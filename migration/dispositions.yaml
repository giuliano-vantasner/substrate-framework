    disposition: qualified
    accepted_claims:
      - C-TOP-001
      - C-CHR-001
    qualification: >-
      T1Z2's half-strength exponential restricted to integer links is exactly
      the accepted integer parity character; odd kink and antikink labels are
      minus one, even links are plus one, and the SU2 doublet matrix for a
      two-pi rotation is minus identity. Those surfaces are already governed by
      C-TOP-001 and C-CHR-001. The headline one-object predicate reduces four
      expressions to SymPy scalars and checks that their Python set has size
      one. It supplies no common typed domain, quotient maps, generator
      orientation, full-map equality, representation action, or intertwiner.
      C4 and distinct C2-product characters share the selected values while
      differing in kernel and full truth table. The RP2 deck matrix is assigned
      by a string-conditioned helper; a renamed host flips the verdict, so
      topology and medium enforcement are not derived. The bosonic guard
      changes strength and charge rather than the character on fixed inputs.
      Its parity-versus-exchange ceiling is appropriate, but it validates i/4
      while the cited Lean theorem states the unit phase exp(i/4). Pending S2
      grants no hedgehog, baryon, state, spin-statistics, or physical premise.
      No common representation, physical fermion, exchange statistic,
      cross-sector identity, medium mechanism, or substrate realization is
      accepted.
