schema_version: 1
source_baseline: substrate@6d1f4e0
default_disposition: pending_adjudication
allowed_dispositions:
  - pending_adjudication
  - partially_migrated
  - migrated
  - qualified
  - refuted
  - duplicate_evidence
  - out_of_scope
units:
  T1A:
    disposition: migrated
    accepted_claims:
      - C-RG-001
    note: >-
      P006 promotes the exact line/shell scaling classification, both shell
      guards, the free-radius result, and the conditional breather coefficient
      while proving that shared form does not equate coefficients or objects.
  T1B:
    disposition: qualified
    accepted_claims:
      - C-OG-001
      - C-OG-002
      - C-OG-003
    qualification: >-
      The exact 1+1 geometry, conditional TF drift, and source-operator
      pullback are accepted, but T1B does not derive its matter equation,
      8*pi*G_eff normalization, physical cross-program identity, or a positive
      3+1 gravity construction.
    evidence:
      - campaigns/P010-optical-source-operator/reviews/source_adjudication.md
    note: >-
      P004 promoted the exact 1+1 identity and conditional TF/geodesic map;
      P010 promotes the exact source-operator pullback and terminally audits
      the unproved dynamical interpretations.
  T1D:
    disposition: migrated
    accepted_claims:
      - C-VAR-001
      - C-CC-001
      - C-VIR-001
    note: >-
      P007 promotes the corrected general fixed-scale variational theorem, the
      exact conditional optical acceleration, the mixed-scale guard, and the
      conditional virial classification; degree one is sufficient but not necessary.
  T1E:
    disposition: qualified
    accepted_claims:
      - C-SG-002
      - C-SG-004
      - C-SG-005
    qualification: >-
      The Hamiltonian energy is duplicate evidence, the threshold complement is
      accepted with precise deficit semantics, and the gradient functional stays
      distinct. The triple-oracle and cross-program object/lift claims are not derived.
    evidence:
      - campaigns/P009-breather-threshold-gap/reviews/source_adjudication.md
    note: >-
      P009 promotes the exact threshold deficit and classifies T1E's point
      evaluation as regression coverage and its lift identity as conditional definition.
  T1G:
    disposition: migrated
    accepted_claims:
      - C-TH-001
    note: >-
      P005 promotes the normalized occupation, variance/sech identity, global
      bounds and limits, both source guards, and the conditional shape relation
      while keeping the macroscopic amplitude and mechanism outside the claim.
  T2B:
    disposition: qualified
    accepted_claims:
      - C-VAR-001
      - C-CC-001
      - C-VIR-001
    qualification: >-
      P007 accepts the exact one-coordinate dynamics, but T2B's later annotation
      that S5 closes Option-C physical realizability is unsupported. A full 3D
      PDE time-stepper remains explicitly outside the source claim.
    evidence:
      - campaigns/P008-constitutive-qualification/reviews/source_adjudication.md
    note: >-
      P007 replaces duplicate integrations of an analytically identical RHS
      with exact parameter elimination plus local uniqueness; P008 adjudicates
      the later S5 annotation without promoting it.
  S5:
    disposition: qualified
    accepted_claims:
      - C-VIR-001
      - C-MED-001
      - C-SK-001
    qualification: >-
      The exact virial, constitutive, and coefficient algebra survives, but the
      source does not derive Option-C physical realizability, its mass formulas,
      numerical predictions, correct length selection, or later AS annotations.
    evidence:
      - campaigns/P008-constitutive-qualification/reviews/source_adjudication.md
    note: >-
      P008 maps the narrow exact content while excluding every visible
      comparator and documenting the missing continuum and formula premises.
  HE1:
    disposition: qualified
    accepted_claims:
      - C-SG-001
      - C-SG-002
      - C-SG-006
      - C-SG-008
    qualification: >-
      HE1's exact rest energy, family-dependent secant scale, and Lorentz
      vector proportionality are accepted, but its Planck/de Broglie language
      does not derive quantization, universality, or a quantum ontology.
    evidence:
      - campaigns/P012-boosted-breather-kinematics/reviews/source_adjudication.md
    note: >-
      P012 replaces component division by a regular four-vector relation and
      maps HE1's non-universality checks to C-SG-006.
  HE2:
    disposition: qualified
    accepted_claims:
      - C-SG-006
      - C-ACT-001
      - C-DIM-001
    qualification: >-
      HE2's generic action/secant examples, breather ratio, and exact dimension
      kernels are accepted, but its named medium-object identity, permanent-
      ceiling language, and physical measuring-unit interpretation are not closed.
    evidence:
      - campaigns/P013-action-scale-dimensions/reviews/source_adjudication.md
    note: >-
      P013 fixes the normalized-action convention, proves the general iff, and
      limits every Buckingham conclusion to its declared primitive set.
  EM1:
    disposition: qualified
    accepted_claims:
      - C-U1-001
      - C-U1-002
    qualification: >-
      EM1's conditional current theorem and declared-profile charge are
      accepted, but the complex ontology, profile-generating potential,
      physical electric-charge map, and 3+1 stability are not derived.
    evidence:
      - campaigns/P014-u1-charge-reciprocity/reviews/source_adjudication.md
    note: >-
      P014 separates the general U1 theorem from the declared sech-profile
      specialization and restores its free amplitude before composition.
  HE3:
    disposition: qualified
    accepted_claims:
      - C-U1-002
      - C-SG-006
      - C-SG-008
    qualification: >-
      HE3's exact amplitude-aware product, boosted composition, and exponent
      classification are accepted, but universal-constant, effective-Planck,
      and quantum de Broglie interpretations are not established.
    evidence:
      - campaigns/P014-u1-charge-reciprocity/reviews/source_adjudication.md
    note: >-
      P014 promotes Q*H=64*A^2 rather than a normalization-independent 64 and
      records that the two kernel generators differ by H=E/omega.
  HE4:
    disposition: qualified
    accepted_claims:
      - C-SG-001
      - C-SG-003
      - C-SG-004
      - C-SG-006
      - C-SG-007
    qualification: >-
      HE4's exact classical action, secant comparison, Legendre relation, and
      conditional lattice algebra are accepted, but physical quantization,
      coupling identification, literature-spectrum equality, universal-Planck
      semantics, and charge reciprocity are not established by this unit.
    evidence:
      - campaigns/P011-action-secant-lattice/reviews/source_adjudication.md
    note: >-
      P011 corrects the continuous-derivative versus adjacent-spacing
      distinction and routes charge reciprocity to its actual pending unit HE3.
  HE5:
    disposition: out_of_scope
    accepted_claims: []
    scope_basis: >-
      HE5 establishes a hash-pinned lexical source-consumer census rather than
      a mathematical or physical predicate suitable for the accepted claim registry.
    evidence:
      - campaigns/P015-source-consumer-audit/evidence/consumer-report.yaml
      - campaigns/P015-source-consumer-audit/reviews/source_adjudication.md
    note: >-
      P015 reproduces the exact token sets and hashes, preserves them as impact
      evidence, and rejects HE5's inference from lexical absence to semantic absence.
  AS2:
    disposition: qualified
    accepted_claims:
      - C-DIM-002
      - C-MED-001
      - C-MED-002
    qualification: >-
      AS2's set-local dimension basis and corrected conditional substitutions
      are accepted, but the Debye selection, free ratios, density dictionary,
      unique one-length ontology, and physical realization are not derived.
    evidence:
      - campaigns/P016-primitive-unit-reduction/reviews/source_adjudication.md
    note: >-
      P016 retains all dimensionless and physical premises and corrects AS2's
      implemented mass-density expression by restoring the declared factor one-half.
  MR1:
    disposition: duplicate_evidence
    accepted_claims:
      - C-SK-001
    duplicates:
      - C-SK-001
    evidence:
      - campaigns/P017-mass-unit-identity/attempts/0002/result.yaml
      - campaigns/P017-mass-unit-identity/reviews/source_adjudication.md
    note: >-
      P017 proves that MR1's common-unit factorization is exactly the conditional
      iff already accepted as C-SK-001. Its generic cancellation adds no distinct
      consumer, and its arbitrary-model and sector-bookkeeping readings are not
      consequences of the equations.
  EL1:
    disposition: qualified
    accepted_claims:
      - C-DIM-002
      - C-DIM-003
      - C-SK-001
    qualification: >-
      EL1's primitive-basis mass unit, lossless dimensionless coordinate, and
      conditional Skyrme equality are accepted. It does not predict the
      coordinate, eliminate the physical import, derive a mass ratio or absolute
      scale, or prove one semantic role for every lexical consumer.
    evidence:
      - campaigns/P018-imported-mass-coordinate/reviews/source_adjudication.md
    note: >-
      P018 supplies the exact forward/inverse coordinate APIs and demonstrates
      that EL1.6 confuses dimensionless with derived while EL1.7 tests only
      file-level token co-occurrence in a restricted phase subset.
  EL2:
    disposition: qualified
    accepted_claims:
      - C-TOP-001
      - C-U1-001
    qualification: >-
      EL2's integer winding-sign character and conditional complex-field current
      are accepted. It does not derive fermionic statistics, the claimed
      composite's baryon number, a unit-normalized or electric charge, 3+1
      stability, a Standard Model slot, or an electron identification.
    evidence:
      - campaigns/P019-winding-parity-labels/reviews/source_adjudication.md
    note: >-
      P019 separates the exact label character from physical statistics and
      shows that EL2's negative-potential Derrick stationary point has negative
      curvature, so the advertised stability conclusion fails its own oracle.
  EL3:
    disposition: qualified
    accepted_claims:
      - C-DIM-002
      - C-DIM-003
      - C-DIM-004
      - C-SK-001
    qualification: >-
      EL3's set-local mass monomial and premise-explicit unit-product
      composition are accepted. It does not derive the input equations or
      coupling, eliminate the mass coordinate, identify the length with
      granularity, or establish an electron or Compton interpretation.
    evidence:
      - campaigns/P020-conditional-mass-length-coordinate/reviews/source_adjudication.md
    note: >-
      P020 retains arbitrary functions of the dimensionless coupling, identifies
      the dropped mass column's nullspace coordinate, and classifies the
      coupling-free alternative as a substitution of other free inputs.
  EL4:
    disposition: qualified
    accepted_claims:
      - C-DIM-003
      - C-DIM-005
      - C-RGE-001
    qualification: >-
      EL4's declared one-loop flow and premise-explicit mass-coordinate
      composition are accepted. It does not derive the beta function, numerical
      soliton coefficient, hadronic offset, granularity identification,
      over-determination prediction, electron mass, or electron identity.
    evidence:
      - campaigns/P021-frontier-rg-coordinate/reviews/source_adjudication.md
    note: >-
      P021 distinguishes total from partial RG differentiation, retains the free
      mass-energy ratio, and shows that EL4's fabricated free-length matrix has
      rank three and nullity zero rather than the claimed loss of determination.
  EL5:
    disposition: qualified
    accepted_claims:
      - C-LIN-001
    qualification: >-
      EL5's exact coefficient-rank and augmented-consistency distinctions are
      accepted. It does not derive a closed electron/hadron ratio, reopen a null
      direction in its restored-electron matrix, establish an electron output,
      or replay accepted-framework consumers.
    evidence:
      - campaigns/P022-linear-system-consistency/reviews/source_adjudication.md
    note: >-
      P022 preserves the seven predecessor subprocess tallies as historical
      compatibility evidence, distinguishes EL5's two different control
      matrices, and retains both free inputs in its conditional ratio.
  EL6:
    disposition: qualified
    accepted_claims:
      - C-DIM-003
      - C-DIM-005
      - C-SK-001
    qualification: >-
      EL6's symbolic expression and conditional ratio map to accepted
      coordinate and Skyrme relations. Its measured-value inversions calibrate
      free inputs and do not establish an absolute mass, particle identity,
      parameter closure, or empty framework debt ledger.
    evidence:
      - campaigns/P023-confrontation-closure-audit/reviews/source_adjudication.md
    note: >-
      P023 proves that required length and hadronic offset depend on the target
      comparator and that the restricted-namespace reconstruction is
      tautological after the comparator-derived offset is supplied.
  QCD3:
    disposition: qualified
    accepted_claims:
      - C-LIE-001
      - C-RGE-001
      - C-RGE-002
    qualification: >-
      QCD3's exact standard SU(3) invariants and premise-explicit one-loop
      coefficient specialization are accepted. It does not derive the loop
      weights or substrate field content and establishes neither unique SU(3)
      selection, a physical substrate/QCD identity, nor confinement.
    evidence:
      - campaigns/P024-su3-one-loop-coefficient/reviews/source_adjudication.md
    note: >-
      P024 keeps the perturbative weights as explicit API inputs, replaces the
      numerical running sweep by an exact derivative and limit, and excludes
      pending YM1/EM5 from the accepted dependency closure.
  CF4:
    disposition: qualified
    accepted_claims:
      - C-RGE-001
      - C-RGE-002
      - C-DIM-007
    qualification: >-
      CF4's one-loop solution, formal pole, and RG-invariance claims map to
      accepted C-RGE-001/C-RGE-002, and its sole-scale exponent is accepted as
      C-DIM-007. It does not establish a nonzero string tension, confinement, a
      dimensionless prefactor, or perturbative control at Lambda.
    evidence:
      - campaigns/P025-cf4-dimensional-transmutation/reviews/source_adjudication.md
    note: >-
      P025 adds an extra-scale guard and a same-flow zero-tension countermodel;
      CF4's numerical limit sweep is regression evidence only.
