      opposite. The standing breather has zero integrated momentum but nonzero
      pointwise mixed stress generically, so the hidden static dilaton equation
      M_tx=0=kappa*T_tx does not match it locally. The alleged dilaton predicate
      executes no metric, dilaton, coupling, variation, field equation, boundary
      data, or solution. Its final spatial-stress check omits the transformed
      cycle factor: the correct mean is gamma*E0*v^2=v*P, not
      gamma^2*E0*v^2=gamma*v*P, and the source never integrates dens_Txx.
      Uniform translation supplies no radiation, gravity, material realization,
      or observation.
