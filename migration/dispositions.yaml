schema_version: 1
source_baseline: substrate@6d1f4e0
default_disposition: pending_adjudication
allowed_dispositions:
  - pending_adjudication
  - partially_migrated
  - migrated
  - qualified
  - refuted
  - duplicate_evidence
  - out_of_scope
units:
  T1A:
    disposition: migrated
    accepted_claims:
      - C-RG-001
    note: >-
      P006 promotes the exact line/shell scaling classification, both shell
      guards, the free-radius result, and the conditional breather coefficient
      while proving that shared form does not equate coefficients or objects.
  T1B:
    disposition: partially_migrated
    accepted_claims:
      - C-OG-001
      - C-OG-002
    remaining_scope: >-
      The matter-sourced dilaton equation and its claimed Poisson normalization
      remain unaccepted, and the verified 3+1 counterexample is only a scope
      guard rather than a positive gravity construction.
    note: >-
      P004 promoted the exact 1+1 identity, its true uniqueness class modulo a
      constant, and the conditional TF/geodesic weak-field map.
  T1D:
    disposition: migrated
    accepted_claims:
      - C-VAR-001
      - C-CC-001
      - C-VIR-001
    note: >-
      P007 promotes the corrected general fixed-scale variational theorem, the
      exact conditional optical acceleration, the mixed-scale guard, and the
      conditional virial classification; degree one is sufficient but not necessary.
  T1E:
    disposition: partially_migrated
    accepted_claims:
      - C-SG-002
    remaining_scope: >-
      Cross-program lift and binding-gap encodings remain separate candidate
      claims; their agreement with the accepted energy does not promote them.
    note: C-SG-002 independently rederived the bridge's load-bearing Hamiltonian energy result.
  T1G:
    disposition: migrated
    accepted_claims:
      - C-TH-001
    note: >-
      P005 promotes the normalized occupation, variance/sech identity, global
      bounds and limits, both source guards, and the conditional shape relation
      while keeping the macroscopic amplitude and mechanism outside the claim.
  T2B:
    disposition: partially_migrated
    accepted_claims:
      - C-VAR-001
      - C-CC-001
      - C-VIR-001
    remaining_scope: >-
      The later Phase-4 S5 annotation claiming Option-C physical realizability
      and microscopic-to-continuum layer separation remains unadjudicated.
      A full 3D PDE time-stepper remains explicitly outside T2B's claim.
    note: >-
      P007 replaces duplicate integrations of an analytically identical RHS
      with exact parameter elimination plus local uniqueness, and separates the
      mixed-scale model by an exact initial-acceleration difference.
  HE4:
    disposition: partially_migrated
    accepted_claims:
      - C-SG-003
      - C-SG-004
    remaining_scope: >-
      The hbar_eff interpretation, charge reciprocity, quantization tower, and
      literature-spectrum comparisons remain unaccepted candidate claims.
    note: Only the classical action, inverse map, and gradient-Legendre identity have been promoted.
