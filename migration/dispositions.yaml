      - C-CC-001
      - C-OG-004
    qualification: >-
      T2C correctly reconstructs the declared optical Christoffels, Riemann
      components, scalar curvature, and two-dimensional Gaussian identity. Its
      Fourier identity -w_tilde_double_prime(0)=integral y^2*w(y)dy is also
      correct for a separately defined finite-moment kernel. The claimed
      acceleration R_scalar*moment/(2*n), however, is defined rather than
      derived. Curvature times a normalized spatial variance has velocity-
      squared rather than acceleration units; the source's raw kernel moment
      additionally carries its unremoved weight. The upstream fixed-profile
      response and the accepted conditional profile-average alternative use a
      third background derivative at leading weak order. On an even index about
      the body center, exact reflection symmetry forces zero averaged
      acceleration while T2C predicts a nonzero value. Papapetrou's Riemann
      coupling is to antisymmetric spin, and the Dixon quadrupole force uses a
      rank-four Riemann-symmetry moment contracted with a curvature derivative,
      plus momentum or mass and worldline data. T2C executes none of these and
      its R^1_010*J^11 contraction is not index-typed. Its zero-width, nonzero,
      sign, and linearity checks are necessary construction properties that do
      not select a force law. FS1, FS2, FS4, P3D3, and T1B do not lift this
      ceiling or supply a physical gravity, material, or substrate mechanism.
