    the curvature. (2) REJECTION GUARD [DERIVED]: the wrong identification phi = n VIOLATES the master
    identity -- Box(n) - R[n] is NONZERO on a concrete non-trivial profile (n = 1 + alpha*x). So the bridge
    selects ln n, not n; it is not a tautology that "any phi(n) works". (3) WEAK FIELD [DERIVED]: with
    the IMPORTED TF eq n = 1/(1+2*Phi/c0**2),'
