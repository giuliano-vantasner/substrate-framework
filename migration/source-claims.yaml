  headline: Bridge WN5 -- "the derived weight ADDS to Phase-32 without narrowing it, and yields a NEW
  question_excerpt: Phase-32's value rests substantially on being regime-agnostic. Does supplying a derived
    w(n) trade that robustness away for a fragile single-regime claim -- and if not, what does the derived
    weight actually buy?
  result_excerpt: 'WN5.1 MEMBERSHIP. S^n/n! > 0 for every integer n>=0 and every S>0, so it lies inside
    GB4''s quantified family; nothing GB4 proves is restricted by adopting it. WN5.2 GB4''s HEADLINE RE-VERIFIED
    VERBATIM for general symbolic w: dB_gamma/dN = -rho*w/(wN+rho)^2 < 0 for all rho,w,N>0. Then re-checked
