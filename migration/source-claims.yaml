    derived content AT ALL? Could some future combination of already-derived quantities fix it, or is
    it free as a matter of principle?'
  result_excerpt: 'epsilon is FREE, and the proof is an explicit symmetry of the framework''s entire derived
    content. Dimensional analysis (hbar=c=1) fixes the generalized-Skyrme parameter dimensions [F_pi]
    = E, [e] = 0, [lambda] = E^-1, [mu] = E^2, so the BPS sector carries its OWN energy scale lambda*mu
    (dimension E), independent of the standard sector''s scale F_pi/e. The near-BPS deformation is their
    ratio, epsilon ~ (F_pi/e) / (lambda mu) -- dimensionless, as it must be. Now consider the one-parameter
    flow Phi_t : (F_pi, e, lambda, mu) |--> (F_pi, e, t*lambda, t*mu), t > 0. Because (KI1) NO framework-derived
    quantity depends on lambda or mu, and because Phi_t fixes F_pi and e outright, EVERY quantity the...'
