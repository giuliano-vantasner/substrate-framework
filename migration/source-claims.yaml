    run them at one loop in the Amaldi-Ellis form alpha_i^{-1}(mu) = alpha_i^{-1}(M_Z) - (b_i/2pi) ln(mu/M_Z),
    with GUT-normalized (b_1, b_2, b_3) = (41/10, -19/6, -7). The SU(3) slope b_3 is REUSED from QCD3''...'
  result_excerpt: 'The three couplings DO converge toward a high-scale window (~10^13 .. 10^17 GeV) but
