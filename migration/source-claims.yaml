  qualification: 'KI2''s conditional natural-unit dimension tuple, three-dimensional exponent-kernel basis,
    exact identity for its locally defined ratio, and freedom of that ratio across C-BPS-001''s positive
    lambda-mu parameter family survive. The source flow is not a symmetry of one fixed accepted BPS theory:
