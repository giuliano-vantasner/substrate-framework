    program separately speaks of a gravitational potential Phi_N tied to the refractive index by the TF
    eq n = 1/(1 + 2*Phi_N/c0**2). T1-B asks: is the dilaton phi = ln n the SAME object as (minus twice,
    weak-field) the vantasner Newtonian potential -- i.e. does the soliton-shadow curvature-matching identity
    Box(ln n) = R[n] reduce, in the weak field, to the vantasner/Fulceri Poisson + drift law? And is the
    identification UNIQUE: does the naive alternative phi = n fail?'
  result_excerpt: 'YES. Five machine-checked links: (1) MASTER IDENTITY [DERIVED, the non-tautological
    core]: for the d''Alembertian built on g_eff = diag(-1/n, n/c0**2), Box(ln n) - R[n] == 0 IDENTICALLY
