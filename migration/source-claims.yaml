    multi-Skyrmion profiles in the Houghton-Manton-Sutcliffe rational-map approximation. A rational map
    of degree B>1 is NOT spherically symmetric: the angular factor Nc(theta,phi) = [ (1+|z|^2)/(1+|R(z)|^...'
