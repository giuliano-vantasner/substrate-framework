  headline: 'Bridge GK1 -- "the gauge-kinetic induction is 1+1D for ALL THREE gauge groups: the'
  question_excerpt: 'The corpus''s headline claim, as corrected by commits 412f7f6 / ff69add, is ASYMMETRIC:
    the non-abelian gauge kinetic terms are said to be "generated, not imported" WITHOUT qualification
