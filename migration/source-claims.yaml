  headline: 'Bridge PN3 -- "the Dicke collective coupling: N identical two-level systems'
  question_excerpt: Hagelstein's coherent phonon-nuclear exchange is a COLLECTIVE effect over N nuclei
    sharing a phonon bath (his 'generalized nuclear Dicke model', compared to Lloyd-Mohseni supertransfer).
    What is the collective-coupling scaling? Derive it from the total-spin ladder operator rather than
    importing a number.
  result_excerpt: 'Model N two-level systems as spins-1/2 in the fully-symmetric (Dicke) sector, total
    spin j = N/2. The collective raising operator J+ has the exact matrix element <j, m+1 | J+ | j, m>
    = hbar * sqrt( (j - m)(j + m + 1) ). At the ground rung m = -j = -N/2 this is <j, -N/2+1 | J+ | j,
    -N/2> = hbar * sqrt(N) (EXACT), so the collective AMPLITUDE ~ sqrt(N) and the FGR RATE ~ |amplitude|^2
    ~ N. For N = 1 (single spin-1/2) it collapses to the ordinary Rabi matrix element hbar*1. The classic
    error amplitude ~ N (rate ~ N^2) is REJECTED: the ladder element is sqrt(N), not N.'
