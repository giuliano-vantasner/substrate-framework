  sha256: c88ff5fe65473756d36a29546fae4da417c56d7539dcfd8e58304bd0ab7b335f
  headline: 'Bridge TX4 -- "the rigidly rotating B=2 Skyrmion is DYNAMICALLY STABLE: the Floquet problem'
  question_excerpt: 'TX1-TX3 built the mechanism: a solved B=2 torus, rigidly rotated, radiates into both
    TT polarizations with no free parameter in the claim. `frontier.md:408` had honestly conceded that
    the previous (QB3) triaxial state "is not claimed to be a dynamical attractor", and Phase-36 priced
    a real stability determination as multi-day and declined it. That prohibition is lifted here. Is the
    rotating B=2 configuration dynamically stable? A rotating soliton is a RELATIVE EQUILIBRIUM -- a critical
    point of the energy at fixed angular momentum -- so the correct instruments are (a) Floquet/monodromy
    analysis of the linearisation about the time-periodic orbit, and (b) the energy-momentum (Arnold)
    second...'
  result_excerpt: '(1) THE FLOQUET PROBLEM IS EXACTLY SOLVABLE. For a rotationally covariant field equation,
    passing to the co-rotating frame replaces d/dt by (d/dt - Omega*L), L the rotation generator. A RIGIDLY
    ROTATING solution is STATIC in that frame, so the linearised operator has TIME-INDEPENDENT coefficients
    and the monodromy over one period is exactly M = exp(T*A) with A t-independent. This is what makes
    Floquet tractable rather than multi-day: Floquet multipliers are exp(T*lambda) for lambda in the spectrum
    of a STATIC operator. The operator identity is verified exactly in SymPy. (2) THE COLLECTIVE ROTOR
    SECTOR IS STABLE, AND ITS SECULAR TERM IS A ZERO MODE, NOT AN INSTABILITY. The body is AXISYMME...'
