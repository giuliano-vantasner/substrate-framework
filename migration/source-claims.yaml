  question_excerpt: 'The coherence gate (NY3, phase-24) says a phase-locked breather population concentrates
    energy ~N^2 and crosses the barrier at N_coh = sqrt(E_*/theta1), while an incoherent one only reaches
    ~N and needs N_inc = E_*/theta1 >> N_coh. In NY3 the per-breather quantum theta1 = 0.05 eV and E_*
