    breather quantum hbar*omega_b), and (ii) turn N_coh, N_inc into FUNCTIONS of the real variables via
    E_*(loading, drive) from BD1 -- and it must be able to say NO: a parameter set that should not cross
    stays incoherent (~N, never reaching N^2 ignition), rejecting a "barrier always crossed" fabrication.'
  result_excerpt: 'With the coherence model Theta_pop(N,V) = theta1*(N(1-V) + N^2 V) (V = coherent fraction),
    the fully-coherent (V=1) path reaches E_* at N_coh = sqrt(E_*/theta1), the incoherent (V=0) path at
    N_inc = E_*/theta1, so N_coh = sqrt(N_inc) and N_coh << N_inc. Identifying theta1 = hbar*omega_b (Rung
    C: the per-breather energy quantum, the inserted 0.05 eV retired) and E_* = 2*pi*T^2/(g*A^2*k^2*l_m)
    (BD1) makes both thresholds FUNCTIONS of (loading A, drive k~omega, material): more loading or higher
    drive LOWERS E_* and so lowers BOTH thresholds -- dN_coh/dA < 0, dN_inc/dA < 0 (falsifiable). GUARD
