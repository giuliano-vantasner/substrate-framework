  result_excerpt: 'WN4.1 Ratio law, exact: w(n+1)/w(n) = S/(n+1). WN4.2 Crossover, exact: w strictly INCREASES
    at n iff n+1 < S, strictly DECREASES iff n+1 > S. The weight is unimodal with mode n* = floor(S) (verified
    on samples). WN4.3 Strict log-concavity: w(n)^2 > w(n-1)w(n+1) for all n>=1, S>0 -- a SINGLE maximum,
    no second peak, so the crossover is unique. WN4.4 REGIME RECOVERY. Growth limb (n+1 < S): w rises
    with n -- the phase-space limb. Suppression limb: for EVERY alpha>0 and every n+1 >= S*e^alpha, the
    ratio w(n+1)/w(n) <= e^(-alpha), so the weight decays at least as fast as the energy- gap law e^(-alpha
    n). Both named regimes are recovered; neither is the whole function; the power-law family n^k...'
