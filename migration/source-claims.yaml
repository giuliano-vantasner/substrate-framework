    fact, or two coincidences? This bridge asserts -- and machine-checks symbolically -- that BOTH...'
  result_excerpt: 'The pulson holonomy(1/2,1)=-1, the Lean kink (-1)^|+1|=-1, and the Lean antikink (-1)^|-1|=-1
    are ONE AND THE SAME object: chi_F(g) = -1, the nontrivial Z2 character on the shared generator. The
