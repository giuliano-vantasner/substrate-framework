    links (SymPy + mpmath oracle, standalone): (i) [DERIVED, symbolic] the boosted field u_v(x,t) = u_b(gamma(x-vt),
    gamma(t-vx); omega) is an EXACT solution of u_tt - u_xx + sin u = 0 -- the SG-EOM residual is 0 identically
    in v (SG is Lorentz invariant), and = 0 to < 1e-10 at concrete (x,t) for v = 0.3, 0.6. (ii) [DERIVED,
    numerical -- THE NEW CONTENT] int T^0x_v dx = gamma E0 v != 0 for the MOVING source, derived by integrating
    -u_t u_x over x; the STANDING source gives int T^0x dx = 0. The non-relativistic guess P_NR = E0 v
