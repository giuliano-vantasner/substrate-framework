- source_unit: KI5
  phase: phase-34
  path: merged-framework/bridges/phase-34/bridge_KI5_kappa_is_not_a_variational_bound.py
  sha256: 5db475be67e6668f9064096055b0452bb2a762c435132ae324896cce3f9863fe
  headline: Bridge KI5 -- "kappa is a DIFFERENCE of two variational upper bounds, so improving the
  question_excerpt: 'The frontier names the safe forward route as "a closer-to-BPS submodel or a higher-mode
    profile, not a pin", and states at frontier.md:417 that "the rational-map single-profile ansatz is
    a variational upper bound". The D4 research dossier accordingly assessed route (c) -- improve the
    profile -- as the low-risk option that "tightens the CEILING honestly". Before spending effort there,
    one question has to be answered: is kappa_classical actually an upper bound on the true classical
    kappa at all?'
  result_excerpt: 'NO. The variational property belongs to the ENERGIES b(B), not to kappa. Each solved
    b(B) is a genuine upper bound on the true B-Skyrmion energy, b_ansatz(B) = b_true(B) + delta_B with
    delta_B >= 0. But E3''s coefficient is a DIFFERENCE of them: kappa = 3 pi^2 [ 2 b(2) - b(4) ] => kappa_ansatz
    - kappa_true = 3 pi^2 [ 2 delta_2 - delta_4 ], whose SIGN is not determined by delta_2, delta_4 >=
    0. The errors enter with opposite signs and do not cancel in a controlled direction. Consequently:
    * kappa_classical ~ 8.46 is a POINT ESTIMATE from a particular ansatz, NOT a rigorous ceiling. The
    true classical value could lie above or below it. * "Improving the profile to tighten the upper bound"
    is...'
  declared_status_words:
  - DERIVED
  - IMPORTED
  candidate_dependencies:
  - E2
  - E3
  oracle_hints:
  - symbolic
  - numeric
  static_check_calls: 5
  literal_check_calls: 5
  dynamic_check_calls: 0
  assert_statements: 1
  terminal_tally_literal_present: true
  disposition: qualified
  accepted_claims:
  - C-RDIFF-001
  - C-RDIFF-002
  - C-RPROF-002
  qualification: 'KI5''s exact error identity survives conditionally: if separate energy estimates have
    nonnegative slacks, their signed-difference error is the multiplicity-weighted initial slack minus
    the final slack and can have either sign. Explicit coupled slack relations recover conditional one-sided
    bounds, while controlled component errors can converge without monotonicity of the difference. C-RDIFF-001
    already owns this theorem, C-RDIFF-002 owns the corrected conditional coordinate 8.482417318795285,
    and C-RPROF-002 owns the stationary-profile ceiling. KI5''s eight selected rescalings do not prove
    minimization; its solve_bvp result is consumed without a success gate, its hard-wall source values
    give stale 8.4574, and accepted profile evidence proves no variational upper bound or full three-dimensional
    solution. Comparator 0.929 enters both KI5.4 pass predicates, the physical overbinding and universal
    profile-quality conclusions do not follow, and KI5.5 hard-codes its bound verdict. No new claim, API,
    physical point estimate, binding result, or release is accepted.'
