    \ breather give a genuinely new, CONSERVED source -- nonzero integrated momentum int T^0x dx = gamma\
    \ E0 v (DERIVED from the boosted field, not asserted), a nonzero off-diagonal dilaton source M_tx,\
    \ the relativistic energy int T^00 dx = gamma E0 and dispersion E^2 - P^2 = E0^2 -- and does the covariant\
    \ conservation \u2202_mu..."
