  headline: 'Bridge CM1 -- "the Channel-A separation boundary: the MAXIMUM two-body fusion yield'
  question_excerpt: What is the honest upper bound on screened two-body ("Channel A") tunnelling, and
    how does it depend on the input energy per pair? Using the screening ladder's own maximal static screening
    energy U_e (its ceiling), show the screened rate R_A(E_in) is monotonically increasing in E_in, Gamow-exponential
