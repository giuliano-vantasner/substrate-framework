  headline: Bridge WN4 -- "the DERIVED subdivision-weight family and its CROSSOVER. WN3's composition
  question_excerpt: frontier.md:436-438 records three candidate regimes for w(n) -- linear phase-space
    w=n, energy-gap-law w=exp(-alpha n), power-law w=n^k -- as pulling in different directions, with no
