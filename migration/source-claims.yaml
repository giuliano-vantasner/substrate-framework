    ways, each machine-checked here: (1) THE COMPOSITION IS THE IDENTITY. Let kappa:(0,inf)->(0,kappa_cl)
    be any admissible interpolant (KI3) and g its inverse, the back-solve. Then for EVERY y in the bracket
    kappa(g(y)) = y identically. The "predicted" coefficient equals the empirical input for every possible
    input. The procedure has no fixed point to test and no residual to check: it cannot fail. (2) THE
    INFORMATION GAIN IS EXACTLY ZERO. Before back-solving, the framework admits every kappa in (0, kappa_cl)
    (KI3''s sharpness). After back-solving, it still admits every kappa in (0, kappa_cl) -- because every
    s...'
