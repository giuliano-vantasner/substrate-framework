    is the well-known SM near-miss -- a TRUE statement, NOT a unification claim. (1) [DERIVED, ties QCD3]
    b_3 = -(11 - (2/3)n_f) at n_f = 6 = -7 = -b0(QCD3). REUSE QCD3''s exact b0 assembly b0 = (11/3)C_A
    - (4/3)T_F n_f with the DERIVED C_A = 3, T_F = 1/2; then b_3 = -b0 = -7. Sign map: d alpha_3^{-1}/d
    ln mu = -b_3/2pi = +7/2pi > 0 -> alpha_3^{-1} GROWS with mu -> alpha_3 FALLS -> asymptotic freedom.
