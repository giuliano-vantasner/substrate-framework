  - id: C-PDE-003
    statement: >-
      In the dimensionless 3+1 sine-Gordon model of C-PDE-001, let P(r,t)
      satisfy the radial equation and let Y=P2(cos(theta)) with
      Delta_Omega Y=-6*Y. The finite multiplicative ansatz
      u=P*(1+a*Y) has exact full-field residual
      sin(P*(1+a*Y))-(1+a*Y)*sin(P)+6*a*P*Y/r^2. Its coefficient at first
      order in a is Y*(P*cos(P)-sin(P)+6*P/r^2), so the ansatz is not a
      generic solution; moreover its l=2 coefficient is nonregular wherever
      P(0,t) is nonzero. The correct infinitesimal ansatz
      u=P+epsilon*psi(r,t)*Y obeys at first order
      psi_tt-psi_rr-2*psi_r/r+6*psi/r^2+cos(P)*psi=0, with
      psi=O(r^2) at the origin. For v=r*psi this is
      v_tt=v_rr-6*v/r^2-cos(P)*v with v=O(r^3). At second order the
      multiplicative ansatz contains P4 harmonic leakage because
      P2^2=P0/5+2*P2/7+18*P4/35. These are exact field-equation statements,
      not a nonlinear mode-existence, stability, periodicity, gravity, or
      radiation theorem.
