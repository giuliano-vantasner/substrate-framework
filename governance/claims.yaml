      - campaigns/P008-constitutive-qualification/attempts/0001/result.yaml
      - campaigns/P008-constitutive-qualification/reviews/independent_algebra_review.py
      - memory/vantasner/decisions/C-SK-001-review.md
      - tests/test_skyrme_relations.py
    assumptions:
      - Both mass formulas are approved conditional premises rather than derived or empirically validated framework claims.
      - B1, electron rest energy, pion scale, and Skyrme coupling are positive.
      - No numerical comparator, individual F_pi or e value, or physical mass prediction is part of this claim.
    comparators: []
    accepted_in: v0.8.0
    challenges: []
    supersedes: []
  - id: C-SG-005
    statement: >-
      For every real omega with 0 < omega < 1, the C-SG-002 breather's deficit
      below the normalized two-kink threshold is
      Delta(omega)=16-E(omega)=16*(1-sqrt(1-omega^2)). It satisfies
      0<Delta<16, is strictly increasing and strictly convex, tends to 0 as
      omega approaches 0 from above, tends to 16 as omega approaches 1 from
      below, and partitions the threshold exactly as E+Delta=16.
    provenance: campaigns/P009-breather-threshold-gap/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
    dependencies:
      - C-SG-002
    evidence:
      - campaigns/P009-breather-threshold-gap/verify.py
      - campaigns/P009-breather-threshold-gap/attempts/0001/result.yaml
      - campaigns/P009-breather-threshold-gap/reviews/independent_marginal_review.py
      - memory/vantasner/decisions/C-SG-005-review.md
      - tests/test_sine_gordon.py
    assumptions:
      - The threshold deficit is an energy difference in normalized sine-Gordon units, not a separately derived interaction potential.
      - Endpoint values are one-sided limits because the frequency domain is open.
    comparators: []
    accepted_in: v0.9.0
    challenges: []
    supersedes: []
  - id: C-SG-006
    statement: >-
      For every real omega with 0 < omega < 1, define the breather's
      energy-frequency secant action scale H(omega)=E(omega)/omega. Then
      H=16*sqrt(1-omega^2)/omega is positive and strictly decreasing from
      positive infinity to zero. Its ratio to the canonical action is
      Pi=J/H=omega*arccos(omega)/sqrt(1-omega^2), which is strictly increasing
      with 0<Pi<1, tends to zero as omega->0+, and tends to one as omega->1-.
      Moreover dE/dH=omega^3, whereas dE/dJ=omega, so H is not the canonical
      action on the open family and agrees with it only asymptotically through
      Pi->1 at the harmonic endpoint.
    provenance: campaigns/P011-action-secant-lattice/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
    dependencies:
      - C-SG-002
      - C-SG-003
    evidence:
      - campaigns/P011-action-secant-lattice/verify.py
      - campaigns/P011-action-secant-lattice/attempts/0003/result.yaml
      - campaigns/P011-action-secant-lattice/reviews/independent_angle_review.py
      - campaigns/P011-action-secant-lattice/reviews/source_adjudication.md
      - memory/vantasner/decisions/C-SG-006-review.md
      - tests/test_sine_gordon.py
    assumptions:
      - The accepted normalized breather energy, action, and open frequency domain are retained.
      - The name secant action scale denotes E/omega and does not identify a universal Planck constant.
    comparators: []
    accepted_in: v0.11.0
    challenges: []
    supersedes: []
  - id: C-SG-007
    statement: >-
      Conditional on a fixed positive action increment h and the imposed
      lattice J_n=n*h, every positive integer n with n*h<8*pi has
      omega_n=cos(n*h/16) and E_n=16*sin(n*h/16), so n<8*pi/h and only
      finitely many levels are admissible. The continuous interpolation obeys
      dE/dn=h*cos(n*h/16)=h*omega_n. When (n+1)*h<8*pi, the actual adjacent
      gap is E_(n+1)-E_n=32*sin(h/32)*cos((2*n+1)*h/32), which is generally
      not h*omega_n. This claim does not derive the lattice premise or identify
      h with a physical coupling or Planck constant.
    provenance: campaigns/P011-action-secant-lattice/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies:
      - C-SG-003
    evidence:
      - campaigns/P011-action-secant-lattice/verify.py
      - campaigns/P011-action-secant-lattice/attempts/0003/result.yaml
      - campaigns/P011-action-secant-lattice/reviews/independent_angle_review.py
      - campaigns/P011-action-secant-lattice/reviews/source_adjudication.md
      - memory/vantasner/decisions/C-SG-007-review.md
      - tests/test_sine_gordon.py
    assumptions:
      - A fixed positive action increment h and positive-integer action lattice J_n=n*h are declared conditional inputs.
      - Each claimed level lies in the accepted open action domain, and an adjacent gap requires both levels to lie there.
    comparators: []
    accepted_in: v0.11.0
    challenges: []
    supersedes: []
  - id: C-SG-008
    statement: >-
      For every C-SG-001 breather with 0<omega<1 and every real boost velocity
      v with |v|<1 in units c=1, let gamma=1/sqrt(1-v^2). The boosted phase
      components for phase Omega*t-k*x are (Omega,k)=(gamma*omega,
      gamma*omega*v), while energy-momentum is (E,P)=(gamma*E0,
      gamma*E0*v). They satisfy the division-free vector identity
      (E,P)=H(omega)*(Omega,k), where H=E0/omega is C-SG-006's secant action
      scale, and the invariant norms Omega^2-k^2=omega^2 and
      E^2-P^2=E0^2. For v!=0 this implies E/Omega=P/k=H; the vector statement
      remains well defined at v=0. This is a Lorentz-kinematic relation and
      does not identify H as a universal quantum constant.
    provenance: campaigns/P012-boosted-breather-kinematics/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
    dependencies:
      - C-SG-001
      - C-SG-002
      - C-SG-006
    evidence:
      - campaigns/P012-boosted-breather-kinematics/verify.py
      - campaigns/P012-boosted-breather-kinematics/attempts/0001/result.yaml
      - campaigns/P012-boosted-breather-kinematics/reviews/independent_rapidity_review.py
      - campaigns/P012-boosted-breather-kinematics/reviews/source_adjudication.md
      - memory/vantasner/decisions/C-SG-008-review.md
      - tests/test_sine_gordon.py
    assumptions:
      - The normalized 1+1 Lorentz boost uses c=1, |v|<1, and phase convention Omega*t-k*x.
      - The rest energy and phase frequency are the accepted C-SG-002 and C-SG-001 objects.
      - The proportionality scale retains C-SG-006's family-dependent secant semantics.
    comparators: []
    accepted_in: v0.12.0
    challenges: []
    supersedes: []
  - id: C-ACT-001
    statement: >-
      On any connected interval with normalized canonical action J>0,
      differentiable positive energy E(J), and positive frequency
      omega=dE/dJ, the identity E/omega=J throughout the interval holds if
