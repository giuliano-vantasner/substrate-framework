  - id: C-RG-001
    statement: >-
      For positive radius R and density lambda, the circumference line energy
      E_line = 2*pi*R*lambda is homogeneous of degree one, has constant positive
      derivative 2*pi*lambda, and has no stationary radius. For positive surface
      density sigma, E_shell = 4*pi*R^2*sigma is homogeneous of degree two and
      has radius-dependent derivative 8*pi*R*sigma. For positive line tension T
      and pressure P, E_cap = 2*pi*R*T - pi*R^2*P + C has the unique strict
      global maximum R = T/P. Conditional line constructions with coefficients
      T and the C-SG-002 breather energy share only the degree-one line form;
      their energies are equal for every positive R if and only if their
      coefficients are equal.
    provenance: campaigns/P006-radial-energy/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies:
