  - id: C-SPN-001
    statement: >-
      Let Psi be a nonzero complex pure spin-1 spinor in the ordered
      m=(+1,0,-1) basis with the standard Hermitian spin-one matrices. Define
      n=Psi^dagger*Psi, f_a=Psi^dagger*F_a*Psi, and the singlet amplitude
      A=Psi_0^2-2*Psi_+*Psi_-. Then the exact invariant is
      |f|^2+|A|^2=n^2, and the attainable interval is
      0<=|f|^2<=n^2. Under the unitary complex-Cartesian convention
      Psi_+=-(d_x-i*d_y)/sqrt(2), Psi_0=d_z, and
      Psi_-=(d_x+i*d_y)/sqrt(2), writing d=u+i*v gives
      f=2*u cross v and A=d dot d. Hence |f|^2=0 exactly when u and v are
      parallel; modulo global phase and spatial SO(3), these rays form the
      polar orbit RP^2. The upper endpoint |f|^2=n^2 holds exactly when u and
      v are orthogonal with equal norm; modulo global phase and SO(3), these
      rays form the coherent ferromagnetic orbit S^2 with SO(2) stabilizer.
      Conditional on the supplied fixed-density pure-state functional
      E_spin=(c2/2)*|f|^2, positive c2 selects precisely the polar projective
      orbit, negative c2 selects precisely the ferromagnetic projective
      orbit, and c2=0 leaves every pure spin-1 ray degenerate. The
      polar-minus-ferromagnetic endpoint energy is -c2*n^2/2. This theorem
      derives no material sign or magnitude of c2, atomic realization,
      spatial condensate ground state, full physical order-parameter
      manifold, defect energetics, finite-temperature phase, mixed-state
      classification, or substrate mechanism.
