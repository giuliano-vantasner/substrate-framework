  - id: C-DYN-001
    statement: >-
      For the declared real linearly damped oscillator
      q_tt+Gamma*q_t+omega_0^2*q=0 with omega_0>0 and Gamma>=0, the exact
      characteristic roots are
      -Gamma/2 +/- sqrt(Gamma^2-4*omega_0^2)/2. The oscillator is
      underdamped, critically damped, or overdamped according as Gamma is
      below, equal to, or above 2*omega_0. In the underdamped branch its
      angular frequency is omega_d=sqrt(omega_0^2-Gamma^2/4), its coordinate
      amplitude envelope is exp(-Gamma*t/2), and the square of that envelope
      is exp(-Gamma*t). Its instantaneous mechanical energy
      E=(q_t^2+omega_0^2*q^2)/2 instead satisfies the exact on-shell balance
      dE/dt=-Gamma*q_t^2, so it is not pointwise a single exponential. In a
      declared 1/Gamma quadratic-envelope window the actual oscillation count
      is omega_d/(2*pi*Gamma); omega_0/(2*pi*Gamma) is only a nominal
      natural-frequency convention. The actual count tends to zero at
      critical damping while the nominal count tends to 1/(4*pi). For the
      normalized damped sine-Gordon linearization
      psi_tt-psi_xx+psi=-Gamma*psi_t, a real Fourier mode k has
      omega_0(k)=sqrt(1+k^2)>=1 and critical damping
      2*sqrt(1+k^2). A finite-amplitude breather frequency 0<omega_b<1 is
      therefore not a real linear-mode natural frequency; substituting it can
      reverse the damping classification. Separately, for positive uniform
      damping, sufficient regularity, and zero integrated boundary flux, the
      period-integrated exact energy balance excludes every nontrivial exactly
      time-periodic finite-energy field. Thus an abstract reduced-coordinate
      damping classification, a linear field-mode transient, exact nonlinear
      periodic existence, phase coherence, survival probability, population,
      and a material or spark/DBD threshold are distinct predicates. No latter
      interpretation follows without an independently derived coordinate,
      observable, finite-time classifier, and physical parameter map.
