  - id: C-OVL-003
    statement: >-
      Let {eta_i}_{i=1}^N be one declared ordered orthonormal family in a
      complex L2 space with fixed domain and measure, and let Phi be a bounded
      real multiplication profile. The finite compression
      Y_ij=<eta_i,Phi*eta_j>, with complex conjugation in the first slot, is
      Hermitian. For psi=sum_i c_i*eta_i, c^dagger*Y*c=<psi,Phi*psi>; hence a
      normalized Rayleigh quotient and every eigenvalue of Y lie in Phi's
      supplied essential range. Under one common basis change eta'=eta*U,
      Y'=U^dagger*Y*U, so entries are basis dependent while the spectrum,
      trace, determinant, spectral multiplicities, and commonly transformed
      commutator data are invariant. If the two modes and multiplier have
      declared parities p_i,p_j,p_Phi in {+1,-1}, the whole-line entry
      vanishes when p_i*p_Phi*p_j=-1; in particular, changing only the width
      of a centered even profile cannot couple opposite parities. Two finite
      Hermitian compressions on one explicitly identified space admit a common
      unitary eigenbasis exactly when their commutator vanishes. Matrix
      inequality alone does not establish misalignment, and a relative
      eigenbasis additionally retains independent eigenvector phases,
      permutations, arbitrary U(m) rotations in m-fold degenerate subspaces,
      and any undeclared map between separately named spaces; its unitarity or
      nonidentity alone is not a physical observable. For C-QBL-003's actual
      normalized even sech(z)^2 and odd sech(z)*tanh(z) modes, z=kappa*x,
      compressing the separately supplied asymmetric profile
      A*sech(z)*(1+b*tanh(z)) gives exactly
      [[9*pi*A/32,sqrt(2)*A*b/5],[sqrt(2)*A*b/5,3*pi*A/16]]. The common
      positive kappa cancels, b=0 restores the parity-diagonal C-OVL-001
      matrix, and the nonzero cross entry therefore requires the new free odd
      profile premise b rather than a width change. MH3's substituted sech
      even mode instead gives pi*A/16 times
      [[4,sqrt(3)*b],[sqrt(3)*b,3]], also independent of kappa; its two
      displayed textures differ because b is independently changed, not
      because their widths differ. These exact compression results derive no
      fermion or chirality, Yukawa or mass interaction, generation assignment,
      physical up/down sectors, charged-current operator, hierarchy, CKM or
      Cabibbo observable, CP quantity, absolute mass, or substrate mechanism.
