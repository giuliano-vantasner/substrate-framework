      G_A-Q^2*G_P/(4*M^2). Separately declaring the normalized PCAC source
      F*m_pi^2*G_piNN(Q^2)/(M*(m_pi^2+Q^2)) yields a generalized residual that
      retains G_P independently. Under the additional pion-pole-dominance
      premise G_P=4*M*F*G_piNN/(m_pi^2+Q^2), the residual reduces exactly to
      G_A-F*G_piNN/M. Adding an induced-form-factor remainder R(Q^2) finite at
      zero and at Q^2=-m_pi^2 changes that residual by
      -Q^2*R/(4*M^2), leaves the pole residue
