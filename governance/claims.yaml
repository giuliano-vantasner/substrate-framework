  - id: C-RPROF-002
    statement: >-
      Conditional on C-RPROF-001 and on accepted angular inputs
      (B,I)=(1,1),(2,pi+8/3),(4,20.6496264884189), two independent float64
      routes give resolution-bounded evidence for one monotone stationary
      branch at each input. Vacuum-complement DOP853 amplitude shooting on
      [10^-4,24] with regular-origin and massless-tail Robin data,
      rtol=3e-10, atol=3e-12, maximum step 0.05, 2401 samples, shared
      trapezoidal integration, and explicit leading endpoint-energy estimates
      gives conventional conditional coefficients E/(12*pi^2) of
      1.2314456867, 2.4162704269, and 4.5460579996, hence per-degree values
      1.2314456867, 1.2081352135, and 1.1365144999. The relative E2/E4
      imbalances are 4.98e-9, 1.50e-11, and 3.42e-13. Independent solve_bvp
      collocation from a fresh two-power initial construction on the same
      cutoffs, tolerance 3e-7, adaptive residual below 3e-7, and Simpson
      integration gives 1.2314503696, 2.4162703856, and 4.5460579996. Isolated
      sampled-quadrature, origin-cutoff, outer-domain, IVP-tolerance, and
      maximum-step refinements preserve the values and ordering. Accepted,
      source-biased, I=B, and I=B^2 angular inputs give materially distinct
      energies; both simple mutations still preserve the selected ordering,
      so comparator rejection is not its oracle. This is numeric evidence for
      three declared stationary branches and their conditional selected
      ordering only. It proves no half-line existence or uniqueness theorem,
      local or global minimum, rational-map angular minimum, variational upper
      bound, full three-dimensional solution, physical baryon, deuteron,
      alpha particle or nucleus, fission threshold, binding hierarchy,
      reaction, yield, quantum state, mass scale, material, or observation.
