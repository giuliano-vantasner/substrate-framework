      divergences are partial_mu T^(mu 0)=phi_t*R and
      partial_mu T^(mu 1)=-phi_x*R. Thus local stress conservation follows
      on shell; integrated charges additionally require appropriate boundary
      flux conditions. For x_plus=t+x, x_minus=t-x and
      partial_plus=(partial_t+partial_x)/2,
      partial_minus=(partial_t-partial_x)/2, the covariant null components
      are T_pp=(phi_t+phi_x)^2/4, T_mm=(phi_t-phi_x)^2/4, and
      T_pm=V/2. They obey the exact off-shell balances
      partial_minus T_pp+partial_plus T_pm=(phi_t+phi_x)*R/4 and
      partial_plus T_mm+partial_minus T_pm=(phi_t-phi_x)*R/4, while the
      Cartesian trace is T^mu_mu=2*V=4*T_pm. Scalar-field spatial parity
