  - id: C-MOD-001
    statement: >-
      For r>0, declare the dimensionless reduced energy
      E=4*pi*integral[(r^2+2*sin(f)^2)*f'^2+2*sin(f)^2
      +sin(f)^4/r^2]dr. Its exact Euler--Lagrange equation is
      (r^2+2*sin(f)^2)*f''+2*r*f'+sin(2*f)*(f'^2-1)
      -sin(2*f)*sin(f)^2/r^2=0. For f+epsilon*eta, the coefficient of
      epsilon^2 before integration by parts is A*eta'^2+B*eta*eta'+D*eta^2,
      where A=r^2+2*sin(f)^2, B=4*sin(2*f)*f', and
      D=2*cos(2*f)+2*cos(2*f)*f'^2
      +2*sin(f)^2*(3*cos(f)^2-sin(f)^2)/r^2. Under endpoint data that cancel
      the boundary term, the self-adjoint quadratic operator is
      H*eta=-(A*eta')'+C*eta with C=D-B'/2 and separately declared kinetic
      weight W=A; its Green boundary form is A*(u*v'-u'*v). For the scale
      family f(exp(s)*r), the tangent is r*f' and the declared two-/four-
      derivative energy scales as exp(-s)*E2+exp(s)*E4, so E2=E4 gives zero
      first derivative but positive curvature E2+E4 rather than a dilation
      zero mode. For a regular-origin half-line realization with the declared
      massless tail f,f' tending to zero sufficiently fast, A/W tends to one
      and C/W tends to 2/r^2 and then zero, so the continuum edge is
      Omega^2=0. A positive finite-Dirichlet-box eigenvalue is therefore not
      below that continuum edge. These are exact conditional reduced-model
      identities. They derive no physical Skyrme action, soliton or bound
      state, nucleon, Roper, spin or isospin, quantization, absolute scale, or
      substrate realization.
