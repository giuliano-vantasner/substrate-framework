  - id: C-RGE-004
    statement: >-
      For a separately supplied finite family of at least two exact real
      inverse-coupling coordinates a_i and signed exact real coefficients b_i
      in the declared affine convention a_i=A+B*b_i, the rows (1,b_i) define
      an exact two-coordinate linear system. Composing C-LIN-001, the family
      has a common intersection exactly when coefficient and augmented ranks
      agree, and it uniquely identifies A and B exactly when the common rank
      is two. A pair with b_i!=b_j has the unique crossing
      B_ij=(a_i-a_j)/(b_i-b_j); equal coefficients with equal coordinates are
      coincident, while equal coefficients with unequal coordinates are
      parallel and disjoint. Thus a consistent rank-two family makes all
      distinct-pair crossings agree, whereas unequal pairwise crossings are
      an exact counterexample to common intersection. Under the declared
      reference shift a_i'=a_i-delta*b_i, A is invariant and B'=B-delta.
      Separately, for supplied positive electromagnetic inverse E, strong
      inverse S, hypercharge weight n, and signed b1,b2,b3 with
      D=b2+n*b1-(1+n)*b3 nonzero, the exact-matching equations
      a_i=A+B*b_i, a3=S, and E=a2+n*a1 have the unique inverse
      reconstruction B=(E-(1+n)*S)/D, A=S-B*b3, weak coordinate w=a2/E,
      and common-coupling boundary w_boundary=1/(1+n). This is conditional
      inverse inference from two supplied observations and an exact matching
      premise, not an ab-initio prediction. For a positive Abelian coordinate
      rescaling alpha1'=q*alpha1, the paired map a1'=a1/q, b1'=b1/q, and
      n'=q*n preserves the electromagnetic row but not an unqualified equality
      between the Abelian and non-Abelian coupling coordinates. Independent
      additive sector matching offsets can represent arbitrary supplied
      intercepts and therefore must remain explicit. Applied only to WM3's
      supplied exact readings E=1279/10, S=500/59, n=5/3, and
      (b1,b2,b3)=(41/10,-19/6,-7), the reconstruction gives
      A=1639681/39530, B=186383/39530, w=6296809/30335322, and boundary 3/8.
