    statement: >-
      For an independently declared smooth complex scalar Psi on 1+1
      Minkowski spacetime with signature (+,-), define the raised current
      j^mu=i*(Psi_conj*d^mu(Psi)-Psi*d^mu(Psi_conj)). Off shell it obeys the
      exact identity d_mu*j^mu=i*(Psi_conj*Box(Psi)-Psi*Box(Psi_conj)). If the
      conjugate equations of motion have Box(Psi)=F(|Psi|^2)*Psi with real F,
      the current is conserved on shell. A genuinely real field has zero
