  - id: C-RMAP-001
    statement: >-
      Let S^2 carry its oriented unit round metric and normalized average
      <F>=(1/(4*pi))*integral_{S^2} F dOmega, with stereographic coordinate
      z=tan(theta/2)*exp(i*phi). For a declared nonconstant coprime holomorphic
      rational map R(z)=p(z)/q(z) of exact algebraic degree B>=1, define its
      conformal Jacobian J_R=((1+|z|^2)/(1+|R|^2)*|dR/dz|)^2, understood in a
      homogeneous polynomial representation at target poles. The pullback-area
      identity gives <J_R>=B. Hence the angular functional I[R]=<J_R^2> obeys
      I[R]>=B^2, with exact deficit I[R]-B^2=<(J_R-B)^2>. Polynomial degree is
      assigned only after exact common-factor cancellation. For the axial map
      R(z)=z^B, explicit radial substitution and Euler-beta integration give
      I_B=(B^3/3)*(1+Gamma(2-1/B)*Gamma(2+1/B)); in particular I_1=1 and
      I_2=pi+8/3 exactly. These conditional sphere-geometric results do not
      select a global fixed-degree minimizer, derive a physical Skyrme action
      or rational-map ansatz, solve a radial profile, identify map degree with
      a physical baryon or nucleus, or supply a mass, binding energy, reaction,
      yield, material, or observation map.
