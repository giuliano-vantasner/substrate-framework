    statement: >-
      Conditional on C-VTX-001 with (v,n,lambda,g)=(1,1,2,1), there is
      resolution-bounded numerical evidence on truncated radial domains for a
      nontrivial monotone solution with f(epsilon)=a(epsilon)=0 and
      f(R)=a(R)=1 and finite positive tension approximately 4.21160. The
      reference collocation solve uses epsilon=1e-4, R=20, 120 initial points,
      tolerance 1e-8, at most 100000 nodes, maximum RMS residual below 1.1e-8,
      and uniform 20001-point trapezoidal energy quadrature. Tightening
      tolerance reduces tension error; R from 10 through 25 agrees within
      1e-5; inner-cutoff error decreases from 1e-2 toward 1e-4; exponential and
      rational guesses converge to the same branch; matched dimensionless
      v=1 and v=2 domains give tension ratio four within 1e-5. Independent
      central finite differences at 101, 201, and 401 points give tensions
      4.19212, 4.20658, and 4.21037. This is numeric evidence, not a continuum
      existence or uniqueness theorem, absolute tension, or physical
      confinement result.
