  - id: C-LIN-001
    statement: >-
      For a finite exact real linear system M*x=b, the system is consistent if
      and only if rank(M)=rank([M|b]). When consistent, its solution-space
      dimension is columns(M)-rank(M); it is unique exactly when this dimension
      is zero and underdetermined exactly when it is positive. More equations
      than unknowns is only an equation-count property and implies neither
      consistency nor uniqueness. Adding an exact duplicate of a nonzero row
      leaves coefficient rank and nullity unchanged; the two-row duplicate
      subsystem is consistent exactly when the two right-hand sides agree.
