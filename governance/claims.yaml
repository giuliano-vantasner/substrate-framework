  - id: C-RPROF-001
    statement: >-
      Conditional on C-RMAP-001's declared positive integer degree B and
      positive angular coefficient I, and on the separately declared
      dimensionless radial functional
      E=4*pi*integral_0^infinity [r^2*f'^2
      +2*B*sin(f)^2*(1+f'^2)+I*sin(f)^4/r^2] dr, exact one-dimensional
      variation gives
      (r^2+2*B*sin(f)^2)*f''+2*r*f'
      +B*sin(2*f)*(f'^2-1)-I*sin(2*f)*sin(f)^2/r^2=0. The density separates
      as E=E2+E4 with E2=4*pi*integral [r^2*f'^2+2*B*sin(f)^2]dr and
      E4=4*pi*integral [2*B*sin(f)^2*f'^2+I*sin(f)^4/r^2]dr. Under the scale
      family f_s(r)=f(exp(s)*r), convergence and endpoint data that remove
      boundary terms give E(s)=exp(-s)*E2+exp(s)*E4; a stationary member
      therefore obeys E2=E4 and has positive curvature E2+E4 in this scale
      direction. Linearized regular-origin and decaying massless-tail powers
      are sigma=(sqrt(1+8*B)-1)/2 and p=(sqrt(1+8*B)+1)/2, satisfying
      sigma*(sigma+1)=2*B and p*(p-1)=2*B, with asymptotic residuals
      r*f'+sigma*(pi-f)=0 and r*f'+p*f=0. At B=1,I=1 the density and equation
      reduce exactly to C-MOD-001. These are conditional exact reduced-model
      identities. They do not derive a physical Skyrme action or rational-map
      ansatz, prove half-line existence or uniqueness, establish local or
      global minimization, solve a full three-dimensional field, identify
      degree with a baryon or nucleus, or supply a mass, binding energy,
      reaction, yield, material, or observation.
