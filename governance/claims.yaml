  - id: C-OVL-001
    statement: >-
      For any whole-line L2 mode eta normalized by integral_R |eta|^2 dx=1
      and any supplied bounded real multiplication profile Phi with essential
      range Phi_min<=Phi<=Phi_max, its expectation
      y=integral_R |eta|^2*Phi dx obeys Phi_min<=y<=Phi_max. For positive
      p,r,kappa and real A, if eta is proportional to sech(kappa*x)^p and
      Phi=A*sech(kappa*x)^r under Cartesian dx, then normalization gives the
      exact matched-width overlap
      y=A*Gamma(p+r/2)*Gamma(p+1/2)
      /(Gamma(p)*Gamma(p+r/2+1/2)); the common kappa cancels, but A does not.
      The p=2,r=1 value is 9*pi*A/32. For C-QBL-003's actual unnormalized
      even sech^2 and odd sech*tanh modes against A*sech at the same width,
      the normalized squared-density expectations are respectively
      9*pi*A/32 and 3*pi*A/16, their ratio for common A is 2/3, and the
      weighted even-odd cross expectation vanishes by parity. After L2
      normalization y has the mass dimension of Phi. A separately declared
      product m=y*v has the sum of the supplied profile and scale dimensions;
      a common v cancels from mass ratios, while independent amplitudes remain,
      and y->rho*y with v->v/rho leaves m invariant. These exact conditional
      expectation and parameter results derive no fermion, Yukawa interaction,
