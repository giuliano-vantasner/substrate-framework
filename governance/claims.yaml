schema_version: 1
claims:
  - id: C-SG-001
    statement: >-
      For every real omega with 0 < omega < 1, eta = sqrt(1-omega^2), and real
      x,t, the field phi(x,t) = 4 atan(eta sin(omega t)/(omega cosh(eta x)))
      is spatially localized, periodic with period 2*pi/omega, and satisfies
      phi_tt - phi_xx + sin(phi) = 0 identically in normalized units.
    provenance: campaigns/P001-sine-gordon-root/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
    dependencies: []
    evidence:
      - campaigns/P001-sine-gordon-root/verify.py
      - campaigns/P001-sine-gordon-root/attempts/0001/manifest.yaml
      - campaigns/P001-sine-gordon-root/reviews/independent_rederivation.py
      - tests/test_sine_gordon.py
    assumptions:
      - The normalized real 1+1 dimensional sine-Gordon equation is the declared root model.
      - Coordinates and field use c = m = beta = 1 dimensionless conventions.
    comparators: []
    accepted_in: v0.1.0
    challenges: []
    supersedes: []
  - id: C-SG-002
    statement: >-
      The C-SG-001 breather has conserved normalized Hamiltonian energy
      E(omega) = 16 sqrt(1-omega^2); E approaches the two-kink threshold 16 as
      omega -> 0+ and approaches 0 as omega -> 1-.
    provenance: campaigns/P001-sine-gordon-root/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
    dependencies:
      - C-SG-001
    evidence:
      - campaigns/P001-sine-gordon-root/verify.py
      - campaigns/P001-sine-gordon-root/attempts/0001/manifest.yaml
      - campaigns/P001-sine-gordon-root/reviews/independent_rederivation.py
      - tests/test_sine_gordon.py
    assumptions:
      - The normalized Hamiltonian density is (phi_t^2 + phi_x^2)/2 + 1 - cos(phi).
    comparators: []
    accepted_in: v0.1.0
    challenges: []
    supersedes: []
  - id: C-SG-003
    statement: >-
      For every real omega with 0 < omega < 1, the C-SG-001 breather's
      canonical action normalized by J = (1/(2*pi))*closed_integral(p dq) is
      J(omega) = 16 arccos(omega). It satisfies dE/dJ = omega, maps the family
      onto 0 < J < 8*pi, and has inverse parameterization
      omega = cos(J/16) and E = 16 sin(J/16).
    provenance: campaigns/P002-sine-gordon-action/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
    dependencies:
      - C-SG-001
      - C-SG-002
    evidence:
      - campaigns/P002-sine-gordon-action/verify.py
      - campaigns/P002-sine-gordon-action/attempts/0001/result.yaml
      - campaigns/P002-sine-gordon-action/reviews/independent_phase_space.py
      - memory/vantasner/decisions/C-SG-003-review.md
      - tests/test_sine_gordon.py
    assumptions:
      - The canonical action uses J = (1/(2*pi))*closed_integral(p dq).
      - The Hamiltonian action-angle identity dJ/dE = T/(2*pi) applies to the accepted periodic breather orbit.
    comparators: []
    accepted_in: v0.2.0
    challenges: []
    supersedes: []
  - id: C-SG-004
    statement: >-
      For every real omega with 0 < omega < 1, the C-SG-001 breather's
      period-averaged squared-gradient integral is
      Gbar = (1/T)*integral_0^T dt integral_R dx phi_x^2
      = 16*(sqrt(1-omega^2) - omega*arccos(omega)) = E - omega*J.
      It satisfies dGbar/domega = -J, approaches 16 as omega -> 0+, and
      approaches 0 as omega -> 1-. Gbar is the full squared-gradient
      integral; its Hamiltonian energy contribution is Gbar/2.
    provenance: campaigns/P003-sine-gordon-gradient/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
    dependencies:
      - C-SG-001
      - C-SG-002
      - C-SG-003
    evidence:
      - campaigns/P003-sine-gordon-gradient/verify.py
      - campaigns/P003-sine-gordon-gradient/attempts/0001/result.yaml
      - campaigns/P003-sine-gordon-gradient/attempts/0002/result.yaml
      - campaigns/P003-sine-gordon-gradient/reviews/independent_field_integral.py
      - memory/vantasner/decisions/C-SG-004-review.md
      - tests/test_sine_gordon.py
    assumptions:
      - Periodicity and localization justify the explicitly checked spacetime integration-by-parts boundary cancellations.
      - The averaged squared-gradient integral excludes the Hamiltonian factor of one half.
    comparators: []
    accepted_in: v0.3.0
    challenges: []
    supersedes: []
  - id: C-OG-001
    statement: >-
      For every positive twice-differentiable static index n(x) and c0 > 0,
      the declared 1+1 metric g = diag(-1/n, n/c0^2) has Ricci scalar
      R = c0^2*(n*n_xx - 2*n_x^2)/n^3 and satisfies Box_g(log(n)) = R.
      Among twice-differentiable scalar compositions f(n) satisfying
      Box_g(f(n)) = R for every such profile, exactly f(n) = log(n) + C work.
    provenance: campaigns/P004-optical-dilaton/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies: []
    evidence:
      - campaigns/P004-optical-dilaton/verify.py
      - campaigns/P004-optical-dilaton/attempts/0001/result.yaml
      - campaigns/P004-optical-dilaton/reviews/independent_tensor_review.py
      - memory/vantasner/decisions/C-OG-001-review.md
      - tests/test_optical_geometry.py
    assumptions:
      - The static 1+1 optical metric is declared to be diag(-1/n, n/c0^2) with signature (-,+).
      - The index is positive and twice differentiable and the signal speed c0 is positive.
    comparators: []
    accepted_in: v0.4.0
    challenges: []
    supersedes: []
  - id: C-OG-002
    statement: >-
      Conditional on C-OG-001 and the imported constitutive relation
      n = 1/(1 + 2*Phi/c0^2), the optical dilaton is
      log(n) = -log(1 + 2*Phi/c0^2), with leading weak-field term
      -2*Phi/c0^2. The metric's static slow coordinate-geodesic acceleration
      is exactly -(1 + 2*Phi/c0^2)*Phi_x; under Phi = lambda*U it satisfies
      acceleration/lambda -> -U_x as lambda -> 0+.
    provenance: campaigns/P004-optical-dilaton/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies:
      - C-OG-001
    evidence:
      - campaigns/P004-optical-dilaton/verify.py
      - campaigns/P004-optical-dilaton/attempts/0001/result.yaml
      - campaigns/P004-optical-dilaton/reviews/independent_tensor_review.py
      - memory/vantasner/decisions/C-OG-002-review.md
      - tests/test_optical_geometry.py
    assumptions:
      - The TF constitutive map n = 1/(1 + 2*Phi/c0^2) is an approved conditional import, not a derived framework claim.
      - The weak-field limit scales Phi = lambda*U at fixed differentiable U.
    comparators: []
    accepted_in: v0.4.0
    challenges: []
    supersedes: []
  - id: C-OG-003
    statement: >-
      Conditional on C-OG-001 and C-OG-002, for every twice-differentiable
      potential Phi(x) whose TF index n = 1/(1 + 2*Phi/c0^2) is positive,
      the exact source-side optical dilaton operator is
      -Box_g(log(n)) = 2*Phi_xx; no weak-field approximation is required and
      c0 cancels. Consequently, if a separate model declares
      -Box_g(phi) = kappa*rho, that equation is algebraically equivalent to
      Phi_xx = (kappa/2)*rho. This claim neither derives that matter equation
      nor assigns a physical normalization to kappa.
    provenance: campaigns/P010-optical-source-operator/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies:
      - C-OG-001
      - C-OG-002
    evidence:
      - campaigns/P010-optical-source-operator/verify.py
      - campaigns/P010-optical-source-operator/attempts/0001/result.yaml
      - campaigns/P010-optical-source-operator/reviews/independent_density_review.py
      - campaigns/P010-optical-source-operator/reviews/source_adjudication.md
      - memory/vantasner/decisions/C-OG-003-review.md
      - tests/test_optical_geometry.py
    assumptions:
      - The accepted static 1+1 optical metric and scalar-operator sign convention are retained.
      - The TF index map is an approved conditional import and produces a positive index.
      - Any matter-source equation and coupling kappa are separate premises, not consequences of this identity.
    comparators: []
    accepted_in: v0.10.0
    challenges: []
    supersedes: []
  - id: C-TH-001
    statement: >-
      For every real dimensionless splitting x, the normalized upper-state
      occupation of Z = 1 + exp(-x) is P = exp(-x)/Z = 1/(1+exp(x)). Its
      Bernoulli variance is P*(1-P) = sech(x/2)^2/4, and the conditional
      symmetric gate W = 2*P*(1-P) = sech(x/2)^2/2. W is even, has unique
      global maximum 1/2 at x = 0, decreases strictly with |x|, and tends to
      zero as x tends to either infinity. A shape A*sech(x/2)^2 equals 2*A*W;
      this identity does not determine the independent amplitude A.
    provenance: campaigns/P005-two-level-gate/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies: []
    evidence:
      - campaigns/P005-two-level-gate/verify.py
      - campaigns/P005-two-level-gate/attempts/0001/result.yaml
      - campaigns/P005-two-level-gate/attempts/0002/result.yaml
      - campaigns/P005-two-level-gate/reviews/independent_partition_review.py
      - memory/vantasner/decisions/C-TH-001-review.md
      - tests/test_thermal.py
    assumptions:
      - The two-level partition function is Z = 1 + exp(-x), with state occupations 0 and 1.
      - Any single-event or macroscopic gate interpretation is conditional on separately approved definitions; no amplitude or causal mechanism is derived here.
    comparators: []
    accepted_in: v0.5.0
    challenges: []
    supersedes: []
  - id: C-RG-001
    statement: >-
      For positive radius R and density lambda, the circumference line energy
      E_line = 2*pi*R*lambda is homogeneous of degree one, has constant positive
      derivative 2*pi*lambda, and has no stationary radius. For positive surface
      density sigma, E_shell = 4*pi*R^2*sigma is homogeneous of degree two and
      has radius-dependent derivative 8*pi*R*sigma. For positive line tension T
      and pressure P, E_cap = 2*pi*R*T - pi*R^2*P + C has the unique strict
      global maximum R = T/P. Conditional line constructions with coefficients
      T and the C-SG-002 breather energy share only the degree-one line form;
      their energies are equal for every positive R if and only if their
      coefficients are equal.
    provenance: campaigns/P006-radial-energy/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies:
      - C-SG-002
    evidence:
      - campaigns/P006-radial-energy/verify.py
      - campaigns/P006-radial-energy/attempts/0001/result.yaml
      - campaigns/P006-radial-energy/reviews/independent_scaling_review.py
      - memory/vantasner/decisions/C-RG-001-review.md
      - tests/test_radial_energy.py
    assumptions:
      - Radius and the applicable line, surface, tension, and pressure coefficients are positive real quantities.
      - The circumference and spherical-area constructions are declared geometries; a physical pulson or breather ring lift requires separate approval.
      - The Frank tension and accepted sine-Gordon breather energy are independent coefficients unless an additional accepted claim equates them.
    comparators: []
    accepted_in: v0.6.0
    challenges: []
    supersedes: []
  - id: C-VAR-001
    statement: >-
      For any differentiable one-coordinate Lagrangian L0 and any nonzero
      multiplier A that is independent of the path coordinate, velocity, and
      evolution parameter, the Euler-Lagrange operator satisfies
      EL[A*L0] = A*EL[L0]. The two Euler-Lagrange equations therefore have the
      same solution set. The result holds for every fixed nonzero uniform
      factor, not only a factor of degree one in a named energy scale.
    provenance: campaigns/P007-variational-scale/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
    dependencies: []
    evidence:
      - campaigns/P007-variational-scale/verify.py
      - campaigns/P007-variational-scale/attempts/0001/result.yaml
      - campaigns/P007-variational-scale/reviews/independent_geometry_review.py
      - memory/vantasner/decisions/C-VAR-001-review.md
      - tests/test_variational.py
    assumptions:
      - The multiplier is nonzero and constant with respect to the path, velocity, and evolution parameter.
      - The Lagrangian is differentiable enough for the stated Euler-Lagrange operator.
    comparators: []
    accepted_in: v0.7.0
    challenges: []
    supersedes: []
  - id: C-CC-001
    statement: >-
      Conditional on the timelike one-coordinate action
      L = -(E0/sqrt(n(q)))*sqrt(1-n(q)^2*qdot^2/c0^2), with positive n, c0,
      and E0, the exact coordinate-time acceleration is
      qddot = (c0^2-3*n^2*qdot^2)*n_q/(2*n^3). Its zero-velocity limit is
      c0^2*n_q/(2*n^3), matching C-OG-001, and its locally unique same-data IVP
      is independent of E0. The mixed-scale counterexample with E0 also inside
      the kinetic square root retains E0 and, for n=1+alpha*q at q=qdot=0,
      has initial acceleration E0*c0^2*alpha/2.
    provenance: campaigns/P007-variational-scale/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies:
      - C-VAR-001
      - C-OG-001
    evidence:
      - campaigns/P007-variational-scale/verify.py
      - campaigns/P007-variational-scale/attempts/0001/result.yaml
      - campaigns/P007-variational-scale/reviews/independent_geometry_review.py
      - memory/vantasner/decisions/C-CC-001-review.md
      - tests/test_collective_dynamics.py
    assumptions:
      - The one-coordinate optical collective action is a declared effective model, not a derived full 3D field reduction.
      - The path stays in a smooth positive-index timelike domain n(q)^2*qdot^2 < c0^2 where the IVP is locally unique.
      - Energy scale E0 and signal speed c0 are fixed positive parameters.
    comparators: []
    accepted_in: v0.7.0
    challenges: []
    supersedes: []
  - id: C-VIR-001
    statement: >-
      Conditional on the real virial slope formulas
      width_slope=(a-b)/2 and energy_slope=-(a+b)/2, both slopes equal -1/2
      if and only if (a,b)=(0,1). The alternatives (1,0) and (1,1) give
      slopes (1/2,-1/2) and (0,-1), respectively, and fail the simultaneous
      target.
    provenance: campaigns/P007-variational-scale/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies: []
    evidence:
      - campaigns/P007-variational-scale/verify.py
      - campaigns/P007-variational-scale/attempts/0001/result.yaml
      - campaigns/P007-variational-scale/reviews/independent_geometry_review.py
      - memory/vantasner/decisions/C-VIR-001-review.md
      - tests/test_collective_dynamics.py
    assumptions:
      - The two virial slope formulas are approved conditional inputs; their physical derivation and fitted predecessor slopes are not part of this claim.
      - Parameters a and b are real.
    comparators: []
    accepted_in: v0.7.0
    challenges: []
    supersedes: []
  - id: C-MED-001
    statement: >-
      For positive density rho, thermal scale Theta, and reference speed c, the
      declared co-scaled response laws epsilon=rho*Theta/c^2 and
      mu_inverse=rho*Theta satisfy epsilon*mu=1/c^2 and give local wave speed
      sqrt(mu_inverse/epsilon)=c. Density and thermal variations therefore
      cannot create an index within this ansatz. More generally, the logarithmic
      sensitivities vanish exactly when the corresponding response exponents
      match.
    provenance: campaigns/P008-constitutive-qualification/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies: []
    evidence:
      - campaigns/P008-constitutive-qualification/verify.py
      - campaigns/P008-constitutive-qualification/attempts/0001/result.yaml
      - campaigns/P008-constitutive-qualification/reviews/independent_algebra_review.py
      - memory/vantasner/decisions/C-MED-001-review.md
      - tests/test_constitutive.py
    assumptions:
      - The permittivity and inverse permeability response laws are declared constitutive premises with positive inputs.
      - The conclusion is confined to common response scaling and does not derive a separate continuum coupling or physical medium realization.
    comparators: []
    accepted_in: v0.8.0
    challenges: []
    supersedes: []
  - id: C-SK-001
    statement: >-
      Conditional on positive premises M_top=48*pi^3*B1*E_e and
      M_ANW=3*pi^2*B1*F_pi/e, equality M_top=M_ANW holds if and only if
      F_pi/e=16*pi*E_e. The shared linear hedgehog coefficient B1 cancels
      exactly; changing either B1 power generally prevents that cancellation.
    provenance: campaigns/P008-constitutive-qualification/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: compatible_extension
    epistemic: active
    dependencies: []
    evidence:
