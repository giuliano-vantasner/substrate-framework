  - id: C-EFT-001
    statement: >-
      Let V, J_even, and J_odd be real n-entry columns and let K be a nonempty
      real symmetric invertible n-by-n kernel. In the declared plus-source
      convention L(V)=V^T*K*V/2+V^T*J with J=J_even+J_odd, component
      stationarity gives V_star=-K^-1*J, the exact residual
      K*V_star+J=0, and the reduced term
      L_eff=-J^T*K^-1*J/2. Its source decomposition consists of the two even
      squares -J_even^T*K^-1*J_even/2 and
      -J_odd^T*K^-1*J_odd/2 plus the cross term
      -(J_even^T*K^-1*J_odd+J_odd^T*K^-1*J_even)/2. Under the declared
      bookkeeping K and J_even are parity even and J_odd is parity odd, so
      only the cross term changes sign; it vanishes when either source is
      absent. For K=M+D with symmetric invertible M and symmetric D, define
      A=M^-1*D and R_N=sum_(n=0)^N((-A)^n*M^-1). Exact multiplication gives
      R_N*(M+D)-I=(-1)^N*A^(N+1) and
      (M+D)*R_N-I=(-1)^N*M*A^(N+1)*M^-1. Thus a finite low-momentum inverse
      expansion is only a formal truncation under separately supplied power
      counting and convergence premises; its returned nonzero residual cannot
      be identified with an exact inverse. Finally, for a field-dependent
      stationary substitution, the chain rule gives
      delta Gamma_eff=(delta Gamma)_V+(partial Gamma/partial V)_star*delta
      V_star, so the induced-field term vanishes on the actual stationary
      equation while the supplied explicit variation remains. Consequently,
      if a starting functional is an inhomogeneous term plus invariant local
      terms with free coefficients, stationary elimination neither selects
      those coefficients nor creates a missing inhomogeneous anomaly
      variation. This is a conditional finite-dimensional action theorem. It
      fixes no field content, source, kernel, mass, coupling, boundary term,
      operator basis, or coefficient and supplies no HLS field content, no
      physical vector meson, no WZW functional, no anomaly coefficient, no
      vector dominance or KSRF relation, no baryon interpretation, no N_c, no
      absolute scale, and no substrate realization.
