  - id: C-DEF-001
    statement: >-
      For a real angular field theta of degree q on the annulus
      xi<r<R with positive stiffness K and energy
      (K/2)*integral|grad(theta)|^2*d^2x, the uniform winding theta=q*phi
      has energy pi*K*q^2*log(R/xi), and circlewise Cauchy-Schwarz makes this
      the sharp lower bound when every concentric circle has that degree.
      In the separately declared matched-shell model for n positive-concrete
      equal pieces of fixed total charge Q, with n near annuli xi<r<d and one
      common far annulus d<r<R, the field energy is
      pi*K*Q^2*((1/n)*log(d/xi)+log(R/d)); adding piece and unsplit core
      energies gives split-minus-unsplit
      -pi*K*Q^2*(1-1/n)*log(d/xi)+n*E_piece-E_integer. Thus the independent-
      copy field ratio 1/n occurs only when the common far shell vanishes at
      d=R; it is not a general fixed-boundary interaction ratio. Separately,
      pi1(RP2)=Z2, while the full polar manifold (S2 x U1)/Z2 has universal
      cover S2 x R and deck group Z generated by
      g(director,t)=(-director,t+pi); its square is the nontrivial integer
      phase vortex, not the identity. For the supplied isolated phase/director
      functional, two half textures have field energy
      pi*(K_phase+K_director)*L/2 and one integer phase vortex has
      pi*K_phase*L, so including cores their pair-minus-integer residual is
      pi*(K_director-K_phase)*L/2+2*E_half-E_integer. Preference therefore
      requires that declared residual to be negative. These exact conditional
      ledgers derive no material stiffness or core, exact finite-domain
      multi-core solution, equilibrium separation, vortex existence or
