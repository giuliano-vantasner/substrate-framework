  - id: C-LAT-002
    statement: >-
      Let N>=2 and let dimensionless real phases u_j(t) live on a
      one-dimensional periodic nearest-neighbour chain with exact positive
      physical phase inertia I, coupling energy K, on-site energy V0, and
      spacing a. The per-site-energy Lagrangian
      sum_j[I*dot(u_j)^2/2-K*(u_(j+1)-u_j)^2/2
      -V0*(1-cos(u_j))] has exact site equation
      I*ddot(u_j)-K*(u_(j+1)-2*u_j+u_(j-1))+V0*sin(u_j)=0. Linearization about
      a vacuum has first-zone dispersion
      Omega^2=(V0+4*K*sin(k*a/2)^2)/I, gap sqrt(V0/I), zone-edge frequency
      sqrt((V0+4*K)/I), and long-wave speed a*sqrt(K/I). Under base rows
      (mass,length,time), the columns (I,K,V0,a,m,b) are (1,2,0), (1,2,-2),
      (1,2,-2), (0,1,0), (1,0,0), and (0,1,0). If a physical displacement is
      declared by q=b*u, then I=m*b^2; if its neighbour stiffness is kappa,
      then K=kappa*b^2. Thus sqrt(V0/m) has speed rather than frequency units
      when m is a bare mass. For two declared hosts A and B,
      Omega_A(0)/Omega_B(0)=sqrt(V_A*I_B/(I_A*V_B)), or after displacement
      lifts sqrt(V_A*m_B*b_B^2/(V_B*m_A*b_A^2)). The H-over-D value sqrt(2)
      follows only if V_D=V_H, b_D=b_H, and m_D=2*m_H exactly; changing either
      curvature or phase scale can remove that shift. At fixed I, V0->0+
      closes the linear gap. These exact conditional results derive no
      lattice or material realization, coefficient value, collective
      effective mass, exact isotope prediction, nonlinear discrete-breather
      existence, lifetime, radiation, or absolute frequency.
