      Q2=-4*m2. The Q2-to-zero limit is zero, while the m2-to-zero limit at
      fixed positive Q2 is C, so those iterated limits do not commute. More
      generally, for a separately declared spectral density rho(t) supported
      on t>=Delta>0, whenever the displayed inverse moments and remainder
      converge, integral[rho(t)*Q2/(t+Q2)]dt equals the order-N sum
      sum_(n=1)^N (-1)^(n-1)*Q2^n*integral[rho(t)/t^n]dt plus the exact
      remainder (-1)^N*Q2^(N+1)*integral[rho(t)/(t^N*(t+Q2))]dt. A positive
