  - id: C-RDIFF-001
    statement: >-
      Let U and alpha be positive, let A and n be positive integers, and let
      b(A) and b(n*A) be real dimensionless coefficients. Conditional on the
      declared masses M(k)=alpha*b(k)*U and binding convention
      B_E(k)=k*M(1)-M(k), the signed difference satisfies exactly
      Q=n*M(A)-M(n*A)=B_E(n*A)-n*B_E(A)
      =alpha*U*(n*b(A)-b(n*A)). Hence kappa=Q/U has inverse
      b(n*A)=n*b(A)-kappa/alpha, and for positive alpha its sign is the sign of
      n*b(A)-b(n*A), with zero surface b(n*A)=n*b(A). If independent input
      intervals are b(A) in [l_A,u_A] and b(n*A) in [l_F,u_F], their sharp
      rectangular image is
      alpha*(n*l_A-u_F) <= kappa <= alpha*(n*u_A-l_F). Separate upper bounds
      on M(A) and M(n*A) do not in general bound their signed difference:
      their unknown nonnegative slacks enter with opposite signs. This is an
      exact conditional linear transformation. It derives no mass formula,
      scale, action, minimum, state identity, binding convention, reaction,
      yield, material, or observation.
