  - id: C-COH-002
    statement: >-
      For the declared Brownian phase process
      delta_t=sqrt(2*D)*W_t with D>=0, t>=0, delta_0=0, and a standard real
      Wiener process, the exact integer-harmonic characteristic is
      E[exp(i*n*delta_t)]=exp(-n^2*D*t), and Var(delta_t)=2*D*t. Hence the
      one-ensemble mean phasor is exp(-D*t), while the iid same-time pair
      coherence is its square exp(-2*D*t); neither is a survival probability.
      For a positive uniform observation window T, their temporal averages
      are respectively (1-exp(-D*T))/(D*T) and
      (1-exp(-2*D*T))/(2*D*T), with continuous value one at D=0, and they are
      not their endpoint values. Separately, if an independent deterministic
      coordinate-amplitude envelope exp(-Gamma*t/2) with Gamma>=0 is declared,
      its product with the Brownian mean phasor is the coherent mean-field
      factor exp(-(Gamma/2+D)*t), whose quadratic factor is
      exp(-(Gamma+2*D)*t). These formulas derive no physical diffusion
      coefficient, fluctuation-dissipation normalization, effective
      temperature, oscillator or breather phase projection, total energy,
      lifetime, survival fraction, population, event rate, or material or
      discharge map.
