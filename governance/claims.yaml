  - id: C-OVL-002
    statement: >-
      Let p,r,kappa be positive, A real, R real, and let an L2-normalized
      whole-line Cartesian mode be proportional to
      sech(kappa*(x-R))^p while the supplied core multiplier is
      A*sech(kappa*x)^r. With a=kappa*abs(R), alpha=2*p, and
      ell=(alpha+r)/2, its exact expectation is A/J_alpha times
      2^(alpha+r-1)*exp(-alpha*a)*B(ell,ell)
      *2F1(alpha,ell;2*ell;1-exp(-2*a)), where
      J_alpha=sqrt(pi)*Gamma(p)/Gamma(p+1/2). It is even in R and reduces to
      C-OVL-001's matched-width gamma ratio at R=0. For nonzero A and large
      a, unequal alpha and r give the exact leading class
      A*2^(alpha+r-1)*B(abs(alpha-r)/2,ell)/J_alpha times
      exp(-min(alpha,r)*a); equal alpha=r instead gives
      A*2^(2*alpha)/J_alpha times a*exp(-alpha*a). Thus the slower density or
      profile tail sets the exponential rate, and equal rates are not a pure
      geometric law. Separately, for V0,w>0 the whole-line Hamiltonian
      H_R=-d_x^2-V0*sech((x-R)/w)^2 has exact normalized ground state
      N*sech((x-R)/w)^s, with s=(sqrt(1+4*V0*w^2)-1)/2,
      N^2=Gamma(s+1/2)/(w*sqrt(pi)*Gamma(s)), eigenvalue -s^2/w^2, and
      density-tail rate 2*s/w. Translation changes R but not its spectrum.
      Against A*sech(kappa*x), the slower of 2*s/w and kappa controls the
      overlap; the exact unequal-rate beta prefactors and equal-rate linear-R
      prefactor are retained by the canonical ledger. A declared linear
      center ladder R_n=R_0+n*d therefore has limiting log overlap ratio
      -min(2*s/w,kappa)*d, but d is a free input and reciprocal rate/spacing
      rescaling leaves this product invariant. An exact Gaussian localized
      countermodel attenuates as exp(-c*R^2), proving localization does not
      uniquely select a geometric displaced-sech mechanism. These exact
      conditional results derive no half-line radial operator, common
      multi-rung spectrum, well centers or spacing, generation count or
      identity, Yukawa interaction, observed hierarchy, mixing, absolute
