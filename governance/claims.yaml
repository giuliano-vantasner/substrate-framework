  - id: C-MED-003
    statement: >-
      Conditional on a dimensionless real field u, physical coordinates x and
      t, exact positive coefficients lambda, T, and mu, and the declared
      energy-per-length density
      L=lambda*u_t^2/2-T*u_x^2/2-mu*(1-cos(u)), the Euler-Lagrange equation is
      lambda*u_tt-T*u_xx+mu*sin(u)=0 and the positive scales are
      c=sqrt(T/lambda), omega_0=sqrt(mu/lambda),
      ell=sqrt(T/mu)=c/omega_0, E_scale=sqrt(T*mu), and
      J_scale=sqrt(lambda*T), with E_scale=omega_0*J_scale. Under base rows
      (energy,length,time), the coefficient columns (lambda,T,mu) are
      (1,-1,2), (1,1,0), and (1,-1,0), a full-rank matrix. The coordinate map
      X=x/ell and tau=omega_0*t sends the dimensional residual exactly to mu
      times U_tau_tau-U_XX+sin(U). The logarithmic map from coefficients to
      (c,omega_0,ell) has rank two and right nullspace spanned by (1,1,1): at
      fixed positive c and omega_0 the inverse coefficient family is
      (lambda,lambda*c^2,lambda*omega_0^2) for an arbitrary positive lambda.
      A common coefficient multiplier preserves c, omega_0, ell and the field
      solution set while multiplying physical energy and canonical action by
      that factor. This is a conditional continuum cosine model; dimensions,
      periodicity, ratio closure, or symbol absence does not derive a material,
      select coefficient values, or remove the common energy/action scale.
