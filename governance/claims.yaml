  - id: C-COH-001
    statement: >-
      Let N be a positive integer, I1 a positive exact per-source directional
      intensity, and z_j independent identically distributed unit complex
      phasors with common mean mu and pair coherence V=|mu|^2 in [0,1]. Then
      I1*E[|sum_j z_j|^2]=I1*(N+N*(N-1)*V). The V=0 and V=1 endpoints are
      N*I1 and N^2*I1, and the expected-to-incoherent ratio is
      1+(N-1)*V. For centered iid Gaussian phase noise of variance sigma^2,
      V=exp(-sigma^2). These are directional
      ensemble statements at fixed per-source normalization: substituting
      I1=I_total/N changes the aligned result to N*I_total, and deterministic
      correlated phases need not obey the iid lower endpoint. Separately,
      declare the continuous positive-coordinate interpolation
      Theta(n,V)=theta*n*(1+(n-1)*V) with theta>0, n>0, and V in [0,1]. For a
      supplied positive barrier E its unique positive continuous crossing is
      n=E/theta at V=0 and
      n=(sqrt((1-V)^2+4*V*E/theta)-(1-V))/(2*V) for V>0; the fully aligned
      endpoint is sqrt(E/theta). Thus alignment lowers the endpoint threshold
      exactly when E/theta>1, is neutral at one, and reverses below one.
      Theta is strictly increasing in V for n>1 and independent of V at n=1.
      The separately conditional activated factor exp(-E/Theta) inherits that
      monotonicity but is dimensionless and is not a rate without a supplied
      dimensionful prefactor and kinetic model. These exact results derive no
      emitter population, phase preparation or dynamics, observable
      normalization, total or conserved energy, effective temperature,
      stochastic escape process, material barrier, precursor identity,
      nuclear interaction, reaction branch, deposition law, event payload,
      engine replacement, or substrate realization.
