      [[2,-1,0],[1,0,K]]*(u,v,y)^T=(log(G_r),log(L_r/C))^T. Its coefficient
      rank is two, its nullspace is generated by (-K,-2*K,1), and none of u,
      v, or y is identified by those two rows. Adding a separately supplied
      positive coefficient ratio sigma through v=log(sigma) gives a full-rank
      unique solve u=(log(G_r)+log(sigma))/2 and
      y=(log(L_r/C)-u)/K; it defines a positive inferred g^2=1/y only when
