  - id: C-PDE-005
    statement: >-
      For the dimensionless three-dimensional radial sine-Gordon equation of
      C-PDE-001, let H be a finite set of positive odd integers containing one
      and set u(r,t)=sum_(n in H) a_n(r)*cos(n*omega*t). With
      S_n[a]=(1/pi)*integral_0^(2*pi)
      sin(sum_(m in H) a_m(r)*cos(m*tau))*cos(n*tau) dtau, exact Fourier
      projection gives
      a_n''+2*a_n'/r+(n*omega)^2*a_n-S_n[a]=0. Odd harmonics give exact
      half-period antisymmetry. Even radial regularity gives a_n'(0)=0 and the
      origin curvature law
      3*a_n''(0)+(n*omega)^2*a_n(0)-S_n[a](0)=0. In the linear far field each
      mode obeys
      a_n''+2*a_n'/r+((n*omega)^2-1)*a_n=0: n*omega<1 is evanescent with rate
      sqrt(1-(n*omega)^2), n*omega=1 is threshold, and n*omega>1 is radiative
      with wavenumber sqrt((n*omega)^2-1). A nonzero real radiative one-over-r
      tail has positive asymptotic energy per unit radial length and hence
      infinite integrated three-dimensional energy. Thus a sub-threshold
      fundamental does not localize its higher channels, and a Dirichlet wall
      on a radiative harmonic fixes a finite-box standing-wave phase rather
      than proving an infinite-domain finite-energy breather. These exact
      conditional statements establish no existence, uniqueness, nonzero
      radiative coefficient, exact periodic solution, lifetime, gravity,
      particle identity, absolute scale, or substrate realization.
