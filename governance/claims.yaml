      - campaigns/P006-radial-energy/reviews/independent_scaling_review.py
      - memory/vantasner/decisions/C-RG-001-review.md
      - tests/test_radial_energy.py
    assumptions:
      - Radius and the applicable line, surface, tension, and pressure coefficients are positive real quantities.
      - The circumference and spherical-area constructions are declared geometries; a physical pulson or breather ring lift requires separate approval.
      - The Frank tension and accepted sine-Gordon breather energy are independent coefficients unless an additional accepted claim equates them.
    comparators: []
    accepted_in: v0.6.0
    challenges: []
    supersedes: []
  - id: C-RG-002
    statement: >-
      Conditional on positive Frank constant K_F with energy-per-length
      dimension, real dimensionless defect strength s, ordered positive
      cutoffs R_o>r_c, positive core line energy epsilon_core, positive
      coupling g and thickness l_m, and nonzero real amplitude A and
      wavenumber k, declare
      T=pi*K_F*s^2*log(R_o/r_c)+epsilon_core and
      P=g*A^2*k^2*l_m/2. Composing these premises with C-RG-001 gives the
      unique positive capillary maximum
      R_*=2*T/(g*A^2*k^2*l_m) and relative barrier
      E_barrier=E(R_*)-E(0)=2*pi*T^2/(g*A^2*k^2*l_m); a radius-independent
      core offset cancels only from this relative height. If [A]=L^alpha,
      dimensional closure requires [g]=E*L^(-1-2*alpha), giving
      [P]=E/L^2, [R_*]=L, and [E_barrier]=E for every declared real alpha,
      so dimensions select neither alpha nor the quadratic loading premise.
      Holding T fixed, the log elasticities of both radius and barrier against
      (g,A,k,l_m) are (-1,-2,-2,-1), while the barrier elasticity against T is
      two and the radius elasticity is one. Writing
      T_el=pi*K_F*s^2*log(R_o/r_c), the T elasticities against
      (K_F,s,R_o,r_c,epsilon_core) are
      (T_el/T,2*T_el/T,pi*K_F*s^2/T,-pi*K_F*s^2/T,epsilon_core/T); the radius
      inherits them and the barrier doubles them. The exact log-exponent
      matrix for (R_*,E_barrier) against (T,g,A,k,l_m) has rank two and three
      null directions: radius plus barrier identifies effective T but not the
      four drive constituents, while a barrier observation alone has rank one
      and identifies none. Zero drive has no finite maximum and negative
      drive is strictly increasing for positive radius. These results derive
      no material, coupling value, amplitude convention, k-omega dispersion,
      temperature law, nucleation rate, DBD event, isotope effect, nuclear
      process, or output power.
    provenance: campaigns/P099-bd1-capillary-constitutive-map/adjudication.yaml
    verification: symbolic_verified
