      observation column b with row provenance, and a separately supplied exact
      symmetric positive-definite covariance Sigma with declared provenance,
      the unique generalized least-squares estimator is
      x_hat=(A^T*Sigma^-1*A)^-1*A^T*Sigma^-1*b. Its fitted column is A*x_hat,
      residual r=b-A*x_hat, residual projector
      P=I-A*(A^T*Sigma^-1*A)^-1*A^T*Sigma^-1, exact normal residual
