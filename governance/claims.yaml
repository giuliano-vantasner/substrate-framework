  - id: C-SG-012
    statement: >-
      Let phi be a sufficiently smooth real field in normalized 1+1
      sine-Gordon conventions, with signature eta=diag(+1,-1), potential
      V(phi)=1-cos(phi), Lagrangian density
      L=(phi_t^2-phi_x^2)/2-V(phi), and residual
      R=phi_tt-phi_xx+sin(phi). The canonical symmetric tensor
      T_mu_nu=partial_mu(phi)*partial_nu(phi)-eta_mu_nu*L has covariant
      components T_00=(phi_t^2+phi_x^2)/2+V, T_01=T_10=phi_t*phi_x, and
      T_11=(phi_t^2+phi_x^2)/2-V. Raising both indices changes the mixed
