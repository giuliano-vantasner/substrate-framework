  - id: C-BPS-003
    statement: >-
      Let A and n be positive integers and epsilon a positive dimensionless
      parameter tending to zero. Suppose the same positive-degree sectors used
      in C-BPS-002 have controlled expansions at D=A and D=n*A of the form
      M_epsilon(D)=K*D+epsilon*Delta_D+r_D(epsilon), with finite fixed-degree
      coefficients Delta_D. Then exactly
      n*M_epsilon(A)-M_epsilon(n*A)
      =epsilon*(n*Delta_A-Delta_(n*A))
      +n*r_A(epsilon)-r_(n*A)(epsilon). If both remainders are o(epsilon),
      this is epsilon*(n*Delta_A-Delta_(n*A))+o(epsilon); if both are
      O(epsilon^2), the residual is O(epsilon^2). The first-order coefficient
      may be positive, zero, or negative. This theorem does not establish that
      a proposed deformation admits the expansion, derive the corrections or
      their sign, provide a global interpolation, or make epsilon or a
      physical binding coefficient numerically small.
