  - id: C-FLX-001
    statement: >-
      Conditional on positive flux Phi uniformly crossing a cross-section A
      that is fixed independently of positive length L, Gauss data give the
      constant field E=Phi/A. With declared field-energy density E^2/2, stored
      field energy is U(L)=Phi^2*L/(2A), linear with energy slope
      sigma_energy=Phi^2/(2A). Separately, for positive endpoint charge q and
      declared force F=qE, endpoint work is V(L)=q*Phi*L/A, linear with force
      slope sigma_force=q*Phi/A. The slopes agree if and only if q=Phi/2; for
      q=Phi the endpoint slope is twice the energy slope. Fixed area is
      load-bearing: A(L)=A0*(1+L/L0) gives logarithmic field energy, while
      spherical spreading gives an inverse-square field and curved Coulomb
      potential. Matching a supplied tension by A_eff=Phi^2/(2*sigma) defines
      an effective area and does not predict it. This theorem establishes no
      physical charge, flux tube, vortex-tension identity, QCD, area law, or
      confinement.
