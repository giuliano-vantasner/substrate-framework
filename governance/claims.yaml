  - id: C-BPS-001
    statement: >-
      Let X be a closed connected oriented three-manifold with volume form
      dvol, and let the target be the oriented unit round S^3 with volume form
      Omega normalized by integral_{S^3} Omega=2*pi^2. For a sufficiently
      regular map U:X->S^3 of nonzero signed degree B, define the normalized
      pullback density by U*Omega/(2*pi^2)=B0*dvol. Let lambda and mu be
      positive, let V:S^3->[0,infinity) have integrable square root, and set
      W=(1/(2*pi^2))*integral_{S^3} sqrt(V)*Omega. Then the declared energy
      E[U]=integral_X[(lambda*pi^2*B0)^2+mu^2*V(U)]dvol has the exact
      decomposition
      E=integral_X(lambda*pi^2*B0-sign(B)*mu*sqrt(V(U)))^2*dvol
      +2*lambda*mu*pi^2*abs(B)*W and therefore obeys
      E>=2*lambda*mu*pi^2*abs(B)*W. Equality holds if and only if the displayed
      square vanishes almost everywhere. This theorem does not establish that
      an equality configuration exists in any degree sector, select a
      potential or coupling, identify degree with a physical baryon or
      nucleus, or derive a mass, reaction, binding, or yield.
