  - id: C-MOM-003
    statement: >-
      Let rho(r) be any radial density for which
      J=integral_R3 rho(r)*r^2 d^3x exists, and define
      I_ij=integral_R3 rho(r)*x_i*x_j d^3x. Exact sphere integration gives
      integral_S2 n_i*n_j dOmega=(4*pi/3)*delta_ij and hence
      I_ij=(J/3)*delta_ij. Therefore Tr(I)=J, the normalized tensor
      I_STF=I-delta*Tr(I)/3 is identically zero, and the triple convention
      Q=3*I_STF is identically zero. For the axisymmetric deformation
      rho=f(r)*(1+a*P2(cos(theta))) with the same scalar J, the exact guard is
      I_STF=diag(-a*J/15,-a*J/15,2*a*J/15) and
      Q=diag(-a*J/5,-a*J/5,2*a*J/5), which is nonzero when a*J is nonzero and
      returns to the spherical null at a=0. These are moment-kinematic
      identities. They define no gravitational dynamics and do not by
      themselves establish physical radiation, non-radiation, or a required
      dynamical l=2 channel.
