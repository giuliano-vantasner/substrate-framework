  - id: C-RGE-005
    statement: >-
      Let a finite nonempty ordered family of gauge factors contain at most one
      Abelian factor. Supply each factor a nonnegative exact real adjoint
      Casimir C_A(a), with zero for the Abelian factor, and supply each of a
      finite family of Weyl-fermion or complex-scalar multiplets a positive
      integer multiplicity m_r, nonnegative exact Dynkin indices S2_a(r)
      including spectator-factor degeneracies, and nonnegative exact quadratic
      Casimirs C2_a(r). Conditional on the imported modified-minimal-
      subtraction one- and two-loop gauge weights, define
      b_a=-(11/3)C_A(a)+(2/3)sum_F m_r*S2_a(r)
      +(1/3)sum_S m_r*S2_a(r), and define the gauge-only matrix
      B_ab=-(34/3)C_A(a)^2*delta_ab
      +sum_F m_r*S2_a(r)*((10/3)C_A(a)*delta_ab+2*C2_b(r))
      +sum_S m_r*S2_a(r)*((2/3)C_A(a)*delta_ab+4*C2_b(r)).
      In the convention
      mu*dg_a/dmu=b_a*g_a^3/(16*pi^2)
      +g_a^3*sum_b(B_ab*g_b^2)/(16*pi^2)^2, row a belongs to beta(g_a)
      and column b multiplies g_b^2. Every coefficient is an exact sum with
      separately inspectable gauge, Weyl, and complex-scalar contributions.
      For an Abelian coordinate change T'=rho*T and g'=g/rho with rho>0,
      S2'=rho^2*S2 and C2'=rho^2*C2 imply b'_a=rho_a^2*b_a and
      B'_ab=rho_a^2*rho_b^2*B_ab, so beta'_a=beta_a/rho_a. Applied only to a
      separately supplied three-factor table with squared Abelian normalization
      3/5, three copies of five declared Weyl multiplets, and one declared
      complex scalar doublet, the exact specialization is
      b=(41/10,-19/6,-7) and
      B=((199/50,27/10,44/5),(9/10,35/6,12),(11/10,9/2,-26)).
      This theorem imports the loop weights and supplied invariants. It excludes
      the same-order Yukawa contribution, multiple-Abelian kinetic mixing,
      thresholds, matching, boundary data, field-content or anomaly derivation,
      a preferred Abelian normalization, unification, Standard-Model identity,
      observed running, and substrate realization.
