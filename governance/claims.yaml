  - id: C-GW-005
    statement: >-
      Let e and n be nonzero three-vectors denoting an axis of symmetry and a
      line of sight, and replace them by their unit directions. For an
      axisymmetric normalized STF tensor
      S=alpha*(e*e^T-delta/3), and an explicit nonzero convention scale s,
      define S_s=s*S; s=1 is normalized and s=3 is the triple convention.
      Then Tr(S_s)=0, its eigenvalue along e is 2*s*alpha/3, and
      |S_s|^2=2*s^2*alpha^2/3. Let cos(i)=e.n. Away from the axial null choose
      the natural meridian frame p=(e-cos(i)*n)/sin(i), q=n cross p. The TT
      projection of S_s has normalized plus coordinate
      s*alpha*sin(i)^2/sqrt(2), conventional matrix readout
      s*alpha*sin(i)^2/2, and cross coordinate zero. Along n parallel to e the
      complete TT tensor is zero. Under the separately declared C-GW-001
      inputs A=2*G and B=1/(32*pi*G), convention S_s requires waveform
      coefficient 2*G/s and gives the convention-invariant conditional
      conventional waveform h_plus=G*alpha''*sin(i)^2/R, h_cross=0, and power
      P=2*G*alpha'''^2/15. Equivalently, if lambda_s is the axial eigenvalue
      of S_s, h_plus*R/G=3*lambda_s''*sin(i)^2/(2*s) and
      P/G=3*lambda_s'''^2/(10*s^2). Combining a scale-three tensor with the
      scale-one coefficient multiplies the waveform by three and power by
      nine. These are exact conditional tensor identities. They establish no
      source dynamics, conserved isolated stress tensor, gravitational action
      or field equation, physical retarded solution or flux, detector strain,
      backreaction, absolute scale, or substrate realization.
