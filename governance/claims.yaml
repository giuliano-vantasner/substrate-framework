      - campaigns/P100-bd2-thermal-rate-audit/reviews/source_adjudication.md
      - memory/vantasner/decisions/C-TH-002-review.md
      - tests/test_thermal.py
    assumptions:
      - q, vartheta, E, and nu are exact, real, constant, and strictly positive; x, Theta, u, and b are defined exactly as displayed.
      - The coth scale, prefactor exponent, and supplied attempt frequency are declared premises. No physical bath, state, mode, noise, kinetic, or stochastic model is inferred from the composition.
      - The source-prefactor maximum uses a=1/2 and an unrestricted positive thermal-energy coordinate. A physical optimum requires a separately declared objective, control domain, costs, and validity regime.
      - Input elasticities hold q, vartheta, nu, the gate, and all other displayed inputs fixed. A total drive-frequency derivative requires explicit q(k), nu(k), and any dependent-scale maps.
      - C-RG-002's quadratic-loading premise supplies m=2 for amplitude and wavenumber only within its accepted conditional scope; it does not establish k proportional to frequency.
      - Identifiability statements concern the exact displayed response family; no observation model, calibrated attempt frequency, or independent energy scale is supplied.
    comparators:
