  - id: C-SPN-002
    statement: >-
      Let N be a positive integer and let H=(C^2)^(tensor N) have the
      orthonormal computational basis of N declared two-state factors. For
      0<=k<=N, let |D_N^k> be the normalized equal superposition of all
      binomial(N,k) basis vectors with exactly k excited factors. With local
      dimensionless raises sigma_i^+ and a declared real operator scale s,
      define J_+=s*sum_i sigma_i^+, J_-=J_+^dagger, and
      J_z=(s/2)*sum_i sigma_i^z. Then exactly
      J_+|D_N^k>=s*sqrt((N-k)*(k+1))*|D_N^(k+1)> for k<N and zero for k=N;
      J_-|D_N^k>=s*sqrt(k*(N-k+1))*|D_N^(k-1)> for k>0 and zero for k=0.
      In j=N/2, m=k-N/2 coordinates these are the standard irreducible su(2)
      ladder coefficients, with [J_+,J_-]=2*s*J_z and Casimir
      J_z^2+(J_+*J_-+J_-*J_+)/2=s^2*j*(j+1). The ground-edge coefficient is
      s*sqrt(N), while central-rung coefficients are order N and approach
      N*abs(s)/2 in magnitude for even N. More generally, for a weighted
      ground-state raise A_+=a*sum_i g_i*sigma_i^+ with declared complex
      g_i and a, its projection on |D_N^1> is a*sum_i(g_i)/sqrt(N), its total
      one-excitation norm squared is |a|^2*sum_i|g_i|^2, and the orthogonal
      dark norm squared is their nonnegative difference. Hence the familiar
      equal-coupling square-root enhancement requires equal magnitudes and
      phases; unequal phases can cancel the symmetric projection without
      canceling the full image. These are exact normalized finite-dimensional
      vector-space identities. A squared ladder coefficient is not a rate.
      The theorem establishes no physical two-level constituents, nuclear or
      phonon state, symmetric preparation, common mode, interaction
      Hamiltonian, resonance, spectral density, linewidth, decoherence,
      Fermi-Golden-Rule regime, supertransfer, material realization, or
