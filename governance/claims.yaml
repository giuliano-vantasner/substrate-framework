  - id: C-SYM-002
    statement: >-
      For explicitly positive real coordinates x and coefficients A, the map
      D_A(x)=A/x is an involution, every orbit has product x*D_A(x)=A, and its
      unique positive fixed coordinate is sqrt(A). Any supplied positive
      target t can be made fixed by the inverse construction A=t^2, so neither
      A nor t is selected by fixed-point algebra. If positive coupling
      coordinates beta and beta_tilde with separately supplied product
      P=beta*beta_tilde are exchanged and x=beta^2, the induced squared-
      coordinate map has A=P^2 and fixed x=P; in particular P=4*pi gives the
      conditional map x->16*pi^2/x and fixed coordinate 4*pi. Under a positive
      coordinate reparameterization x'=rho*x, conjugating the same reciprocal
      relation requires A'=rho^2*A, sends the numeric fixed coordinate to
      rho*sqrt(A), and preserves the dual-orbit structure. Generic positive x
      belongs to a valid off-fixed pair and is not thereby required to satisfy
      x=D_A(x). These exact facts establish no physical action or observable
      duality, no accepted coupling normalization or dual-product premise, no
      restriction to or mechanism selecting a self-dual subfamily, and no
      coupling value, beta coefficient, scale, particle interpretation, or
      substrate realization.
