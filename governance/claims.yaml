      n=(n_x,n_y,n_z) be a unit direction and use the unnormalized real l=2
      angular basis P2(n_z), n_x^2-n_y^2, 2*n_x*n_y, 2*n_x*n_z, and
      2*n_y*n_z. Every basis element obeys Delta_Omega Y=-6*Y. Consequently,
      for any sufficiently differentiable radial background P(r,t), every
      real m component has the same radial equation
      psi_tt-psi_rr-2*psi_r/r+6*psi/r^2+cos(P)*psi=0 and the same regular
      origin law psi=O(r^2); m-degeneracy does not supply a separated
      frequency, normalization, or mode existence. Replacing cos(P) by a
      time average Cbar(r) defines a different equation whose exact omitted
      term is (cos(P)-Cbar)*psi. For P=a(r)*cos(tau), Cbar=J_0(a) and
      cos(P)-Cbar=-2*J_2(a)*cos(2*tau)+2*J_4(a)*cos(4*tau)-..., with leading
      small-a term -a^2*cos(2*tau)/4. Thus an eigenfunction of the averaged
      radial operator is a solution of the full linearized equation only when
      the displayed pointwise defect vanishes or a separate Floquet argument
      supplies the missing time dependence. At a positive cutoff epsilon the
      regular leading series satisfies epsilon*psi_r-2*psi=O(epsilon^4), so
