  - id: C-FPT-001
    statement: >-
      Let a<b, x in [a,b], Theta>0, gamma>0, and let U be a declared real
      continuously differentiable potential on [a,b]. Conditional on the
      one-dimensional overdamped Ito diffusion
      dX=-(U'(X)/gamma)dt+sqrt(2*Theta/gamma)dW with reflection at a and
      absorption at b, the mean absorption time tau(x) is the unique solution
      of Theta*tau''-U'*tau'=-gamma on (a,b), tau'(a)=0, tau(b)=0, and is
      tau(x)=(gamma/Theta)*integral_x^b exp(U(y)/Theta)
      integral_a^y exp(-U(z)/Theta) dz dy. It is strictly positive for x<b,
      vanishes at b, and is invariant under an additive constant in U. For
      U(x)=F*(x-a), F>0, L=b-a, and a start at a, the exact result is
      gamma*Theta*(exp(F*L/Theta)-1-F*L/Theta)/F^2, with zero-force limit
      gamma*L^2/(2*Theta). A finite-horizon mean over completed paths is a
      conditional completed-only statistic rather than the full MFPT, and a
      rule returning zero below a completion threshold is an operational
      classifier rather than a zero physical rate. Inverse MFPT is not in
      general a constant hazard: free reflected diffusion started at a has
      squared first-passage coefficient of variation 2/3 rather than the
      exponential value 1. These exact conditional results derive no physical
      coordinate, potential, bath, friction, mobility, stochastic convention in
      physical units, absorbing event, material, population coupling, ignition
      process, attempt frequency, Kramers or Langer prefactor, or observed rate.
