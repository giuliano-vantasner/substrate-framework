      bases U and V and a same-shape rectangular diagonal Sigma with
      nonnegative entries such that U^dagger*M*V=Sigma and M=U*Sigma*V^dagger.
      The nonzero spectra of M*M^dagger and M^dagger*M are the squared singular
      values with the shape-required additional zeros. Individual bases are
      noncanonical: a repeated nonzero singular block permits the same unitary
      rotation on its paired left and right bases, while left and right null
      blocks permit independent unitary choices. For two same-size unitary
      column bases U_a,U_b, R=U_a^dagger*U_b is unitary and identical ordered
      bases give R=I. If row transforms A_i instead satisfy
      A_i*M_i*B_i^dagger=Sigma_i and map original coordinates to diagonal
      coordinates, the corresponding relative transform is A_a*A_b^dagger,
      not A_a^dagger*A_b. For a real symmetric matrix [[a,b],[b,d]], the proper
      rotation [[cos(theta),sin(theta)],[-sin(theta),cos(theta)]] with
      2*theta=atan2(2*b,d-a) diagonalizes by R^T*M*R; a scalar identity block
