  - id: C-BPS-002
    statement: >-
      Under C-BPS-001, define the energy M(B) of a nonzero degree sector as
      the infimum of the declared energy over a specified nonempty admissible
      class, and write K=2*lambda*mu*pi^2*W. Then M(B)>=K*abs(B). If an
      admissible configuration attains the C-BPS-001 equality in a specified
      sector, M(B)=K*abs(B) in that sector. Hence, for positive integers A and
      n with attainment in sectors A and n*A,
      n*M(A)-M(n*A)=0. If sectors 1 and B>0 attain, the declared binding
      B*M(1)-M(B) is zero. Linearity of the lower bound alone does not imply
      these conclusions: writing M(B)=K*abs(B)+s_B with unknown nonnegative
      sector slacks leaves n*M(A)-M(n*A)=n*s_A-s_(n*A), which can have either
      sign. This is a conditional attainment theorem, not an existence or
      physical zero-binding claim.
