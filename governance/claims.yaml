  - id: C-RMAP-002
    statement: >-
      Conditional on C-RMAP-001 and on the exact declared rational map
      R_4(z)=(z^4+2*i*sqrt(3)*z^2+1)/(z^4-2*i*sqrt(3)*z^2+1), exact polynomial
      reduction makes the numerator and denominator coprime and the map degree
      four. Homogeneous-Wronskian tensor Gauss-Legendre cubature on
      u=cos(theta),phi at orders 16x32 through 64x128 gives normalized pullback
      area converging to four and angular functional converging to
      20.6496264884189 in IEEE-754 binary64/complex128. An independent nested
      adaptive integration split between direct and reciprocal stereographic
      charts at relative and absolute tolerances 1e-7, 1e-9, and 1e-11 agrees
      within 2e-12 relative. Axis rotations preserve the two integrals, while
      changing the imaginary quadratic coefficient to 3.2*i preserves degree
      area and changes I to about 20.7744. This is resolution-bounded evidence
      for one declared map only; it proves neither full cubic symmetry nor
      global degree-four minimality and supplies no radial solution, physical
      state, baryon or nucleus identification, energy, mass, binding, reaction,
      yield, material, or observation.
