      - campaigns/P002-sine-gordon-action/reviews/independent_phase_space.py
      - memory/vantasner/decisions/C-SG-003-review.md
      - tests/test_sine_gordon.py
    assumptions:
      - The canonical action uses J = (1/(2*pi))*closed_integral(p dq).
      - The Hamiltonian action-angle identity dJ/dE = T/(2*pi) applies to the accepted periodic breather orbit.
    comparators: []
    accepted_in: v0.2.0
    challenges: []
    supersedes: []
  - id: C-SG-004
    statement: >-
      For every real omega with 0 < omega < 1, the C-SG-001 breather's
      period-averaged squared-gradient integral is
      Gbar = (1/T)*integral_0^T dt integral_R dx phi_x^2
      = 16*(sqrt(1-omega^2) - omega*arccos(omega)) = E - omega*J.
      It satisfies dGbar/domega = -J, approaches 16 as omega -> 0+, and
      approaches 0 as omega -> 1-. Gbar is the full squared-gradient
      integral; its Hamiltonian energy contribution is Gbar/2.
    provenance: campaigns/P003-sine-gordon-gradient/adjudication.yaml
    verification: symbolic_verified
    review: accepted
    compatibility: native
    epistemic: active
