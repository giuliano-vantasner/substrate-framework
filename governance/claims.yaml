  - id: C-MED-004
    statement: >-
      Conditional on a dimensionless real field theta, a physical length
      coordinate z, a physical time coordinate tau, and an exact positive
      coefficient g with dimensions 1/(length*time), the mixed-coordinate
      equation theta_z_tau=g*sin(theta) linearizes at a vacuum to
      theta_z_tau=g*theta. A plane wave exp(i*(k*z-Omega*tau)) therefore has
      characteristic k*Omega=g; for positive k its branch Omega=g/k has phase
      velocity g/k^2, group velocity -g/k^2, tends to infinity as k->0+, and
      tends to zero as k->infinity, so it has no finite k-independent
      laboratory angular-frequency floor. With xi=z/L and eta=tau/T, the
      normalized coefficient is g*L*T. Imposing g*L*T=1 leaves the exact
      positive family T=1/(g*L) for arbitrary L; its logarithmic scale
      Jacobian with respect to (L,T) is [1,1], with reciprocal null direction
      (-1,1). The map X=xi+eta and S=xi-eta sends the equation exactly to
      theta_SS-theta_XX+sin(theta)=0. Under rows (length,time), the columns
      (g,alpha,rate,Omega_squared) are (-1,-1), (-1,0), (0,-1), and (0,-2):
      an inverse-length absorption alpha is neither g nor a laboratory
      frequency squared and requires a separately supplied inverse-time rate
      and dimensionless prefactor even to form g. The normalized static kink
      is a coordinate-map cross-check only. These exact conditional results
      derive no Maxwell-Bloch reduction, self-induced-transparency regime,
      optical coefficient, gas or isotope map, material, nonlinear pulse
      existence, laboratory gap, damping, or absolute scale.
