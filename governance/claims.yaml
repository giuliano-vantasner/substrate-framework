  - id: C-SYM-001
    statement: >-
      Let phi be a real nonempty n-entry scalar-coordinate column, let V(phi)
      be twice differentiable, and let T_a be a finite nonempty supplied
      family of real n-by-n linear generators. Define the exact infinitesimal
      invariance residuals r_a(phi)=grad(V)^T*T_a*phi. Direct differentiation
      gives grad(r_a)=H*T_a*phi+T_a^T*grad(V), where H is the Hessian of V.
      Therefore, if every r_a vanishes identically and a declared vacuum phi_0
      is actually stationary, then H(phi_0)*T_a*phi_0=0 for every supplied
      generator. The rank of the matrix whose columns are the actual tangents
      T_a*phi_0 is the number of independent Hessian zero directions certified
      by these premises. The kernel dimension of the coefficient-to-tangent
      map is a stabilizer dimension only when the supplied generator matrices
      form an independent basis; dependent labels cannot inflate the rank. If
      a separately supplied symmetric kinetic metric K is provably positive
      definite, the same tangents are zero directions of the generalized
      quadratic mass operator K^-1*H. Positive K preserves but does not create
      Hessian zeros. At a nonstationary point, under explicit symmetry
      breaking, or without an independent generator basis, the corresponding
      conclusion or interpretation does not follow. This is an exact
      conditional finite-dimensional classical quadratic theorem. It supplies
      no quantum Goldstone-particle theorem, no field-theory vacuum or charge
      algebra, no spectral pole, no group or representation selection, no
      physical field identification, no mass scale, and no substrate
      realization.
