    assumptions:
      - K_F, epsilon_core, g, and l_m are exact, real, constant, and strictly positive; s is exact and real; R_o and r_c are positive lengths with R_o>r_c; A and k are exact nonzero real quantities.
      - The displayed Frank/core and quadratic-loading formulas are declared constitutive premises. Their physical origin, coefficient values, material applicability, and completeness are not derived by the composition.
      - The amplitude length exponent alpha is declared and the coupling dimension changes with it. Dimensional closure alone neither selects alpha nor distinguishes the quadratic law from alternative monomial loading laws.
      - Barrier height means E(R_*)-E(0). An additive radius-independent energy offset remains in the absolute energy at the top.
      - Log elasticities hold the other displayed effective inputs fixed. Frank/core sensitivities are local and state dependent because the line tension is additive.
      - Identifiability statements concern exact positive log coordinates of the displayed effective monomial map; observations, noise models, and independent calibration equations are not supplied.
