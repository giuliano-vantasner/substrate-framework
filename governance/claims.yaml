  - id: C-CMP-001
    statement: >-
      Let m be a positive integer, let Delta_j be real nonzero detunings, and
      let c_j be real nonnegative coupling products with at least one c_j>0.
      For real Gamma>0 and omega>0, C-RES-001's common-loss zero-energy
      magnitude is
      K(Gamma)=Gamma*sum_(j=1)^m c_j/(Delta_j^2+Gamma^2/4). Composing it with
      C-DYN-001's nominal count Q_nom=omega/(2*pi*Gamma) in a declared
      1/Gamma quadratic-envelope window gives exactly
      H_nom(Gamma)=omega/(2*pi)*sum_j c_j/(Delta_j^2+Gamma^2/4). This product
      is strictly positive and strictly decreasing for Gamma>0, with
      derivative -omega*Gamma/(4*pi)*sum_j
      c_j/(Delta_j^2+Gamma^2/4)^2, finite positive right limit
      omega/(2*pi)*sum_j c_j/Delta_j^2 at zero loss, and inverse-square
      large-loss coefficient (2*omega/pi)*sum_j c_j. On the source-style
      extension that assigns zero at Gamma=0 and at Gamma>=2*omega, the right
      limit at zero and left limit
      omega/(2*pi)*sum_j c_j/(Delta_j^2+omega^2) at 2*omega are both positive.
      The extension therefore has two jumps, has a nonattained supremum at
      zero loss, and has no positive-loss maximizer. Replacing the nominal
      count by the actual underdamped oscillator count
      Q_act=sqrt(omega^2-Gamma^2/4)/(2*pi*Gamma) gives an also strictly
      decreasing product on 0<Gamma<2*omega with the same zero-loss limit and
      zero critical left limit. Positive Gamma-independent dimensionless
      factors preserve these loss conclusions. For a single pair, replacing
      the linear opening by Gamma^p gives a stationary surface
      Gamma^2=4*Delta^2*(p-1)/(3-p), which is a positive finite interior point
      only for 1<p<3; the source linear case p=1 has none. If Delta, Gamma,
      and omega have one energy or inverse-time dimension and c has its square,
      H has one such dimension. A common rescaling including c->rho^2*c gives
      H->rho*H, while holding c fixed gives H->H/rho. These are conditional
      finite-matrix and window-count identities, not a phase-coherence,
      probability, transition-rate, nuclear-channel, material, magnitude,
      yield, heat, or observation theorem.
