  - id: C-COL-001
    statement: >-
      Under C-MED-003, let a dimensionless real field be restricted on a fixed
      spatial domain D to a declared sufficiently differentiable one-parameter
      profile family u(x,t)=phi(x,q(t)). If partial_q phi is square-integrable
      and nonzero and lambda>0, exact substitution into the kinetic density
      gives the positive finite collective metric
      M(q)=lambda*integral_D((partial_q phi)^2 dx) and kinetic term
      M(q)*qdot^2/2. For a separately declared twice-differentiable reduced
      potential U(q), L_red=M(q)*qdot^2/2-U(q) has exact equation
      M*qddot+(partial_q M)*qdot^2/2+partial_q U=0. At a rest stationary point
      q0 with U'(q0)=0 and M(q0)>0, the linearization is
      M(q0)*delta_qddot+U''(q0)*delta_q=0: positive curvature gives a stable
      angular frequency sqrt(U''/M), zero curvature is linearly neutral, and
      negative curvature gives real exponential roots with rate
      sqrt(-U''/M). Under a smooth locally invertible reparameterization
      q=g(Q), the metric becomes M_Q=M(g(Q))*g'(Q)^2 and the potential Hessian
      is U_QQ=U_qq*g'^2+U_q*g''; hence at a stationary point U_QQ/M_Q is
      coordinate invariant while curvature and inertia separately are not.
      If q is a length coordinate, x is a length coordinate, and lambda has
      C-MED-003 dimension (E,L,T)=(1,-1,2), then M has (1,-2,2), U'' has
      (1,-2,0), and their ratio has (0,0,-2). Conditional on an independently
      established profile/action identification q=R and C-RG-001's capillary
      potential, R*=T/P has U''=-2*pi*P, so sqrt(2*pi*P/M(R*)) is an unstable
      exponential rate, not a stable oscillation frequency. These results do
      not supply the profile, prove its physical realization, couple the
      continuum and capillary coefficients, select their normalization or a
      material, identify a quantum or thermal onset, derive stochastic escape,
      or establish an ignition or observed event.
