note: >-
  Adds the exact periodic-potential curvature and local-nonuniqueness theorem,
  the paired SU(2) kinetic/trace generalized-mass normalization, and a
  separately reviewed conditional GMOR parameter ledger. PG2 is qualified:
  its Taylor series, trace shape, and fixed-input linear scaling survive, but
  its cited one-eighth trace coefficient is one quarter of its advertised
  cosine amplitude and the passing check silently changes that coefficient by
  four. It imports rather than derives GMOR and supplies no physical pion,
  decay constant, condensate, quark mass, numerical mass, chiral sector, or
  substrate realization.
