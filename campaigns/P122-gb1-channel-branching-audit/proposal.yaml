  - id: A
    description: Reproduce GB1 literally and classify every symbolic dimension free-symbol mutation and tally predicate.
  - id: B
    description: Derive a reusable two-nonnegative-rate allocation theorem with the excluded zero denominator endpoints odds limits derivatives and common-scale invariance.
  - id: C
    description: Specialize the theorem to r_s*w*N and r_gamma and audit rho reduction units count and weight domains.
  - id: D
    description: Derive the ratio-of-ratios enhancement with all nonzero baseline premises and arbitrary-weight identifiability.
  - id: E
    description: Construct zero-rate arbitrary-prefactor unequal-normalization negative-weight and dimension-mutation countermodels.
  - id: F
    description: Audit CM2 PN2 and PN3 dependencies against C-CMP-001 C-SPN-002 and the absence of an accepted PN2 rate premise.
  - id: G
    description: Audit the selected-symbol absence rule for scope collisions aliases imports equivalent semantics and data flow.
  - id: H
    description: Determine whether the surviving algebra is already governed or too source-specific for a new claim and independently close predicates cycles consumers and nonduplication.
