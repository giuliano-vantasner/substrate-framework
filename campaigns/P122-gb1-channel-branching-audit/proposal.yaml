source_baseline: substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64
source_units: [GB1]
question: >-
  Reproduce and independently audit GB1's two declared rate-valued objects,
  normalized branching fractions, odds and relative-enhancement reductions,
  dimensions, domains, endpoints, free normalizations, weight and count
  premises, dependency closure, and selected-symbol absence scan; determine
  whether a reusable exact two-channel allocation theorem survives beyond
  C-CMP-001 and C-SPN-002, and terminally adjudicate every predicate without
  converting declared dimensions or algebraic fractions into physical
  de-excitation channels, coherence, a nuclear rate, material branching,
  enhancement, yield, heat, or observation.
invariants:
  - >-
    For nonnegative channel rates A and B not both zero, the normalized shares
    A/(A+B) and B/(A+B) lie in [0,1], sum to one, preserve their zero and unit
    endpoints, and depend only on the rate ratio; they are undefined at A=B=0.
  - >-
    Calling an input a rate requires an inverse-time dimension and accepted
    states, interaction and normalization for a physical interpretation.
    Algebra can propagate a declared rate dimension but cannot derive it.
  - >-
    In the specialization A=r_s*w*N and B=r_gamma, w and N must be
    dimensionless for A to share r_s's rate dimension. Positivity, finite N,
    and the domain of w remain explicit premises.
  - >-
    The reduction with rho=r_gamma/r_s requires r_s>0. Odds and any
    ratio-of-ratios enhancement additionally require nonzero denominators and
    a nonzero declared baseline weight.
  - >-
    Common positive scaling of both channel rates cancels from branching
    fractions, while relative scaling changes them. Free r_s, r_gamma, w, and
    N prevent a predicted branching fraction or magnitude.
  - >-
    C-SPN-002 supplies normalized finite-dimensional ladder coefficients and
    explicitly states that their squares are not rates. PN2 supplies qualified
    arithmetic only and no accepted claim.
  - >-
    C-CMP-001 supplies a conditional factor with one matrix-element dimension,
    not a phase-coherent probability, transition rate, nuclear channel,
    material magnitude, yield, heat, or observation.
  - >-
    Absence of selected symbol names from one expression or free-symbol set is
    finite syntactic evidence only; aliases, functions, constants, imported
    values, and semantically equivalent constructions remain possible.
  - >-
    Source candidate dependency edges and cycles grant no authority. Every
    direct and transitive consumer inherits only individually accepted claims.
  - >-
    The source body, runtime output, and exact predicates remain unopened in
    P122 at freeze; queue excerpts have already exposed the headline formulas,
    declared dependencies, and advertised result.
allowed_imports:
  - C-CMP-001 only for its exact conditional composition and explicit non-rate non-channel ceiling
  - C-SPN-002 only for normalized symmetric-spin algebra and its explicit squared-coefficient non-rate ceiling
  - P110 and PN2 adjudication only as qualified arithmetic evidence with no accepted scientific claim
  - exact real algebra inequalities limits derivatives dimensions ratio invariance and countermodels
  - GB1 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence only after freeze
  - SymPy exact simplification substitution differentiation limits and logical domain checks
