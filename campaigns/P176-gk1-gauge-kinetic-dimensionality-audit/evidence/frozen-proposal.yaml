  - C-NVP-001 and C-NVP-002 multiply the accepted two-dimensional Abelian loop kernel by an exact representation trace metric and expressly supply no four-dimensional lift or unique total coupling.
  - C-GAU-001 supplies local U1 covariance while leaving every gauge-kinetic coefficient unconstrained.
  - C-NAG-001 supplies exact non-Abelian covariance and curvature algebra while leaving every action, kinetic coefficient, dimension, and physical sector unconstructed.
