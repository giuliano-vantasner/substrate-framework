claim_outline:
  - Canonical kinetic normalization gives dimension A equals D over two minus one dimension g equals two minus D over two and projector coefficient dimension two.
  - The special ansatz Pi_hat equals g squared times a nonzero dimensionless number is homogeneous only at D equals two.
  - The mass-scale counterfamily g squared times M to the D minus two has dimension two for every D, so dimension counting alone proves no universal constant-polarization no-go.
  - In D equals four a transverse projector coefficient Q times any dimensionless function of Q over M squared has dimension two, and dimension counting alone does not select a logarithm.
  - For connection B equals g A and curvature F_B equals g F_A, the kinetic coefficient transforms by division by g squared and has dimension D minus four.
  - A dimensionless fixed-basis trace index cannot change spacetime dimension, while generator rescaling must be accompanied by inverse coupling rescaling to preserve the covariant connection.
