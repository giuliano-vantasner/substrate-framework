load_bearing_findings:
  - >-
    The source shares the u(1-u) numerator already rejected for its complex-
    scalar reading. C-VAC-001 instead derives the (1-2u)^2 bubble-seagull
    kernel and a fixed-positive-momentum massless divergence.
  - >-
    GK1.5 divides its trace-weighted tensor by the same trace value. This is an
    identity inside its definition, not a convention-preserving Abelian limit;
    T'=rho*T requires g'=g/rho and preserves g^2*T(R).
  - >-
    GK1.7 correctly proves that the special scale-free ansatz Pi_hat=g^2*c has
    dimension two only at D=2. It does not test g^2*M^(D-2), which has the
    required dimension in every D.
  - >-
    Dimensionless four-dimensional form factors are not forced to be
    logarithmic. Constant, rational threshold, and logarithmic examples all
    preserve scale homogeneity; dynamics and renormalization select among them.
  - >-
    GK1.8 proves only that power counting fixes exponent zero for a
    four-dimensional inverse coupling. It determines neither a logarithm nor
    its coefficient or subtraction.
  - >-
    GK1.9 differentiates a normalized Riesz shape with respect to a symbol
    absent by construction. This correctly proves that expression cannot
    identify g_eff, while leaving independent source and kinetic amplitudes free.
  - >-
    GK1.11 is a useful pinned documentation regression but chronology and
    literal prose agreement do not create scientific authority.
  - >-
    The result prose repeats previously rejected propagation computed-coupling
    physical gauge-sector and substrate claims.
