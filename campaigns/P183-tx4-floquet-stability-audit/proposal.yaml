source_units: [TX4]
question: >-
  Does hash-pinned TX4 establish a mathematically complete stability result
  for a specified rotating solution, or only exact conditional co-rotating
  finite-system and collective-rotor identities plus a restricted rational-map
  calculation, once the action, solution residual, linearized operator and
  domain, constraints, symmetry quotient, boundary data, spectrum, Jordan
  structure, conservation laws, convergence, and physical scope are audited?
invariants:
  - C-GW-009 and C-GW-010 supply only prescribed moment kinematics and conditional TT algebra; they supply no rotating field solution, action, inertia, selected angular speed, or stability authority.
  - C-RMAP-001/002, C-RPROF-001/002, and C-RMOM-001/002 concern declared rational-map geometry, a reduced radial branch, and conditional moments; none supplies a full three-dimensional Skyrme solution or full-field perturbation operator.
  - C-COL-001 classifies only a declared reduced coordinate with proven positive finite inertia and complete stationary curvature; a rotor subsector cannot establish stability outside that subsector.
  - C-SYM-001 requires exact invariance, actual stationarity, independent generator tangents, and a positive kinetic metric before it certifies symmetry Hessian zero directions.
  - A co-rotating change of variables can make a covariant finite-dimensional linear system autonomous, but time independence does not determine spectral signs, diagonalizability, Jordan blocks, semigroup bounds, or nonlinear stability.
  - A unit-modulus Floquet multiplier with a nontrivial Jordan block produces secular growth; naming a secular term a zero mode is not a stability proof without the symmetry quotient and generalized eigenspace audit.
  - Energy-momentum stability requires a specified Hamiltonian or Lagrangian, conserved momentum map, relative equilibrium, constrained second variation on the correct slice, and positivity/coercivity there.
  - Restricted rational-map or collective-coordinate positivity cannot be promoted to arbitrary full-field stability; TX5 remains a separate pending source and cannot validate TX4 retroactively.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral; immutable legacy-name stops are version-only compatibility evidence and never scientific candidate failures.
