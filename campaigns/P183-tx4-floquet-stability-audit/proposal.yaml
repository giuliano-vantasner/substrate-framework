candidates:
  - id: A
    description: Reproduce TX4 exactly and audit every equation, matrix, Hessian, eigenvalue, predicate, assertion, and conclusion against the object actually computed.
  - id: B
    description: Derive a narrow exact finite-dimensional co-rotating linear-system and monodromy theorem that exposes its spectral and Jordan-structure obligations without claiming a full-field spectrum.
  - id: C
    description: Classify a declared finite collective rotor by its complete reduced action, conserved quantities, linearization, symmetry modes, and Jordan structure, composing C-COL-001 where possible.
  - id: D
    description: Reconstruct and refine any declared fixed-degree rational-map shape Hessian, separate genuine stationary and symmetry directions from coordinate artifacts, and keep the verdict inside that ansatz.
  - id: E
    description: Establish genuine full-field Floquet or energy-momentum stability from a specified action, rotating solution, operator domain, constraints, boundary data, complete spectrum, refinement, and independent method.
  - id: F
    description: Close claim, source, dependency, consumer, disposition, queue, release, documentation, memory, and debt governance without blanket promotion.
