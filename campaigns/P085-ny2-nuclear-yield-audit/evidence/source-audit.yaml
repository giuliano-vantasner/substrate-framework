source_unit: NY2
headline_verdict: duplicate_conditional_scale_with_uncomputed_coefficient_missing_reaction_map_and_unimplemented_consumer
checks:
  - id: NY2.1
    source_verdict: pass
    audit_verdict: duplicate_conditional_scale_evaluated_from_empirical_input
    reason: >-
      The 25.69 MeV value repeats C-SK-001/NY1 after inserting the measured
      electron rest energy. It is neither a nuclear yield nor import free.
  - id: NY2.2
    source_verdict: pass
    audit_verdict: arithmetic_on_rounded_external_comparators
    reason: >-
      28.30-2*2.22=23.86 MeV is correct for the supplied rounded binding
      values. It is empirical nuclear-data arithmetic and derives no event or
      Skyrmion coefficient.
  - id: NY2.3
    source_verdict: pass
    audit_verdict: comparator_residual_not_selection_oracle
    reason: >-
      The coefficient-one scale differs from the source comparator by 7.65%.
      A residual threshold cannot derive coefficient one.
  - id: NY2.4
    source_verdict: pass
    audit_verdict: duplicate_narrower_comparator_band
    reason: >-
      The 5--10% assertion rechecks the same residual and supplies no model,
      uncertainty, or independent physical prediction.
  - id: NY2.5
    source_verdict: pass
    audit_verdict: arbitrary_declared_band_brackets_comparator
    reason: >-
      The 0.85--1.15 interval is a declared O(1) prior containing infinitely
      many inequivalent coefficients. Bracketing 23.86 MeV cannot select one.
  - id: NY2.6
    source_verdict: pass
    audit_verdict: arbitrary_declared_band_brackets_old_literal
    reason: >-
      The same broad band also brackets 24 MeV because that comparator is
      nearby. It does not eliminate or derive the engine literal.
  - id: NY2.7
    source_verdict: pass
    audit_verdict: very_broad_scale_regression
    reason: >-
      The 20--30 MeV interval is satisfied by the already evaluated scale and
      tests neither an engine substitution nor a nuclear reaction.
  - id: NY2.8
    source_verdict: pass
    audit_verdict: old_literal_proximity_not_consumer_migration
    reason: >-
      The proposed value differs from 24 MeV by 7.02%, but the pinned engine
      and parity oracle still require 24.0e6 eV. Closeness does not implement
      or validate the replacement.
  - id: NY2.9
    source_verdict: pass
    audit_verdict: comparator_independence_with_empirical_mass_and_missing_map
    reason: >-
      The expression contains only E_e because the source assigns yield equal
      to the scale before comparison. This proves no nuclear-data leakage into
      that calculation, but retains E_e and supplies no relation from scale to
      a physical event.
  - id: NY2.10
    source_verdict: pass
    audit_verdict: deterministic_recomputation_not_predictive_independence
    reason: >-
      Re-evaluating the same expression returns the same float whether or not a
      comparator is read. It cannot test the absent coefficient, solitons,
      state map, reaction branch, or engine behavior.
