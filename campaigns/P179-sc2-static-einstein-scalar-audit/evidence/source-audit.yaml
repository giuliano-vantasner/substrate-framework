load_bearing_findings:
  - E1 and E2 are the standard first-order mixed tt and rr areal-gauge Einstein constraints for the displayed averaged rho and p_r.
  - E3 is the fundamental cosine projection of the scalar equation on the static metric and reduces to the accepted C-PDE-005 single-harmonic form in the flat limit.
  - The source stress is exactly phase averaged, so its conservation identity follows from the same projected scalar ODE; this is reduced-system closure rather than an independent full-PDE oracle.
  - The static Einstein tensor cannot match the generally time-dependent pointwise scalar stress; the source expressly omits oscillating metric harmonics but still overstates SC2.3 as the full coupled system.
  - The source calls the minimal canonical scalar route Horndeski without introducing any nonminimal Horndeski coupling or action beyond C-STG-001.
  - Mesh labels are initial solve_bvp meshes; adaptive final nodes and solver residual estimates are not compared.
  - The finite-wall Robin branch and box stability are useful numeric evidence for the reduced model but do not establish an infinite-domain exact breather or the full periodic PDE.
  - Guard A checks outer compactness only; a horizon-free claim requires positive f over the complete numerical domain.
  - Guard B is a meaningful scalar-equation mutation but not an independent theta-theta derivation because the conservation residual factorizes by the projected scalar residual.
compatibility: >-
  SC2 contains no direct imported or dynamic NumPy trapezoidal integration
  reference and runs natively. Version compatibility creates no scientific
  failure; mutable P179 code must use numpy.trapezoid or trapezoid_integral.
