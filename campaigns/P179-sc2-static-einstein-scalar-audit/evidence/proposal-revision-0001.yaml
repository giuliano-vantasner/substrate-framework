campaign: P179
revision: 0001
created_at: '2026-08-11T07:03:00Z'
trigger:
  - SC2's displayed E1 E2 and E3 form a viable static phase-averaged reduced model.
  - SC2.3 checks a conservation identity generated by the same projected scalar ODE and cannot establish the pointwise full PDE.
  - The native finite-wall family is promising but omits several load-bearing numerical controls.
selected_candidates: [C, D, G]
retained_evidence_candidate: A
rejected_or_deferred:
  B: accepted_claims_do_not_state_the_scaled_averaged_spherical_reduction_or_its_BVP
  E: full_time_periodic_metric_harmonics_are_a_distinct_larger_problem_not_needed_for_the_reduced_positive_object
  F: no_nonminimal_Horndeski_action_is_present_or_required
claims_proposed: [C-STG-002]
collision_search:
  surfaces: [governance_registry, campaigns, package, tests, durable_memory]
  identifiers: [C-STG-002, C-PDE-013]
  collisions: []
exact_object:
  physical_field: phi=F*u
  physical_potential: V=mu^2*F^2*(1-cos(u))
  dimensionless_coordinates: [x=mu*r, tau=mu*t]
  dimensionless_mass: m=mu*M_physical
  dimensionless_coupling: alpha=kappa*F^2
  metric: ds2=-N(x)^2*d_tau^2+dx^2/f(x)+x^2*dOmega^2_up_to_the_common_mu_scale
  mass_function: f=1-2*m/x
  scalar_ansatz: u=a(x)*cos(Omega*tau)
  required_outputs:
    - exact_phase_averaged_rho_p_r_p_t
    - exact_mass_and_lapse_constraints
    - exact_fundamental_projected_scalar_equation
    - exact_averaged_conservation_factorization
    - exact_unretained_scalar_and_pointwise_stress_harmonic_defects
    - regular_origin_and_flat_vacuum_limits
numeric_contract:
  branch: {central_amplitude: 3.0, alpha: 0.03}
  precision: IEEE_float64
  primary_solver: scipy.integrate.solve_bvp_adaptive_collocation
  independent_solver: scipy.integrate.solve_ivp_DOP853_plus_scipy.optimize.root_shooting
  origin_cutoffs: [0.002, 0.001, 0.0005]
  outer_radii: [30.0, 40.0, 60.0]
  initial_meshes: [200, 400, 800]
  tolerances: [1.0e-6, 1.0e-8, 1.0e-10]
  max_nodes: 100000
  boundary_data:
    - central_amplitude_with_second_order_origin_series
    - regular_scalar_derivative_series
    - regular_mass_cubic_series
    - finite_wall_decaying_Robin_tail_explicitly_typed_as_approximate
    - exterior_Schwarzschild_lapse_gauge_match
  required_status:
    - solver_success_and_finite_output
    - maximum_collocation_RMS_residual
    - off_grid_first_order_ODE_relative_residual
    - boundary_residual_norm
    - minimum_full_domain_f
    - mesh_wall_origin_and_tolerance_stability
    - independent_shooting_agreement
  error_model: >-
    Report absolute residuals normalized by one plus the maximum magnitude of
    the corresponding RHS terms; solution-coordinate comparisons use maximum
    absolute differences divided by one plus the reference magnitude. No
    source digits or comparator determines a pass tolerance.
comparators_blinded: false
reason: source_queue_and_native_reproduction_expose_the_advertised_branch
next_attempt: implement_exact_pure_API_and_tests_before_corrected_numeric_execution
