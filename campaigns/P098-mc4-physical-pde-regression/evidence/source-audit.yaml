scaled_configuration:
  ell: 2.0
  domain: [-240.0, 240.0]
  dx: 0.10
  dt: 0.04
  final_time: 600.0
  core_radius: 28.0
  sponge_width: 60.0
  finding: >-
    Every dimensionful grid, time, boundary, and diagnostic radius is scaled
    by ell, so this is the same normalized discrete trajectory rather than an
    independent medium realization.
closed_box_configuration:
  ell: 1.0
  domain: [-80.0, 80.0]
  dx: 0.05
  dt: 0.02
  final_time: 60.0
  boundary: homogeneous Dirichlet endpoints
  sponge_width: 0.0
  finding: >-
    The source checks an approximate continuum Hamiltonian range after an
    exact-breather seed. It does not measure boundary flux, though the exact
    tail is exponentially small on the chosen box.
numerical_limitations:
  - The source uses two coupled dx/dt levels and computes no observed order.
  - The FFT checks only the largest nonzero bin and no line-power fraction or endpoint closure.
  - The retained-core leak is an absolute fitted slope over a selected window and does not establish infinite-time stability.
  - The exact breather initial data make the persistence run a solver regression, not a numerical construction of a solution.
  - The gapless control changes the equation and measures drainage from a fixed core; it does not exclude traveling localized packets.
width_diagnostic:
  source_weight: u_x^2 + 1 - cos(u)
  scale_covariant_weight: u_x^2 + ell^-2*(1-cos(u))
  defect: >-
    Multiplying the source weight by ell^2 leaves
    U_X^2+ell^2*(1-cos(U)), so its normalized shape depends spuriously on ell.
    The independent review obtains ratio 1.841437 with the source proxy and
    exactly 2.0 with the Hamiltonian-covariant proxy.
quadrature:
  source_dispatch: np.trapezoid if present else np.trapz
  status: historical_reproduction_only
  canonical_rule: substrate_framework.numerics.trapezoid_integral
