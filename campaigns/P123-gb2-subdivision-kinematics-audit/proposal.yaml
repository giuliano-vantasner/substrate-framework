  - PN2 only through its terminal qualified disposition with no accepted physical subdivision claim
  - exact integer rational decimal and SymPy floor remainder inequality and limit reasoning
  - GB2 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence only after freeze
  - GB5 queue metadata only for dependency and cycle auditing with no scientific authority
