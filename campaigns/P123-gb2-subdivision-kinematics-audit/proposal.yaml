question: >-
  Reproduce and independently audit GB2's floor quotient, remainder, bracket,
  weak monotonicity, scale and deep-subdivision mean; close its domains, units,
  boundary behavior, limit path, dependency cycle, predicates, consumers, and
  nonduplication against P090 and P110 without converting Euclidean division
  into physical quanta, an emitted spectrum, a phonon energy, a dynamical soft
  channel, material response, yield, heat, or observation.
invariants:
  - >-
    For exact quantities Omega>=0 and omega>0 in one common unit,
    n=floor(Omega/omega) and r=Omega-n*omega uniquely satisfy integer n>=0,
    Omega=n*omega+r, and 0<=r<omega.
  - >-
    The quotient-zero regime Omega<omega is valid arithmetic, but Omega/n is
    undefined there. Any per-item mean therefore requires n>=1.
  - >-
    For fixed positive Omega, n is a right-continuous nonincreasing staircase
    in omega with exact plateau and one-sided divisor boundaries; it is not
    strictly decreasing or differentiable at its jumps.
  - >-
    On n>=1, Omega/n=omega+r/n and the exact error from omega is r/n. A
    limiting statement must declare what remains fixed and cannot identify a
    physical characteristic scale from the quotient identity.
  - >-
    Exact threshold-adjacent floors use integers, rationals, or decimal
    constructions. Binary floating representation may change a quotient at an
    exact boundary and cannot silently define the theorem.
  - >-
    P110 and PN2 govern the same conditional quotient-remainder arithmetic as
    qualified campaign evidence and explicitly grant no quantum subdivision,
    state, mode, interaction, rate, material, or observation premise.
  - >-
    GB5 is pending noncanonical evidence and cannot supply GB2 authority. Any
    GB2-GB5 dependency cycle must be broken at individually accepted claims or
    rejected as circular.
  - >-
    Source candidate dependency edges and runtime tallies grant no authority.
    Every direct and transitive consumer inherits only accepted claims and
    explicitly qualified arithmetic ceilings.
  - >-
    The GB2 body, output, and predicate implementations remain unopened at
    freeze. Queue metadata has already exposed the quotient, remainder,
    bracket, monotonicity, deep-subdivision result, dependencies, and tally
    shape, so those excerpts cannot select a candidate.
