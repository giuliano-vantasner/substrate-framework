  - CM3 through CM7 and GB1 are pending consumers and cannot validate CM2.
claim_closure:
  proposed_claim: C-CMP-001
  dependencies: [C-RES-001, C-DYN-001]
  typed_positive_multipliers: [C-RG-002, C-TH-001, C-SPN-002]
  note: >-
    The new theorem needs only the accepted paired magnitude and the declared
    nominal/actual cycle conventions. Other accepted factors may multiply it
    conditionally without changing its Gamma classification.
