source_baseline: substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64
source_units: [BD4]
question: >-
  Audit BD4's proposed radius inertia and barrier-top scale, derive the exact
  field-to-collective-coordinate kinetic pullback, reduced equation of motion,
  stationary-point stability classification, dimensions, and coordinate
  covariance, and determine which source predicates survive without importing
  an unspecified finite profile, identifying independently declared continuum
  and capillary coefficients, treating a barrier maximum as a stable mode, or
  equating its local growth rate with a quantum onset or observed event.
invariants:
  - C-MED-003 owns only the declared dimensional sine-Gordon density and leaves its common positive coefficient scale free; it does not select a material or a ring-radius profile.
  - C-RG-001 owns the relative capillary energy with a unique strict global maximum at R=T/P and curvature -2*pi*P for positive T and P.
  - A collective-coordinate inertia is a pullback of a declared kinetic form along a differentiable profile family; dimensions alone do not establish the family, convergence, positivity, value, or physical identification.
  - At a rest stationary point the sign of U''/M distinguishes stable oscillation, neutral linearization, and exponential instability when M is positive.
  - Coordinate curvature and inertia separately depend on coordinate normalization; their stationary ratio is invariant under a smooth locally invertible reparameterization.
  - An instability exponent, a stable natural frequency, hbar times either scale, a thermal crossover, barrier escape, and a measured onset are distinct objects unless independently related.
  - A common action normalization must multiply the kinetic and potential sectors together; scaling lambda alone changes their ratio and cannot be inferred from C-MED-003's free coefficient ray.
  - The source checkout's NumPy compatibility overlay does not modify BD4 and is not a new scientific baseline; the hash-pinned source commit remains provenance.
allowed_imports:
  - C-MED-003 and the canonical dimensional sine-Gordon density and coefficient dimensions only
  - C-RG-001 and the canonical radial-energy stationary point and curvature only
  - C-VAR-001 and C-BRK-001 solely for multiplier and generalized-curvature consistency checks, not as a derived profile or material map
  - exact positive-real variational calculus, integration under declared regularity and boundary assumptions, dimensions, linearization, sign classification, and smooth coordinate reparameterization
  - BD4 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence after contract validation and freeze
  - legacy rung098 at the same pinned source commit as predecessor evidence, not as an accepted claim or as the phase-7 bridge unit also labeled M2
  - hash-pinned downstream units only after freeze and only as noncanonical impact evidence
candidates:
  - id: A
    description: Reproduce BD4 unchanged and classify every import, literal predicate, guard, and terminal tally.
  - id: B
    description: Accept dimensions-only closure, retaining the profile integral as an explicit undeclared input and refusing to infer finiteness or value.
  - id: C
    description: Derive the collective-coordinate kinetic metric from a differentiable field-profile family and the C-MED-003 kinetic density.
  - id: D
    description: Derive the variable-metric reduced Euler-Lagrange equation and its exact rest-stationary linearization.
  - id: E
    description: Classify positive, zero, and negative stationary curvature as stable, neutral, and unstable, specializing the capillary maximum to an exponential rate.
  - id: F
    description: Prove covariance of the stationary curvature-to-inertia ratio under smooth locally invertible coordinate changes while showing each factor alone is normalization-dependent.
  - id: G
    description: Audit profile regularity, boundary behavior, finiteness, positivity, and the difference between a concrete radius family and a symbolic integral.
  - id: H
    description: Audit common action scaling versus independent lambda scaling and test whether accepted claims couple the sine-Gordon and capillary sectors.
  - id: I
    description: Trace predecessor and downstream consumers and reject stable-frequency, hbar-onset, escape, and observed-event interpretations that lack dependencies.
uniqueness_evidence: null
selection_criteria:
  - accepted dependency closure and nonduplication against C-MED-003, C-RG-001, C-VAR-001, and C-BRK-001
  - exact variational derivation, dimensions, sign, factor normalization, coordinate covariance, regularity, and mutation sensitivity
  - strict separation of a local stable spectrum from a saddle growth exponent and from onset, escape, channel, and observable claims
  - assumption and parameter economy with the profile integral and cross-sector coefficient map retained explicitly unless derived
  - canonical API reuse, independent exact rederivation, consumer classification, and no selection by a terminal tally
claims_proposed:
  - C-COL-001
comparators_blinded_until: >-
  The generated queue, P100 consumer replay, parent memory, and predecessor
  inspection already exposed m_R=lambda*integral((du/dR)^2)dx,
  sqrt(2*pi*P/m_R), the all-fourteen-check tally, and the claimed retirement of
  rung098's ceiling. P102 claims no formula or output blinding. Before renewed
  BD4 body inspection or execution it freezes the genuine profile pullback,
  variable-metric equation, stationary sign classification, dimensions,
  coordinate covariance, normalization and identifiability tests, and the
  onset/escape interpretation ceiling.
status: accepted
