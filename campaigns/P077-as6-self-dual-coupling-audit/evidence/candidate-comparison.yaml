    reason: >-
      The full D_A family exposes A as load bearing and makes arbitrary-target
      reconstruction explicit through A=target^2.
  D:
    decision: selected
    reason: >-
      Coordinate conjugation requires A'=rho^2*A and moves the numeric fixed
      coordinate by rho while preserving reciprocal orbit structure.
  E:
    decision: selected_as_interpretation_ceiling
    reason: >-
      Neither AS6 nor accepted dependencies construct an invariant action,
      partition function, observable, field map, or solution equivalence. A
      primary N=2 dual-field extension conditionally realizes the map, but its
      second cosine and equal-amplitude premises are absent here.
  F:
    decision: selected
    reason: >-
      A constructive off-fixed orbit shows that dual pairing does not force
      occupation of the self-dual subfamily.
