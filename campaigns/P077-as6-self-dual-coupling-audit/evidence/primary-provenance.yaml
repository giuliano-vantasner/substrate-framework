sources:
  coleman_1975:
    title: Quantum sine-Gordon equation as the massive Thirring model
    author: Sidney Coleman
    journal: Physical Review D 11, 2088 (1975)
    doi: https://doi.org/10.1103/PhysRevD.11.2088
    official_url: https://journals.aps.org/prd/abstract/10.1103/PhysRevD.11.2088
    audited_scope: >-
      In Coleman's quantum sine-Gordon normalization, beta^2=4*pi is
      equivalent to the zero-charge sector of a free massive Fermi field, and
      other beta values map to the massive Thirring model subject to the paper's
      stated relation. This is a quantum action-level correspondence with its
      own field normalization; it is not AS6's reciprocal-coupling theorem and
      is not automatically an import into C-SG-001's classical beta=1 root.
  lecheminant_gogolin_nersesyan_2002:
    title: Criticality in self-dual sine-Gordon models
    authors: [P. Lecheminant, A. O. Gogolin, A. A. Nersesyan]
    arxiv: https://arxiv.org/abs/cond-mat/0203294
    source_url: https://export.arxiv.org/e-print/cond-mat/0203294
    source_archive_sha256: cc9ab4ae1f4d85f7db2fd3245e9bb6730751bb837d27edff6566219b11d90384
    journal: Nuclear Physics B 639 (2002) 502-523
    doi: https://doi.org/10.1016/S0550-3213(02)00474-1
    audited_scope: >-
      The paper defines a self-dual extension with both cos(beta*Phi) and
      cos(beta_tilde*Theta). Equal dimensions and equal amplitudes make the
      action invariant under Phi<->Theta. Its XY normalization gives the
      relations beta=N/sqrt(K) and beta_tilde=2*pi*sqrt(K), hence
      beta*beta_tilde=2*pi*N. Exchanging the two couplings acts on
      x=beta^2 as x->4*pi^2*N^2/x; at N=2 this is AS6's
      x->16*pi^2/x and has fixed x=4*pi. The N=2 equal-amplitude two-cosine
      model refermionizes to one massive and one massless Majorana; unequal
      amplitudes make both sectors massive. This conditionally sources AS6's
      map only for that explicit extension and does not establish ordinary
      one-cosine sine-Gordon self-duality or an accepted framework import.
    reproduction: >-
      curl -Ls https://export.arxiv.org/e-print/cond-mat/0203294 | gzip -dc
adjudication:
  - Coleman supports AS6's narrow attribution of a free-fermion point only within Coleman's explicit quantum normalization.
  - The primary N=2 self-dual extension conditionally realizes AS6's reciprocal squared-coupling map, but requires a dual field and equal-amplitude second cosine absent from AS6 and the accepted root.
  - Neither source makes that map an accepted framework symmetry or supplies a mechanism requiring the accepted framework to occupy its fixed subfamily.
