      the other missing load-bearing objects.
  - id: I
    decision: selected_no_new_claim
    reason: >-
      Surviving facts are standard conditional calculus with no distinct
      governed consumer or importable framework object. C-SG-015 and C-MED-001
      remain unchanged ceilings.
selection_basis: >-
  Structural closure and exact mutations select B-I before source numerical
  values are used. The twelve-check tally and numerical closeness select no
