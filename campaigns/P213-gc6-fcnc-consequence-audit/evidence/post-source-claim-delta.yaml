claim_delta:
  - id: C-MIX-004
    provisional_statement: >-
      For a finite declared family of same-size complex matrices Y_a and
      complex weights v_a, set M=sum_a v_a*Y_a. If unitary U_L and U_R give a
      declared diagonal mass basis D=U_L^dagger*M*U_R, then the separately
      transformed matrices Gamma_a=U_L^dagger*Y_a*U_R obey
      D=sum_a v_a*Gamma_a exactly. Off-diagonal cancellations in that sum do
      not force the individual Gamma_a to be diagonal. In a declared
      multi-scalar interaction, absence of tree-level neutral flavor change in
      that fixed mass basis is equivalent to every Gamma_a being diagonal;
      common alignment Y_a=c_a*Y is sufficient. For complex symmetric M with
      a Takagi basis U, U_R=conjugate(U), so the correct transform is
      U^dagger*Y_a*conjugate(U), not U^dagger*Y_a*U. Degenerate singular
      subspaces retain additional basis freedom. The theorem supplies no field
      content, scalar count, generation map, Yukawa interaction, spatial
      profile, physical rate or bound, observation, Standard Model, or
      substrate realization.
    dependencies: [C-MIX-001]
    verification_plan: exact_symbolic_matrix_algebra_and_independent_rederivation
