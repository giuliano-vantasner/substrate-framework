question: >-
  Reproduce and independently audit EM7's claim that one fractional-Laplacian
  or Riesz family constructively bridges one-dimensional linear,
  two-dimensional logarithmic, and three-dimensional Coulomb potentials, and
  determine exactly which Fourier domain, boundary subtraction, distributional
  prescription, dimension concept, operator power, source normalization, and
  force dictionary are required for each branch and for any dimensional or
  physical selection statement beyond C-KRN-001 and C-MAX-001.
invariants:
  - >-
    C-KRN-001 supplies the exact subcritical Euclidean Riesz kernel only for
    r>0, nonzero coefficient A, and 0<s<d/2 in a fixed Fourier convention. It
    explicitly does not select s, d, A, a source, boundary condition, force
    law, electromagnetic sector, or substrate realization.
  - >-
    C-MAX-001 supplies source-normalized ordinary-Laplacian static branches for
    positive integer spatial dimension, including the d=1 linear, d=2
    reference-dependent logarithmic, and d>2 power-law cases. It supplies no
    fractional operator, effective dimension, physical dimension selection, or
    dimension-changing mechanism.
  - >-
    C-LOC-001 supplies exact series and spectral identities for separately
    declared kernels. It does not derive a Riesz operator, dimension, source,
    loop, charge, or gauge action. Qualified D3S maps only C-LOC-001 and
    C-KRN-001; its physical gap-to-Coulomb closure was rejected.
  - >-
    A positive real parameter d inside gamma functions is not by itself a
    metric-measure space, Hausdorff dimension, spectral dimension, diffusion
    generator, Dirichlet form, or physical fractal medium. Those concepts need
    independently declared structures and need not agree.
  - >-
    The subcritical integral 0<s<d/2, the critical slice 2s=d, and the
    supercritical region 2s>d are different mathematical regimes. Critical
    logarithms require a subtraction/reference prescription; supercritical
    inverse kernels require distributional and boundary or polynomial-quotient
    data and cannot be imported from the convergent formula silently.
  - >-
    Differentiating a supplied potential gives a radial power only after a
    probe-energy or force dictionary and sign convention are declared. The
    inverse-square equation 2s-d-1=-2 has the family d=2s+1 and selects d=3
    only after s=1 is independently supplied.
  - >-
    EM3 is qualified through C-GAU-001/C-KRN-001/C-MAX-001; D3S is qualified
    through C-LOC-001/C-KRN-001; QCD5 remains pending and grants no premise.
    EM7 is hash-pinned noncanonical evidence.
  - >-
    P134 and P135 already executed EM7 in immutable source-graph replays and
    exposed its successful tally and body. P136 makes no fresh source- or
    comparator-blinding claim; source literals cannot select the candidates.
