  - accepted dependency closure and exact quotient remainder domain fidelity
  - explicit spectral measure support weights tie convention units and varying-parameter discipline
  - assumption and parameter economy scale covariance physical-premise completeness and counterexamples
  - mutation sensitivity data-gate specificity nonduplication and predicate dependency and consumer closure
