trigger: >-
  Native reproduction, right-half-line energy balance, direct piston-variable
  elimination, and source-aware nonduplication reveal a distinct exact passive
  boundary-scattering theorem absent from the accepted registry. It preserves
  W5's rational algebra only under corrected conventions and exposes the
  physical and identifiability ceilings.
