  exact_content: >-
    The imported text proposes a boundary piston ansatz, two equations, a
    schematic combined condition with explicitly retained inertial terms, a
    linear characteristic decomposition, and supplied physical selection
    labels. Those statements are noncanonical source evidence and are not an
    accepted weak-sector action or event derivation.
initial_scientific_flags:
  - >-
    On the declared right half-line x>0, a phase exp(i*(k*x-omega*t)) travels
    toward increasing x and is outgoing from the boundary, while
    exp(i*(-k*x-omega*t)) travels toward decreasing x and is incoming. W5 names
    them in the opposite order.
  - >-
    For the canonical scalar wave energy on x>0, dE/dt at the boundary is
    -c^2*phi_t*phi_x. The displayed source-free condition
    phi_t+zeta*phi_x=0 with zeta>0 gives positive bulk energy injection rather
    than absorption. The advertised passive reflection law belongs to
    phi_t-zeta*phi_x=0 with the correctly oriented incoming and reflected waves.
  - >-
    Even accepting the imported signs phi_x=-lambda*psi_dot and
    mu*psi_ddot+V'=lambda*phi_t+J, direct elimination gives
    phi_t+(mu/lambda^2)*partial_t(phi_x)=(V'-J)/lambda. It does not give the
    local condition phi_t+(lambda^2/mu)*phi_x=drive. Dropping drive and
    potential does not remove the inertial derivative.
  - >-
    A boundary-only action cannot derive the bulk trace equation without a
    declared bulk action and domain normal. With the canonical right-half-line
    bulk sign, variation of the written coupling yields the opposite trace sign
    from the imported equation.
  - >-
    T=1-R is an algebraic complement. It is an absorbed fraction only after the
    passive boundary energy balance and absence of other reservoirs are shown;
    W5 evaluates neither stress flux nor boundary energy.
  - >-
    A_LR is constructed after independently assigning R_R=1. It is the
    deterministic transform (1-R)/(1+R), not a third independent prediction.
    R, T, and A_LR contain one power-ratio degree of freedom.
  - >-
    The power observables are invariant under z->1/z, while the amplitude
    reflection changes sign. Thus the advertised ratios do not identify the
    free impedance even within the conditional scalar model.
  - >-
    Equal assigned channel coefficients give zero normalized contrast by
    arithmetic. They do not establish scalar-boundary parity as a fixed-theory
    symmetry, Lorentz chirality, a V-A current, charge selection, a detector
    observable, a weak interaction, or a substrate mechanism.
