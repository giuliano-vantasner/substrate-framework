question: >-
  Reproduce and independently audit W5's claim that one boundary impedance
  supplies linked reflection transmission and left-right chiral asymmetry
  observables, and determine exactly which statements are conditional linear
  scattering identities, normalized two-channel contrasts, impedance
  reparameterizations, boundary-action consequences, or genuinely require
  parity-nonreciprocal states, physical currents, detector maps, and weak
  interaction dynamics.
invariants:
  - >-
    C-BND-001 treats a scalar affine boundary residual as declared data, proves
    its parity-family covariance and trace underdetermination, and supplies no
    boundary action, selected chiral state, current, charge map, or weak force.
  - >-
    C-SG-011 through C-SG-013 fix nonlinear characteristic sources, scalar
    parity, stress and boundary-flux signs, correlation, and winding transfer.
    They distinguish these objects from a physical chiral current or intrinsic
    parity violation.
  - >-
    C-BRN-001 gives exact normalization and odds for two declared nonnegative
    common-dimension inputs. It does not establish physical channels,
    exhaustiveness, scattering, detector acceptance, states, or interactions.
  - >-
    C-REP-002 qualifies W2 and P148 qualifies W3: independent carrier-factor
    representation algebra and scalar derivative identities do not supply
    Lorentz chirality, a charged vertex, gauge dynamics, or a weak sector.
  - >-
    C-KIN-001 qualifies W4: algebraic residuals and invisibility labels do not
    create an on-shell missing particle, charge-conditioned energy, detector
    event, neutrino, or weak interaction.
  - >-
    C-RAD-001, C-GOR-001, and C-MED-005 govern only their separately declared
    scalar-source, effective-metric, and constitutive statements. Qualified G1,
    G2, G5, and S5 grant no physical chiral-boundary authority; pending M1, M2,
    and W7 grant none at all.
  - >-
    The generated queue exposes W5's headline, eleven declared dependencies,
    twenty-seven literal checks, one assertion, a symbolic hint, and an
    unusually detailed result excerpt containing advertised formulas and
    values. P149's frozen graph additionally pins W5's hash and absence of an
    immutable NumPy-integration compatibility shape. Those exposed materials
    cannot select a candidate or threshold. Source and dossier bodies, data
    flow, exact predicates, and runtime output remain unopened for P150.
