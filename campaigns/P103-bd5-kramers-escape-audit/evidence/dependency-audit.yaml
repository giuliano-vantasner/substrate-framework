campaign: P103
claim: C-FPT-001
mathematical_imports:
  - one-dimensional reflected Ito diffusion with constant positive diffusion coefficient
  - continuous differentiable potential on a compact interval
  - absorbing stopping time and backward-generator calculus
  - elementary conditional expectation and moments
