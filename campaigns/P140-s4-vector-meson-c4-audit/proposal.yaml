question: >-
  Reproduce and independently audit S4's claim that integrating out a declared
  rho vector generates the Skyrme quartic tensor I1-I2 with a uniquely fixed
  sign and coefficient c4=8/B1^2, and determine exactly which action, metric,
  current normalization, low-momentum expansion, KSRF relation, B1 value,
  field dictionary, and physical interpretation are required.
invariants:
  - >-
    C-EFT-001 proves exact stationary elimination only after a complete
    symmetric invertible kernel and source are declared. It fixes no vector
    field, HLS action, mass, coupling, KSRF relation, operator basis, or
    coefficient.
  - >-
    C-CHI-001 and C-CHI-002 fix conditional Pauli trace and chiral-coordinate
    conventions only. They do not derive a physical pion, rho field, HLS
    connection, Skyrme action, or coupling normalization.
  - >-
    C-SK-001 keeps B1 as a positive premise and proves only a conditional
    cancellation between two supplied mass formulas. Pending B1 grants no
    profile value, c4 value, or physical scale.
  - >-
    C-LIE-001 fixes the accepted fundamental trace normalization but supplies
    no physical vector-meson representation or chiral effective action.
  - >-
    A propagator sign, a stationary-elimination sign, an induced local
    operator sign, and positivity of a static energy are distinct obligations
    and must use one explicit metric and action convention.
  - >-
    The Euclidean current identity sum_{mu,nu}|x_mu cross x_nu|^2=I1-I2 is
    algebraic. Calling its source a rho meson or its coefficient the physical
    Skyrme stabilizer requires separate action and dictionary premises.
  - >-
    A kinetic massive vector produces a derivative expansion, whereas a
    purely algebraic auxiliary field produces an exact Schur complement.
    Finite low-momentum truncations retain a nonzero remainder.
  - >-
    The generated queue has exposed the claimed beta/alpha=-1, c4=8/B1^2,
    approximate comparator 5.27, propagator sign, KSRF pinning, and headline
    rho-saturation conclusion. S4's body, exact check literals, internal
    normalizations, output, and dossier body remain unopened at freeze.
