  - C-RGE-003 owns only the formal positive one-loop length map with supplied coefficients and conversions.
  - C-IDN-002 establishes that AS7's alleged second route is inverse reconstruction by construction and supplies no physical values.
  - C-REP-001 owns three-eighths only as a normalization-covariant conditional trace coordinate.
  - C-QBL-004 owns a dimensionless classical radial branch with no mass pole determinant field or substrate identity.
