exact_corrections:
  - For Z_i=z_i+b_i*(L-log(c))/(8*pi^2), g_i^2/g_j^2=Z_j/Z_i.
  - Its derivative with respect to log(c) is (b_i*z_j-b_j*z_i)/(8*pi^2*Z_i^2).
  - Common-scale cancellation holds exactly iff b_i*z_j=b_j*z_i on the nonzero domain; zero matching is one corollary.
  - Distinct factor logs add b_i*b_j*(X_j-X_i)/(8*pi^2) to the ratio residual.
  - The relative normalization shift is -log(c)/L, while the inverse-coordinate shift is log(c)/(L-log(c)).
  - Smallness requires a separately bounded fixed log(c), large L, a nonzero denominator, and a justified perturbative interpretation.
accepted_ceiling:
