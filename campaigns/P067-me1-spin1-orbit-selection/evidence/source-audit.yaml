    reason: Given the exact global endpoints, -c2/2 is correct at norm one. At density n the energy difference is -c2*n^2/2. Strictness is transverse to the minimizing orbit inside the supplied functional, not uniqueness of a state or a material/continuum theorem.
  - id: ME1.4
    source_verdict: pass
    audit_verdict: conditional_sign_guard_exact_with_projective_ceiling
    reason: Negative c2 selects the upper endpoint and zero c2 leaves all pure rays degenerate. S2 is the ferromagnetic projective ray orbit with SO2 stabilizer, not a derivation of the full condensate order-parameter manifold; the source phrase that SO3 acts freely is false.
