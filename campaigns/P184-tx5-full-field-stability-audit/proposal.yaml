  - pinned source inventory and exact Git metadata at substrate@6d1f4e0
  - TX5 and its hash-pinned dependency and reverse-consumer nodes as noncanonical evidence only after this freeze
candidates:
  - id: A
    description: Reproduce TX5 exactly and audit every field definition, lattice functional, baryon estimator, perturbation generator, predicate, assertion, and conclusion against the object actually computed.
  - id: B
    description: Extract and validate a narrow exact or converged finite-lattice SU(2) static-functional and positive kinetic-tangent theorem without inferring an energy minimum.
  - id: C
    description: Establish a finite-box constrained discrete local-minimum result by a stationary residual and complete lowest-Hessian spectral audit with symmetry quotient, mesh/domain/step refinement, and independent Hessian-vector construction.
  - id: D
    description: Establish a continuum or full-field coercive local-minimum theorem from the exact second variation and boundary/topology constraints, independently of random-direction sampling.
  - id: E
    description: Retain only exact Derrick, baryon-convention, targeted-direction, or accepted reduced-ansatz composition results if the complete full-field candidates fail, while still producing a distinct positive importable object where one exists.
  - id: F
    description: Close claim, source, dependency, consumer, disposition, queue, release, documentation, memory, and debt governance without blanket promotion.
