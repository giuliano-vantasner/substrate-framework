source_units: [TX5]
question: >-
  Does hash-pinned TX5 establish that a specified degree-two SU(2) field is a
  strict local minimum of the full three-dimensional static Skyrme energy, or
  only finite-box discrete functional, kinetic-metric, selected-direction,
  Derrick, and topology diagnostics, once the field/action conventions,
  constrained tangent space, stationary residual, complete Hessian spectrum,
  symmetry quotient, boundary and topology sectors, mesh/domain/step
  refinement, independent method, and physical scope are audited?
invariants:
  - C-RMAP-001/002, C-RPROF-001/002, C-RMOM-001/002, and C-RMAP-003 are conditional reduced-ansatz results; none supplies a stationary full three-dimensional field or full-field Hessian.
  - C-GW-009/010 prescribe moment kinematics only, while C-FLO-001 and C-ROT-001 are finite-matrix and abstract free-rotor theorems; TX5 inherits no rotating Skyrme solution, collective inertia, selected Omega, or dynamic stability from them.
  - A finite-box lattice field, energy, baryon estimator, or positive kinetic metric is not a continuum existence, topology, stationarity, local-minimum, or nonlinear stability theorem without its own convergence and constraint closure.
  - Random smooth directions, even many positive samples, cannot establish positivity in every direction; a finite discrete strict-minimum claim requires the complete constrained Hessian or a coercive bound after exact symmetry and constraint modes are handled.
  - Positive curvature along Derrick scaling or one targeted m=2 direction does not classify the full tangent space.
  - A positive kinetic mass operator is distinct from positivity of the static energy Hessian and from Floquet or nonlinear dynamic stability.
  - Baryon-number closeness and agreement with reduced energies validate conventions only after mesh, domain, interpolation, boundary, and normalization refinements; they do not select the candidate or prove minimization.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral; immutable legacy-name stops are version-only compatibility evidence and never scientific candidate failures.
