id: P072
base_release: v0.65.0
base_commit: 05f928c
scientific_base_commit: 4ca91af
source_baseline: substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64
source_units: [MH3]
question: >-
  Derive a basis-covariant finite multiplication-overlap compression, its
  exact parity blocks and simultaneous-diagonalization criterion, and the
  invariant ceiling on relative eigenbases; then audit whether MH3 constructs
  nonzero mixing rather than comparing supplied matrices or basis choices.
invariants:
  - C-OVL-001 fixes the actual C-QBL-003 even/odd weighted cross expectation to zero for a centered even A*sech multiplier.
  - C-MIX-001 supplies abstract SVD and relative-basis algebra only; unitarity of a relative basis is automatic and does not prove it is nonidentity or physical.
  - C-MIX-002 supplies diagonal-rephasing invariants and explicitly enlarges freedom for degenerate or disconnected cases; matrix entries and angles alone are basis-convention dependent.
  - A compression Y_ij=<eta_i,Phi eta_j> must declare one common Hilbert space, measure, ordered orthonormal basis, complex conjugation, multiplier domain, and sector-identification map.
  - A real multiplier gives a Hermitian compression. Under a common basis change it transforms by unitary similarity; entries are not invariant while eigenvalues and commutator spectra are.
  - An even multiplier preserves parity and has zero matrix elements between opposite-parity modes; changing only its even width cannot break this selection rule.
  - Two Hermitian matrices on one identified finite space admit a common unitary eigenbasis exactly when they commute; a nonidentity diagonalizer from arbitrary independent basis choices is not evidence of misalignment.
  - A physical mixing interpretation additionally requires accepted left-handed fields, sector representations, a mass/Yukawa interaction, nondegenerate physical spectra, and a charged-current operator. None is accepted.
  - MH1 and MH2 are qualified only through C-OVL-001 and C-OVL-002; they supply no physical mass or generation premise.
allowed_imports:
  - C-OVL-001 for normalized expectations, the actual even/odd cross-term zero, dimensions, and physical ceiling
  - C-OVL-002 for translated profiles and supplied-center ceilings only
  - C-MIX-001 for finite SVD, relative column-basis convention, unitarity, ordering, phase, null, and degeneracy freedoms
  - C-MIX-002 for diagonal rephasing, support strata, and invariant-quartet ceilings
  - finite-dimensional Hermitian compression, Rayleigh-Ritz bounds, parity, unitary similarity, spectral projectors, and the commuting-Hermitian simultaneous-diagonalization theorem
  - separately declared orthonormal modes, real bounded multiplier profiles, centers, widths, amplitudes, ordered bases, and sector-identification maps
  - MH3 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as noncanonical evidence after this contract gate
candidates:
  - id: A
    description: >-
      Reproduce MH3 literally and retain only matrix entries, diagonalizations,
      and relative-basis statements whose modes, profiles, sectors, and basis
      maps are actually constructed.
  - id: B
    description: >-
      Derive the general finite compression of a bounded real multiplication
      operator, including Hermiticity, Rayleigh bounds, and basis covariance.
  - id: C
    description: >-
      Derive the parity-block theorem and apply it to C-QBL-003's even/odd
      modes against every centered even profile width.
  - id: D
    description: >-
      Use the exact commutator criterion for two Hermitian compressions to
      separate genuine common-space eigenbasis misalignment from matrix
      difference or unitarity alone.
  - id: E
    description: >-
      Audit eigenvalue ordering, phases, degeneracies, null spaces, rephasing,
      and missing inter-sector identification maps before assigning a relative
      basis any invariant meaning.
  - id: F
    description: >-
      Construct a minimally asymmetric or displaced multiplier that breaks
      parity and yields a conditional nonzero cross overlap, exposing the new
      premise and testing whether even-width variation can substitute for it.
uniqueness_evidence: null
selection_criteria:
  - accepted dependency closure without a fermion, Yukawa, charged-current, generation, or physical sector premise
  - exact Hilbert-space, measure, conjugation, basis, multiplier, parity, and sector-map bookkeeping
  - correct Hermiticity, essential-range, zero-multiplier, constant-multiplier, parity, equal-matrix, commuting, and degenerate limits
  - basis covariance of entries and invariance of spectra, projectors, commutator norms, and permitted rephasing observables
  - mutation sensitivity to omitted conjugation, wrong relative-basis orientation, parity violation by an even profile, reordered eigenvectors, arbitrary independent bases, and unitarity-only verdicts
  - parameter economy and a physical ceiling that leaves every field and interaction identification unproved
claims_proposed:
  - provisional C-OVL-003 weighted-overlap compression, parity, commutator, and basis-identifiability ledger if nonduplicate content survives
comparators_blinded_until: >-
  The generated synopsis exposes a claimed nonzero off-diagonal entry,
  different widths, a nonidentity relative matrix, and Cabibbo-like language.
  None may select a mode family, basis map, profile asymmetry, matrix ordering,
  degeneracy convention, sector interpretation, or physical observable.
  Those objects, candidates, invariants, mutations, and the interpretation
  ceiling are frozen here before MH3's executable body opens.
status: accepted
