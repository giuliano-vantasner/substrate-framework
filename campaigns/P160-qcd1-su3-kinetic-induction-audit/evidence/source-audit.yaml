load_bearing_findings:
  - >-
    The u(1-u) numerator is not the accepted complex-scalar numerator. For the
    declared scalar reading the fixed-positive-Q massless limit diverges; a
    finite fermion result would require a separately declared Dirac action and
    trace derivation absent from QCD1.
  - >-
    Transversality is imposed by defining Pi as a scalar times the projector.
    No bubble-seagull or fermionic diagrammatic Ward identity is derived.
  - >-
    A Q-independent coefficient multiplying P equals a coefficient times
    (Q delta-qq)/Q. Rewriting it as curvature produces a nonlocal inverse-Q
    kernel, not the local F-squared coefficient claimed in QCD1.8.
  - >-
    The source never constructs the noncommuting cubic and quartic curvature
    completion. Its G symbols enter only a trace-normalization polynomial.
  - >-
    The Abelian guard sets an unused self-interaction symbol to zero and changes
    the generator trace factor from one half to one. It is not a fixed-basis
    subgroup limit with a coupled generator-coupling normalization map.
  - >-
    Equality of the SU2 and SU3 fundamental Dynkin indices does not transfer a
    field action, statistics, determinant, dimension, or physical sector.
