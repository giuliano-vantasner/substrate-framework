  - {id: QCD1.1, status: retained_exact_duplicate, mapping: C-LIE-001, reason: The fundamental SU3 trace metric is exact and already accepted; equality with the SU2 index transfers no loop action.}
  - {id: QCD1.2, status: partly_retained_new_exact_algebra, mapping: [C-LIE-001, C-LIE-003], reason: The f tensor is accepted while the d tensor full anticommutator reconstruction and symmetry are distinct exact SU3 algebra.}
  - {id: QCD1.3, status: retained_with_scope_correction, mapping: C-LIE-003, reason: The d tensor vanishes on the standard lambda1 lambda2 lambda3 embedding and is nonzero outside; this distinguishes that embedding from the full fundamental algebra but is not a unique characterization of SU3 among all groups.}
