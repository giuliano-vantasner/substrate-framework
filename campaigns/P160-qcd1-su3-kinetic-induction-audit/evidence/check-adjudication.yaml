headline_decision: >-
  Promote only the distinct exact SU3 symmetric-tensor algebra and a separately
  declared generic massive complex-scalar finite-Lie-representation theorem if
  their independent and global reviews pass. QCD1 itself supplies neither the
  correct scalar loop nor a local full Yang-Mills action, unique coupling,
  physical quark or gluon sector, dimensional lift, or substrate mechanism.
