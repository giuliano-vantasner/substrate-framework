    C-SG-008 supplies exact constant-velocity Lorentz kinematics only. Replacing
    v by v(t) does not produce an on-shell accelerated breather or its source.
  - >-
    C-SG-012 fixes the normalized sine-Gordon stress tensor and local
    conservation only for an on-shell field; integrated balance additionally
    requires boundary flux conditions.
  - >-
    T2A is qualified through C-SG-001 C-SG-002 C-SG-008 and C-SG-012. It
    constructs no dilaton action field equation time-dependent solution or
    physical radiation premise.
  - >-
