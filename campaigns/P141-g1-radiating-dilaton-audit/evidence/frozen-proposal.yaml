  sources a time-dependent 1+1 dilaton field with outgoing power proportional
  to the square of its energy-loss rate, and determine exactly which action,
  kinetic and source normalizations, retarded boundary data, conservation law,
  trajectory, multipole, energy, flux, and physical dictionary are required.
