    conditional source-side identity. They supply no time-dependent kinetic
    action retarded propagator energy flux or physical gravitational coupling.
  - >-
    Pending G2 and G3 grant no authority. Later consumers may supply evidence
    but cannot close G1 before their own claim-level adjudication.
  - >-
    A field-equation coefficient and a wave-energy normalization are separate
    inputs. Outgoing power cannot be inferred from the equation alone.
  - >-
    Queue and earlier consumer audits have exposed G1's ten-check tally,
    symbolic and numeric oracle labels, G2 G3 T2A dependencies, headline
    Larmor analogy, and immutable legacy-NumPy compatibility path. G1's source
    body exact formulas check literals output and dossier body remain unopened
