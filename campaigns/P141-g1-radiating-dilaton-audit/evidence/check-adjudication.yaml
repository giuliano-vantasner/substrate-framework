source_unit: G1
checks:
  - id: G1.1
    executable_result: pass
    verdict: exact_conditional_metric_ansatz_algebra
    reason: The imported metric helper gives the displayed nonzero off-diagonal left-hand-side component for a declared time-dependent n, but no target solution source matching or action variation is constructed.
  - id: G1.2
    executable_result: pass
    verdict: exact_conditional_trace_and_linearization
    reason: The trace of the declared V=0 metric-equation left side is Box(log n) and its flat weak-field limit is a wave operator; the physical field equation action and propagating energy remain premises.
  - id: G1.3
    executable_result: pass
    verdict: rest_regression_then_wrong_boost
    reason: One grid reproduces the accepted rest energy and averaged rest stress, but the boosted trace monopole is asserted as gamma E0 without transformation and conflicts with scalar-trace volume contraction.
  - id: G1.4
    executable_result: pass
    verdict: circular_and_incorrect
    reason: The retarded derivative and flux coefficient are assignments. The Green function differentiates to the source monopole rather than its derivative, and the stated per-side canonical flux sums to four times the checked total.
  - id: G1.5
    executable_result: pass
    verdict: exact_kinematics_on_invalid_source_map
    reason: dgamma/dt=gamma^3*v*vdot is exact, but the closed power only propagates G1.3 and G1.4's incorrect source and flux premises.
  - id: G1.6
    executable_result: pass
    verdict: same_rhs_regression_and_target_selected_smallness
    reason: solve_ivp integrates the analytic dE/dt and np.gradient recovers the same derivative without a solver-success or refinement gate; kappa is then chosen backward to make h exactly 1e-3.
  - id: G1.7
    executable_result: pass
    verdict: unsupported_multipole_interpretation
    reason: Differentiating assigned gamma E0 and gamma E0 v is exact, but no retarded moment expansion establishes ell language, leading order, or a physical radiating channel in one spatial dimension.
  - id: G1.G1
    executable_result: pass
    verdict: constructed_guard_on_invalid_formula
    reason: The inserted v^2*vdot^2 formula vanishes when either literal is zero and is positive otherwise; this does not validate its derivation.
  - id: G1.G2
    executable_result: pass
    verdict: counterexample_only
    reason: The fabricated momentum-square expression differs from the inserted preferred formula but cannot repair the missing positive retarded-action derivation.
  - id: G1.G3
    executable_result: pass
    verdict: exact_free_wave_counterexample_mislabeled_bianchi
    reason: f(t-x) solves the free wave equation and a static sine does not, but no covariant Bianchi identity source conservation or dilaton equation is evaluated.
summary:
  exact_or_narrow_surfaces: [G1.1, G1.2, G1.5, G1.G3]
  numeric_regression_only: [G1.3, G1.6]
  circular_invalid_or_unsupported: [G1.4, G1.7, G1.G1]
  counterexample_only: [G1.G2]
  headline_supported: false
