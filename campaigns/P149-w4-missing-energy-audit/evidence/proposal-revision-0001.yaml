exact_statement: >-
  Let m1,m2>0 and theta be real. In 1+1 signature (+,-), take a center-of-mass
  threshold total P=(m1+m2,0) and an observed on-shell particle
  p1=(m1*cosh(theta),m1*sinh(theta)). The residual p2=P-p1 has exact mass-shell
  defect p2^2-m2^2=2*m1*(m1+m2)*(1-cosh(theta)), which is nonpositive and is
  zero if and only if theta=0. Hence the residual can be an on-shell particle
  of mass m2 only at zero recoil, where p1=(m1,0) and p2=(m2,0). A nonzero
  recoil requires total energy above threshold or a channel that is not the
  claimed second free particle, such as explicitly modeled boundary storage,
  work, or radiation.
