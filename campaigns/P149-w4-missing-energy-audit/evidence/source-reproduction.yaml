initial_scientific_flags:
  - >-
    W4.1 and the omega=0.5 portion of W4.6 reproduce C-SG-002 and C-SG-005.
    The threshold deficit is an input complement, not an outgoing constituent
    energy or interaction potential.
  - >-
    W4.2 correctly shows two expressions differ generically, but equality of
    their scalar energies does not identify an intact breather or any state.
  - >-
    W4.3 assigns gamma_abs=2-gamma_refl. For any gamma_refl greater than one,
    gamma_abs is below one and cannot describe a positive-mass free kink.
  - >-
    Exact four-momentum closure sharpens that failure: subtracting an on-shell
    mass-m1 particle of rapidity theta from threshold total (m1+m2,0) leaves
    mass-shell defect 2*m1*(m1+m2)*(1-cosh(theta)), which vanishes only at
    theta=0. Thus W4.4's open recoil interval is not a two-free-kink channel.
  - >-
    W4.5 assigns opposite momentum independently of its residual energy. At
    v=0.6 and equal mass eight, the residual is (6,-6), whose invariant mass
    is zero rather than eight. A fixed boundary may also absorb momentum.
  - >-
    W4.G1 is a conditional definition plus an unsupported charge implication;
    W4's imported both-absorbed outcome is a direct counterexample. Charge and
    detector visibility do not determine energy.
  - >-
    W4.G2 obtains negative residual energy for boosted reflected particles.
    That signals an incomplete fixed-total ledger or omitted drive work, not
    proof that missing energy is zero or tied to a charged-current event.
