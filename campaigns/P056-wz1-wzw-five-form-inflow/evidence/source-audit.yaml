    Full wedge antisymmetrization gives Tr(L^4)=0 by a cyclic shift with sign
    minus one. In d Tr(L^4), the four graded Leibniz terms have coefficients
    +1,-1,+1,-1 after cyclic reordering and cancel. Equivalently d(L^4)=0
    under dL=-L^2. The source retained one term and multiplied it by four.
