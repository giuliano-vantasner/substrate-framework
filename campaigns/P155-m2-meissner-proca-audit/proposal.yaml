  - C-NAG-001 only for exact curvature notation covariance and its action and physical ceilings
  - C-GAU-001 only for local Abelian covariance and its action and physical ceilings
  - C-VTX-001 only for its separately declared Abelian-Higgs radial model inverse lengths and interpretation ceiling
  - C-EFT-001 only as a nonduplication boundary for algebraic rather than kinetic massive-vector elimination
  - C-VAC-001 and C-QBL-001 only for their accepted gauge-loop scalar-equation and ontology ceilings
  - exact finite-dimensional tensor algebra variational calculus commuting partial derivatives Fourier substitution and constant-coefficient half-line ODE theory
  - M2 and M2-dossier at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence after freeze
