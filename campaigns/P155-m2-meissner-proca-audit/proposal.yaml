question: >-
  Reproduce and independently audit M2's claimed massive-vector equation and
  screening profile, and determine the most general exact statement relating
  a separately declared source-free Proca action to its Euler equation,
  derived divergence constraint, dispersion relation, and unique decaying
  transverse half-line boundary-value solution, while keeping the conditional
  M1 coefficient and any London, Meissner, condensate, weak-boson, material,
  observable, or substrate interpretation behind their missing action and
  dictionary premises.
invariants:
  - >-
    C-GSM-001 supplies a conditional gauge-scalar quadratic coefficient and a
    generalized kinetic-metric eigenproblem, but explicitly supplies no gauge
    kinetic action, stationary condensate, spectral pole, W field, Standard
    Model sector, or substrate mass mechanism.
  - >-
    C-NAG-001 supplies exact non-Abelian covariance and curvature but no action
    coefficient, equation of motion, mass, current, weak boson, or physical
    dictionary. A free Proca action therefore remains a separately declared
    model even when its curvature notation is compatible.
  - >-
    In the frozen mostly-plus convention eta=diag(-1,+1,+1,+1), the declared
    free action density is -F_mu_nu*F^mu_nu/4-m^2*A_mu*A^mu/2 with m>0.
    Variation, constraint, wave operator, and dispersion signs must be derived
    together rather than mixed with a mostly-minus formula.
  - >-
    For nonzero mass the divergence condition follows from the source-free
    Euler equation and commuting derivatives; it is not a residual gauge
    choice. The massless limit restores a different constraint structure.
  - >-
    Exponential screening requires a component and geometry compatible with
    the divergence constraint plus boundary and decay data. For a tangential
    component A_y(x) on x>=0, A_y(0)=A0 and A_y(infinity)=0 select the decaying
    branch; the unconstrained second-order ODE also has a growing branch.
  - >-
    C-VTX-001 supplies a conditional Abelian-Higgs radial inverse length under
    its own action and ansatz, while C-EFT-001 supplies algebraic stationary
    elimination without a kinetic Proca PDE. Neither is the theorem requested
    here, and neither supplies an M2 material or substrate dictionary.
  - >-
    The queue preexposes M2's M_W^2=g^2*v^2/4, Proca/London equation,
    exponential profile, lambda_W=2/(g*v), and Meissner analogy. Those values
    are recorded and excluded from candidate selection. The source and dossier
    bodies, exact AST data flow, sign conventions, ODE branch handling, and
    guards remain unopened until this contract is frozen and committed.
