  - {id: B, description: Derive the free source-free Proca Euler equation divergence constraint massive wave equation and dispersion relation in one explicit mostly-plus convention.}
  - {id: C, description: Solve the static transverse half-line boundary-value problem and distinguish its unique decaying profile from the unconstrained growing branch and longitudinal counterexample.}
  - {id: D, description: Compose the generic theorem conditionally with C-GSM-001 under canonical and noncanonical gauge kinetic metrics without importing a W pole or material medium.}
