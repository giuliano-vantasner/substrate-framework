exact_statement: >-
  Let A_mu be a real twice-differentiable vector field on 3+1 Minkowski space
  with eta=diag(-1,+1,+1,+1), let
  F_mu_nu=partial_mu*A_nu-partial_nu*A_mu, and separately declare the
  source-free action density L=-F_mu_nu*F^mu_nu/4-m^2*A_mu*A^mu/2 with exact
  m>0 and boundary behavior licensing integration by parts. Exact variation
  gives partial_mu*F^(mu nu)-m^2*A^nu=0. Commuting derivatives and
  antisymmetry give partial_nu*A^nu=0 as a derived massive constraint, not a
  gauge choice, and hence (box-m^2)*A^nu=0 for
  box=-partial_t^2+nabla^2. A plane wave has
  omega^2=|k|^2+m^2. For a static tangential component A_y(x) on x>=0 with
  A_y(0)=A0 and limit A_y(x)=0 as x tends to infinity, the unique solution is
  A0*exp(-m*x); the general unconstrained ODE also has a growing branch, and a
  longitudinal A_x(x) generally violates the derived divergence constraint.
  The inverse length is m and the penetration length is 1/m. For a separately
  declared positive one-mode kinetic coefficient kappa and positive quadratic
  coefficient q, m^2=q/kappa. Conditional on C-GSM-001's lower-doublet
  coefficient q=g^2*v^2/4 and an independently declared canonical free kinetic
  action, m=g*v/2 and the length is 2/(g*v). At m=0 the divergence constraint
  is not derived and no finite positive penetration length follows. These are
  exact conditional action and BVP identities. They supply no London current,
  Maxwell-material response, Meissner magnetic observation, stationary
  condensate, physical W boson, Standard Model selection, or substrate mass
  mechanism.
