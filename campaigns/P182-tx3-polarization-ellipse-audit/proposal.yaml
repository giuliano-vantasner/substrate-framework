question: >-
  Does hash-pinned TX3 establish an exact, convention-safe generic-observer
  polarization-ellipse theorem for the prescribed perpendicular rigid rotation
  accepted in C-GW-009, with frame-invariant temporal-rank and limiting-view
  classifications and a precisely scoped phase-parameterized cancellation of
  the common Omega scale, without treating two nonzero instantaneous
  coordinates as two modes or importing solved source dynamics, gravity,
  radiation, detector observables, or an Omega-independent physical waveform?
invariants:
  - C-GW-001 and C-GW-002 fix conditional TT projection, normalized and conventional readout conventions, and basis covariance but supply no gravitational action, source equation, detector model, or physical polarization observable.
  - C-GW-007 fixes temporal source rank as the rank of DC-removed coefficient traces; two nonzero coordinates at one time do not imply rank two, and transverse-frame rotation preserves rank.
  - C-GW-008 fixes the convention-safe conditional real-m2 waveform and rank theorem; equal quadrature is circular only in the declared natural-axis view and does not grant a generic physical wave interpretation.
  - C-GW-009 fixes the prescribed perpendicular rotation tensor, its pure twice-Omega harmonic, exact derivatives, rotation-axis conditional circular readout, and kinematic and physical-scope ceilings.
  - C-MOM-001 and C-RMOM-001 fix normalized I_STF versus triple Q=3*I_STF; TX3 may not silently use the source's factor-three-misnamed tensor.
  - Polarization coordinates depend on the oriented transverse frame, while temporal rank, ellipse degeneracy, and singular values under orthogonal frame changes are invariant.
  - A ratio h_cross/h_plus can have phase zeros and poles; cancellation of a common q*Omega^2 scale at fixed dimensionless phase is not independence of the physical-time waveform from Omega.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral; immutable legacy-name stops are version-only compatibility evidence and never scientific candidate failures.
