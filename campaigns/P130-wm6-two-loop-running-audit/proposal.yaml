source_units: [WM6]
question: >-
  Reproduce and independently audit WM6's gauge-only two-loop boundary-running
  calculation; determine the narrow conditional numeric object supported by
  C-RGE-005, distinguish inverse inference from prediction, and separate a
  uniform two-loop-matrix inverse fit from any all-orders or physical no-go.
invariants:
  - >-
    C-RGE-005 supplies a gauge-only beta polynomial under separately supplied
    representation invariants and imported perturbative weights. Its same-order
    Yukawa term, kinetic mixing, thresholds, matching, field content, boundary,
    physical identity, and perturbative domain remain outside the claim.
  - >-
    C-RGE-004 treats a common one-loop affine intersection as conditional
    inverse inference from supplied low-scale coordinates, coefficients,
    hypercharge weight, reference scale, and exact matching. It supplies no
    physical unification boundary or observed prediction.
  - >-
    For inverse couplings a_i=4*pi/g_i^2 and t=log(mu), the declared C-RGE-005
    convention gives da_i/dt=-b_i/(2*pi)-sum_j B_ij/(8*pi^2*a_j). A solver must
    keep every a_j positive and expose its integration and root status.
  - >-
    A three-factor high-scale boundary a_i(Lambda)=A*S_i with supplied positive
    ratios S_i has two unknown coordinates A and log(Lambda/mu0). Two supplied
    low-scale linear constraints determine those coordinates; a remaining weak
    coordinate is conditional output, not ab-initio prediction.
  - >-
    Setting B=0 must reproduce the exact affine C-RGE-004 limit. Direct-g and
    inverse-alpha formulations, independent integration methods, tightened
    tolerances, and load-bearing sign, matrix, boundary, and input mutations
    must agree or reject the route.
  - >-
    A root k obtained by replacing B with k*B is an inverse fit within one
    artificial one-parameter deformation. It neither represents the unknown
    higher-loop tensors nor proves a statement at all perturbative orders.
  - >-
    SM2 and SM4 remain pending; WM1 and WM3 are qualified only through their
    accepted surfaces; WM5 contributes C-RGE-005 only. Candidate dependency
    edges and clean consumer execution grant no additional authority.
  - >-
    P129's required WM6 consumer replay exposed the full terminal output and the
    values 0.20757, 0.21064, 0.23122, 8.90 percent, and about 8.75 before P130.
    This unavoidable prior exposure is recorded; structural criteria are frozen
    now and those values cannot select a concept, equation, convention, or gate.
allowed_imports:
  - C-RGE-004 conditional one-loop inverse-running reconstruction and ceilings
  - C-RGE-005 exact gauge-only coefficient ledger beta convention and omissions
  - src/substrate_framework/gauge_beta.py and src/substrate_framework/numerics.py
  - SciPy solve_ivp root and least_squares with explicit status tolerance and domain gates
  - exact SymPy one-loop limits transformations and scale covariance
  - WM6 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence after freeze
candidates:
  - {id: A, description: Reproduce WM6 literally and classify every numeric predicate provenance statement and omission.}
  - {id: B, description: Implement a canonical inverse-coupling three-factor boundary solver for supplied coefficients ratios and two low constraints.}
  - {id: C, description: Independently solve the same declared problem in direct gauge couplings without importing the canonical solver.}
  - {id: D, description: Derive the B=0 affine solution exactly and require both numeric formulations to converge to it.}
  - {id: E, description: Run tolerance method shooting-parameter and integration-domain refinement with positivity and solver-status gates.}
  - {id: F, description: Trace comparator data flow and mutate beta sign matrix orientation boundary ratios inputs and target-free residual construction.}
  - {id: G, description: Reproduce the uniform B-scaling inverse and construct higher-order or threshold countermodels that invalidate an all-orders reading.}
  - {id: H, description: Close accepted dependencies primary-formula scope consumers impact nonduplication and claim-level review.}
