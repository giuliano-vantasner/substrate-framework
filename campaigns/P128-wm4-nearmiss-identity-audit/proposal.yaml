question: >-
  Reproduce and independently audit WM4's claim that SM4's three-crossing
  scale spread and WM3's weak-coordinate miss are the same one-loop near-miss;
  distinguish a common left-null functional or vanishing locus from
  proportional coordinates, absolute or piecewise projections, percentage
  normalizations, and numerically identical physical observables.
invariants:
  - >-
    C-RGE-004's exact convention is a_i=A+B*b_i with separately supplied real
    inverse-coupling coordinates and signed coefficients. Reference scale,
    logarithm normalization, coefficient sign, and Abelian coordinate changes
    must be mapped explicitly rather than mixed.
  - >-
    For three lines with coefficient rank two, the common-intersection plane in
    intercept space is span{(1,1,1), (b1,b2,b3)}. Its linear annihilator is
    one-dimensional, so a nonzero linear incompatibility functional is unique
    only up to a nonzero scale and sign.
  - >-
    Pairwise crossing-coordinate differences are proportional to a signed
    incompatibility functional only when their coefficient denominators are
    nonzero. A max-minus-min crossing spread is nonnegative, absolute, and
    piecewise rather than one globally signed linear functional.
  - >-
    WM3's accepted surface is an inverse reconstruction from supplied E, S, n,
    coefficients, and exact matching. Comparing its solved weak coordinate to
    a separately supplied weak coordinate is a fixed-data residual, not an
    ab-initio prediction or an input-free observable.
  - >-
    Percentage miss depends on the chosen denominator and weak-coordinate
    convention. A scale spread depends on logarithm base, reference-coordinate
    normalization, pair selection, and absolute-value or range convention.
  - >-
    A shared zero set can establish equivalent exact-unification diagnostics
    without making two reported nonzero values equal, dimensionally identical,
    equally normalized, or physically interchangeable.
  - >-
    B1, M1, SM4, and WM6 remain pending and grant no authority. WM2 is duplicate
    evidence only; WM3 is qualified through C-RGE-004 with explicit physical
    ceilings. Candidate dependency edges are replay scope, not premises.
  - >-
    WM4's body, exact functional, coefficient formulas, input readings, output,
    approximate comparator values beyond queue-exposed four-decade and ten-
    percent headlines, and predicate implementations remain unopened at freeze.
