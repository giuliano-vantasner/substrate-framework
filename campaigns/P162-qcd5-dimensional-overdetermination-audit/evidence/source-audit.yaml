load_bearing_findings:
  - >-
    The three simultaneous equations are identical copies of d=2s+1. At
    supplied s=1 their one-column coefficient matrix has rank one and two row
    dependencies. With d and s both free the three-by-two matrix also has rank
    one and one-dimensional solution freedom.
  - >-
    The source sets over_determined from three greater than one and never
    computes coefficient rank or row provenance. Its distinct_groups witness
    checks only that the three named amplitudes contain at least two values;
    SU2 and SU3 both use one half and no amplitude enters the constraint row.
  - >-
    A dimension-dependent nonzero amplitude kappa(d) changes d-derivative
    sensitivity but not the radial log derivative or force exponent. Guard b
    therefore mutates an irrelevant quantity and does not show that sectors
    could select different d under the displayed Coulomb equation.
  - >-
    The s equals one input is load bearing: s equals three quarters gives d
    equals five halves. The retroactive D3S annotation cannot override the
    accepted C-KRN-002 and D3S qualification ceilings.
  - >-
    no_sg_derivation_of_s is assigned the literal boolean True. Its statement
    is consistent with the source inventory but the check does not derive or
    inspect that absence.
narrative_conflict: >-
  QCD5.1 correctly says the sectors share one exponent function, while QCD5.3
  calls three copies of that function independent constraints. Equation count
  is described as over-determination even though the source's own owner rule
  requires at least two independent constraints.
