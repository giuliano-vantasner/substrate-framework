  - C-KRN-001
  - C-KRN-002
  - C-LIN-001
  - C-LIE-003 and C-NVP-002 for exact SU3 trace data and their physical-scope ceilings only
  - exact symbolic rank nullspace exponent substitution and finite-dimensional algebra
  - QCD5 and its dossier as hash-pinned noncanonical evidence only after the freeze
