question: >-
  Which exact shared-exponent and fixed-input dimension statements in QCD5
  survive, and do three named gauge-sector copies supply independent constraints
  that overdetermine the spatial dimension rather than repeat one equation?
invariants:
  - C-KRN-001 fixes a scalar Riesz inverse only after dimension exponent Fourier convention and nonzero coefficient are supplied.
  - C-KRN-002 proves that inverse-square behavior selects the family d=2s+1 and does not identify d or s separately.
  - C-LIN-001 distinguishes row count from rank and treats repeated proportional equations as one constraint direction.
  - EM7 YM2 QCD1 and QCD2 are qualified with no accepted dimensional-lift or endpoint-selection authority.
  - Dimension-blind sector amplitudes can preserve an exponent but cannot make repeated copies of that exponent statistically or algebraically independent.
