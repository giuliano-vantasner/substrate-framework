question: >-
  Reproduce and independently audit EM5's claim that integrating out an
  assumed charged complex scalar in 1+1 dimensions generates a transverse
  gauge quadratic action, and determine exactly what field content, quantum
  action, regulator, renormalization condition, mass and momentum limits, and
  bare gauge input are required for any local kinetic term, nonlocal kernel,
  or pole statement beyond C-GAU-001 and C-MAX-001.
invariants:
  - >-
    C-U1-001 supplies only a conditional classical global-U1 current for an
    independently declared complex scalar. C-GAU-001 supplies only conditional
    local covariance and curvature and explicitly derives no quantum field,
    loop measure, gauge kinetic coefficient, photon, force, or physical charge.
  - >-
    C-MAX-001 supplies a conditional Maxwell action only after its positive
    kinetic coefficient, current, dimension, source, and boundary data are
    declared. It does not establish that a loop generates that action or fix a
    coupling normalization.
  - >-
    A candidate loop calculation must begin from a complete declared quantum
    scalar-QED action. The Euclidean convention is a complex scalar with
    operator -D^2+m^2, D_mu=partial_mu-i*e*A_mu, and a separately declared
    bare gauge quadratic term. Bubble and seagull contributions, the functional
    determinant sign and multiplicity, and analytic continuation are part of
    the claim rather than hidden premises.
  - >-
    Gauge invariance requires a regulator and renormalization prescription that
    preserve momentum-shift identities or explicit restoring counterterms. A
    transverse ansatz cannot prove the Ward identity of the underlying loop.
  - >-
    For nonzero Euclidean q squared, the kinematic projector
    P_mu_nu=delta_mu_nu-q_mu*q_nu/q_squared is idempotent and transverse by
    definition. It is undefined at q=0. The forms P_mu_nu*Pi_hat(q_squared) and
    (q_squared*delta_mu_nu-q_mu*q_nu)*Pi_scalar(q_squared) differ by an explicit
    q_squared and cannot be mixed.
  - >-
    A local Maxwell term is the analytic coefficient multiplying
    q_squared*delta_mu_nu-q_mu*q_nu. A nonzero constant multiplying P_mu_nu is
    instead a nonlocal F*(1/box)*F kernel and may alter pole structure when
    combined with a separately supplied bare action; it is not itself a local
    Maxwell coefficient.
  - >-
    The limits q_squared to zero and m to zero need not commute. Endpoint or
    infrared divergences, local counterterm freedom, field rescaling, species
    multiplicity, statistics, and charge normalization must remain explicit.
  - >-
    EM1 and EM2 are qualified through C-U1-001/C-U1-002 and C-GAU-001; EM3 is
    qualified through C-MAX-001. EM7 and M1 remain pending and provide no
    accepted premise. EM5 itself is hash-pinned noncanonical evidence.
  - >-
    P134 already executed EM5 as a reverse consumer and exposed its body,
    successful eleven-check tally, and claimed result. P135 therefore makes no
    source- or comparator-blinding claim; source literals cannot select among
    the independently frozen candidates.
