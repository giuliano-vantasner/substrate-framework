  - Any epsilon definition must declare its normalization, standard-sector scale, positivity domain, and relation to C-BPS-003's abstract expansion coordinate.
  - Refuted KI1 cannot support any premise; pending KI3 KI4 and MK1 through MK3 cannot supply authority.
