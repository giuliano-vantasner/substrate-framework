rejected_claims:
  - id: C-SG-014
    verification: unverified
    review: rejected
    compatibility: conflict
    epistemic: refuted
    reason: >-
      A fixed common phase reverses the alleged sweep sign between w=0.6 and
      w=0.8, while a pi phase shift exactly swaps the eps-labelled drives. The
      source's endpoint coordinate lacks the vacuum hypotheses for integer
      topological charge, and no physical chirality or parity-breaking boundary
      law is derived.
