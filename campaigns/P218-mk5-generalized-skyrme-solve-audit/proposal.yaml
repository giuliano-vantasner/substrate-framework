source_units: [MK5]
question: >-
  What exact conditional radial L2+L4+L6+L0 model follows from separately
  declared positive coefficients and rational-map angular data, which
  stationary branches survive independent refined solvers, and do any MK5
  physical coupling or binding conclusions have accepted dependency closure?
invariants:
  - C-RPROF-001 and C-RPROF-002 own only the L2+L4 radial functional and resolution-bounded stationary branches.
  - C-RMAP-001 and C-RMAP-002 type the angular Jacobian and supplied angular integrals without making rational degree a physical baryon.
  - C-BPS-001 uses lambda_BPS squared times pi to the fourth times B0 squared and selects no physical coupling or potential.
  - C-VEC-002 maps lambda_A=pi^2*lambda_BPS but supplies no physical vector or baryon-current identification.
  - MK1 through MK4 are qualified and supply no physical potential coupling product epsilon or full-model solution.
  - A successful source solve is numeric evidence only and requires solver status residual boundary domain mesh tolerance quadrature and method checks.
  - Mutable sampled integration uses trapezoid_integral or numpy.trapezoid and immutable compatibility events are never scientific failures.
allowed_imports:
  - C-RMAP-001 through C-RMAP-002 at their exact angular ceilings
  - C-RPROF-001 through C-RPROF-002 as the c6=c0=0 baseline only
  - C-RDIFF-001 through C-RDIFF-002 for signed-difference normalization only
  - C-BPS-001 through C-BPS-003 at their conditional convention and controlled-expansion ceilings
  - C-VEC-002 for lambda convention conversion only
  - src/substrate_framework/numerics.py shared solver and trapezoid evidence APIs
  - positive dimensionless c6 and nonnegative c0 as independently declared model parameters
  - hash-pinned MK5 only after the committed freeze
candidates:
  - {id: A, description: Derive the exact conditional generalized radial density Euler-Lagrange equation positivity and scaling ledger.}
  - {id: B, description: Derive the sextic rational-map angular factor from the squared pullback Jacobian rather than replacing it by degree squared.}
  - {id: C, description: Construct a canonical stationary branch with explicit regular-origin and massive-tail boundary data and checked solver status.}
  - {id: D, description: Independently solve the same declared BVP by a second numerical representation and quadrature route.}
  - {id: E, description: Isolate mesh domain cutoff tolerance and quadrature refinements and promote only resolution-bounded quantities that converge.}
  - {id: F, description: Replay the c6=c0=0 limit against C-RPROF-001 and C-RPROF-002.}
  - {id: G, description: Convert lambda_A and lambda_BPS exactly through C-VEC-002 and audit the source reduced coefficients.}
  - {id: H, description: Remove MK1-MK4 physical premises and retain only separately supplied coefficient branches.}
  - {id: I, description: Mutate angular factors coefficients boundary laws and degree combinations and require material verdict changes.}
  - {id: J, description: Reject all numeric promotion if branch identity residuals or refinements fail while continuing to another solver or representation.}
  - {id: K, description: Give MK5 an individual terminal disposition and replay MK6 and MR consumers without backward authority.}
uniqueness_evidence: null
selection_criteria:
  - exact variational derivation dimensional normalization and positivity
  - accepted dependency closure and explicit coefficient typing
  - correct rational-map angular factor and lambda convention
  - solver success equation and boundary residuals
  - isolated mesh domain cutoff tolerance and quadrature convergence
  - independent method agreement on like-for-like half-line quantities
  - baseline and limiting-case recovery
  - mutation sensitivity and branch identity
  - novelty beyond C-RPROF-001 and C-RPROF-002
  - terminal consumer queue and memory closure
claims_proposed: [C-GSK-001, C-GSK-002]
comparators_blinded_until: >-
  The generated queue exposes eight checks, one assertion, the displayed
  generalized radial density, source coefficient formulas, and the claim that
  the squared Jacobian uses angular integral I rather than B squared. Remaining
  equations, boundary data, solver settings, values, predicates, output, and
  consumer details stay unopened until this contract, formula freeze,
  provenance record, validation record, and freeze commit exist.
