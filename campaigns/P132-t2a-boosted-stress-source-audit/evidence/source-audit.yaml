surviving_surface:
  - The scalar Lorentz pullback of the exact rest breather remains an exact sine-Gordon solution.
  - Integrated energy and momentum are gamma*E0 and gamma*E0*v with invariant norm E0 squared.
  - The canonical contravariant stress divergence factorizes through the sine-Gordon residual.
  - A fabricated off-shell field has nonzero residual and stress divergence.
defects:
  - The reported momentum enhancement over E0*v is gamma, not gamma squared as its detail line states.
  - The source calls -u_t*u_x both T^0x and T_tx. In signature (+,-), covariant T_tx is +u_t*u_x and raising both indices flips the mixed sign.
  - A standing breather has zero integrated momentum by parity but nonzero pointwise T_tx at generic spacetime points, contradicting the claimed standing pointwise identity.
  - The imported static metric ansatz has M_tx=0 and therefore cannot equal the full standing breather's generic nonzero local T_tx without averaging or a different dynamical geometry.
  - The dilaton predicate contains no executable M_tx, kappa, metric, dilaton, potential, action variation, field equation, units, boundary data, or solution; it only checks abs(T0x_moving)>0.1.
  - The spatial-stress verdict transforms a density and omits the transformed cycle duration or equal-time integration factor. The correct cycle average is gamma*E0*v^2=v*P, not gamma^2*E0*v^2=gamma*v*P.
  - The load-bearing spatial-stress claim is never integrated numerically even though dens_Txx exists.
  - The Phase-12 radiation annotation is post-hoc prose and no GW script or accepted physical radiation map is executed.
