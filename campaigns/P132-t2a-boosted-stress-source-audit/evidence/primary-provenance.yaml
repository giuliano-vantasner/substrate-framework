finding: >-
  The cited review is genuine authority for a broad class of two-dimensional
  dilaton-gravity models and their interaction with matter. It does not select
  T2A's optical metric, identify the dilaton with a substrate refractive index,
  fix its potential and coupling, or prove that a Lorentz-boosted sine-Gordon
  breather solves the coupled target equations. Those are separate local model
  choices and solution obligations.
