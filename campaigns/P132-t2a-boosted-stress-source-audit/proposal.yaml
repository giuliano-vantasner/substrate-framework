source_units: [T2A]
question: >-
  Reproduce and independently audit T2A's claim that a Lorentz-boosted
  sine-Gordon breather supplies an exact conserved moving stress-energy source
  with transformed energy and momentum and a nonzero mixed dilaton source;
  determine whether any nonduplicate source theorem survives beyond C-SG-008
  and C-SG-012, and separate uniform translation from acceleration, radiation,
  a governed gravity coupling, and material realization.
invariants:
  - >-
    C-SG-008 already owns the exact boosted-breather phase and energy-momentum
    vectors, with (Omega,k)=(gamma*omega,gamma*omega*v),
    (E,P)=(gamma*E0,gamma*E0*v), their invariant norms, vector
    proportionality, rest limit, and the domain |v|<1.
  - >-
    C-SG-012 already owns the canonical symmetric sine-Gordon stress tensor in
    signature (+,-), including T_01=phi_t*phi_x but
    T^01=-phi_t*phi_x, the exact off-shell divergence, on-shell local
    conservation, and the boundary-flux qualification for integrated charges.
  - >-
    A Lorentz boost is fixed as x'=gamma*(x-v*t), t'=gamma*(t-v*x), with
    gamma=(1-v^2)^(-1/2), and phi_v(t,x)=phi_0(t',x') is a scalar pullback.
    Velocity sign, tensor index placement, and integration orientation are
    load-bearing conventions rather than adjustable fit choices.
  - >-
    Rest-breather localization and smoothness permit full-line charge
    integrals at each finite |v|<1. Local conservation is exact on shell;
    integrated conservation additionally uses vanishing asymptotic flux.
  - >-
    GW1 and GW4 are qualified navigation evidence, not accepted physical
    source dependencies. C-MOM-001 grants conditional conserved-moment
    identities only, while C-GW-001 through C-GW-003 keep waveform and power
    premises explicit and derive no 3+1 breather embedding or binding source.
  - >-
    Uniform inertial translation has zero acceleration and cannot by itself
    establish radiation or radiation reaction. A nonzero stress-tensor mixed
    component is not a dilaton, Einstein, material, or observational source
    map without a separately varied field equation and declared coupling.
  - >-
    The generated queue synopsis already exposes the formulas gamma*E0,
    gamma*E0*v, E^2-P^2=E0^2, and T2A's preferred source conclusion. Those
    outputs cannot select a concept, normalization, source map, or claim.
