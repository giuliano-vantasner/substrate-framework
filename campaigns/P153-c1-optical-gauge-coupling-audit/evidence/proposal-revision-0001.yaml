exact_statement: >-
  Conditional on C-OG-001's metric, C-GAU-001's charge-e connection convention,
  and the separately declared action
  S=-integral sqrt(-g)*(g^{mu nu}(D_mu Psi)^*D_nu Psi+m^2*|Psi|^2) dt dx,
  its Euler equation is
  [D_mu(sqrt(-g)*g^{mu nu}D_nu Psi)]/sqrt(-g)-m^2*Psi=0.
  For positive constant n,c0,m,e and constant real (A_t,A_x), a plane wave
  exp(i*(k*x-w*t)) therefore obeys
  n*(w+e*A_t)^2-(c0^2/n)*(k-e*A_x)^2=m^2. Under the affine gauge parameter
  chi=a*t+b*x, w'=w-e*a, k'=k+e*b, A_t'=A_t+a, and A_x'=A_x+b, so
  w+e*A_t and k-e*A_x are invariant. On the simply connected line every
  constant connection is removed by chi=-A_t*t-A_x*x and creates no local
  spectral shift. On a circle of circumference L with boundary condition
  Psi(x+L)=exp(i*theta)Psi(x), mode q has
  (w+e*A_t)^2=m^2/n+(c0^2/n^2)*[(2*pi*q+theta)/L-e*A_x]^2;
  q'=q+ell and A_x'=A_x+2*pi*ell/(e*L) leave it invariant. For varying n(x),
  the spatial operator is D_x[(c0^2/n)D_x Psi], differing from
  (c0^2/n)D_xD_x Psi by -c0^2*n_x*D_x Psi/n^2. Finally, with C-BER-001's
  B=i*psi_dagger*d psi convention and the same section phase as the U1 matter
  phase, a separately declared texture phi(x) can map to this connection only
  by e*A_x=-B_phi*partial_x(phi). These identities establish no material
  action, breather realization, electromagnetic field, analog-gravity
  observation, real-gravity coupling, or dynamical spacetime.
