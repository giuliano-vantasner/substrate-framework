source_unit: C1
headline_verdict: qualified_with_corrected_conditional_claim
accepted_content:
  - the C-OG-001 metric inverse and constant-index determinant
  - the C-GAU-001 minimal-coupling plane-wave eigenvalues after restoring charge e
  - the constant-coefficient mass-shell identity as a consequence of a separately declared charged-scalar action
  - dependence on the gauge-invariant combinations w+e*A_t and k-e*A_x
  - the flat zero-connection Klein-Gordon limit
corrected_content:
  - >-
    The A_eff correction at fixed canonical k is gauge-coordinate algebra, not
    an observable shift on the simply connected line; a constant A_x is pure
    gauge there.
  - >-
    A circle spectrum can depend on a flat connection only after circumference,
    charge representation, global section, and boundary phase are declared.
  - >-
    For varying n(x), the covariant operator is
    D_x[(c0^2/n)D_x Psi], not merely (c0^2/n)D_xD_x Psi; their difference is
    -c0^2*n_x*D_x Psi/n^2.
  - >-
    With C-BER-001's convention B=i*psi_dagger*d psi and the same section phase
    used as the U1 matter phase, a declared texture phi(x) maps by
    e*A_x=-B_phi*partial_x(phi), not by the dimensionless substitution A_x=B_phi.
rejected_content:
  - >-
    B1 does not establish a dimensioned spatial connection: its local half
    component is gauge-dependent, belongs to the dimensionless phi coordinate,
    and C-BER-001 supplies no texture pullback, charge, material carrier, or
    coupling action.
  - >-
    Absence of a symbol G from an equation declared without G does not prove a
    physical medium interaction or distinguish analog from real gravity.
  - >-
    The numeric electrogravitic ratio is not dimensionally established as
    written: eps0 is declared but unused, G*E^2/c^4 alone is not the stated
    curvature in SI, and the comparator A_eff^2/(n*L_med^2) is imposed rather
    than derived from an accepted material action.
  - >-
    Symbol membership in two expressions created to contain G and n is a
    construction check, not evidence for either physical coupling.
  - >-
    Dependence on k-e*A_x establishes the declared connection form but does not
    establish an Aharonov-Bohm experiment, Berry material realization,
    observation, analog gravity, or a coupling to dynamical spacetime.
predicate_adjudication:
  - {id: C0, verdict: exact_duplicate, mapping: C-OG-001}
  - {id: C1, verdict: qualified_exact, mapping: C-GAU-001, correction: restore_e_and_require_a_declared_connection}
  - {id: C2, verdict: qualified_new, mapping: C-OG-005, correction: derive_from_explicit_action_and_use_invariant_momenta}
  - {id: C3, verdict: exact_but_gauge_dependent, mapping: C-OG-005, correction: not_an_observable_line_shift}
  - {id: C3b, verdict: vacuous_construction_check, mapping: null}
  - {id: G1, verdict: qualified_exact_limit, mapping: C-OG-005, correction: free_charged_scalar_not_an_imported_breather}
  - {id: G2, verdict: rejected_as_stated, mapping: null, correction: dimensionally_unclosed_hard_coded_comparison}
  - {id: G2b, verdict: tautological_construction_check, mapping: null}
  - {id: C4, verdict: qualified_exact, mapping: C-OG-005, correction: connection_form_not_physical_realization}
