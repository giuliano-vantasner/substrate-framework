  - {author: Keisuke Ogasawara and others, year: 2023, title: Collisional Penrose process of extended test particles near an extremal Kerr black hole, doi: 10.1140/epjc/s10052-023-12171-w, scope: primary_application_displaying_pole_dipole_quadrupole_MPD_system}
equation_audited: >-
  Dp_a/Dtau=-(1/2)R_abcd*u^b*S^cd-(1/6)nabla_a R_bcde*J^bcde.
  The spin tensor is antisymmetric; the quadrupole is rank four with Riemann
  symmetries. Turning momentum evolution into acceleration additionally needs
  mass or momentum-velocity closure and a worldline prescription.
finding: >-
  T2C's a^x=-R^1_010*J^11 is not the Papapetrou spin term and is not Dixon's
  quadrupole term. The source citation to Dixon 1970 points to Part I, which
  defers equations of motion to subsequent papers; the relevant Part III is
  from 1974. The displayed T2C contraction omits the curvature derivative and
  required tensor rank, velocity, normalization, and supplementary data.
