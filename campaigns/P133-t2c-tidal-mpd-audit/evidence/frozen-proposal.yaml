question: >-
  Reproduce and independently audit T2C's claim that the centered finite-width
  moment of a sine-Gordon breather couples to the computed curvature of the
  static 1+1 optical metric as a leading Mathisson-Papapetrou-Dixon
  post-geodesic acceleration; determine whether a nonduplicate, dimensionally
  closed extended-body force theorem survives beyond C-OG-001, C-CC-001, and
  C-SG-009, with every index, sign, normalization, point limit, dependency,
  and physical interpretation explicit.
invariants:
  - >-
    C-OG-001 fixes coordinates (t,x), signature (-,+), the positive static
    metric g=diag(-1/n,n/c0^2), and the exact scalar curvature
    R=c0^2*(n*n_xx-2*n_x^2)/n^3. P133 fixes the Riemann convention
    R^rho_{sigma mu nu}=partial_mu Gamma^rho_{nu sigma}-partial_nu
    Gamma^rho_{mu sigma}+Gamma^rho_{mu lambda}Gamma^lambda_{nu sigma}
    -Gamma^rho_{nu lambda}Gamma^lambda_{mu sigma}; alternate conventions must
    be converted, not mixed.
  - >-
    C-CC-001 owns the conditional point-collective action and exact
    coordinate-time acceleration. Its zero-velocity limit is
    c0^2*n_x/(2*n^3). This is a declared one-coordinate effective model, not a
    full field-derived material trajectory or an extended-body equation.
  - >-
    C-SG-009 owns the exact centered unnormalized 1+1 energy-density second
    moment mu(t)=integral x^2*T00 dx. It explicitly supplies no physical
    finite-size coupling, 3+1 quadrupole, conserved extended body, or gravity
    theory. A normalized width would require a separately declared profile
    w and normalization, for example w=T00/E0 at a fixed phase.
  - >-
    For a declared Fourier transform w_tilde(k)=integral exp(-i*k*y)w(y)dy,
    sufficient integrability and a finite second moment give
    -w_tilde''(0)=integral y^2*w(y)dy. This is a second derivative. The doubled
    apostrophes visible in raw single-quoted YAML are serialization escaping,
    not a fourth derivative and not scientific evidence.
  - >-
    With t measured in time, x in length, c0 in length/time, and dimensionless
    n, R has units 1/time^2 while a normalized second spatial moment has units
    length^2. Their product has units length^2/time^2, not coordinate
    acceleration length/time^2. Any surviving force must close dimensions
    through its actual mass, velocity, derivative, or moment normalization.
  - >-
    A standard MPD quadrupole force, geodesic-deviation law, profile-averaged
    point acceleration, and a phenomenological curvature response are distinct
    candidate mechanisms with different tensors, curvature derivatives,
    velocities, normalizations, and point limits. A shared use of the word
    tidal cannot identify them.
  - >-
    Qualified FS1, FS2, P3D3, and T1B and duplicate-evidence FS4 are navigation
    records only. Their accepted mappings retain explicit ceilings: no
    physical finite-size force, conserved 3+1 source, gravity action, or
    material realization is inherited by T2C.
  - >-
    The generated queue synopsis exposes T2C's preferred curvature component,
    force formula, second-moment identification, and affirmative verdict.
    Those exposed outputs cannot select the mechanism, normalization, index
    convention, or claim.
