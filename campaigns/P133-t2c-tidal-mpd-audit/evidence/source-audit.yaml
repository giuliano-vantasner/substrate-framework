surviving_surface:
  - The optical Christoffels Riemann components scalar curvature and two-dimensional Gaussian identity are exact and map to C-OG-001.
  - The frozen Riemann sign and component relation R^1_001=R_scalar/(2n) are exact.
  - For a declared integrable kernel with finite second moment the Fourier identity -w_tilde_double_prime(0)=integral y^2*w(y)dy is exact.
  - The phase-three kernel values reproduce numerically and use current np.trapezoid calls.
defects:
  - The claimed MPD force is declared after the geometry calculation and no covariant multipole equation is derived or executed.
  - Papapetrou's Riemann coupling is to an antisymmetric spin tensor. A symmetric rank-two J contracts to zero in those antisymmetric slots, and T2C's R^1_010*J^11 labels do not share index slots.
  - Dixon's quadrupole force uses a rank-four Riemann-symmetry moment and a curvature derivative, plus momentum or mass and worldline data. T2C supplies none of them.
  - Curvature has inverse-time-squared units and a normalized width has length-squared units, so their product is velocity squared rather than coordinate acceleration. The raw kernel moment also retains its coupling weight.
  - The upstream phase-three fixed-profile derivation gives a third-background-derivative correction; T2C gives a second derivative at weak order and therefore does not reproduce its own imported mechanism.
  - For an even index n=1+beta*x^2/2 and an even centered body at x=0, exact reflection symmetry forces zero averaged acceleration while T2C predicts c0^2*beta*variance/2.
  - On n=1+epsilon*x, profile averaging starts at order epsilon cubed while T2C starts at order epsilon squared with the opposite sign.
  - Substitution of zero width proves only that any coefficient times the width vanishes. Infinitely many inequivalent force laws pass the same point guard, nonzero check, and linearity check.
  - The source sign sample has abs(Delta/a_point)=4.65, but its alleged leading correction check requires only a finite ratio and supplies no small-parameter hierarchy or remainder control.
  - The post-hoc FS1 FS4 and P3D3 annotation conflicts with their accepted adjudications and cannot close the missing moving-field or MPD derivation backward.
