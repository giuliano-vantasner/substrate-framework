exact_statement: >-
  Let k be an integer and phi range from zero to two pi. In a complex carrier
  of dimension at least two define the normalized real lift
  n_k(phi)=(cos(k*phi/2),sin(k*phi/2),0,...). Its rank-one projector is
  periodic and n_k(2*pi)=(-1)^k n_k(0). For a normalized section psi of this
  closed projector path with psi(2*pi)=tau*psi(0), |tau|=1, use the convention
  A=i*psi_dagger*d_phi psi and define the closed-ray holonomy
  H=tau*exp(i*integral_0^{2*pi} A dphi). Under every smooth phase change
  psi'=exp(i*chi)psi, A'=A-d_phi chi and
  tau'=exp(i*(chi(2*pi)-chi(0)))*tau, so H is invariant. For the real lift,
  A=0 and tau=(-1)^k. For the periodic section
  psi=exp(-i*k*phi/2)n_k, A=k/2 and tau=1. Both give H=(-1)^k. By contrast,
  exp(-i*k*phi/2) times a fixed ray has a constant projector and H=1, even
  though its bare integral phase is (-1)^k. The theorem derives no unique
  local vector potential, curvature or core source, dynamics, electromagnetic
  field, fermion, material realization, coupling, or observation.
