question: >-
  Reproduce and independently audit B1's claim that an RP2 disclination has a
  concrete Berry connection with half-unit local value and minus-one holonomy,
  and determine exactly which statements belong to the projective base loop,
  a chosen lift or section, a gauge-dependent local one-form, its endpoint
  transition, a gauge-invariant Wilson phase, or a physical medium field.
invariants:
  - >-
    C-TOP-001 and C-CHR-001 govern integer and finite sign characters. Equal
    minus-one values do not identify source spaces, quotient maps,
    representations, connections, or physical objects.
  - >-
    C-SPN-001 identifies the polar pure-spin-one ray orbit as RP2 but supplies
    no spatial texture, line bundle, Berry connection, defect existence,
    material, or observation.
  - >-
    C-DEF-001 distinguishes pi1(RP2)=Z2 from the full polar manifold's integer
    deck group and supplies only conditional angular energy ledgers. It does
    not choose a spinor lift, section, connection, or holonomy convention.
  - >-
    C-GAU-001 governs a separately declared local U1 connection. It proves
    covariance and an integer-flux ceiling but supplies no B1 Berry bundle,
    fractional flux, electromagnetic field, or gauge dynamics.
  - >-
    Pending M1 grants no authority. B1 is lexically listed by twenty-four
    reverse units, but many use B1 as an unrelated coefficient name; every
    semantic consumer must be classified rather than inferred from the token.
  - >-
    The generated queue exposes B1's headline, pending M1 dependency, eight
    literal checks, one assertion, symbolic and numeric hints, and detailed
    advertised results. Accepted P140 graph evidence additionally pins B1's
    hash and its eager dynamic legacy-name compatibility shape. Those exposed
    materials cannot select a candidate. The B1 source and dossier bodies,
    exact predicates, data flow, and runtime output remain unopened for P152.
