id: P059
base_release: v0.52.0
base_commit: 5d81e93
source_baseline: substrate@6d1f4e0
source_units: [WZ4]
question: >-
  Derive a reusable exact low-momentum theorem for eliminating declared
  massive vector fields with parity-even and parity-odd sources, determine
  precisely what local odd operator and coefficient data survive, and audit
  whether WZ4 independently derives a WZW functional rather than assuming an
  anomalous HLS action and free homogeneous coefficients.
invariants:
  - C-LIE-001 fixes only the fundamental SU(3) algebra and trace convention, not an HLS gauge sector or representation map.
  - C-WZW-001 and C-WZW-002 fix an ungauged trace-five class and sphere-filling coefficient lattice, but no gauged WZW functional, HLS action, vector meson, anomaly polynomial, or physical level.
  - C-TOP-002 fixes a mathematical winding current and explicitly withholds a gauged-WZW response, physical baryon current, and vector coupling.
  - Declaring an anomalous source term, eliminating a massive field, matching a local derivative expansion, reproducing an anomaly class, and deriving a microscopic substrate mechanism are separate obligations.
  - Homogeneous solutions of an anomaly equation cannot by themselves select the inhomogeneous anomaly normalization; every free coefficient and imported action term remains explicit.
allowed_imports:
  - C-LIE-001
  - C-WZW-001
  - C-WZW-002
  - C-TOP-002 only as a mathematical winding current with its interpretation ceiling
  - exact finite-dimensional variational calculus, completion of the square, Schur complements, parity bookkeeping, and formal low-momentum inverse expansions
  - audited primary literature for the definition and coefficient freedom of the anomalous HLS operator basis, treated as an external theory premise rather than framework-derived dynamics
  - SymPy exact algebra for matrix elimination and independent direct substitution
  - WZ4 at substrate@6d1f4e0 as noncanonical evidence after the contract gate
candidates:
  - id: A
    description: >-
      Reproduce WZ4 literally and retain only subclaims whose equations,
      coefficients, parity assignments, and dependency closure are exercised
      by its checks.
  - id: B
    description: >-
      Derive the exact Schur-complement theorem for a declared massive vector
      multiplet coupled to independent parity-even and parity-odd sources,
      including the leading local inverse-mass expansion and its odd cross
      term.
  - id: C
    description: >-
      Reconstruct the complete relevant homogeneous anomalous-HLS operator
      basis from audited primary definitions and test whether symmetry,
      anomaly matching, or vector elimination fixes its coefficients.
  - id: D
    description: >-
      Track the anomaly cohomology class through algebraic heavy-vector
      elimination and distinguish an unchanged pre-existing WZW functional
      from gauge-invariant local homogeneous terms generated by the
      elimination.
uniqueness_evidence: null
selection_criteria:
  - exact compatibility with accepted SU(3), WZW, winding-current, and orientation conventions
  - a complete declared quadratic vector action and actual stationary-field substitution
  - explicit parameter and assumption ledger for masses, couplings, operator coefficients, and derivative-order truncation
  - parity, dimensions, symmetry, invertibility, and low-momentum limits checked on the defining objects
  - no import of pending G2, G3, S3, or S4 and no use of a desired WZW coefficient as an input under another name
  - independent completion-of-square and equation-of-motion derivations with sensitive sign, mass, coupling, and source mutations
  - clear separation of homogeneous anomalous terms, the inhomogeneous WZW anomaly solution, physical vector mesons, and substrate dynamics
claims_proposed:
  - provisional C-EFT-001 exact conditional massive-vector elimination and parity-odd cross-term theorem
selected_candidate: [B, D]
comparators_blinded_until: >-
  The migration inventory necessarily exposes WZ4's claimed HLS mechanism,
  low-q propagator analogy, and reference to four homogeneous anomalous terms.
  Those synopsis statements cannot select a coefficient, operator, or
  candidate. The quadratic-action convention, source decomposition, Schur
  complement, derivative expansion, parity rules, coefficient ledger,
  mutation set, anomaly-class distinction, and interpretation ceiling are
  frozen in this manifest and matching memory contract before WZ4's
  executable internals or printed values are inspected.
status: accepted
