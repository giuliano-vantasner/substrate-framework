question: >-
  Reproduce and independently audit EM3's claim that adding an imported
  Maxwell kinetic term to the accepted conditional local-U1 connection yields
  a sourced Maxwell equation, a static point-charge tail, and a two-charge
  force, and determine exactly which action, current, dimension, boundary,
  normalization, and physical premises are required beyond C-GAU-001 and
  C-KRN-001.
invariants:
  - >-
    C-GAU-001 fixes D_mu=partial_mu-i*e*A_mu,
    F_mu_nu=partial_mu*A_nu-partial_nu*A_mu, and the local transformation
    A_mu'=A_mu+partial_mu*chi. It explicitly supplies no F-squared coefficient,
    gauge-field equation, photon, force, physical charge, or electromagnetic
    sector. P134 cannot infer those objects from covariance alone.
  - >-
    The independent conditional action uses flat (d+1)-dimensional signature
    (+,-,...,-), L=-kappa*F_mu_nu*F^mu_nu/4-j^mu*A_mu, kappa positive, and a
    smooth conserved supplied current. With compactly supported variations,
    its equation is kappa*partial_mu F^mu_nu=j^nu. Other metric, source, unit,
    and coupling conventions must be converted rather than mixed.
  - >-
    In the static gauge A_0=phi, A_i=0, j^0=rho, the frozen convention gives
    -kappa*Laplacian(phi)=rho and E=-gradient(phi). A point source, delta
    normalization, spatial dimension, regularity away from the source, and
    boundary condition are additional premises; the homogeneous solution and
    additive constant are not fixed by the differential operator alone.
  - >-
    Let S_(d-1)=2*pi^(d/2)/Gamma(d/2). For integer d>2 and the decaying
    boundary condition, a supplied point charge Q gives
    phi=Q/[kappa*(d-2)*S_(d-1)*r^(d-2)] and radial
    E=Q/[kappa*S_(d-1)*r^(d-1)]. Thus decaying power-law tails occur for every
    d>2; only the inverse-square member of this declared family selects d=3.
  - >-
    The d=2 fundamental solution is logarithmic and needs a reference scale;
    the d=1 solution is linear up to homogeneous data. Neither decays at
    infinity. These dimension cases must be derived rather than discarded by
    fitting a three-dimensional comparator.
  - >-
    A second supplied test charge q has conditional potential energy U=q*phi
    and force F=-gradient(U)=q*E. Like charges repel and opposite charges
    attract in the frozen signs. This is a force dictionary premise, not a
    consequence of the field equation or accepted complex-scalar current.
  - >-
    C-KRN-001 already owns the exact conditional Riesz Green kernel, including
    d=3, s=1, A=1 giving 1/(4*pi*r), while explicitly selecting no dimension,
    source, boundary, force, or charge normalization. C-FLX-001 separately
    owns conditional F=q*E algebra. Duplicate composition cannot be promoted
    as a new claim.
  - >-
    EM2 is qualified through C-GAU-001. G1, G2, and G3 remain pending and
    provide no accepted premise. The generated queue synopsis exposes EM3's
    Maxwell, Coulomb, inverse-square, and dimension-selection targets, but its
    body and result remain unopened at freeze and cannot select a candidate.
