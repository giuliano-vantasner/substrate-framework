  - C-FLX-001 only for its separately declared force-equals-charge-times-field and spherical-spreading algebra
  - src/substrate_framework/gauge_u1.py and momentum_kernels.py accepted pure APIs
  - exact SymPy variational integration-by-parts tensor contraction radial divergence gamma-function and limit algebra
  - independently declared flat-spacetime action current point source dimension boundary condition and test-charge force dictionary
  - primary classical-field references after freeze only for convention provenance if needed and never as substrate authority
  - EM3 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence after freeze
