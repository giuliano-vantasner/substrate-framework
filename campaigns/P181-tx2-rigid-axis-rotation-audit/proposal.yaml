question: >-
  Does hash-pinned TX2 establish an exact convention-safe kinematic theorem
  for rigid orthogonal rotation of an axisymmetric STF moment, including its
  invariant eigenvalue degeneracy, harmonic derivatives, observer readouts,
  and conditional power, without calling a rotated axisymmetric tensor
  genuinely triaxial or treating a declared angular speed as solved source
  dynamics, stability, gravity, radiation, or a physical state?
invariants:
  - C-MOM-001 fixes normalized I_STF and triple Q=3*I_STF conventions and separates declared moment kinematics from locally conserved source dynamics and gravity.
  - C-GW-001 and C-GW-002 fix only conditional TT projection, convention covariance, angular power algebra, and polarization bases; they supply no gravitational action, coupling derivation, source equation, or radiation mechanism.
  - C-GW-007 and C-GW-008 distinguish Cartesian tensor shape, observer-frame coordinates, and temporal polarization rank; two coordinates at one phase do not establish two independent modes.
  - C-RMOM-001 fixes the exact conditional B2 normalized moment as diag(q,q,-2q) with q positive but supplies no rotation, angular speed, full field, local conserved stress, physical state, gravity, or radiation.
  - C-RMOM-002 supplies one resolution-bounded dimensionless magnitude for a corrected stationary reduced branch, not a physical scale, inertia, rotating solution, stability theorem, or selected angular speed.
  - Orthogonal conjugation preserves trace, determinant, characteristic polynomial, eigenvalues, multiplicities, and Frobenius norm; coordinate diagonal entries are not eigenvalues when off-diagonal components are present.
  - A rigidly prescribed rotation is kinematic input. A dynamically self-consistent rotating or tumbling soliton requires field equations, stresses, constraints, boundary data, conserved charges, and stability evidence not inferred from the tensor path.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral; immutable legacy-name stops are version-only compatibility evidence and never scientific candidate failures.
