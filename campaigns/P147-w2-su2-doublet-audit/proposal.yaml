question: >-
  Reproduce and independently audit W2's claim that kink and antikink labels
  form a physical chiral SU(2)_L doublet, and determine exactly which statements
  are abstract two-dimensional representation identities, supplied label and
  charge conventions, compatible independent chirality projections, or
  genuinely require a gauge action and interaction dynamics.
invariants:
  - >-
    C-SPN-002 already proves the normalized finite-dimensional su(2) ladder,
    commutator, and Casimir on a declared two-state carrier; its N=1
    specialization supplies no physical constituent, Hamiltonian, current,
    transition rate, or gauge sector.
  - >-
    C-SG-011 gives exact sine-Gordon winding labels plus and minus one and
    parity exchange, but explicitly supplies no particle identity, selected
    sector, fermionic state, V-A interaction, or weak force.
  - >-
    C-BND-001 qualifies W1: its boundary residual gives parameter-family
    covariance and trace underdetermination, not charge selection, chiral
    matter, fermion parity, or weak dynamics. W2 may not import rejected W1
    readings as premises.
  - >-
    C-REP-001 treats representation rows, generator eigenvalues, and charge
    coefficients as supplied data and makes Abelian normalization freedom
    explicit; table arithmetic alone establishes no physical representation,
    chirality, anomaly cancellation, gauge action, or Standard-Model identity.
  - >-
    On a declared two-dimensional complex carrier with T_a=sigma_a/2, any
    unitary basis relabel preserves the abstract algebra. A physical
    identification of the two basis vectors requires separate state,
    transformation, and observable provenance.
  - >-
    A common Abelian generator commuting with an irreducible SU(2) doublet is
    proportional to the identity, so Q=T3+cY has eigenvalue separation one in
    the declared T3 normalization. Labels plus and minus one have separation
    two and cannot both be that Q without an explicit rescaling or different
    representation data.
  - >-
    Weak chirality is an independent Lorentz-spinor factor. A left projector
    can multiply SU(2) generators as T_a tensor P_L on a product carrier; a
    nontrivial rank-one projector on the same irreducible two-state carrier
    cannot commute with all T_a and cannot be silently called chirality.
  - >-
    The generated queue exposes W2's broad headline, thirteen named
    dependencies, nine static and literal checks, one assertion, symbolic
    hints, and partial result prose. Source and dossier bodies, exact
    predicates, matrices, output, and thresholds remain unopened.
