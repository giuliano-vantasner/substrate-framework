claim_reserved:
  id: C-REP-002
  dependencies: [C-SPN-002]
  statement: >-
    Let H_I=C^2 have its standard inner product and Hermitian generators
    T_a=sigma_a/2. Let H_C be a nonzero finite-dimensional complex inner-product
    space and let P be a Hermitian idempotent on H_C, with P_R=I-P. Then
    G_a^L=T_a tensor P and G_a^R=T_a tensor P_R are Hermitian and each obeys
    [G_a,G_b]=i*epsilon_abc*G_c; G^L acts as the fundamental doublet on
    H_I tensor image(P) and vanishes on H_I tensor kernel(P), with the roles
    exchanged for G^R. The vector and axial combinations are
    G^V=G^L+G^R=T_a tensor I and G^A=G^L-G^R. If a declared unitary parity
    operator exchanges P and P_R while leaving H_I untouched, it exchanges
    G^L and G^R, leaves G^V even, and makes G^A odd; G^L alone is not a
    parity-odd eigenoperator. On H_I itself the full commutant of all T_a
    consists only of scalar matrices, so no nontrivial rank-one projector on
    that same irreducible carrier can be an independent chirality projector.
    In particular T_a*diag(1,0) is non-Hermitian for a=1,2 and fails the su2
    algebra. Any Hermitian Abelian generator Y commuting with every T_a is
    y*I, so Q=T_3+c*Y has eigenvalues c*y+1/2 and c*y-1/2 with separation one.
    Assigned labels plus and minus one therefore cannot both be eigenvalues of
    one such Q; the rescaled declaration q_top/2=T3 with y=0 is algebraically
    compatible but is not selected by the representation. These exact
    finite-dimensional identities establish no physical state identification,
    topological transition, Lorentz chirality, fermion parity, gauge connection,
    interaction, anomaly statement, weak sector, or substrate realization.
