headline_failures:
  - >-
    The standard Pauli representation is exact, but attaching kink, antikink,
    fermion, weak-isospin, or charged-current names requires separate physical
    state and interaction provenance.
  - >-
    The declared basis-label transition is minus one to plus one and changes Q
    by two. Comparing the ladder's T3 step one with a separately inserted
    winding event one does not identify the two operations.
  - >-
    CP-opposite labels fix opposite signs only. They do not select magnitude,
    T3=Q/2, or a physical representation.
  - >-
    A common Abelian generator on the irreducible doublet is scalar, so
    Q=T3+cY has eigenvalue separation one. W2's labels have separation two and
    its computed opposite hypercharges are not one shared doublet charge.
  - >-
    The source reuses the isospin carrier as chirality space. T_a*P_L is
    non-Hermitian for a=1,2 and fails every cyclic su2 commutator; P_L*P_R=0
    cannot repair the representation.
  - >-
    Exchanging left and right factors makes their sum even and difference odd.
    One left operator is exchanged with the right operator, not mapped to its
    negative, and W2 constructs no parity or rectification oracle.
headline_verdict: >-
  Qualified. Native execution passes all nine predicates without a NumPy
  compatibility event. The tally validates exact standard matrices, supplied
  labels, tautological projectors, and preloaded guards, not W2's physical
  chiral SU2_L, charge-changing, fermionic, or weak-interaction headline.
