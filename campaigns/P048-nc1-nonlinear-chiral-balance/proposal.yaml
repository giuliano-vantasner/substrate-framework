  - no dependence on pending weak-sector claims or an imported bosonization dictionary
  - conservation law strength and explicit boundary hypotheses
  - normalization and light-cone factor closure
  - correct free-field, vacuum, kink, antikink, and spatial-parity limits
  - assumption and parameter economy
