exact_statement: >-
  Let H_I=C^2 carry the exact Pauli-half generators T_a, let H_C be nonzero and
  finite-dimensional, and let P be an exact Hermitian projector with
  P_R=I-P. On H_I tensor H_C define G_a=T_a tensor P. For a smooth local
  U_I(x) in SU2 define U=U_I tensor P + I tensor P_R. Let g be exact positive,
  W_mu=W_mu^a G_a, and D_mu=partial_mu-i*g*W_mu. The finite transformation
  W_mu'=U*W_mu*U_dagger-(i/g)*(partial_mu U)*U_dagger gives
  D_mu'(U*psi)=U*D_mu psi. The curvature
  F_mu_nu=partial_mu W_nu-partial_nu W_mu-i*g*[W_mu,W_nu] obeys
  [D_mu,D_nu]psi=-i*g*F_mu_nu*psi and transforms as
  F_mu_nu'=U*F_mu_nu*U_dagger. The connection annihilates the P_R sector.
  With a separately declared invariant metric and trace, a quadratic
  trace(F_mu_nu F^mu_nu) density is gauge invariant and its commutator produces
  non-Abelian cubic and quartic algebraic terms; this does not derive an action
  coefficient or equation of motion. A parity exchange P<->P_R maps this left
  gauge construction to a distinct right construction rather than making the
  left connection a parity-odd eigenobject. The theorem derives no physical
  matter field, charged current, charge-event equality, anomaly cancellation,
  Yang-Mills induction, weak boson, mass, coupling match, detector, or
  substrate realization.
