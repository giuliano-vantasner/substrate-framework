source_unit: W7
checks:
  W7.01:
    source_name: CHECK1_local_covariance
    classification: rejected_full_covariance_qualified_homogeneous_rotation
    maps_to: [C-NAG-001]
    reason: >-
      The checked homogeneous i[alpha,W] rotation is exact, but the displayed
      finite plus-sign law contradicts D=partial-i*g*W. Product-rule covariance
      requires W'=U*W*U_dagger-(i/g)*(partial U)*U_dagger, and CHECK1 imports
      rather than evaluates the derivative shift.
  W7.02:
    source_name: CHECK2_algebraic_commutator
    classification: qualified_noncommutative_curvature_identity
    maps_to: [C-NAG-001]
    reason: The exact Pauli-half commutator produces the non-Abelian curvature term for a declared connection.
  W7.03:
    source_name: CHECK3_full_field_strength
    classification: qualified_conditional_curvature_commutator
    maps_to: [C-NAG-001]
    reason: The unprojected differential calculation correctly gives F=dW-dW-i*g*[W,W] and [D,D]=-i*g*F.
  W7.04:
    source_name: CHECK4_abelian_limit
    classification: qualified_commuting_connection_limit
    maps_to: [C-NAG-001, C-MAX-001]
    reason: Vanishing connection commutators reduce the declared curvature to independent curl components; this is an algebraic limit, not a derived group or physical-sector reduction.
  W7.05:
    source_name: CHECK5_charged_basis_regrouping
    classification: qualified_basis_identity_rejected_physical_bosons
    maps_to: [C-NAG-001, C-REP-002]
    reason: The W1/W2 and ladder regrouping is exact representation algebra, but no physical W field, state, or boson is constructed.
  W7.06:
    source_name: CHECK6_charged_current_vertex
    classification: qualified_ladder_matrix_elements_rejected_current_and_charge_event
    maps_to: [C-REP-002]
    reason: >-
      Fundamental ladder matrix elements are exact. No matter bilinear or
      interaction action is evaluated, and W7's assigned charge labels change
      from minus one to plus one by two while Delta T3 is one; the unit event
      charge is inserted separately.
  W7.07:
    source_name: CHECK7_left_only_gauging
    classification: rejected_same_carrier_gauging_qualified_corrected_tensor_factor
    maps_to: [C-NAG-001, C-REP-002]
    reason: >-
      Same-carrier T_a*P_L is non-Hermitian for two generators and fails every
      cyclic SU2 commutator. On the independent carrier T_a tensor P the exact
      connection closes and annihilates the complementary block, but this
      supplies no physical V-A current or Lorentz chirality.
  W7.08:
    source_name: CHECK8_yang_mills_kinetic_term
    classification: qualified_one_component_polynomial_rejected_action_and_dynamics
    maps_to: [C-NAG-001]
    reason: >-
      Expanding one selected component square displays quadratic cubic and
      quartic powers. W7 does not perform the full adjoint and Lorentz sum,
      declare a metric and normalization, vary an action, derive an equation,
      or gain authority from pending YM1.
  W7.09:
    source_name: CHECK9_coupling_impedance_relation
    classification: rejected_declared_coupling_match
    maps_to: [C-SCT-001]
    reason: >-
      g^2=k*Z is assigned before differentiation. No units action normalization
      or matching theorem fixes k or g, and C-SCT-001 expressly does not derive
      W5's lambda^2/mu piston relation.
  W7.10:
    source_name: CHECK10_drop_nonabelian_term_guard
    classification: qualified_load_bearing_mutation
    maps_to: [C-NAG-001]
    reason: A curl-only mutation fails the commutator identity for noncommuting constant connections.
  W7.11:
    source_name: CHECK11_vector_parity_guard
    classification: qualified_vector_even_rejected_left_odd_and_physical_parity
    maps_to: [C-REP-002, C-NAG-001]
    reason: The vector sum is parity-even, but parity exchanges a left action with a distinct right action; left alone is not odd, and no physical charge selection or parity-violating interaction follows.
all_eleven_adjudicated: true
