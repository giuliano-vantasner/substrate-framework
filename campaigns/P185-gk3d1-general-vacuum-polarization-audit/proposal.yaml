  - C-GAU-001
  - C-DIM-009
  - C-MAX-001
  - C-VAC-001
  - C-NVP-001
  - C-NVP-002
  - exact finite Clifford traces and gamma-matrix identities after the integer-dimensional representation convention is declared
  - a separately declared free charged-Dirac Euclidean or Minkowski action, functional determinant, loop order, regulator, and quadratic-effective-action convention as conditional model inputs rather than accepted physical matter
  - Feynman parameterization, dimensional Gaussian integrals, Gamma-function identities, Laurent series, and standard complex analysis with domains and branches explicit
  - SymPy exact algebra and arbitrary-precision numerical quadrature used only as independent checks after exact formulas freeze
  - pinned source inventory and exact Git metadata at substrate@6d1f4e0
  - GK3D1 and its hash-pinned dependency and reverse-consumer nodes as noncanonical evidence only after this freeze
