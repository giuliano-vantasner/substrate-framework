question: >-
  Does hash-pinned GK3D1 derive one convention-complete charged-Dirac one-loop
  vacuum-polarization master whose finite D=2 limit and regulated D=4 Laurent,
  subtraction, logarithmic-slope, tensor, trace, analytic-continuation, and
  group-factor specializations are exact, or does it mix an imposed transverse
  ansatz, discontinuous Clifford dimension, scalar and fermion conventions,
  unrenormalized poles, scheme-dependent constants, or source ontology into an
  induced physical four-dimensional gauge conclusion?
invariants:
  - C-DIM-009 fixes gauge-field and projector-coefficient mass dimensions but explicitly derives no loop determinant, numerator, regulator, subtraction, counterterm, logarithm, or preferred dimension.
  - C-VAC-001 is a massive complex-scalar Euclidean D=2 bubble-plus-seagull theorem; its scalar numerator, determinant sign, seagull, massless infrared behavior, and local coefficient cannot be reused as a charged-Dirac result.
  - C-NVP-001/002 are likewise complex-scalar D=2 representation theorems and grant no general-dimensional fermion loop, four-dimensional coefficient, or physical SU2/SU3 sector.
  - C-MAX-001 imports a Maxwell kinetic coefficient and derives its classical equations; a loop correction remains additive to bare and counterterm coefficients and cannot erase their matching freedom.
  - A transverse tensor written by ansatz is not a Ward-identity derivation; the regulated loop numerator, momentum-shift permission, contact terms if present, and contraction must close independently.
  - Dimensional regularization analytically continues integration dimension, whereas the spinor trace convention near an integer dimension must be declared separately; floor(D/2) is not analytic in D.
  - A D=4 pole and subtraction-scale logarithm require a declared regulator and renormalization scheme; only appropriately defined residues or scale derivatives can be scheme-independent.
  - Minkowski and Euclidean kernels, metric signs, i0 prescriptions, branch thresholds, projector coefficients, and transverse scalar form factors remain separately typed.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral; immutable legacy-name stops are version-only compatibility evidence and never scientific candidate failures.
