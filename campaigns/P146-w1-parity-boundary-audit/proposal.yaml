question: >-
  Reproduce and independently audit W1's claim that a boundary condition with
  a signed spatial-derivative coefficient derives parity violation, and
  determine exactly when the sign is a fixed-coordinate parity transform, an
  outward-normal orientation convention, a spurionic parameter exchange, an
  explicitly parity-breaking single theory, or merely state-dependent
  numerical response.
invariants:
  - >-
    C-SG-001 fixes the normalized real sine-Gordon equation and C-SG-011 proves
    that scalar spatial parity preserves that equation while exchanging
    opposite winding sectors. Neither characteristic derivatives nor sector
    exchange supplies intrinsic parity violation or a weak interaction.
  - >-
    C-SG-013 distinguishes a fixed-coordinate derivative from an outward-normal
    derivative: the first is parity odd, while the second is unchanged when a
    half-line domain and its normal are transformed together. It supplies no
    boundary action, parity-breaking dynamics, or epsilon-to-chirality map.
  - >-
    Qualified NC4 supplies only a tuned finite-time numerical subcase and
    accepted exact surfaces. A common phase reverses one claimed sign and a pi
    shift exchanges epsilon labels, so NC4 cannot be imported as a physical
    chirality or phase-independent parity-selection premise.
  - >-
    For a real scalar phi define the fixed-coordinate residual at x=b by
    B_(epsilon,J)[phi]=phi_t+epsilon*phi_x-J. With scalar parity
    phi_P(t,x)=phi(t,-x) and scalar source pullback, exact chain rule gives
    B_(epsilon,J_P)[phi_P](t,b)=B_(-epsilon,J)[phi](t,-b).
  - >-
    On the right half-line x>=b the outward derivative is -phi_x and on the
    parity-mapped left half-line x<=-b it is +phi_x. A coefficient of the
    outward derivative is therefore not the same object as a fixed-coordinate
    coefficient, and parity need not act internally on one fixed half-line.
  - >-
    The generated queue exposes W1's broad headline, dependencies NC1 and NC4,
    eight static and literal checks, two assertions, symbolic and numeric
    hints, and no dynamic check calls. Source and dossier bodies, literal
    predicates, output, thresholds, and any further comparators remain unopened.
