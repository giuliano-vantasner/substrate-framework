headline_failures:
  - >-
    The beta and minus-beta residuals form a parity-covariant family; covariance
    of two parameter values is not intrinsic parity violation of either fixed
    theory.
  - >-
    A mixed residual a*u+beta*v-J contains an even temporal-source component
    and an odd spatial component, so beta nonzero does not make the whole
    residual parity odd.
  - >-
    Mapping a right half-line to its left-half-line parity image transforms the
    outward normal together with the field, leaving the normal coefficient
    unchanged.
  - >-
    One scalar residual constrains one combination of two traces. It cannot
    force the source's vector or chiral witnesses without an additional law.
  - >-
    Boundary sign correlation is not topological charge transfer. The latter
    requires boundary field change and vacuum-endpoint data.
  - >-
    Full sine-Gordon characteristic channels remain sourced by the nonlinear
    equation; W1.1 is only a linear massless identity.
headline_verdict: >-
