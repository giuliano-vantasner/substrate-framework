  id: C-BND-001
  dependencies: [C-SG-013]
  statement: >-
    Let phi be a sufficiently smooth real scalar, let u=phi_t(t,b) and
    v=phi_x(t,b), and let a, beta, and the scalar source J be exact real
    declared boundary data. Define R_(a,beta,J)=a*u+beta*v-J. Under scalar
    spatial parity phi_P(t,x)=phi(t,-x) and source pullback
    J_P(t,x)=J(t,-x), exact chain rule gives
    R_(a,beta,J_P)[phi_P](t,b)=R_(a,-beta,J)[phi](t,-b). Thus beta and -beta
    form a parity-covariant parameter family. At a parity center, a fixed
    residual is internally invariant for arbitrary traces iff beta=0. The
    mixed residual is not a parity-odd eigenobject: its a*u-J part is even and
    beta*v part is odd; it is purely odd only when the even part is absent.
    Under the simultaneous parity map from a right half-line to a left
    half-line, the outward-normal derivative and its coefficient are unchanged.
    Finally one residual equation does not determine both u and v; for
    beta=0 it leaves v arbitrary, and for beta nonzero it admits the family
    v=(J-a*u)/beta. It therefore derives neither boundary sign correlation nor
    topological charge transfer or selection without additional dynamics and
    vacuum-boundary data.
novelty: >-
  C-SG-011 supplies field and topological-current parity, while C-SG-013
