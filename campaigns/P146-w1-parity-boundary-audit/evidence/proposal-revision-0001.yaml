  Neither exposes the general boundary residual, its even/odd decomposition,
  the distinction between internal invariance and parameter-family covariance,
  or the trace underdetermination needed by W1 and nine reverse consumers.
oracle: exact SymPy chain rule linear algebra and independent trace-space elimination
