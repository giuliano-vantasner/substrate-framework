claim_outline:
  - For real three-dimensional central radial modes, chi=r*g exactly removes the first derivative and preserves the radial L2 norm.
  - Regular g=O(r^ell) maps to chi=O(r^(ell+1)) for nonnegative integer ell.
  - For constant vacuum potential mu_squared on a regular Dirichlet ball, g is spherical Bessel j_ell and E=mu_squared+(z_ell_n/R)^2 for a positive zero z_ell_n.
  - The vacuum finite-wall gap therefore scales exactly as R^-2 and its normalized radial shape scales with r/R; neither behavior is half-line localization.
  - If W_ell=ell*(ell+1)/r^2+V-mu_squared is nonnegative almost everywhere and the boundary form vanishes, the quadratic form gives E>=mu_squared; this implication is exact but a sampled W grid is not proof of its premise.
  - An endpoint-decay predicate evaluated after the endpoint or outer tail is overwritten by zero is non-discriminating whenever the interior amplitude clears its floor.
  - For BX1 the theorem types only the supplied time-averaged finite-wall operator and cannot infer a Floquet, nonlinear, gravitational, or substrate mode.
