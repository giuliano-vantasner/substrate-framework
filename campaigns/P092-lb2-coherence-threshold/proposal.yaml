id: P092
base_release: v0.78.0
base_commit: 90170bf
scientific_base_commit: 6c444a6
source_baseline: substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64
source_units: [LB2]
question: >-
  Determine which parts of LB2 are exact properties of a declared damped
  harmonic oscillator, which follow from the normalized damped sine-Gordon
  linearization, and which overreach into nonlinear breather existence,
  coherence survival, spark/DBD selection, or physical medium thresholds;
  terminally adjudicate every subclaim and promote only distinct closed content.
invariants:
  - C-SG-001 fixes the normalized nonlinear sine-Gordon equation and exact undamped breather family.
  - C-SG-011 fixes the small-amplitude normalized sine-Gordon limit as massive Klein-Gordon with mass gap one.
  - C-SG-012 gives the exact damped energy balance when its residual is specialized to -Gamma*phi_t.
  - C-SG-016 supplies the exact family form factor and a qualified slow-damping action law, not a global exact exponential, material Gamma map, or nonlinear existence threshold.
  - A spatial Fourier mode of the normalized damped linearization has natural frequency sqrt(1+k^2); a sub-gap breather frequency is not a real linear Fourier-mode frequency.
  - Uniform positive damping with vanishing boundary flux excludes a nontrivial exactly time-periodic finite-energy solution by the period-integrated energy balance.
  - Underdamped transient oscillation, exact periodic breather, energy decay, amplitude envelope, phase coherence, survival probability, and population are distinct predicates.
  - Pending MC3 and LB3/LB4 and qualified-without-claim SA2 cannot supply accepted premises.
allowed_imports:
  - exact real and complex quadratic-root, ODE, Fourier-mode, energy, dimensional, inequality, and limit algebra with explicit domains
  - C-SG-001 as the normalized undamped nonlinear equation and breather family only
  - C-SG-011 as the massive small-amplitude linearization and gap-one convention
  - C-SG-012 as the exact stress-energy and boundary-flux identity
  - C-SG-016 as the qualified slow-damping family law and lifetime-semantics ceiling
  - LB2 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence after contract validation
candidates:
  - id: A
    description: Reproduce LB2 literally and test whether its seventeen predicates distinguish an abstract SHO, the linearized field, nonlinear breathers, and survival consumers.
  - id: B
    description: Derive the exact characteristic-root classification and solution forms of a positive-frequency linearly damped harmonic oscillator.
  - id: C
    description: Derive exact amplitude-envelope, mechanical-energy balance, damped-period, and observable-specific cycle-count conventions for the oscillator.
  - id: D
    description: Derive the normalized damped sine-Gordon linear Fourier-mode dispersion and its mode-dependent critical boundary.
  - id: E
    description: Prove the period-integrated no-nontrivial-exact-periodic theorem for positive uniform damping and vanishing boundary flux.
  - id: F
    description: Construct exact countermodels separating sub-gap breather frequency from linear-mode natural frequency and nominal from actual damped cycles.
  - id: G
    description: Test whether any finite-time nonlinear transient threshold or survival classifier is distinct, well-defined, and numerically warranted.
  - id: H
    description: Require accepted normalized-to-physical Gamma and omega maps before material, spark, DBD, or density interpretations.
  - id: I
    description: Mutate damping sign, natural frequency, mass gap, spatial wavenumber, discriminant factor, period, lifetime observable, and cycle convention.
  - id: J
    description: Trace LB3/LB4 and engineering consumers and compare surviving algebra with accepted claims and reusable APIs.
uniqueness_evidence: null
selection_criteria:
  - accepted dependency and normalized-unit closure
  - exact equation, roots, branches, signs, energy identity, mode frequency, and observable semantics
  - separation of exact periodic existence from transient oscillation and survival interpretation
  - correct zero-damping, critical, overdamped, gap, long-wavelength, and weak-damping limits
  - mutation sensitivity, independent rederivation, parameter economy, and nonduplication
  - controlled numerical evidence only for genuinely nonlinear finite-time statements
claims_proposed:
  - C-DYN-001
comparators_blinded_until: >-
  LB2's complete body was necessarily exposed during P091's preregistered
  consumer audit, so fresh source blinding is impossible and is not claimed.
  P092 freezes its contracts and structural criteria before executing LB2,
  reading its output, inspecting additional downstream consumer bodies, or
  using any physical or numerical comparator values.
status: accepted
