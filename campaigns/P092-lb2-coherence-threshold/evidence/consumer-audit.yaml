campaign: P092
source_baseline: substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64
consumers:
  LB3:
    sha256: 1b54ef5704fce1502464f44bd675c01824cfa48b6b98688b1df8f000d1030a2b
    status: pending_adjudication
    finding: >-
      LB3 applies LB2's Gamma>=2*omega_b label to a nonlinear damped-field
      simulation. Its guard uses omega_b=0.7 and Gamma=1.75, but the normalized
      k=0 linear field mode has natural frequency one and remains underdamped
      because 1.75<2. The observed loss of core sign changes and energy is a
      finite-time nonlinear relaxation result under its chosen classifier, not
      validation of the LB2 field threshold or a universal survival-null law.
    integration_note: >-
      The immutable source chooses np.trapezoid when available and falls back
      to np.trapz on older NumPy. P092 does not execute or copy that pending
      numerical implementation; canonical P092 work needs no quadrature.
  LB4:
    sha256: e33361e6985002e76342203716fd00ca72c22f905590825a6c064fe472b0d103
    status: pending_adjudication
    finding: >-
      LB4 imports LB2's nonlinear-existence reading and adds a phase-diffusion
      model whose phase stiffness, order-one normalization, operating ranges,
      physical maps, and survival semantics are not accepted. Its comparator
      check that a declared band brackets 0.125 cannot validate LB2.
  lifetime_kernel:
    sha256: 51bd4f46593363ac37d99b4e95ca0bef1b572a3b075505968adf77404db4cac5
    status: noncanonical_engineering_consumer
    finding: >-
      The kernel copies a discontinuous hard cutoff delta>=2 -> g_window=0,
      defaults omega_b, and calls the result a coherent-survival fraction. It
      inherits LB2's unproved reduced-coordinate and population maps.
  dbd_pipeline:
    sha256: 5354b39d3bc25439a7f6e83c175474358b3104b2f844cc6aa3a2ee2a84439669
    status: noncanonical_engineering_consumer
    finding: >-
      The pipeline propagates the lifetime-kernel cutoff into surviving
      population and power. Sequential wiring and zero propagation do not
      derive the upstream physical survival predicate.
  barrier_scaling:
    status: semantic_name_collision
    finding: >-
      Its N_coh=sqrt(E_star/theta1) is a separate coherent-barrier population
      threshold, not LB2's oscillator cycles. Shared notation creates no
      dependency or validation.
