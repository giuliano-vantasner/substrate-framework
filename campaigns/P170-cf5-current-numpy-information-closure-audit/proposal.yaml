  - A geometric match requires a separately defined profile observable and discriminating criterion, neither numerical proximity nor a broad order-one window.
  - C-VTX-001 and C-VTX-002 remain a conditional smooth-vortex theorem and resolution-bounded branch, while C-FLX-001 remains an ideal uniform fixed-area theorem.
