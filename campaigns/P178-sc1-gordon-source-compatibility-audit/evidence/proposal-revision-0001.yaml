provisional_statement: >-
  For the accepted mostly-plus transverse Gordon metric with positive n(x),
  uniform abs(v)<1 z flow, a real canonical scalar U(t,x) with real potential
  value V, and positive kappa, G_ab=kappa*T_ab componentwise if and only if
  U_t=U_x=V=K=0, where K=(n*n_xx-2*n_x^2)/n^2. For v nonzero, an exact
  three-by-three ray-condition minor is 8*n^2*v^2*(v^2-1)^5. The v=0 branch
  closes from the tt and xx equations plus real-square nonnegativity. K=0 is
  equivalent to (1/n)_xx=0, so 1/n is affine on a connected interval. For the
  separately declared potential 1-cos(U), the locus is the on-shell scalar
  vacuum. No breather embedding, material action, selected coupling, physical
  gravity, observation, or substrate realization follows.
