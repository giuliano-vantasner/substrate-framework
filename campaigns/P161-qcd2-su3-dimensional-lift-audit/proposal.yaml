question: >-
  Which exact color-metric and fixed-input Riesz statements in QCD2 survive,
  and does any distinct operator theorem connect the accepted two-dimensional
  SU3 scalar loop to a four-dimensional gauge action?
invariants:
  - C-LIE-001 fixes the standard fundamental SU3 trace metric and structure constants without a physical color identification.
  - C-NVP-002 fixes only a declared massive complex-scalar finite-representation loop in flat Euclidean two-space and denies dimensional lift or a unique total coupling.
  - C-KRN-001 fixes a scalar Riesz inverse only after dimension exponent Fourier convention and nonzero coefficient are supplied.
  - C-KRN-002 fixes the source-probe force dictionary and proves that power behavior alone does not identify both dimension and operator order.
  - P159 establishes that inversion of a trace-weighted quadratic kernel uses the reciprocal color metric rather than the direct trace factor.
