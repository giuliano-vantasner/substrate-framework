load_bearing_findings:
  - >-
    G_color is defined as TrTT times an already inverted scalar Green kernel.
    If TrTT multiplies the quadratic inverse kernel, fixed-source inversion
    instead produces the inverse trace metric; no source convention is given
    that could justify the displayed multiplication as the propagator.
  - >-
    The so-called abelian limit sets an unused eps_self symbol to zero and
    manually changes the trace factor from one half to one. It is a convention
    replacement, not a limit of the displayed fundamental SU3 carrier.
  - >-
    The force checks differentiate a Green kernel without declaring source and
    probe strengths, their representation, a potential-energy dictionary, or
    the sign convention required for a physical force.
  - >-
    The FFT check is one-dimensional with s=one-half and tests a localized
    packet approximately; it does not test the claimed three-spatial-dimensional
    s=one gauge sector.
  - >-
    The body declares d=3 and s=1 at the comparator endpoint. It contains no
    map from the accepted flat Euclidean 2D scalar-loop theorem to that domain.
narrative_conflict: >-
  The source repeatedly says the QCD1 ceiling is closed, while its own module
  docstring also states that the 3+1D kinetic-term ceiling is not closed and
  QCD2 supplies only a static force-law shape. The executable resolves only
  the latter narrow fixed-input shape arithmetic.
