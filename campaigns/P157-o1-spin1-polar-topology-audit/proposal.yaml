question: >-
  Reproduce and independently audit O1's claimed spin-one polar-state,
  projective-director, and Berry-holonomy construction, determine whether any
  exact content remains beyond accepted C-SPN-001, C-DEF-001, C-BER-001, and
  C-HOL-001, and preserve the distinction among the polar ray orbit RP2, the
  full phase-retaining polar manifold (S2 x U1)/Z2, and a physical spinor-BEC
  model with its missing action, material parameters, ground-state, defect,
  and observable premises.
invariants:
  - >-
    C-SPN-001 already fixes the standard pure spin-one carrier, exact invariant,
    polar zero-spin equality set, projective polar ray orbit RP2, and
    conditional positive-c2 selection. It derives no material c2, atomic
    realization, spatial ground state, or full physical order parameter.
  - >-
    C-DEF-001 already distinguishes pi1(RP2)=Z2 from the full polar manifold
    (S2 x U1)/Z2 with deck group Z. The square of its half generator is a
    nontrivial integer phase vortex, not the identity.
  - >-
    C-BER-001 fixes A=i*psi_dagger*d psi and requires the endpoint transition
    tau in H=tau*exp(i*integral A). A local half connection or a bare minus-one
    phase is not an invariant without the normalized section, base loop, and
    endpoint law.
  - >-
    C-HOL-001 requires representation-typed center data. A 2*pi SU2 center
    acts as +I3 in the spin-one adjoint carrier even though it acts as -I2 in
    the fundamental; any minus one from a projective spin-one lift must be
    derived from its endpoint or phase quotient rather than a spinorial
    2*pi sign.
  - >-
    Under C-SPN-001's unitary Cartesian convention, an exact real unit director
    d maps to a normalized polar spinor zeta(d), and zeta(-d)=-zeta(d). The
    ray quotient therefore identifies antipodes, while retaining a physical
    U1 condensate phase instead gives the separate diagonal identification
    (d,theta)~(-d,theta+pi).
  - >-
    The SO3 stabilizer of a polar ray must be derived rather than named. Its
    connected rotations about the director and disconnected pi rotations that
    reverse the representative distinguish the ray orbit SO3/O2 from an
    incorrectly free SO3 action.
  - >-
    For a nontrivial projective loop, a real lift may have local A=0 and
    endpoint tau=-1, while a periodic phase gauge may move that sign into the
    integral. Both must give the same transition-corrected holonomy. A
    fixed-ray phase control must not be mistaken for the same base loop.
  - >-
    The queue preexposes seven literal checks, one assertion, a symbolic
    oracle, dependencies B1, ME1, NA1, and S2, and excerpts asserting a rotated
    reference polar state, zero spin, antipodal director phase, local one-half
    Berry connection, pi integral, and minus-one value. Those values and labels
    are excluded from concept selection. The source and dossier bodies, exact
    AST data flow, guards, constants, and narrative consumers remain unopened
    until this contract is frozen and committed.
