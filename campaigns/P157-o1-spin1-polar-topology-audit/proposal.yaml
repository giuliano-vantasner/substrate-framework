  - C-HOL-001 only for representation-typed center and transport boundaries
  - C-REP-002 only for finite-carrier representation discipline without a physical weak or matter identification
  - exact finite-dimensional linear algebra SO3 spin-one representation orbit-stabilizer theory covering spaces and Berry one-form calculus
  - O1 and O1-dossier at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence after freeze
