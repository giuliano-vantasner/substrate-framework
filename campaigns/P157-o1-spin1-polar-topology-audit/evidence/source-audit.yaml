  - >-
    A genuine projective director loop may have corrected holonomy -1, but its
    real lift changes director and has local connection zero; O1 does not build it.
  - >-
    The spin-one representation returns +I3 after 2pi. O1's 2pi minus sign
    comes from its separately inserted half U1 phase, not the representation.
