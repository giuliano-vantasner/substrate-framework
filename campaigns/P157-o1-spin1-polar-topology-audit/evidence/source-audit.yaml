    C-SPN-001 supplies the complete polar projective ray orbit RP2 and
    conditional fixed-density selection; O1 checks only representatives.
  - >-
    C-DEF-001 distinguishes the projective ray orbit from the physical
    phase-retaining polar manifold (S2 x U1)/Z2 and their Z2 versus Z loop groups.
  - >-
    C-BER-001 includes the endpoint transition. O1's constant-projector section
