question: >-
  Derive the conditional rational-map sphere Jacobian, degree identity,
  angular-functional bound, and exact axial-family integral; implement
  chart-stable independently refined numerical evaluation for a declared
  rational map; and adjudicate whether E1 evaluates supplied degree-one,
  degree-two, and degree-four maps, proves those maps globally minimal,
  validates a general multi-Skyrmion energy, or closes any nuclear-yield claim.
invariants:
  - C-MOD-001 owns only a declared B=1 radial reduced energy and supplies no general rational-map angular theorem, multi-map ansatz, or physical Skyrme action.
  - C-MOD-002 is resolution-bounded evidence for one B=1 radial branch and explicitly imports no pending E1, E2, E4, or S2 result.
  - C-SK-001 is only a conditional cancellation between two supplied mass formulas and supplies no angular functional, multi-Skyrmion solution, or state map.
  - C-TOP-002 is a distinct SU(3) winding-current theorem and explicitly supplies no physical baryon identification; it cannot promote a CP1 map degree into a nuclear state.
  - C-DIM-002 leaves dimensionless coefficients and physical model selection unconstrained.
  - Evaluating one declared degree-B rational map is distinct from proving that it minimizes the angular functional over all degree-B maps.
  - Exact degree, area, bound, symmetry, and axial-family statements remain separate from resolution-bounded quadrature values.
  - Sphere measure, stereographic chart, complex-derivative convention, target metric, orientation, pole handling, and normalization are load-bearing inputs.
allowed_imports:
  - C-MOD-001 only as the conditional B=1 radial-energy compatibility surface, not as a general multi-Skyrmion theorem
  - C-MOD-002 only as a numerical-evidence and pending-dependency ceiling
  - C-SK-001, C-TOP-002, and C-DIM-002 only for their explicit interpretation and coefficient ceilings
  - standard Riemann-sphere stereographic geometry, holomorphic rational maps, algebraic degree, the pullback area formula, Cauchy-Schwarz, beta and gamma identities, and Riemann-Hurwitz as declared mathematical imports
  - SymPy exact algebra, differentiation, beta/gamma simplification, limits, and polynomial coprimality checks
  - NumPy Gauss-Legendre tensor cubature and SciPy or mpmath adaptive integration with explicit charts, precision, tolerances, refinements, and relative-error gates
  - E1 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence after contract validation and freeze
  - hash-pinned predecessor and downstream consumers only after freeze and only as noncanonical impact evidence
candidates:
  - id: A
    description: Reproduce E1 unchanged and classify every literal predicate, integration convention, map, comparator, and terminal tally.
  - id: B
    description: Derive the exact conformal Jacobian, pullback-area degree identity, nonnegativity, and Cauchy lower bound for any declared coprime rational map.
  - id: C
    description: Derive a closed beta/gamma formula for the full axial family R(z)=z^B, including identity and degree-two specializations and large- or unit-degree limits.
  - id: D
    description: Implement a pure chart-stable tensor Gauss-Legendre sphere evaluator with explicit degree and angular-functional outputs and refinement evidence.
  - id: E
    description: Independently evaluate the same supplied maps by adaptive high-precision or separately parameterized cubature without importing the canonical evaluator.
  - id: F
    description: Audit the declared degree-four cubic-symmetry map for coprimality, degree, pole regularity, target/domain rotation invariance, and a resolution-bounded angular value.
  - id: G
    description: Compare evaluation of a supplied map with an actual variational search over a declared degree-fixed family and reject unproved global minimality.
  - id: H
    description: Trace radial-energy, multi-Skyrmion, BPS, yield, and state consumers and preserve every missing ansatz, profile, action, scale, reaction, and observation premise.
uniqueness_evidence: null
selection_criteria:
  - accepted dependency closure and nonduplication against C-MOD-001, C-MOD-002, C-SK-001, C-TOP-002, and C-DIM-002
  - exact sphere normalization, degree identity, positivity, lower bound, axial closed form, limits, and mutation sensitivity
  - chart-stable independent numerical methods with explicit precision, nodes, tolerances, convergence, regularity, and relative-error gates
  - honest separation of supplied-map evaluation, family-local comparison, and global degree-B minimization
  - assumption and parameter economy with physical Skyrme, baryon, nuclear-state, reaction, yield, and material premises retained explicitly unless derived
  - canonical API reuse, consumer classification, and no concept selection by the exposed E1 decimals or source tally
