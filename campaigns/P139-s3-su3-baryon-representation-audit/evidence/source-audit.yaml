supportable_surfaces:
  - >-
    The Weyl dimension and quadratic Casimir formulas are exact for
    nonnegative SU(3) Dynkin labels in C-LIE-001's normalization and are now
    independently generalized by C-IRR-001.
  - >-
    A supplied exact hypercharge can be used as a mathematical weight filter.
    The octet is the unique minimum-dimension Y=1 match, while the next
    distinct dimension has both decuplet and antidecuplet matches.
  - >-
    At Y=1 the exact SU(2)xU(1) branching rows have I=1/2 for the octet,
    I=3/2 for the decuplet, and I=1/2 for the antidecuplet. These are
    mathematical right-row labels until a collective Hilbert space is supplied.
  - >-
    The abstract integer-level sphere-filling theorem and mathematical winding
    surfaces are already governed by C-WZW-002 and C-TOP-002 under ceilings
    that exclude k=N_c, physical baryon number, and representation selection.
rejected_or_qualified_surfaces:
  - >-
    Y_PHYSICAL is a seven-entry hard-coded table rather than a complete irrep
    enumeration. It hides the dimension-ten conjugate tie by prose.
  - >-
    In the source's fundamental convention, the sextet hypercharges are
    {2/3,-1/3,-4/3}, not {4/3,1/3,-2/3}. The dossier alternates incompatible
    p/q, highest-weight, physical-hypercharge, and right-hypercharge conventions.
  - >-
    The WZW integrality predicate samples four integers and one half-integer;
    it does not prove the quantified theorem and imports the identification k=N_c.
  - >-
    Y_R=N_c*B/3 is evaluated after insertion. No collective configuration
    space, right action, velocity-linear term, canonical momentum, generator
    sign, Hilbert measure, or physical mapping is constructed in executable code.
  - >-
    Under the dossier's own displayed rotor Hamiltonian, the decuplet-octet
    gap is 3/(2I1), not 3/(2I2). The latter is the same-spin
    antidecuplet-octet gap in that conditional model.
  - >-
    The universal range |p-q|/2 through (p+q)/2 is not the SU(3) to SU(2)xU(1)
    branching rule. The fundamental itself has I=1/2 and I=0 rows.
  - >-
    The two-color guard's complete low matches begin with the antitriplet and
    also include the sextet. Source and dossier variously claim triplet,
    antitriplet, or sextet selection.
  - >-
    The ceiling predicate assigns period one and exact-period zero as literals.
    It derives no cohomology, physical WZW action, anomaly inflow, or baryon map.
