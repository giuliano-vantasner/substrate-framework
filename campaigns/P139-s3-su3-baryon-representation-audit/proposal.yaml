question: >-
  Reproduce and independently audit S3's claim that SU(3) Weyl dimensions,
  quadratic Casimirs, hypercharge weights, and a WZW-derived right-hypercharge
  constraint select physical octet and decuplet baryon representations, and
  determine exactly which mathematical representation theorem, collective
  action, WZW coefficient, topology, integer inputs, state constraints, scale,
  and physical dictionary are required.
invariants:
  - >-
    C-LIE-001 fixes the explicit fundamental SU(3) generator and trace
    convention, with C_F=4/3 and C_A=3, but supplies no physical gauge or
    baryon representation selection.
  - >-
    C-LIE-002 fixes the exact center and abstract triality character only. A
    physical irrep or state assignment requires separate accepted premises.
  - >-
    C-WZW-001 and C-WZW-002 fix an exact trace-five cohomology class, primitive
    S5 period, and mathematical integer coefficient lattice. They explicitly
    do not identify the level with N_c, baryon number, representation
    selection, anomaly dynamics, or a physical WZW action.
  - >-
    C-TOP-002 fixes the exact SU(3) winding current and hedgehog endpoint charge
    as mathematical topology. It is not by itself a physical baryon current,
    WZW response, N_c relation, or representation theorem.
  - >-
    C-EFT-001 is a conditional stationary-elimination theorem and WZ4 grants
    only that accepted surface. It supplies no HLS fields, vector mesons, WZW
    coefficient, N_c, or baryon interpretation.
  - >-
    Qualified S2 grants only C-MOD-001, C-MOD-002, C-SCL-001, C-SG-002, and
    C-SK-001, with no collective quantization or particle dictionary.
    Qualified S5 grants only C-VIR-001, C-MED-001, and C-SK-001. Pending S4
    grants no premise.
  - >-
    SU(3) Dynkin labels p and q are nonnegative integers. Dimension, Casimir,
    center triality, weights, multiplicities, isospin, and hypercharge must use
    one declared normalization and be derived over the complete irrep rather
    than a favored finite table.
  - >-
    A weight Y=Y_R inside an irrep is a kinematic filter only. Selecting a
    physical baryon state additionally needs a declared collective Hilbert
    space, left and right generator actions, spin/isospin constraints,
    statistics, Hamiltonian, symmetry breaking, and observable dictionary.
  - >-
    The generated queue has already exposed the claimed dimension and Casimir
    formulas, Y_R=N_c*B/3, and octet/decuplet headline. S3's body, exact check
    literals, finite representation table, numerical or named comparators, and
    dossier body remain unopened at freeze.
