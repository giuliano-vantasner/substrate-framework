headline_verdict: >-
  SA1 contains the distinct exact C-SG-015 temporal-Fourier theorem. It does
  not derive a susceptibility, causal transfer function, deposition-to-
  population law, derivative voltage coupling, breakdown gate, or C035
  consumer. Its full fundamental coefficient and finite-width DC statements
  are misstated, and its normalized overlap erases the claimed spectrum
  magnitude while retaining a free kernel scale.
