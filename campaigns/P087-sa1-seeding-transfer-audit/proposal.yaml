id: P087
base_release: v0.75.0
base_commit: 3000804
scientific_base_commit: 5fa7def
source_baseline: substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64
source_units: [SA1]
question: >-
  Determine whether SA1 derives a dependency-closed physical seeding transfer
  function from a deposition spectrum to a breather population and the
  engine's slew trigger, or only exact breather temporal-parity/Fourier facts
  plus a separately declared spectral-overlap coordinate; terminally
  adjudicate every SA1 subclaim and promote distinct exact content only.
invariants:
  - C-SG-001 supplies the exact normalized rest breather and period but no external drive, linear-response kernel, deposition process, or population-production law.
  - C-SG-002 supplies the normalized conserved breather energy 16*sqrt(1-omega^2); dividing by it does not by itself turn an arbitrary overlap into an integer object count.
  - Odd time parity and half-wave antisymmetry constrain Fourier coefficients but do not identify the field itself with a susceptibility or causal response function.
  - A zero DC Fourier coefficient is weaker than a derivative coupling; multiplication by i*frequency requires an independently derived drive interaction and convention.
  - A physical susceptibility requires declared input and output observables, a perturbing interaction, response normalization, causality, and a domain; a field profile alone supplies none of these.
  - A spectral-overlap population requires compatible units, a nonnegative absorbed-energy measure, coupling and efficiency, normalization, and a counting convention.
  - Scaling a supplied deposition spectrum can realize arbitrary positive overlap values unless its normalization is independently fixed.
allowed_imports:
  - exact real trigonometric, parity, periodicity, Fourier-coefficient, integral, and dimensional algebra
  - C-SG-001 only as the accepted normalized breather field and open frequency domain
  - C-SG-002 only as the accepted normalized conserved breather energy and physical-interpretation ceiling
  - C-DIM-002 and C-DIM-003 only as coefficient and imported-coordinate ceilings
  - C-SG-009 and C-SG-010 only as examples that exact harmonic structure belongs to a declared observable and does not establish a physical emission or response spectrum
  - SA1 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence after both contracts and the immutable freeze record validate
candidates:
  - id: A
    description: Reproduce SA1 literally and test whether its susceptibility, deposition spectrum, population normalization, slew law, breakdown gate, and consumer have accepted dependency closure.
  - id: B
    description: Derive the breather core's exact odd time parity, half-period antisymmetry, zero cosine/DC coefficients, odd-only sine support, and period from C-SG-001.
  - id: C
    description: Prove the fundamental sine coefficient is nonzero and classify higher coefficients without identifying the Fourier series as a response kernel.
  - id: D
    description: Require a driven equation, perturbing operator, input/output observables, retarded boundary condition, and normalization before constructing a physical linear susceptibility.
  - id: E
    description: Compare zero-DC filtering with a genuine time-derivative coupling and exhibit other zero-DC kernels that do not imply dV/dt or voltage independence.
  - id: F
    description: Treat the spectral overlap as conditional bookkeeping, audit dimensions and signs, and construct arbitrary-target families under deposition-spectrum or coupling rescaling.
  - id: G
    description: Audit every source predicate for sensitivity to parity, harmonic index, spectrum normalization, coupling, energy denominator, DC mutation, and consumer absence.
  - id: H
    description: Compare any surviving temporal-Fourier theorem and API against C-SG-001, C-SG-009, C-SG-010, and existing canonical Fourier utilities; add nothing without distinct content and a governed consumer.
uniqueness_evidence: null
selection_criteria:
  - accepted dependency closure for drive, interaction, input/output observables, causality, normalization, absorbed energy, population counting, breakdown, slew law, and consumer
  - exact parity, period, Fourier normalization, support, coefficient signs, units, limits, and mutation sensitivity
  - separation of field spectrum, Green function, susceptibility, filter kernel, deposition density, absorbed energy, and seeded object count
  - parameter economy without silently fixing spectrum amplitude, coupling, efficiency, bandwidth, energy conversion, or count rounding
  - nonduplication against accepted sine-Gordon field, energy, harmonic-observable, dimensional, and coherence claims
claims_proposed:
  - no new claim unless Candidate H demonstrates a distinct reusable exact temporal-Fourier theorem or conditional overlap ledger with complete assumptions and a governed consumer
comparators_blinded_until: >-
  Both contract representations, their hashes, repository validation, and an
  immutable frozen-proposal record are complete. The generated queue synopsis
  has already exposed the candidate odd-time, zero-DC, fundamental, overlap,
  and slew narrative, but until the freeze the SA1 body, coefficient formulas,
  literal spectra, checks, executable output, thresholds, and consumer details
  remain closed.
status: accepted
