  - exact signed-affine consistency, rank, degeneracy, units, reference covariance, and pairwise-crossing equivalence
  - separation of forward prediction, inverse construction, comparator use, and fixed-data unification testing
  - normalization covariance and parameter economy with thresholds explicit
  - mutation sensitivity and nonduplication against accepted linear and running claims
candidates:
