campaign: P083
purpose: >-
  Audit the named running literature and PDG attribution invoked by WM3 without
  treating external physics as an accepted framework derivation.
sources:
  - authors: [Howard Georgi, Helen R. Quinn, Steven Weinberg]
    title: Hierarchy of Interactions in Unified Gauge Theories
    journal: Physical Review Letters
    volume: 33
    pages: 451-454
    year: 1974
    doi: 10.1103/PhysRevLett.33.451
    primary_url: https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.33.451
    finding: >-
      The paper develops renormalization effects in simple unified gauge
      theories and notes that mixing-angle predictions depend materially on
      running. It presupposes the unified theory and embedding; it does not
      derive WM3's substrate mechanism.
  - authors: [Ugo Amaldi, Wim de Boer, Hermann Furstenau]
    title: Comparison of grand unified theories with electroweak and strong coupling constants measured at LEP
    journal: Physics Letters B
    year: 1991
    doi: 10.1016/0370-2693(91)91641-8
    primary_url: https://www.sciencedirect.com/science/article/abs/pii/0370269391916418
    finding: >-
      The primary analysis evolves measured low-energy electroweak and strong
      couplings to test a single unification point and reports exclusion of a
      minimal nonsupersymmetric single point. This supports fixed-data
      pairwise-crossing tests, not WM3's ab-initio label.
  - author: Particle Data Group
    title: Review of Particle Physics 2024 - Electroweak Model and Constraints on New Physics
    primary_url: https://pdg.lbl.gov/2024/reviews/rpp2024-rev-standard-model.pdf
    finding: >-
      The review states that weak mixing angle values depend on the
      renormalization prescription and lists on-shell, MSbar, zero-momentum,
      and effective definitions with different values. WM3's bare 0.23122
      literal has no scheme or uncertainty and is not a self-describing
      comparator.
  - author: Particle Data Group
    title: Review of Particle Physics 2024 - Quantum Chromodynamics
    primary_url: https://pdg.lbl.gov/2024/reviews/rpp2024-rev-qcd.pdf
    finding: >-
      The review quotes a current world average alpha_s(MZ)=0.1180+-0.0009.
      This corroborates only that WM3's rounded 0.118 is observational input;
      it supplies no substrate derivation or exact rational authority.
framework_status:
  simple_unified_embedding: unavailable
  U1_and_SU2_beta_derivation: unavailable
  physical_matching_boundary: unavailable
  threshold_and_decoupling_model: unavailable
  weak_angle_scheme_and_uncertainty: absent_from_WM3
adjudication_implication: >-
  The literature supports treating one-loop running and measured couplings as
  established external context, but it also requires a declared embedding,
  normalization, matching model, and observable scheme. It cannot convert
  WM3's conditional inverse reconstruction into an accepted substrate or
  ab-initio prediction.
authority_note: >-
  These primary sources document external premises and comparator semantics.
  They are not accepted framework claims and do not supersede the registry.
