scope_translation:
  formula_sign: >-
    The primary simple-group formula is converted to the framework convention
    beta=+b*g^3/L+g^3/L^2*B*g^2 by distributing its leading minus signs.
  scalar_translation: >-
    Luo-Wang-Xiao count real scalars; pairing two real scalars into one complex
    scalar doubles the scalar S2 terms and gives the canonical 1/3 one-loop,
    2/3 adjoint two-loop, and 4*C2 cross-factor weights.
  product_translation: >-
    Their semisimple replacement g^5*C2(R)*S2(R) becomes a sum over factor b,
    fixing row a as beta(g_a) and column b as the multiplier of g_b squared.
  excluded: [Yukawa_term, multiple_U1_kinetic_mixing, threshold_matching, field_content, boundary_conditions]
