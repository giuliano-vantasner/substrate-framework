self_adversarial_findings_and_repairs:
  F1_massless_boundary_NaN: >
    VERIFIED INDEPENDENTLY. curvature_scale_factor returned NaN at m^2=0 for
    the smooth (0*K_1(0)) and zeta (0*log 0)) families, violating the
    accepted claims' own continuously-extended-at-m^2=0 convention
    (C-IGR-001..003) and silently corrupting scheme_selection_ledger and
    scheme_spread_ratio at the physically central massless point. Repair:
    explicit one-sided continuous extension J_sharp(0)=J_smooth(0)=1,
    J_zeta(0)=0; regression tests assert the extension and never-NaN.
  F2_uniform_in_mass_threshold_direction: >
    VERIFIED INDEPENDENTLY. The original all-mass threshold for xi<1/6 read
    B > -K (i.e. some negative baselines attractive for all masses); since
    J decreases to 0, a negative baseline always turns repulsive at large
    mass, and the correct uniform condition is B >= 0 with threshold 0.
    Caught by the first test run (test failure), repaired in module and
    docstring, and locked by boundary tests on both sides.
  F3_zeta_control_value: >
    Test-side defect: expected tau^-1 zeta value at z=1 was 1+EulerGamma;
    the exact value is EulerGamma. Fixed with an exact simplify comparison.
  F4_sign_decidability: >
    SymPy cannot decide signs of expint/Bessel constants (returned
    undecidable for e.g. B=0, xi=0). Repair: honest three-tier classifier:
    exact SymPy decision, then derived-structure decision (J>0 proven on
    the usable set, so the shift carries the sign of 1-6*xi), then
    certified numeric separation at 70 digits with a 1e-50 band returning
    None (never guessing zero).
  F5_control_log_divergence: >
    The tau^-1 class diverges logarithmically at m^2=0; the control ledger
    now raises with the declared z_min domain rather than returning an
    unevaluated infinity silently.
  F6_baseline_provenance_gap: >
    Issue #88 demands an explicit additive-baseline provenance surface with
    the B=0 consequence structure and exact downstream ceiling; initially
    only implicit in docstrings. Repair: BaselineProvenance record plus
    baseline_provenance() with the purely-induced G_total formula
    12*pi/(N*(1-6*xi)*J(z)*Lambda^2), the conformal marginal-locus record,
    and the scheme-bracket ceiling text, all oracle-tested.
