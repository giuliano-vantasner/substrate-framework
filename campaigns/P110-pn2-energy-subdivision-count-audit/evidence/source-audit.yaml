surviving_surface:
  - Exact positive commensurate inputs have a unique floor quotient and same-unit remainder in the half-open interval.
  - The exact quotient is nonincreasing in the unit energy, with sharp half-open inverse plateaus and jumps at divisors.
  - Exact decimal-prefix arithmetic reproduces all seven selected counts and the thirty-meV value.
  - A constant count fails the quotient-remainder law on the selected band.
source_weaknesses:
  - The physical-scale path converts named decimal inputs to binary floats before floor and therefore is unsafe at exact thresholds; exact 0.3/0.1 gives three while the binary-float path floors to two.
  - The source proves neither the general strict upper remainder inequality nor general monotonicity symbolically; it samples four ratios, three brackets, and seven band points.
  - The selected seven points have sharp image 2.4e7 to 2.4e10, much narrower than the advertised 1e7 to 1e11 envelope.
  - The rounded 24 MeV and meV-to-eV mode band are external inputs with no uncertainty or accepted material/state provenance.
  - General energy conservation with unequal final energies does not force equal packets; the floor count is the maximum number of declared equal units with a residual, not a transition or state-count theorem.
  - A zero third derivative of a constant and a nonzero third derivative of a cosine do not prove that the modulation carries the entire energy budget; its amplitude remains free.
  - PN1's classical coefficient and FS4's duplicate constant-offset identity supply no quantum operator, state, matrix element, kinematics, resonance, rate, or material mechanism.
  - The primary v2 paper contains no explicit retraction. Its about-1.3-percent number is an imaginary-to-real component ratio, while the direct magnitude changes about 0.00868 percent and the paper retains a potentially large interference-mediated rate effect.
