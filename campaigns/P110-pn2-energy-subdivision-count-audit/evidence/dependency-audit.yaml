    Already derived positive-energy floor/remainder bookkeeping and found no
    distinct claim or API. PN2's exact arithmetic adds no new accepted surface.
missing_for_physical_interpretation:
  - accepted initial and final quantum states and normalized modes
  - a Hamiltonian or interaction operator and dimensional coupling
  - nonzero matrix element, selection rules, occupation factors, and phase space
  - energy-momentum closure including the residual and all final products
  - resonance, detuning, linewidth, coherence, and perturbative domain
  - transition probability, rate, branching, deposition, and material map
  - independently accepted total energy and phonon or plasmon spectrum with uncertainties
closure: >-
  Exact quotient bookkeeping closes through standard mathematics and declared
  inputs, with no accepted-claim dependency and no new claim. PN1, FS4, and the
  primary paper do not close the physical process.
