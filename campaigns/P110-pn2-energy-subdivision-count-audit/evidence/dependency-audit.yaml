    Supplies PN1's exact classical coefficient and expressly excludes a
    selected mode split, quantization, matrix element, kinematic channel, and
    transition rate. It cannot be a physical PN2 precondition.
  C-SG-009_C-MOM-002_C-GW-004: >-
    These accepted claims are FS4's duplicate ceiling. Time-independent
