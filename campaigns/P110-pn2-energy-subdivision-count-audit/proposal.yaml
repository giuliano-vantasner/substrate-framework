question: >-
  Derive and independently verify the exact quotient, remainder, unit,
  interval, boundary, monotonicity, discontinuity, and input-sensitivity
  structure of n=floor(Omega/omega) for declared positive commensurate
  energies; then adjudicate PN2 without converting kinematic bookkeeping into
  a quantum subdivision process, importing physical energy or phonon scales,
  inheriting PN1's rejected process interpretation, or inferring a matrix
  element, rate, resonance, branching, deposition, or material mechanism.
invariants:
  - Positive commensurate energies Omega and omega must be declared before their quotient can define an integer and same-unit remainder.
  - Euclidean division gives n=floor(Omega/omega) and r=Omega-n*omega with 0<=r<omega; it is bookkeeping, not an existence, formation, exclusivity, stability, or transition theorem.
  - For fixed positive Omega the quotient is nonincreasing in omega and discontinuous at exact divisors; the inverse interval for n>=1 is Omega/(n+1)<omega<=Omega/n.
  - Decimal-prefix conversion and large integer construction must be exact; binary floating-point floor near a threshold can change the integer verdict.
  - C-SG-019 supplies only a classical local Taylor coefficient with explicit normalization dependence and no quantum-process premise.
  - FS4 is duplicate evidence for cancellation of time-independent offsets from already accepted derivative observables; it supplies no energy quantum, subdivision, phonon, transition, or rate.
  - Named MeV, eV, meV, or literature values are external inputs or comparators and cannot select the structural theorem or become framework predictions.
  - A kinematically allowed integer partition does not establish a nonzero matrix element, density of states, occupation, overlap, energy-momentum channel, resonance, linewidth, probability, rate, or material realization.
allowed_imports:
  - exact integer and rational arithmetic, order properties, floor, Euclidean division, and standard SI decimal-prefix definitions
  - C-SG-019 only for PN1's accepted classical coefficient formula and its explicit quantum-process ceiling
  - C-SG-009, C-MOM-002, and C-GW-004 only as the accepted duplicate ceiling of FS4's constant-offset derivative cancellation
  - P090 only as governed historical nonduplication evidence that floor/remainder bookkeeping alone earned no distinct claim
  - SymPy and Python exact integers or Fractions for exact quotient, remainder, intervals, limits, and boundary mutations
  - PN2 at substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64 as hash-pinned noncanonical evidence only after freeze
  - primary literature named by PN2 only after freeze and only to audit attribution or retraction context, never as a hidden derivation premise
