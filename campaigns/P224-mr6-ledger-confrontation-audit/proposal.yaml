  - C-BPS-002 and C-BPS-003 preserve attainment slack and controlled-remainder requirements.
  - C-VAR-002 and C-VAR-003 prove only common-domain infimum statements and no physical double-counting diagnosis.
  - C-GSK-001 owns the supplied-coefficient generalized radial model while P223 retains MR5 as duplicate noncanonical regression evidence.
  - Every earlier MK and MR source unit has an individual terminal disposition; MR6 cannot reopen or supersede it by summary.
