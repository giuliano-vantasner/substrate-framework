id: P232
base_release: v0.161.0
source_baseline: substrate-framework@db082ec
question: 'Census every theorem of the 60 ingested historical Lean files against the accepted claim registry
  at v0.161.0: which theorems machine-check statements already accepted (and in exactly what scope), which
  are new standalone exact facts, which compose accepted claims, and which are infrastructure with a recorded
  disposition?'
source_inventory:
- source: governance/claims.yaml @ v0.161.0 (210 accepted statements)
  access: in-hand repository registry
  extracted: all 210 claim statements read for matching
- source: formal/SubstrateFramework/Ingested/*.lean (60 files, 467 theorems)
  access: in-hand ingested corpus
  extracted: module docs, theorem statements, declared-input structure per file
- source: campaigns/P0*/adjudication.yaml for every candidate claim family
  access: in-hand immutable records
  extracted: accepted scope and exclusions used for match adjudication
invariants:
- accepted atoms are not re-reviewed; only the lean evidence scope is reviewed
- each attachment names exactly what the Lean theorem proves including its declared physics premises
- interpretive or narrative physics beyond the machine-checked statement stays out of the core layer
- every non-claim theorem carries a recorded disposition naming why it is not a claim
- no formal/ file is edited and the Lean corpus gate is not rerun for governance-only changes
