candidates:
- id: A
  description: Theorem-by-theorem census with per-claim scope adjudication against the accepted statements;
    corroboration attachments recorded as reviewed verification_evidence transactions, non-claims as recorded
    dispositions.
uniqueness_evidence: 'The census route is fixed by the issue: enumerate every ingested theorem and adjudicate
  against the registry; no mechanism selection is involved.'
selection_criteria:
- exact-scope match between the Lean statement and the accepted claim, named explicitly per attachment
- declared physics premises of the Lean file recorded as input, not as machine-checked content
- no accepted claim re-reviewed or altered beyond appending lean evidence
