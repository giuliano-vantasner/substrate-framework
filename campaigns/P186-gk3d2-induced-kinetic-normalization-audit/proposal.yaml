  - a separately declared free charged-complex-scalar D4 action, determinant, seagull, loop order, regulator, subtraction scheme, and quadratic-effective-action convention as conditional inputs
  - exact Feynman parameterization, dimensionally regulated Gaussian integrals, Gamma-function identities, Laurent series, and affine first-order flow integration
  - pinned source inventory and exact Git metadata at substrate@6d1f4e0
  - GK3D2 and its hash-pinned dependencies and reverse consumers as noncanonical evidence after this freeze
