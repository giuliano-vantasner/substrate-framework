question: >-
  Does hash-pinned GK3D2 derive a convention-complete complex-scalar
  four-dimensional one-loop polarization coefficient and a total induced gauge
  kinetic normalization, or does it reuse a Dirac/scalar coefficient without a
  bubble-seagull derivation, identify an earlier no-matter/no-kinetic
  constraint with a renormalization boundary condition, and thereby erase the
  bare-plus-counterterm integration constant?
invariants:
  - C-GAU-001 leaves every F-squared coefficient unconstrained and derives no gauge dynamics or physical sector.
  - C-MAX-001 starts from a supplied positive kinetic coefficient; deleting that term yields only j equals zero and does not force A to be pure gauge.
  - C-VAC-001 is a massive complex-scalar Euclidean D2 bubble-plus-seagull theorem and supplies no D4 continuation, counterterm, or total normalization.
  - C-VAC-002 supplies a conditional charged-Dirac D4 residue and logarithmic slope while explicitly leaving the finite counterterm, bare term, and total coefficient free.
  - C-DIM-009 fixes dimensions and convention transformations but selects no loop, logarithm, matching condition, or coefficient.
  - C-RGE-001 requires an independently supplied reference coupling; a differential flow does not erase its boundary coordinate.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral; immutable legacy-name stops are version-only compatibility evidence and never scientific candidate failures.
