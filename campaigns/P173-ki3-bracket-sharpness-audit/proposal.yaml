  - C-RDIFF-002 is a resolution-bounded conditional coordinate near 8.4824 and explicitly is not a variational bound physical coefficient or BPS interpolation endpoint.
  - P172 qualifies KI2 only as local-ratio freedom across a family of distinct positive lambda-mu theories; no fixed-theory symmetry or physical epsilon is accepted.
  - Continuity plus two endpoint limits can force inclusion of intermediate values but cannot exclude overshoot undershoot or repeated preimages.
  - Exact range equality requires an independently established codomain bound monotonicity or equivalent global control; declaring the codomain is an assumption not a derivation.
  - Open endpoints limits and attained finite endpoints remain distinct.
  - Comparator values cannot define select rank or validate an interpolant or bracket.
  - Mutable integration uses numpy.trapezoid or the canonical helper; immutable legacy-name stops are version-only evidence.
