question: >-
  Does hash-pinned KI3 prove that an exact open or closed kappa bracket is the
  complete attainable set under accepted framework authority, and which result
  belongs to one illustrative interpolant, every continuous endpoint-compatible
  function, or a separately assumed monotone bounded map?
invariants:
