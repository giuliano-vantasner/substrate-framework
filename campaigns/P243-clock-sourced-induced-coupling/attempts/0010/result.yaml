verdict:
  refutation: >
    The np/na shear channels mediate NO long-range interaction between
    confined clocks. Mechanism (i): compact-support confinement plus the
    single-generator identity ([A,A]=0) zeroes every internal-channel tail
    exactly beyond support overlap; the residual global winding is pure
    gauge within the vacuum manifold {rank-1 projectors}. Mechanism (ii):
    no protected flat direction survives on the physical background --
    aligned-vacuum flatness does not transfer to confined roots. Mechanism
