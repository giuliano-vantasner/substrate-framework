findings:
  - three_massless_propagating_species: >-
      The timelike-eigenvector orbit (boost directions E_0a + E_a0) carries
      zero stiffness (trace powers are stationary to second order along every
      off-diagonal direction) and strictly positive kinetic metric from the
      projector current. These are the long-range sector: exactly massless,
      three real propagating species.
  - four_stiff_static_directions: >-
      Diagonal eigenvalue-changing directions carry positive potential
      stiffness but no quadratic kinetics (dP_t vanishes on diagonal
      perturbations): non-dynamical at quadratic order, excluded from species
      counting with this named reason. Their exact squared stiffness values
      are recorded for the ledger.
  - three_inert_directions: >-
      Spatial-symmetric off-diagonal directions have no quadratic dynamics
      either way.
