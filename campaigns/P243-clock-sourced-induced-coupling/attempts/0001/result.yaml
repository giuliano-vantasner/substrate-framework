frozen_question: >-
  What is the exact free-fluctuation content of the aligned spectral-Cartan
  vacuum M0 with mixed targets (4, 1, 3/10, 0), classified into massive,
  massless, and inert directions on the symmetric order-parameter space?
method: >-
  The curvature sector of the conditional P239 action is quadratic in first
  derivatives, so about an aligned vacuum it contributes nothing at quadratic
  order. The free fluctuation theory is therefore exactly the pinned spectrum
  potential (stiffness K) plus the projector current (kinetic metric G). Both
  are computed as exact rational matrices on the 10-dimensional symmetric
  basis via series expansion of canonical primitives; the projector first
  variation dP = -(du u^T eta + u du^T eta) with induced rotations du_a =
  x_mixed[a,t]/(lambda_t - lambda_a) is certified by exact affine uniqueness
  against its linearized defining system (right/left eigen-relations,
  idempotence, eta self-adjointness).
