fd_route:
  status: G0 PASSED after root-cause fix; ladder EXECUTED; verdicts
    delivered with one reliability flag
  bugs_fixed_en_route:
    - shared (1,N_mu) mu-grid made autograd sum d_mu over all radial rows
      (fixed by committed-style repeated grid + Gauss nodes)
    - missing -sine/r factors in theta/phi derivatives (inflated ~600x)
    - "ROOT CAUSE of the transfer failure: the FD grid variable x=(r/R)^2
      was fed into committed formulas expecting r/R, double-squaring the
      Chebyshev argument and corrupting all envelope factors; corrected to
      2*x_c-1 with xn=r/R-based envelopes"
  g0_transfer_rel: 2.0e-04 (E_fd=55.1169 vs modal 55.1042) PASS
  ladder_bottom_lambda0:
    - {n_r: 48, value: 5.2735e-07}
    - {n_r: 72, value: 4.9459e-08}
    - {n_r: 96, value: 8.6450e-09}
  preregistered_verdicts: "GRID ARTIFACT for all six bottom-block modes"
  reliability_flag: >
    RESOLVED (was: relgrad 46-58). The earlier number was a reporting bug
    -- jac.norm() is the HESSIAN OPERATOR NORM over |E|, not a gradient.
    True background gradient decomposes as healthy discretization
    mismatch: |grad|/E = 0.049/0.042/0.037 across N_r=48/72/96, dominated
    by grid-scale components while the smooth modal-representable part is
    0.07-0.33 (near-stationary). Verdicts confirmed on the corrected run;
    stdout-fd-route.txt now reports both quantities separately.
  confidence: solid pending independent review (pre-declared rule, clean
    transfer, converging ladder, resolved diagnostics)
  interpretation: >
    Three independent lines now point the same way: mesh refinement
    collapses the soft eigenvalues (this route), box growth does NOT
    rescue them into bound structure (box-trend diagnostic), and the
    family-S lambda_min halving across orders matches the grid-mode
    signature. Working hypothesis for the next session: P240's marginal
    plateau is a spectral-resolution artifact; the window background's
    propagating content is carried by the stiffer block, not by the two
    ultra-soft modes.
  queued: diagnose the relgrad~50 inconsistency, rerun the ladder, then
    write the soft-mode adjudication claim.
box_trend_diagnostic:
  source: small-ratio-numerics skill (finite-domain-gift test), run on
    already-committed order-16 window roots, no new solves
  data:
    - {R: 10, lambda0: 5.705042e-05, lambda1: 1.187097e-02,
       ratio: 4.806e-03, dominant_nodes: 13}
    - {R: 12, lambda0: 7.450258e-05, lambda1: 1.901708e-02,
       ratio: 3.918e-03, dominant_nodes: 13}
    - {R: 14, lambda0: 1.013732e-04, lambda2_ratio_ref: 3.498e-03,
       dominant_nodes: 15}
  reading: >
    lambda0 does NOT collapse as the box grows -- it rises modestly with
    stable nodal count. The finite-domain-gift hypothesis is DISFAVORED.
    Combined with positive kinetic metric (stage 2), the soft modes now
    lean PHYSICAL; the nodal-count-near-order signature remains the one
    unexplained suspicious datum and keeps the question open pending the
    FD route (after its factor-2 fix) or a symmetry-adapted analytic
    classification.
  reporting_habit_adopted: quote lambda_min/lambda_2 alongside every
    soft-mode claim (values above; ~4e-3, i.e. inside the regime the
    skill flags as truncation-dominated on any single mesh).
