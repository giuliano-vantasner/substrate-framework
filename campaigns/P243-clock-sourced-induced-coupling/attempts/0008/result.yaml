stage2_kinetic_metric:
  construction: >
    T(v) = 4 * sum_i integral || [Vdot, d_i S_bg] ||_F^2 over the same
    quadrature/weight conventions as the committed static reduction;
    velocity modals pass through the same shape factors as coefficient
    modals; directors held fixed. M = d2T/dv2 exact via Jacobian-of-
    gradient. Kappa projector term EXCLUDED (bias toward STATIC stated).
  verifier_defects_before_result:
    - run with detached coordinate grids gave M == 0 exactly
      (stdout-stage2-run1-Mzero-bug.txt); fixed by the energy_radial
      requires_grad pattern, gradients now nonzero (norms 4.5/8.2/8.4)
    - inner autograd.grad lacked create_graph=True -> jacobian of a
      constant; caught by direct T-probe before trusting any output
  gates: "1/3 PASS"
  results:
    all_eight_modes_propagating_candidates:
      rayleigh_quotients: all positive (see kinetic-stage2.json modes)
      generalized_omega_sq_lowest: [1.5460e-04, 1.8100e-04, 5.5598e-04,
        8.8246e-04, 1.1212e-03]
    tangent_channel_structural_null:
      unit-tangent Rayleigh quotient 2.0e-26 == 0 exactly; the pure
      tangent velocity is tdot(r)*Identity, which commutes with every
      background gradient -- the trace/constraint direction carries no
      propagating kinetics under this construction
    mixed_mode_caveat: >
      mode 4 is 98.9% tangent yet reads PROPAGATING through a ~1%
      q-admixture scaled by the large q-channel metric weight; per-mode
      Rayleigh labels mislead for admixed modes -- classification should
      use constrained-subspace projection weights, queued refinement.
  gate_failures_honest:
    G2_refinement: soft omega^2 drift up to 9.9% between quadratures
      (48x24)->(64x32), above the declared 5%; the ultra-light values are
      resolution-sensitive at that level and are NOT certified numbers.
    G3_r10: M Frobenius difference across roots 5.6% < the guessed 10%;
      recorded, gate not silently widened.
  interpretation_guard: >
    PROPAGATING here means positive kinetic metric under the declared
    Frobenius convention with the kappa term excluded; it WEAKENS but does
    not kill the grid-artifact suspicion on the ultra-light modes, whose
    final adjudication remains with the independent-discretization route.
