  - necessary and sufficient pairwise and full-sum cancellation conditions
  - all-zero, signed, and complex-product countermodels
  - distinction between g^2 and a Hermitian product abs(g)^2
  - nonuniform pair loss and unequal member-shift cases
  - finite-sum small- and large-loss coefficients
  - unequal-detuning stationary equation and failure of one-pair optimum inheritance
  - fixed-per-pair versus fixed-total size normalization
compatibility_event: none
