load_bearing_findings:
  - >-
    The tensor-factor SU3 and SU2 images commute and, with a supplied nonzero
    scalar Abelian generator, give a faithful twelve-dimensional local Lie
    algebra representation on C6. This is distinct supportable content.
  - >-
    SM1 declares Y only real but substitutes Y=1 before its rank calculation.
    At Y=0 the Abelian generator vanishes and the combined rank is eleven, so
    nonzero Y is an undeclared load-bearing premise.
  - >-
    The source's one mixed-generator guard disproves that example but does not
    prove the claimed uniqueness of scalar matrices. A full joint-commutant
    nullspace derivation is required and yields span of I6.
  - >-
    An arbitrary real Lie-algebra weight defines a local u1 action, but a
    compact U1 representation with period two pi additionally requires its
    full-turn phase to be one in the chosen normalization.
  - >-
    Direct products and finite central quotients have the same Lie algebra, so
    local commutators and dimension cannot establish a global Standard Model
    group or its faithful matter representation.
  - >-
    The combined connection is defined as a sum and the source tests a constant
    phase norm only. It constructs no local transformation, derivative acting
    on a field, action, kinetic term, current, or dynamical gauge boson.
