question: >-
  Reproduce and independently audit YM1's claimed induction of a non-Abelian
  Yang-Mills kinetic term, determine whether a complete conditional massive
  scalar non-Abelian vacuum-polarization theorem is both supportable and
  distinct from C-NAG-001 and C-VAC-001, and keep group trace algebra,
  transverse two-point kinematics, a local low-momentum term, a declared bare
  gauge action, and a physical substrate gauge sector separately typed.
invariants:
  - >-
    C-NAG-001 fixes D=partial-i*g*W, the finite connection sign, curvature
    covariance, commutator, and invariant trace square. It explicitly derives
    no action coefficient, field equation, Yang-Mills induction, matter
    content, weak sector, or substrate realization.
  - >-
    C-VAC-001 fixes the complete massive complex-scalar QED2 one-loop kernel,
    bubble-seagull Ward cancellation, low-momentum coefficient, limit order,
    and physical ceilings for a separately declared Abelian theory. It does
    not by itself authorize a non-Abelian representation or covariant
    completion.
  - >-
    Generator normalization must be explicit. For Hermitian generators in a
    declared representation R, tr_R(T_a*T_b)=T(R)*delta_ab; component
    F_a*F_a and tr_R(F*F) coefficients differ by that trace convention.
  - >-
    A transverse projector at nonzero momentum is kinematic. It neither
    derives the loop numerator and seagull nor fixes the scalar form factor,
    bare coefficient, local counterterm, gauge-field measure, or pole.
  - >-
    A one-loop two-point kernel about zero background determines its quadratic
    color-diagonal surface. Promoting a full non-Abelian local invariant
    additionally requires a background-field or heat-kernel derivation and
    must preserve the cubic and quartic terms inside F.
  - >-
    A positive loop contribution is additive to any separately allowed bare
    and counterterm coefficient. Field normalization, matter representation,
    scalar mass, coupling, multiplicity, regulator, subtraction, dimension,
    and matching scale remain declared inputs unless independently derived.
  - >-
    Queue metadata preexposes nine literal checks, one assertion, a symbolic
    oracle, the fundamental Dynkin index one half, a transverse projector, and
    a claimed generated kinetic term. Those values and labels are excluded
    from candidate selection; the source and dossier bodies remain unopened
    until this contract is frozen and committed.
