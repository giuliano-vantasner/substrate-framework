corrected_content:
  - >-
    A declared massive complex-scalar SU2 multiplet has a color-diagonal
    two-point kernel equal to T(R) times the accepted scalar-QED2 kernel, not
    YM1's u*(1-u) massless scaffold.
  - >-
    Bubble and seagull contractions cancel before transverse decomposition;
    the representation trace multiplies both terms.
  - >-
    The low-momentum component-density coefficient is
    N_s*g^2*T(R)/(48*pi*m^2), while the coefficient multiplying
    tr_R(F_mu_nu*F_mu_nu) is N_s*g^2/(48*pi*m^2).
  - >-
    The full local non-Abelian completion follows from the independently
    derived background-field inverse-mass expansion, not from the quadratic
    projector alone.
  - >-
    The fixed-nonzero-momentum massless limit diverges for this scalar model;
    the zero-momentum and heavy-mass limits vanish in the stated order.
