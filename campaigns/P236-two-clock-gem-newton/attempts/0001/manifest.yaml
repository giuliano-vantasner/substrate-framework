    Composing the two per-center radial boosts as Q1 Q2 (product form)
    generated a non-decaying EM artifact (boost-composition rotations).
    REPAIRED by the additive shared-field form theta(x) = theta_1(r_1) +
    theta_2(r_2) with the engine's single fixed boost axis (A_BOOST = 2, the
    seed_M class), which is also the class the issue prescribes.
  F3_ldg_well_confinement: >
    Free static relaxation of the boost dressing with the development LdG
    amplitude well (kappa > 0) collapsed the dressing to the core (an
    artifact: the well pins the undressed trace). REPAIRED by the kappa = 0
    engine functional (u + 1.558 u^2, the N-3 record object) with the
    M5.21.14 constrained-smooth guard (band-limited descent) for the
    mediation arm.
  F4_zigzag_channel: >
    Unconstrained FIRE on the kappa = 0 functional rides the known scale-free
    oscillatory boost channel (M5.21.14 section 4 / M5.20.3). GUARDED by
    sigma = 2 px band-limited descent directions and reported via the
    zigzag amplitude and forward/central monitors.
  F5_fit_window: >
    Including separations out to 2(L - 4h) degraded the fit (box-edge
    contamination). REPAIRED by the mid-range window [4.1, 0.9 L] with a
    disclosed small-box extension to four points at 24^3.
