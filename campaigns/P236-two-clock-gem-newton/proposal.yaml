id: P236
base_release: v0.163.0
source_baseline: substrate-framework@a96399f
canonical_issue: "96"
question: >-
  On the public OpenWave M5 engine, does the shared, relaxed GEM field of two
  driven M5.8 fixed-clock configurations produce an attractive inter-source
  force F(d) proportional to d^-2, stable under the required 24^3 -> 32^3 ->
  48^3 growing-box ladder and a separate fixed-domain grid refinement, and
  can its normalized Green kernel be wired to accepted C-IGR-004 / C-GRV-002
  without inventing a cutoff or changing an accepted claim?
positive_objective: >-
  A directly differenced attractive force curve with exponent -2, a
  genuinely relaxed shared field at every distance and rung, converged raw
  magnitude, mandatory null/mutation/independent-pipeline controls, and a
  typed conditional G_total coefficient bridge.
coordination_boundary: >-
  This campaign lands in substrate-framework and resolves issue #96.  It
  does not edit OpenWave MODELS.md or open an OpenWave pull request; that is
  the separately requested follow-on discussion.
source_inventory:
  - source: openwave-labs/openwave@614a223fff01b768550b0917d0f96621d6bbe155
    role: >-
      Public M5.8 quartic-commutator engine and fixed-clock constants; M5.17
      angle-superposition texture; M5.21.8 rigid rapidity family; M5.21.14
      mandatory constrained-profile guard.
  - source: accepted C-IGR-004 and C-GRV-002 in v0.162.0
    role: >-
      Conditional total gravitational coupling and exact attractive-sign
      map, imported through src/substrate_framework/total_gravitational_coupling.py.
invariants:
  - MODELS.md and governance/claims.yaml remain unchanged.
  - The two-center frame is orthogonal and q2=0 is exactly the single source.
  - One ambient rapidity is shared by both pinned clock cores and is minimized
    on the same n^3 lattice used for the observable.
  - Pair and both single densities are subtracted pointwise on one common
    mask before integration.
  - The force exponent is fitted from direct finite differences of raw U(d),
    never from a residual created by a forced 1/d energy fit.
  - Lambda stays a positive symbolic premise because C-IGR-004 supplies no
    unique numerical normalization.
candidates:
  - id: guarded_rigid_shared_rapidity
    status: selected
    rationale: >-
      Canonical M5.21.8 profile class; M5.21.14 expressly permits constrained
      smooth profiles and forbids an unguarded full-field descent.
  - id: unrestricted_local_rapidity_descent
    status: rejected
    rationale: >-
      Enters the upstream-proven scale-free negative UV channel and therefore
      does not define the requested relaxed physical state.
  - id: imposed_two_envelope_overlap
    status: prohibited
    rationale: >-
      Explicitly banned by issue #96 and known to manufacture steep overlap
      exponents.
deliverables:
  - evidence/m5_96_two_clock_gem_newton.py
  - evidence/m5_96_two_clock_gem_newton.json
  - evidence/m5_96_independent_audit.json
  - evidence/findings-note.md
  - evidence/plots/m5_96_ud_ladder.png
  - evidence/plots/m5_96_controls.png
  - reviews/independent_force_audit.py
  - verify.py
claim_delta: none; evidence campaign only, accepted claims are unchanged
target_kind: simulation_evidence
comparator_blinding: >-
  No external gravitational constant or observed comparator was inspected;
  -2, sign, ladder, and mutation thresholds came from issue #96.
