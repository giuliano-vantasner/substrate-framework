campaign: P137
role: primary_scope_cross_check_not_derivation_input
sources:
  - title: Static properties of nucleons in the Skyrme model
    authors: [Gregory S. Adkins, Chiara R. Nappi, Edward Witten]
    year: 1983
    doi: https://doi.org/10.1016/0550-3213(83)90559-X
    finding: >-
      The paper concerns static properties of quantized single-Skyrmion
      baryons. The accessible primary record does not support S1's attribution
      of a two-Skyrmion most-attractive-channel Eq. 3.8 to this paper.
  - title: Scattering of Skyrmions
    authors: [David Foster, Steffen Krusch]
    year: 2015
    url: https://arxiv.org/abs/1412.8719
    doi: https://doi.org/10.1016/j.nuclphysb.2015.06.011
    finding: >-
      Widely separated B=1 configurations admit an interacting-dipole
      approximation; short-range scattering contains additional repulsion and
      lies outside that approximation.
  - title: Nucleon-nucleon potential from skyrmion dipole interactions
    authors: [Derek Harland, Chris Halcrow]
    year: 2021
    version: arXiv v3 with 2022 erratum
    url: https://arxiv.org/abs/2101.02633v3
    doi: https://doi.org/10.1016/j.nuclphysb.2021.115430
    finding: >-
      A Skyrmion-to-nucleon interaction needs separate classical-dynamics and
      quantization approximations. The massive-pion dipole approximation is a
      long-range model, and the corrected paper explicitly records errors in
      its earlier formulas.
selection_effect: >-
  These sources support the audit ceiling and the legitimacy of studying a
  declared long-range dipole model. No literature coefficient equation or
  empirical agreement enters C-SKY-001's proof or selection.
