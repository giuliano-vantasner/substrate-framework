  - distinction among assigned index response linearized far-field interaction full nonlinear field energy and physical nucleon force
  - orientation completeness rather than comparison of one favored and one disfavored channel
  - solver success mesh domain tolerance and independent-method refinement for any numerical field result
  - sensitivity to source amplitude range mass kinetic normalization separation orientation subtraction and boundary assumptions
  - parameter and import economy reusable API value downstream compatibility and nonduplication
