source_units: [TX1]
question: >-
  Does hash-pinned TX1 establish an exact or resolution-bounded intrinsic
  rank-two energy moment for the declared B=2 rational-map ansatz, and what
  importable angular/radial factorization and stationary-branch evidence can
  be accepted without calling the ansatz a solved full three-dimensional
  Skyrmion, identifying map degree with a physical nucleus, importing a
  gravitational coupling, or treating a static moment as radiation?
invariants:
  - C-RMAP-001 fixes the oriented round-sphere normalization, conformal Jacobian, exact axial R=z^B family, and I_2=pi+8/3, but supplies no physical action, minimizing map, radial profile, baryon, nucleus, or mass.
  - C-RMAP-002 gives resolution-bounded integrals for one declared degree-four map but proves neither its full cubic symmetry nor a fixed-degree minimum.
  - C-RPROF-001 fixes only a separately declared reduced radial functional and its exact stationary equation, split, scale identity, and endpoint powers; it does not supply an accepted local three-dimensional density or full-field solution.
  - C-RPROF-002 gives two-method numeric evidence for three conditional stationary radial branches and their coefficients only; it proves no existence, uniqueness, minimum, full three-dimensional solution, physical mass, or state map.
  - C-MOM-001 fixes normalized I_STF and triple Q=3*I_STF conventions for integrable Cartesian source moments and distinguishes moment kinematics from gravitational dynamics.
  - C-MOM-003 fixes the exact spherical STF null and one P2 deformation guard; axial symmetry alone constrains tensor form but does not prove a nonzero amplitude or its sign.
  - C-GW-001 and C-GW-002 provide conditional TT algebra only; a static intrinsic moment has zero positive-order time derivatives and supplies no radiation or physical polarization mechanism.
  - Any local rational-map energy density used here must be declared explicitly, integrate to C-RPROF-001's radial functional, and remain a conditional reduced-model premise rather than a derived physical stress tensor.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral; immutable legacy-name stops are version-only compatibility evidence and never scientific candidate failures.
