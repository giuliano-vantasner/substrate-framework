headline_failures:
  - >-
    F_self is obtained by solving the single scalar equality F_self*v=-P_rad.
    Writing the expanded quotient on a second line does not create an
    independent Dirac, momentum-flux, ALD, or Ford-O'Connell derivation.
  - >-
    Accepted C-RAD-001 rejects the inherited G1 coefficient and supplies no
    accelerated breather, source dynamics, or reaction law. Under its declared
    A=1/kappa B=c=1 scalar normalization, the same amplitude would radiate
    kappa*q squared over two, four times G4's inserted power.
  - >-
    One scalar power equation cannot determine translational and internal
    generalized-force components. At zero rate it either is inconsistent for
    positive power or leaves force unconstrained for zero power.
  - >-
    The numeric leg prescribes an accelerating trajectory for which gamma E0
    increases, integrates the same analytic derivative, and never evolves a
    radiation-damped source or checks solve_ivp success.
  - >-
    Time averaging the kernel removes its nonzero temporal harmonics. Its
    finite spatial transform is not the Fourier amplitude of the omitted
    oscillatory source, and the assigned internal power contains no internal
    amplitude, phase, or rate.
  - >-
    Algebraic locality and negative instantaneous work do not by themselves
    prove a regularized causal equation, absence of runaway solutions, or
    absence of preacceleration.
