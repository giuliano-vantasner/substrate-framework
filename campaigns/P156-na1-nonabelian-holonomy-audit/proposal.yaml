question: >-
  Reproduce and independently audit NA1's claimed SU2 Wilson loop, and
  determine the most general exact finite-dimensional statement relating the
  C-NAG-001 connection convention to oriented parallel transport,
  path-ordered products, closed-loop conjugacy data, commuting and genuinely
  noncommuting segment controls, orientation reversal, and representation
  dependence, while keeping any Aharonov-Bohm, weak-sector, particle,
  detector, or substrate interpretation behind its missing geometric,
  dynamical, carrier, and observable premises.
invariants:
  - >-
    C-NAG-001 fixes D=partial-i*g*W and the finite connection law
    W'=U*W*U_dagger-(i/g)*(partial U)*U_dagger. Parallel transport must use
    dV/ds=i*g*dot(x)^mu*W_mu*V, transform by endpoint factors, and reduce to
    conjugation only for a closed loop at a fixed basepoint.
  - >-
    C-REP-002 supplies the exact Pauli-half fundamental carrier and a separate
    projector factor, but supplies no physical matter field, weak doublet,
    path, interaction, anomaly cancellation, or substrate state.
  - >-
    C-BER-001 is a rank-one projective Berry holonomy with a scalar endpoint
    transition. Equal scalar or center values do not identify it with a
    matrix Wilson transporter, common connection, carrier, or physical loop.
  - >-
    C-WIL-001 derives consequences only from separately declared rectangular
    area and perimeter expectation laws. It neither supplies matrix parallel
    transport nor derives a gauge action, phase, or confinement mechanism.
  - >-
    A constant connection confined to T3 is a commuting one-generator
    subgroup. exp(2*pi*i*T3)=-I in the fundamental carrier is an exact control
    but cannot demonstrate path ordering or non-Abelianity.
  - >-
    For ordered piecewise-constant integrated Hermitian segments B1 through
    Bn, the frozen chronological convention is V=exp(i*Bn)*...*exp(i*B1).
    Pairwise commuting segments collapse to exp(i*sum B), reversed paths give
    V inverse, and noncommuting Pauli-axis segments must change the matrix when
    their order is exchanged.
  - >-
    A closed transporter matrix is gauge and basepoint covariant, not itself a
    scalar invariant. Conjugacy class, spectrum, determinant, and trace are
    the corresponding finite-carrier data; raw and dimension-normalized trace
    must remain distinct and are representation dependent.
  - >-
    The queue preexposes five literal checks, one assertion, the labels B1,
    O1, W2, W4, and W7, and the fundamental identities
    exp(2*pi*i*T3)=-I and exp(4*pi*i*T3)=+I. These values are excluded from
    concept selection. The source and dossier bodies, AST data flow, exact
    guards, remaining constants, and narrative consumers remain unopened
    until this contract is frozen and committed.
