exact_statement: >-
  Let H be a nonzero finite-dimensional complex inner-product carrier and let
  B_1,...,B_n be an ordered nonempty sequence of exact Hermitian integrated
  connection matrices. In the convention inherited from
  D=partial-i*g*W, define chronological transport by
  V(B_1,...,B_n)=exp(i*B_n)*...*exp(i*B_1), with later segments on the left.
  V is unitary and det(V)=exp(i*sum_j trace(B_j)); traceless segments therefore
  give determinant one. Concatenation is ordered multiplication. The reversed
  path has chronological segments -B_n,...,-B_1 and transporter
  V_reverse=V^dagger=V^(-1). Pairwise commuting B_j collapse exactly to
  exp(i*sum_j B_j). If E_j=exp(i*B_j) and supplied unitary node gauges
  U_0,...,U_n transform each segment as E_j'=U_j*E_j*U_(j-1)^dagger, then the
  product transforms as V'=U_n*V*U_0^dagger. For a closed loop with U_n=U_0,
  the matrix changes by conjugation, so its characteristic polynomial,
  spectrum, determinant, raw trace, and normalized trace are invariant; the
  matrix itself is not a scalar invariant. Moving the basepoint cyclically
  conjugates the product. In the Pauli-half fundamental carrier,
  exp(2*pi*i*T3)=-I_2 and exp(4*pi*i*T3)=I_2. For the noncommuting ordered
  pair T1 then T2,
  exp(i*a*T2)*exp(i*a*T1)-exp(i*a*(T1+T2)) has leading term
  i*a^2*T3/2 and is not the zero matrix function, while commuting axes collapse.
  The same 2*pi SU2 center element acts as -I_2 in the fundamental and +I_3 in
  the adjoint, giving raw traces -2 and +3 and normalized traces -1 and +1.
  These exact conditional transport identities supply no base-space defect,
  flux, curvature localization, gauge action, weak matter carrier, physical W
  sector, Aharonov-Bohm observation, detector response, or substrate map.
