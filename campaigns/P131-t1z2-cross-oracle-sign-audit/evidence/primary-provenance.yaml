finding: >-
  The primary abstract states a spin-exchange-statistics result for a quantum
  theory of sufficiently nonlinear fields with conserved kinks, canonical
  commutation relations, admitted double-valued state functionals, integer-
  valued intrinsic angular momentum, and continuity assumptions. It does not
  by itself construct T1Z2's RP2-disclination-to-charge quotient map, SU2
  representation intertwiner, or physical identification of its two source sectors.
