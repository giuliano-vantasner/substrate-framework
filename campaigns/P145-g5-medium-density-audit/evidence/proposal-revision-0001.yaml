  id: C-MED-005
  dependencies: [C-MED-001]
  statement: >-
    In SI base dimensions M L T I, a multiplicative mechanical dictionary
    rho=a*epsilon and K=b*mu_inverse requires a and b to share dimension
    M^2*T^-4*I^-2. It gives c_m^2=(b/a)/(epsilon*mu), equal to the
    electromagnetic wave speed squared exactly when a=b for positive factors.
    The common factor remains free and rescales density, stiffness, and energy
    without changing speed. For dimensionless strain xi, u=K*xi^2/2 and, under
    the common conversion, u/c^2=a*epsilon*xi^2/2; bare epsilon/2 is not SI
    mass density and bare 1/(2*mu) is not SI energy density. No material,
    calibration, field amplitude, gravity coupling, or observation is derived.
