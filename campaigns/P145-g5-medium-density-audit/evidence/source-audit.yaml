objects_present:
  - floating regression of the exact SI relation epsilon0*mu0=1/c^2
  - raw-float identities epsilon0/2=1/(2*mu0*c^2) and epsilon0*c^2/2=1/(2*mu0)
  - conditional substitution of declared kappa=8*pi*G_eff
  - SI dimension check for kappa*epsilon0*mu0 after assigning kappa Newton-G dimensions
