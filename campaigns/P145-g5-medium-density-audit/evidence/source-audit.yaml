headline_failures:
  - >-
    In SI M,L,T,I dimensions epsilon0/2 is still permittivity, not mass
    density; the source checks only its raw decimal against a copied decimal.
  - >-
    Bare 1/(2*mu0) is inverse permeability, not energy density. A mechanical
    calibration and dimensionless strain, or an electromagnetic field squared,
    is required.
  - >-
    L3 is exactly L1 plus L2 in log space, so the first three displayed outputs
    have rank two rather than three independent predictions.
  - >-
    The linkage guard counts repeated symbol names. It tests neither input
    independence, row provenance, measurement, nor a parameter-free constraint.
  - >-
    L4 is tautological after kappa=8*pi*G_eff and epsilon0*mu0=1/c^2 are supplied;
    kappa remains arbitrary and its Newton-G dimension is assigned rather than
    obtained from a typed source equation.
  - >-
    Current SI fixes c exactly and relates epsilon0=1/(mu0*c^2), so epsilon0 and
    mu0 do not constitute two independent empirical medium inputs.
headline_verdict: >-
  Qualified. G5 natively passes all fifteen predicates, but its central medium
  density and energy density are dimensionally invalid, its prediction count is
  ceremonial, and its gravity formula is a free-coupling conditional identity.
