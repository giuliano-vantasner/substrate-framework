  - a dimensionally valid map from SI inverse permeability to stiffness or energy density
  - the common dimensioned calibration required by both mechanical coefficients
  - a mechanical strain amplitude or electromagnetic field amplitude
  - a unit check on the source's own L2 and L3 expressions
  - provenance-bearing independent measurements or a prediction-rank calculation
  - a source-typed Einstein coupling with restored c and hbar factors
  - a material action equation of state density measurement or gravitational observation
load_bearing_insertions:
  - assignment: rho_a=EPS0/2
    classification: raw_permittivity_number_relabelled_as_mass_density
  - assignment: strain_rhs=1/(2*MU0)
    classification: raw_inverse_permeability_number_relabelled_as_energy_density
