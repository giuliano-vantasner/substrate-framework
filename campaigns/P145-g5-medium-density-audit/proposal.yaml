question: >-
  Reproduce and independently audit G5's claim that vacuum permittivity,
  permeability, and a gravitational coupling determine a medium density,
  strain-energy density, and linked effective-Newton relation, and determine
  exactly which SI-unit conversions, constitutive premises, coupling
  conventions, independent inputs, and parameter-free predictions exist.
invariants:
  - >-
    C-MED-001 and C-MED-002 are conditional constitutive compositions. Their
    response laws and density dictionary are declared premises, do not identify
    SI vacuum constants with mechanical density, and do not establish a
    physical medium or absolute scale.
  - >-
    C-DIM-002 fixes monomial powers only relative to its declared primitive
    basis and leaves dimensionless coefficients and physical identifications
    free. C-IDN-001 distinguishes exact row rank from provenance, independence,
    and physical prediction.
  - >-
    C-GRV-001 requires a source-typed dimensional ledger before relating
    Newton G to a field-equation coupling. C-STG-001 uses natural units and a
    canonical energy-stress source; it does not select a physical kappa or
    authorize an unqualified SI kappa equals eight pi G substitution.
  - >-
    C-RAD-001, C-GOR-001, and C-RR-001 supply no material realization or
    Newton normalization. Qualified G1, G2, G3, and G4 cannot contribute their
    rejected gravity, medium, source, or backreaction narratives.
  - >-
    SI base-dimension order is M L T I. Permittivity has
    (-1,-3,4,2), permeability (1,1,-2,-2), mass density (1,-3,0,0),
    stiffness and energy density (1,-1,-2,0), speed (0,1,-1,0),
    Newton G (-1,3,-2,0), and G over c squared (-1,1,0,0).
  - >-
    A mechanical dictionary rho=lambda*epsilon and
    stiffness=lambda*mu_inverse requires a common dimensioned lambda with
    dimension (2,0,-4,-2); a bare dimensionless one-half cannot perform that
    conversion. Likewise mu_inverse alone is not an energy density.
  - >-
    The generated queue exposes G5's headline and four displayed relations,
    fifteen literal checks, one assertion, symbolic-only hints, dependencies
    G1 G2 G3 G4, and rounded comparison values. Source and dossier bodies,
    literal predicates, full output, and further comparators remain unopened.
