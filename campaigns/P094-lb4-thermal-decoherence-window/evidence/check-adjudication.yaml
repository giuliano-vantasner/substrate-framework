review_rule: >-
  A passing source predicate is classified individually. Literal
  self-equalities, algebra conditional on rejected premises, comparator
  overlap, parameter declarations, asymptotic extrapolations, and naming
  hygiene do not validate the physical headline.
checks:
  - id: 1
    predicate: FDT noise strength equals 2*Gamma*Theta_eff
    decision: rejected_self_equality
    reason: The source defines the two sides identically and supplies no stochastic equation, covariance derivation, bath limit, or phase projection.
  - id: 2
    predicate: classical limit Theta_eff/(k_B*T_op) tends to one
    decision: qualified_conditional_algebra
    reason: The coth expression has this exact limit, but that expression is not thereby the noise scale of the breather phase.
  - id: 3
    predicate: classical leading term Theta_eff is k_B*T_op
    decision: qualified_conditional_algebra
    reason: This is the leading coth expansion for the supplied scale only.
  - id: 4
    predicate: zero-temperature Theta_eff tends to hbar*omega_b/2
    decision: qualified_conditional_algebra
    reason: This is an exact fixed-frequency coth limit, not a derivation of nonzero white zero-point phase noise.
  - id: 5
    predicate: Theta_eff is at least hbar*omega_b/2
    decision: qualified_formula_bound
    reason: The bound follows from the supplied positive-frequency coth formula; the physical noise interpretation remains unproved.
  - id: 6
    predicate: Gamma_phi equals Gamma*Theta_eff/E_b
    decision: rejected_undeclared_phase_projection
    reason: Dimensional consistency cannot fix the admitted order-one projection coefficient, and an explicit Langevin oscillator gives a different averaged coefficient.
  - id: 7
    predicate: Gamma_phi increases with T_op
    decision: qualified_algebra_of_rejected_model
    reason: The derivative is correct only after importing the unaccepted Gamma_phi formula and mode assignment.
  - id: 8
    predicate: sampled low-temperature Gamma_phi is below sampled high-temperature Gamma_phi
    decision: duplicate_conditional_sample
    reason: The sampled inequality adds no authority beyond check 7.
  - id: 9
    predicate: derivative of Gamma_phi with E_b is negative
    decision: qualified_algebra_of_rejected_model
    reason: The sign is elementary for the supplied quotient but does not derive the quotient.
  - id: 10
    predicate: sampled energy derivative is negative
    decision: duplicate_conditional_sample
    reason: This repeats check 9 at declared inputs.
  - id: 11
    predicate: Gamma_phi tends to zero with Gamma
    decision: qualified_algebra_of_rejected_model
    reason: This is a limit of the inserted proportionality, not an independently derived fluctuation-dissipation limit.
  - id: 12
    predicate: Gamma_phi is linear in Gamma
    decision: qualified_algebra_of_rejected_model
    reason: Linearity is built into the asserted formula.
  - id: 13
    predicate: visibility exp(-variance/2) equals exp(-Gamma_phi*t)
    decision: split_and_corrected
    reason: >-
      C-COH-002 accepts exp(-D*t) as the mean phasor for a declared Brownian
      phase of variance 2*D*t. Pair visibility is exp(-2*D*t), and neither is
      a survival probability or a validation of LB4's physical D.
  - id: 14
    predicate: phase_rms squared equals Gamma_phi*t
    decision: refuted_factor_two
    reason: Under the declared delta=sqrt(2*D)*W convention, phase variance and RMS squared equal 2*D*t.
  - id: 15
    predicate: Gamma_dec equals Gamma/2 plus Gamma_phi
    decision: accepted_only_as_declared_mean_factor
    reason: >-
      Independent multiplication of a deterministic coordinate-amplitude
      envelope and Brownian mean phasor gives this exponent. It is not energy,
      pair coherence, survival, population, or a breather lifetime.
  - id: 16
    predicate: endpoint exponential equals one at zero exponent
    decision: accepted_elementary_endpoint
    reason: This is an exact property of the declared coherent mean factor, not a finite-window average.
  - id: 17
