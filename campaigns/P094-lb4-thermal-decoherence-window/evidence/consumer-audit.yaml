campaign: P094
source_baseline: substrate@6d1f4e02f87a0bd1dc326cb68af01872d1e88c64
consumers:
  coherence_array:
    sha256: 7e1bd3cb1afeaca4c5f2af7ff817422ff84ddabf095e632c20b90aab5efa573d
    status: noncanonical_engineering_consumer
    finding: >-
      It uses V=exp(-phase_rms_squared) as iid pair coherence. With Brownian
      variance 2*D*t, C-COH-002 gives V=exp(-2*D*t), not LB4's exp(-D*t)
      mean phasor. It supplies no phase-noise dynamics or physical D.
  lifetime_kernel:
    sha256: 51bd4f46593363ac37d99b4e95ca0bef1b572a3b075505968adf77404db4cac5
    status: noncanonical_engineering_consumer
    finding: >-
      It copies LB4's formula, central point, broad grid, and LB2 hard cutoff.
      It does not distinguish endpoint from window average or mean from pair
      coherence, and it derives no stochastic survival fraction.
  dbd_pipeline:
    sha256: 5354b39d3bc25439a7f6e83c175474358b3104b2f844cc6aa3a2ee2a84439669
    status: noncanonical_engineering_consumer
    finding: >-
      Sequentially propagates the lifetime-kernel value into population and
      power. Wiring does not close the upstream FDT, phase, lifetime, or event
      premises.
  nucleation_model:
    sha256: bad798b39d850ecf92a97e25bfb0341ef7ae80b036c26a88037efdd618d8d3b8
    status: noncanonical_engineering_consumer
    finding: >-
      Uses selected formation and persistence inputs; it does not derive the
      Brownian phase coordinate, its diffusion coefficient, or an exclusive
      spark-versus-DBD event classifier.
  LB3:
    sha256: 1b54ef5704fce1502464f44bd675c01824cfa48b6b98688b1df8f000d1030a2b
    status: qualified_source_evidence
    finding: >-
      P093 found finite-window damped-field relaxation but no stochastic
      forcing, thermal phase process, or population observable. It cannot
      validate LB4's coefficient or survival semantics.
