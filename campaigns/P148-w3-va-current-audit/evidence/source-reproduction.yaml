initial_scientific_flags:
  - >-
    Direct differentiation of phi_L(t+x)+phi_R(t-x) gives
    phi_x=phi_L_prime-phi_R_prime. W3 instead assigns the negative, so its
    source-level characteristic algebra contradicts its imported channel name.
  - >-
    W3 defines V=(phi_t,-phi_x) and A=(phi_x,-phi_t). Their actual divergences
    are Box(phi) and zero respectively. The script never evaluates either and
    imports the opposite conservation interpretation from a distinct complex
    field plus a finite potential-shift witness.
  - >-
    Parity exchanges the two null derivative combinations. That is covariance
    and does not show a parity-breaking action or select one coupling.
  - >-
    W3 normalizes a Gaussian to area minus two-pi before integration, then
    compares separately assigned integers. It simulates no boundary evolution
    and inherits W2's rejected event-versus-label conflation.
  - >-
    The pure-vector guard uses chosen quadrature-phase traces to obtain zero
    correlation and relabels it zero Delta-Q, despite accepted C-SG-013 proving
    the observables independent.
