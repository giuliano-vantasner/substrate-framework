exact_classification: >-
  Let phi be a sufficiently smooth exact real scalar, u=phi_t, v=phi_x,
  D^mu=partial^mu phi=(u,-v), and T^mu=epsilon^(mu nu)partial_nu
  phi=(v,-u) for signature (+,-) and epsilon^(01)=+1. Then
  partial_mu D^mu=phi_tt-phi_xx, which is -sin(phi) on normalized
  sine-Gordon solutions, while partial_mu T^mu=0 off shell. Moreover
  D-T=(u-v,u-v) and D+T=(u+v,-u-v) are the two null derivative
  combinations. Scalar spatial parity transforms D as a vector, T as an axial
  vector, and exchanges the two null combinations with the spatial-component
  parity sign. This is a covariant exchange, not intrinsic parity violation or
  selection of one interaction. If phi=L(t+x)+R(t-x) in a separately declared
  massless decomposition, direct chain rule gives u=L_prime+R_prime and
  v=L_prime-R_prime, hence u+v=2*L_prime and u-v=2*R_prime. In full normalized
  sine-Gordon both characteristic transport defects are sourced by -sin(phi).
  A declared boundary residual u+epsilon*v=J constrains one characteristic
  trace but does not construct an internal Noether current, Lorentz-spinor
  charged vertex, parity-breaking action, gauge coupling, charge selection, or
  dynamics. Half-line topological transfer still requires boundary field
  change and vacuum data; sign correlation is independent. C-U1-001's complex
  Noether current is a distinct field object and vanishes for a genuinely real
  field. C-REP-002 does not identify a unit winding event with W2's supplied
  plus-minus-one basis-label transition.
