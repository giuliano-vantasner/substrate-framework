question: >-
  Reproduce and independently audit W3's claim that a sine-Gordon
  characteristic decomposition supplies a physical vector-minus-axial charged
  current, and determine exactly which statements are scalar derivative and
  parity identities, accepted nonlinear characteristic balances, boundary
  trace or correlation statements, independently declared internal currents,
  or genuinely require Lorentz matter, gauge, and interaction dynamics.
invariants:
  - >-
    C-SG-011 already proves that J_plus=phi_t+phi_x and
    J_minus=phi_t-phi_x have nonlinear transport defects -sin(phi), and that
    the off-shell topological current is conserved identically. Neither object
    is an independently conserved weak chiral current or V-A interaction.
  - >-
    C-SG-012 fixes signature (+,-), covariant and contravariant stress signs,
    one-half light-cone derivatives, and sourced null-stress balances. The
    massless model obtained by deleting the potential is not the small-field
    limit of normalized sine-Gordon.
  - >-
    C-SG-013 separates a fixed-coordinate boundary sign correlation from
    topological charge transfer. Neither observable implies the other, and
    parity maps coordinate and outward-normal boundary data differently.
  - >-
    C-BND-001 qualifies W1: its scalar boundary residual is a covariant
    parameter family with one free trace, not a selected chiral state,
    intrinsic parity violation, charge map, or weak interaction.
  - >-
    C-REP-002 qualifies W2: an independent projector factor can carry
    Hermitian closing SU2 actions, but W2's same-carrier construction, labels,
    charge-event matching, parity guard, and physical weak-doublet reading are
    not accepted premises.
  - >-
    C-U1-001's Noether current belongs to an independently declared complex
    field, vanishes for a real field, and requires its own on-shell equation
    plus boundary flux for charge conservation. It is not the accepted real
    sine-Gordon field or topological current.
  - >-
    C-GAU-001 shows that a gauge interaction requires a declared matter
    transformation, connection, covariant derivative, and coupling; local
    covariance alone still supplies no gauge kinetic action or force.
  - >-
    The generated queue exposes W3's broad headline, eight named dependencies,
    seven static and literal checks, one assertion, symbolic and numeric hints,
    two immutable legacy trapezoid calls, and no result excerpt. Source and
    dossier bodies, exact predicates, formulas, samples, outputs, and
    thresholds remain unopened.
