question: >-
  Reproduce and independently audit CM7's exact shifted inverse-square-root
  level crossing, full domain and endpoint classification, sensitivities,
  dimensions, scale covariance, threshold-window measure, imported screening
  inputs, and numerical regressions; then determine whether any theorem remains
  beyond C-XOV-001 and C-SCR-001 and terminally adjudicate all twenty-seven
  predicates without converting a free horizontal level into a physical rate,
  predicted material crossover, channel dominance, yield, heat, or observation.
invariants:
  - >-
    For E>=0, G>0, and U>0 in one energy unit, the declared factor
    P(E)=exp(-sqrt(G/(E+U))) is continuous and strictly increasing with attained
    floor p0=exp(-sqrt(G/U)) and unattained upper limit one.
  - >-
    A unique positive crossing exists exactly for p0<c<1 and is
    E_x=G/log(c)^2-U. At c=p0 the unique nonnegative crossing is E=0; at c=1
    only the infinite-input limit exists; outside the range there is no crossing.
  - >-
    Real natural logarithms require a positive dimensionless level. The sign
    and squared logarithm do not authorize c>1 or negative c, and branch
    conditions must be carried rather than inferred from an algebraic residual.
  - >-
    The exact sensitivities are partial_c E_x=-2G/(c*log(c)^3)>0,
    partial_G E_x=1/log(c)^2>0, and partial_U E_x=-1 on the interior domain.
    Elasticities depend on E_x and become singular at the zero-crossing floor.
  - >-
    E, G, and U share one energy dimension while c is dimensionless. Common
    positive rescaling of G and U rescales E_x and any energy threshold by the
    same factor; holding one energy fixed defines a different comparison.
  - >-
    Every positive target E_T can be produced by choosing
    c=P(E_T;G,U). A free c therefore makes the crossover energy nonidentifying
    even when the inverse formula is exact.
  - >-
    For E_T>=0 the threshold level is c_T=exp(-sqrt(G/(U+E_T))). Under a
    declared uniform log-c measure, the below-threshold fraction of the
    admissible log window is 1-sqrt(U/(U+E_T)); another measure or distribution
    gives a different fraction and must not be implied.
  - >-
    C-XOV-001 already owns the full shifted-factor range, inverse,
    sensitivities, scale covariance, load-bearing counterexamples, and physical
    nonidentifiability ceiling with dependency C-SCR-001.
  - >-
    C-SCR-001 declares the factor conditionally and explicitly does not derive
    a Coulomb model, physical screening energy, universal material maximum,
    cross section, rate, coherent channel, yield, heat, or observation.
  - >-
    A maximum over four assigned screening models is a selected source input,
    not a universal material ceiling. Its units, models, constants, uncertainty,
    and version must remain explicit.
  - >-
    Bisection, random scans, and selected fake formulas are regression and
    sensitivity evidence once an exact inverse and range theorem are known;
    numerical agreement cannot become independent derivation.
  - >-
    Prior CM7 execution and extensive source-line exposure may regress frozen
    formulas but cannot select a new claim or physical interpretation.
