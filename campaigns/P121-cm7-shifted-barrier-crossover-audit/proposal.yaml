candidates:
  - id: A
    description: Reproduce CM7 literally and classify all twenty-seven symbolic, numeric, domain, mutation, import, and tally predicates.
  - id: B
    description: Reuse C-XOV-001 and C-SCR-001 to close the exact range, endpoint, inverse, residual, uniqueness, sensitivity, dimension, and scale ledger.
  - id: C
    description: Audit logarithm branches, c outside the range, U=0, c at the floor or one, wrong signs, unscreened and shifted variants, and nonmonotone alternatives.
  - id: D
    description: Derive target-level identifiability and level, barrier, shift, and common-scale elasticities including singular endpoint behavior.
  - id: E
    description: Derive threshold-level fractions under log-uniform, uniform-c, and arbitrary probability measures and separate measure choice from a physical population statement.
  - id: F
    description: Audit the selected screening ladder, four-material maximum, units, conversions, constants, uncertainty, and absence of a universal material premise.
  - id: G
    description: Treat bisection and random scans as exact-formula regressions and audit brackets, stopping rules, tolerances, convergence, residuals, and mutation sensitivity.
  - id: H
    description: Determine whether all surviving content is already governed and independently review every predicate, dependency, cycle, import, consumer, and nonduplication decision.
