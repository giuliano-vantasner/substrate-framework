  - C-NAG-001 only for exact SU2 connection curvature trace and covariance conventions
  - C-KRN-001 and C-KRN-002 only for fixed-input static scalar Riesz kernels and their domain ceilings
  - C-MAX-001 only for separately sourced ordinary-Laplacian static Green branches
