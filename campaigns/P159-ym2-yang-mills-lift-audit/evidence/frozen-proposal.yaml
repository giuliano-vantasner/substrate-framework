source_units: [YM2]
question: >-
  Reproduce and independently audit YM2's claimed 1+1-to-3+1-dimensional
  Yang--Mills lift, determine the exact supportable relation among a supplied
  color trace metric, a static scalar Riesz inverse, a local or nonlocal gauge
  kinetic operator, and a Lorentzian gauge propagator, and deliver either a
  distinct importable conditional theorem or a complete accepted composition
  with a terminal predicate-level source disposition.
invariants:
  - >-
    C-NVP-001 is a conditional massive complex-scalar SU2 one-loop theorem in
    flat two-dimensional Euclidean space. It explicitly supplies no
    dimensional lift, unique total coupling, pole, weak sector, or substrate
    mechanism.
  - >-
    C-NAG-001 fixes finite local non-Abelian covariance and curvature
    conventions but derives no action coefficient, propagator, matter source,
    dimension, weak identification, or dimensional lift.
  - >-
    C-KRN-001 fixes a static scalar Riesz inverse only after spatial dimension
    d, power s, coefficient A, Fourier convention, radius, and subcritical
    domain are supplied. Its d=3,s=1 endpoint is conditional and does not
    select either input.
  - >-
    C-KRN-002 separates subcritical, critical, and distributional branches and
    proves that a force exponent or analytic dimension parameter supplies no
    geometry, physical dimension, gauge action, or dimensional lift.
  - >-
    Multiplication by tr_R(T_a*T_b)=T(R)*delta_ab tensors a spacetime kernel
    with a color metric. It does not change the kernel's domain, dimension,
    signature, time dependence, gauge fixing, source, or normalization.
  - >-
    A three-spatial-dimensional static Green function is not by itself a
    3+1-dimensional Lorentzian gauge propagator. A propagator additionally
    requires an action, time operator, signature, gauge fixing, boundary or
    causal prescription, and source convention.
  - >-
    A quadratic color-diagonal inverse about zero background does not establish
    the full nonlinear non-Abelian action. Local F-squared completion and any
    fractional covariant completion require their own gauge-covariant
    construction and coefficient ledger.
  - >-
    YM2 was already opened and executed through an alias-only compatibility
    replay during P158's downstream graph audit. No fresh comparator blinding
    is claimed; known literals, outputs, and narrative conclusions are barred
    from candidate selection and acceptance thresholds.
