  - {id: C, description: Derive a typed tensor-product static Green theorem for an independently supplied color metric and scalar Riesz operator only if that composition is not already explicit and reusable.}
  - {id: D, description: Derive a separately declared local Yang-Mills quadratic operator and gauge-fixed static limit in supplied 3+1 spacetime while preserving coefficient gauge and source freedom.}
  - {id: E, description: Define a genuinely gauge-covariant nonlocal fractional kinetic operator only if its action domain covariance and nonlinear completion can be stated without retrofitting accepted claims.}
