question: >-
  Reproduce and independently audit M1's claimed SU(2)_L times U(1)
  gauge-boson mass matrix, and determine the most general exact statement
  relating a declared scalar kinetic term and vacuum vector to a positive
  gauge-orbit Gram matrix, its stabilizer kernel, a separately declared gauge
  kinetic metric, and the conditional doublet specialization without
  importing a physical Higgs mechanism, pole mass, or Standard Model
  interpretation that the accepted framework does not supply.
invariants:
  - >-
    C-NAG-001 supplies exact non-Abelian covariance, curvature, and a
    projected carrier, but no scalar matter action, vacuum, kinetic
    normalization, gauge-boson mass mechanism, or physical dictionary.
  - >-
    C-REP-002 supplies the Pauli-half SU(2) doublet representation and an
    independently declared Abelian generator normalization, but no action,
    vacuum expectation value, gauge dynamics, or physical electroweak sector.
  - >-
    C-GAU-001 supplies local U(1) covariance only, and C-QBL-001 supplies a
    conditional quartic complex-scalar equation only. Neither selects an
    SU(2) doublet, hypercharge, nonzero vacuum, condensate ontology, or
    gauge-field mass.
  - >-
    For a declared scalar kinetic term and Hermitian generators, the
    gauge-field quadratic form must be derived with the one-half real-vector
    convention explicit. Its kernel is the vacuum stabilizer; its raw
    eigenvalues are physical mass squares only in a canonically normalized
    gauge basis.
  - >-
    A general positive gauge kinetic metric K changes the pole-mass question
    to the generalized eigenproblem M2*x=lambda*K*x. A massless algebraic
    direction alone does not establish a physical photon or observation.
  - >-
    The queue preexposes M1's declared doublet, hypercharge, vacuum, neutral
    matrix, eigenvalues, mixing relation, and rho identity. Those values are
    recorded and excluded from candidate selection. The source and dossier
    bodies, exact AST data flow, conventions, and guard construction remain
    unopened until this contract is frozen and committed.
