distinct_positive_object: >-
  C-GSM-001 derives the real gauge-field quadratic matrix as twice the real
  Gram matrix of coupled vacuum-orbit vectors, proves PSD and exact equality of
  its kernel with the coupled stabilizer, separates it from a positive gauge
  kinetic metric and its generalized eigenproblem, and specializes it to the
  declared Pauli-half SU2 plus commuting U1 lower doublet. It also makes the
  neutral sign convention basis-covariant and supplies the exact limit and
  representation countermodels absent from existing APIs.
