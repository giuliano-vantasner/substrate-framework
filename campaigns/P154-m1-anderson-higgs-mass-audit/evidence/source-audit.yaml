  - {id: CHECK3, verdict: qualified_exact, mapping: C-GSM-001, correction: negative_offdiagonal_is_fixed_basis_convention_not_a_physical_sign}
  - {id: CHECK4, verdict: qualified_exact, mapping: C-GSM-001, correction: algebraic_null_and_nonzero_modes_not_photon_and_Z_identifications}
  - {id: CHECK5, verdict: qualified_exact, mapping: C-GSM-001, correction: canonical_basis_rotation_not_physical_Weinberg_angle_without_kinetic_and_field_dictionary}
  - {id: CHECK6, verdict: qualified_exact, mapping: C-GSM-001, correction: stabilizer_rank_not_a_physical_Goldstone_or_Anderson_Higgs_count}
  - {id: CHECK7, verdict: qualified_exact, mapping: C-GSM-001, correction: rho_one_is_representation_and_canonical_kinetic_conditional}
  - {id: CHECK8, verdict: rejected_as_described_but_valid_magnitude_mutation, mapping: C-GSM-001, correction: pure_sign_flip_preserves_zero_mode_and_is_a_basis_congruence}
  - {id: CHECK9, verdict: qualified_exact_limit, mapping: C-GSM-001, correction: zero_declared_vacuum_not_evidence_for_a_physical_condensate_phase}
