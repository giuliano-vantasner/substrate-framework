source_unit: M1
headline_verdict: qualified_with_corrected_conditional_claim
accepted_content:
  - the exact quadratic form produced by the separately declared scalar kinetic term representation couplings and constant vacuum vector
  - the real-field one-half convention in which the mass matrix is the Hessian of that quadratic form
  - the charged and neutral matrix entries for the declared Pauli-half doublet Y=1 and lower-component vacuum
  - the exact neutral kernel massive eigenvector and rho identity when the gauge kinetic metric is canonical
  - the zero-vacuum limit of the declared quadratic form
corrected_content:
  - >-
    The source matrix is a gauge-orbit Gram matrix. Its null directions are the
    vacuum stabilizer, while its nonzero quadratic coefficients become
    physical pole masses only after a compatible gauge kinetic action and
    canonical normalization are separately supplied.
  - >-
    With a positive gauge kinetic metric K, the mass question is the
    generalized eigenproblem M2*x=lambda*K*x. Raw eigenvalues of M2 are not
    basis-invariant masses unless K is the identity in that field basis.
  - >-
    The negative neutral off-diagonal follows in the source's fixed generator
    and B-field convention, but B mapped to -B flips that sign by congruence
    without changing determinant, generalized eigenvalues, or the stabilizer.
  - >-
    The source's rho=1 identity is conditional on the doublet representation,
    lower vacuum, couplings, and canonical kinetic normalization. It is not a
    universal consequence of a generic complex order parameter.
rejected_content:
  - >-
    C-QBL-001 does not force a physical complex condensate, promote it to an
    SU2 doublet, select Y=1, or establish a nonzero ground-state vacuum. The
    source's EM6 inheritance and medium-condensate premise are declarations.
  - >-
    C-NAG-001 and C-REP-002 supply exact gauge and representation algebra but
    explicitly do not supply a scalar action, vacuum dynamics, gauge kinetic
    coefficient, mass mechanism, weak boson, or substrate realization.
  - >-
    A zero eigenvalue of the declared algebraic matrix establishes an
    unbroken stabilizer direction. Naming it a physical photon and the other
    directions W or Z requires a separately governed field and observable
    dictionary.
  - >-
    CHECK8 does not test the advertised wrong-sign mutation. A pure sign flip
    has determinant zero; the executed +g*g_prime/2 mutation also changes the
    magnitude. The source's claim that only the negative sign yields a zero
    eigenvalue is false and basis dependent.
  - >-
    Passing the declared matrix algebra does not close W7's physical mass
    residual, prove an Anderson-Higgs mechanism, build electroweak unification,
    or establish that four physical forces arise from the sine-Gordon root.
predicate_adjudication:
  - {id: CHECK1, verdict: qualified_exact, mapping: C-GSM-001, correction: declared_kinetic_term_and_vacuum_not_a_derived_medium_ground_state}
