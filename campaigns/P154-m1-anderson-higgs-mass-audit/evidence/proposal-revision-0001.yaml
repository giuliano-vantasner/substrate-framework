exact_statement: >-
  Let a nonzero finite-dimensional complex inner-product carrier have a
  nonempty supplied family of exact Hermitian generators T_a, exact real
  nonzero couplings g_a, and an exact nonzero declared vacuum vector phi0.
  Conditional on the scalar covariant kinetic term with
  D_mu*phi0=-i*sum_a(g_a*A_mu^a*T_a)*phi0, write its real gauge-field quadratic
  part as one half A^T*M2*A. Then
  M2_ab=g_a*g_b*phi0_dagger*{T_a,T_b}*phi0, equivalently twice the real Gram
  matrix of u_a=g_a*T_a*phi0. It is real symmetric positive semidefinite and
  x^T*M2*x=2*norm(sum_a x_a*u_a)^2 for every real coefficient vector x. Thus
  its kernel is exactly the coupled vacuum stabilizer; with independent
  generators and nonzero couplings its nullity is the stabilizer dimension in
  the supplied generator span. If the real gauge fields instead have a
  separately declared symmetric positive-definite kinetic metric K, their
  quadratic mass parameters are the generalized eigenvalues of
  M2*x=lambda*K*x, not the raw eigenvalues of M2 unless K is identity. Under a
  real invertible field change A=S*A_new, both forms transform by congruence,
  M2_new=S^T*M2*S and K_new=S^T*K*S, preserving generalized eigenvalues and
  nullity. For T_i=sigma_i/2, T_4=I/2, couplings (g,g,g,g_prime), and
  phi0=(0,v/sqrt(2)), the canonical M2 has charged diagonal entries
  g^2*v^2/4 and neutral block v^2/4 times
  [[g^2,-g*g_prime],[-g*g_prime,g_prime^2]], rank three, null vector
  proportional to (g_prime,g), nonzero neutral eigenvalue
  (g^2+g_prime^2)*v^2/4, and the conditional rho identity one. The congruence
  B mapped to -B flips the neutral off-diagonal sign while preserving these
  invariants. These are exact conditional quadratic identities. They do not
  derive the scalar action or potential, prove phi0 is a ground state or
  condensate, supply a gauge kinetic action, establish a spectral pole or
  Higgs particle, identify photon W or Z fields, select the Standard Model,
  or realize a substrate mass mechanism.
