[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Progressive disclosure memory management for autonomous agents"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "click>=8.0",
  "PyYAML>=6.0",
]

[project.scripts]
memory = "agent_memory.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
