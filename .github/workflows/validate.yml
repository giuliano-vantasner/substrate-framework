name: Repository validation

on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pipx
        run: python -m pip install --disable-pip-version-check pipx==1.16.7

      - name: Bootstrap the repository
        run: scripts/bootstrap.sh

      - name: Run impact-scoped pull-request validation
        if: github.event_name == 'pull_request'
        env:
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_changed.py --base "$VALIDATION_BASE_SHA" --head HEAD

      - name: Run periodic or manually requested full validation
        if: github.event_name != 'pull_request'
        run: scripts/validate.sh --full
