name: Contribution task or research proposal
description: Create the canonical issue required before a person or agent submits a pull request
title: "[Contribution] "
body:
  - type: markdown
    attributes:
      value: |
        Every pull request requires one canonical issue that exists before even a draft PR is submitted. Use a distinct merger by default; the repository owner or user may explicitly authorize the authoring agent to self-merge without supplying an independent scientific review.
  - type: textarea
    id: objective
    attributes:
      label: Positive objective
      description: State the concrete object or improvement this work must deliver.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and write boundary
      description: Name the intended files, systems, claims, and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority, dependencies, and provenance
      description: Name the base release, accepted claims or imports, source artifacts, and dependencies.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success and validation gates
      description: State the positive done condition, tests, verifiers, consumer replay, and documentation or memory synchronization required.
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: Coordination and merger handoff
      description: Name the contributing agent, planned branch, overlapping work to avoid, and the intended merger or explicit owner-authorized self-merge.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Collaboration acknowledgements
      options:
        - label: I searched existing issues, pull requests, claims, campaigns, and repository memory for overlap.
          required: true
        - label: I will not submit even a draft pull request until this issue exists.
          required: true
        - label: The merger will be distinct unless the repository owner or user explicitly authorizes self-merge.
          required: true
