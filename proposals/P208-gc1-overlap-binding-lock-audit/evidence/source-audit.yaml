headline_verdict: corrected_qualified
retained:
  - The declared quartic potential has exact local curvature deficit D(f)=f^2/4.
  - A separately declared linear local multiplier c=lambda*f gives D=c^2/(4*lambda^2), including the source normalization lambda=1.
  - The exact quartic sech fluctuation potential has one global minimum at its supplied center.
  - Independent binding and multiplier fields break the local identity.
  - The finite exact-sine computation exits successfully and reports the recorded sampled spectra and overlaps.
corrected:
  - The source headline writes D=y^2/4, but y_n is an integrated normalized expectation while the derived object is the pointwise multiplier c(x); these types cannot be interchanged.
  - The arbitrary-profile phrase means arbitrary field substitution inside one fixed quartic potential and one fixed linear coupling declaration, not arbitrary potentials coupling maps or condensate solutions.
  - The exact-sine numeric section has D_sine=(1-cos(f))/2, which equals f^2/4 only at leading small amplitude and therefore does not measure the exact quartic lock.
  - RMS about the origin divided by mean absolute coordinate is at least one for every normalized density by nonnegative variance; a perfectly relocated point density saturates one, so the predicate cannot diagnose relocation.
  - Eight frequency samples and one grid refinement do not prove any-frequency behavior or a power-law lower bound.
  - The thresholds spread<10 and min(y*ell*kappa)>0.1 are source-selected and have no analytic universality proof.
  - Mono-centricity is exact for C-QBL-001's quartic sech profile, not for every one-condensate profile or arbitrary potential.
  - C-QBL-001 and C-QBL-002 supply existence domains but no stability window.
  - The second-object algebra is a valid conditional countermodel but does not establish coexistence stability or identify the separately planted C-OVL-002 wells as solitons.
rejected:
  - D=c^2/4 implies that an arbitrarily shallow one-dimensional well has no localized mode.
  - Light and bound are contradictory in the declared mathematical family.
  - The source finite sweep proves exponential hierarchy inaccessible for every omega.
  - MH2's separately declared translated wells are generated by the one-core condensate or are exactly a proved multisoliton solution.
  - The quartic Hessian levels or exact-sine sampled modes are physical generations masses or Yukawa states.
decisive_counterevidence:
  - C-OVL-002's exact Poschl-Teller ground eigenvalue is negative for every positive well depth including arbitrarily shallow depth.
  - C-QBL-003's two levels remain below threshold for every positive kappa while C-OVL-001's profile overlaps scale linearly to zero as kappa tends to zero.
  - nonlinear or independent coupling maps and an epsilon*f^6 potential deformation change the local relation exactly.
  - the exact-sine deficit differs from the quartic deficit beginning at order f^4.
physical_ceiling:
  - no_stability_generation_Yukawa_mass_hierarchy_or_mixing
  - no_multisoliton_coexistence_or_count_selection
  - no_Standard_Model_observation_or_substrate_realization
