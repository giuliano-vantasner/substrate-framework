possible_numeric_obligation: >-
  Source inspection revealed a finite exact-sine fluctuation calculation,
  distinct from the quartic symbolic model. Its source equation is
  f_xx=sin(f)/2-omega^2*f on a symmetric Dirichlet box, with the fluctuation
  operator -d2+cos(f0)/2-omega^2 and threshold kappa^2. The source uses a
  uniform second difference, DOP853 background integration at rtol 1e-11 and
  atol 1e-13, and eigh_tridiagonal. The source's one-point N refinement may be
  reproduced as finite evidence, but the exact Jensen inequality, exact
  Pöschl shallow-well countermodel, and exact quartic scaling family are the
  decisive oracles for the claimed universal no-go.
post_source_obligations:
