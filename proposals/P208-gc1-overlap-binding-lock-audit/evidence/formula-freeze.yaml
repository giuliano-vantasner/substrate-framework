  - mutate_a_density_by_translation_and_show_the_source_ratio_still_cannot_drop_below_one
  - use_C_OVL_002_to_show_every_positive_Poschl_depth_has_a_negative_ground_eigenvalue
  - keep_exact_sine_numeric_evidence_separate_from_the_quartic_identity
  - show_the_quartic_bound_levels_remain_below_threshold_for_every_positive_kappa_while_the_declared_profile_overlaps_scale_to_zero_with_kappa
  - classify_the_fixed_eight_frequency_sweep_as_sampled_evidence_not_an_all_frequency_theorem
