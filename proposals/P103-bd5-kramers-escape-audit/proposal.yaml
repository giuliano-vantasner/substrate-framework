  - accepted dependency closure and nonduplication against C-RG-001, C-RG-002, C-COL-001, C-TH-002, C-COH-001, and C-PRB-001
  - exact backward-equation derivation, boundary conditions, dimensions, positivity, additive-potential invariance, soluble limits, and mutation sensitivity
  - independent quadrature and BVP agreement with solver-status, tolerance, mesh, domain, and error gates declared before comparison
  - honest separation of uncensored first passage, finite-horizon censoring, restricted means, completed-only statistics, hazards, and asymptotic rates
  - assumption and parameter economy with damping, bath, boundary, material, population, and event premises retained explicitly unless derived
  - canonical API reuse, consumer classification, and no concept selection by the source tally or fitted Arrhenius slope
