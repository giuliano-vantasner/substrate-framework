  - C-NVP-002
  - C-RGE-005
  - exact finite-matrix trace, tensor-product, direct-sum, Gram-matrix, affine-family, dimension, and rank algebra
  - separately supplied exact product representations, charges, multiplicities, statistics, sector couplings, regulator and matching data as conditional inputs
  - pinned source inventory and exact Git metadata at substrate@6d1f4e0
  - GK3D4 and its hash-pinned dependencies and reverse consumers as noncanonical evidence only after this freeze
candidates:
  - id: A
    description: Reproduce GK3D4 exactly and audit every generator, trace, dimensional predicate, sector transfer, coupling formula, assertion, and headline conclusion edge.
  - id: B
    description: Compose the accepted D4 affine kinetic theorem separately for each declared gauge factor while retaining factor-specific invariant matter weights, reference values, couplings, and matching scales.
  - id: C
    description: Derive an exact product-representation kinetic Gram ledger whose entries are supplied matter-weighted generator traces, with block diagonality and cross-factor mixing decided by the actual representation rather than factor labels.
  - id: D
    description: Test the claimed universal construction against different representations, spectator multiplicities, statistics, masses, charges, regulators, and affine boundary data that preserve the named local factor algebra.
  - id: E
    description: Compare the source 3/8 coupling-angle interpretation with C-REP-001's conditional common inverse-trace law and Abelian normalization covariance.
  - id: F
    description: Determine whether Candidates B and C add a distinct reusable theorem or are already complete compositions of C-PGA-001, C-REP-001, C-VAC-002 through C-VAC-004, and C-RGE-005.
  - id: G
    description: Close source, claim, dependency, consumer, disposition, queue, release, documentation, memory, compatibility, and debt governance without blanket promotion.
