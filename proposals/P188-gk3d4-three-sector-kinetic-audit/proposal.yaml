source_units: [GK3D4]
question: >-
  Does hash-pinned GK3D4 derive one common four-dimensional induced kinetic
  construction for U(1), SU(2), and SU(3), including a physical 3/8 weak-angle
  relation, or does it compose convention-specific generator traces with an
  Abelian loop while leaving matter representations, spectator multiplicities,
  sector couplings, affine matching data, and physical identifications supplied?
invariants:
  - C-PGA-001 supplies a faithful local su3 direct-sum su2 direct-sum u1 matrix representation but no matter representation, action, kinetic term, or coupling relation.
  - C-DIM-009 proves that a trace factor is dimensionless but also that generator rescaling changes the trace quadratically and the coupling inversely, preserving only the product g squared times the trace index.
  - C-VAC-002 supplies a conditional charged-Dirac D4 one-loop form factor and convention-invariant group weight while leaving the representation, group, finite matching, total kinetic coefficient, and physical sector free.
  - C-VAC-003 supplies an affine one-connection kinetic family whose scalar and Dirac invariant weights, reference value, matching scales, group, and matter content remain independent inputs.
  - C-VAC-004 preserves the affine reference coordinate and all scale identifications even after one-loop scale matching.
  - C-NVP-001 and C-NVP-002 are exact complex-scalar D2 representation-weighted loop theorems and do not lift themselves to D4.
  - C-REP-001 makes a trace angle equal a coupling angle only under a separately supplied common inverse-trace coefficient law and preserves positive Abelian normalization covariance.
  - C-RGE-005 accepts factorwise Dynkin indices with spectator degeneracies as supplied product-matter data and derives neither field content, matching, common normalization, nor unification.
  - Distinct simple or Abelian factors may have independent matter weights, couplings, local and finite counterterms, and matching boundaries unless an accepted action or symmetry relates them.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral; immutable legacy-name stops are version-only compatibility evidence and never scientific candidate failures.
allowed_imports:
  - C-GAU-001
  - C-LIE-001
  - C-REP-001
  - C-REP-002
  - C-PGA-001
  - C-DIM-009
  - C-VAC-001
  - C-VAC-002
  - C-VAC-003
  - C-VAC-004
