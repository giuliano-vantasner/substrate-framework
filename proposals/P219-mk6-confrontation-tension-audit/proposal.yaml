question: >-
  Which exact convention-safe BPS, shared-functional, and signed-difference
  statements survive MK6, and does its physical mass, binding, or
  double-counting diagnosis have accepted dependency closure?
invariants:
  - C-BPS-001 uses lambda_BPS squared times pi to the fourth and gives a lower bound without physical coefficient closure or attainment.
  - C-VEC-002 maps lambda_A=pi^2*lambda_BPS and does not permit the two coordinates to be substituted interchangeably.
  - C-GSK-001 is one declared shared-profile L2+L4+L6+L0 functional with separately supplied coefficients.
  - C-GSK-002 supplies only finite-domain stationary branches at independently supplied coefficients and no physical binding prediction.
  - C-RDIFF-001 types signed differences conditionally while C-RDIFF-002 remains a reduced-model coordinate rather than a physical energy.
  - MK1 through MK5 supply no accepted physical pion nucleon vector or generalized-model coefficient closure.
  - A lower bound component cannot be added to a separately minimized sector value unless one common functional state and decomposition justify that operation.
  - Mutable integration uses trapezoid_integral or numpy.trapezoid and immutable compatibility events are never scientific failures.
allowed_imports:
  - C-BPS-001 through C-BPS-003 at their exact bound attainment and controlled-expansion ceilings
  - C-VEC-002 for lambda_A and lambda_BPS conversion only
  - C-GSK-001 through C-GSK-002 at their exact conditional and resolution-bounded ceilings
  - C-RDIFF-001 through C-RDIFF-002 for declared signed-difference bookkeeping only
  - C-SK-001 only at its conditional common-unit identity ceiling
  - general exact facts about infima of sums of real functionals on one nonempty admissible set
  - hash-pinned MK6 only after the committed freeze
candidates:
  - {id: A, description: Recompute every BPS substitution in the accepted lambda_BPS convention before any numeric comparison.}
  - {id: B, description: Treat MK6 formulas in lambda_A coordinates and convert the C-BPS-001 bound coefficient explicitly.}
  - {id: C, description: Prove a shared-admissible-set infimum-of-sum theorem that distinguishes one joint functional from adding separately minimized sector values.}
  - {id: D, description: Apply the exact C-RDIFF-001 ledger only to explicitly declared common normalization and state assignments.}
  - {id: E, description: Retain conditional algebra but remove empirical pion nucleon electron and binding interpretations when imports are unaccepted.}
  - {id: F, description: Add no new claim or API if C-BPS C-VEC C-GSK C-RDIFF and C-SK already own every exact survivor.}
  - {id: G, description: Mutate lambda convention coefficient ownership and shared-minimizer assumptions and require the diagnosis to change.}
  - {id: H, description: Give MK6 an individual terminal disposition and replay MR1 through MR6 without granting backward authority.}
uniqueness_evidence: null
selection_criteria:
  - accepted convention and dependency closure
  - exact field functional and common admissible-set typing
  - assumption and parameter economy
  - distinction between bound value attained energy component and joint minimum
  - dimensional normalization and state-map consistency
  - mutation sensitivity to pi-squared and common-minimizer premises
  - novelty beyond accepted BPS generalized-model difference and unit claims
  - terminal consumer queue and memory closure
