campaign: P219
provisional_claim: C-VAR-002
decision: retain_for_implementation_and_independent_review
scope: >-
  Exact finite-family theorem for real-valued functionals bounded below on one
  common nonempty admissible set: infimum of the sum is at least the sum of
  component infima; equality is equivalent to a common minimizing sequence,
  and under joint attainment it is equivalent to a common minimizer.
