  - KI2's local epsilon is a defined dimensionless monomial with an arbitrary normalization and is not C-BPS-003's abstract expansion coordinate.
  - KI2's simultaneous lambda-mu flow changes the accepted BPS density square residual and bound, so it compares parameterized theories rather than acting as a symmetry of one fixed accepted theory.
  - MK1 supplies only a conditional convention-covariant mass match and no accepted medium physical-pion decay-scale or BPS coupling map.
  - MK2 supplies conditional vector-current elimination but no accepted physical HLS omega baryon-current N_c KSRF F_pi mass coupling or medium map.
