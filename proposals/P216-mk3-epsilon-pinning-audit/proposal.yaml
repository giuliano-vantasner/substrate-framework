  - C-SK-001 gives F_pi/e=16*pi*E_e only iff two separately supplied positive mass premises are equated and retains E_e as an empirical input.
  - A supplied positive scale s and product p determine a declared quotient s/p but do not derive either input or identify it with a physical observable.
  - Pending MK4 through MK6 and MR units grant no backward authority.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral and immutable compatibility events never count as scientific candidate failures.
