claim: C-M5S-002 (scale selection, candidate E)
verdict: >
  Refuted within the accessible regime.  Family U -- the stationary-point
  family containing the certified P240 R=6 root -- has no stabilization
  radius for R <= 14: its soft eigenvalue lambda_1 rises from -6.26e-2
  (R=6.05) to -1.42e-3 (R=14) with geometrically decaying increments
  (ratio drifting 0.83 -> 0.87 per 0.25-0.5 step), whose partial sums
  bound all future rise below |lambda_1(R=14)|.  The eigenvalue
  approaches a strictly negative asymptote of order -(1..3)e-4 rather
  than crossing zero.  Per the frozen interpretation rule this is a
  named-mechanism refutation, not a conversion into another
  construction.
established_along_the_way:
  - >
    The attempt-0004 U-chain replays bit-for-bit (13 radii, zero energy
    mismatches, thread-pinned environment), then extends cleanly to
    R=14 with continuous family monitors throughout: soft-mode overlap
    >= 0.9947 at every step, energy interpolation gaps <= 0.041,
    lambda_min/lambda_2 quoted per row.
  - >
    Order artifact exposed: the apparent U-S energy-gap closure near
    R=12-14 came from comparing 0042 order-16 S roots against order-20
    U roots.  Same-order (20) splittings are Delta_E = +0.260 (R=8)
    and +0.265 (R=10).
missing_construction: >
  Either continuum evidence that lambda_1(U) < 0 for all finite R
  (closing the R>14 loophole), or a box-independent scale construction
  that does not require branch stabilization.
declared_caveat: >
  The asymptotic argument is numerical on R in [6,14] at order 20 with
  pinned threads, not a continuum proof; stabilization beyond R=14 is
  outside the certifiable domain and is recorded as the residual
  hypothesis the refutation rests on.
candidate_F_registered_separately: >
  The same-order U-S splitting data motivate candidate F (Lambda^2 :=
  E_U - E_S), registered in proposal.yaml with frozen criteria before
  the R=12/14 order-20 S-root comparators were evaluated.
