question: >-
  Reproduce and independently audit S2's claim that a hedgehog Skyrmion's
  fluctuation or breather modes constitute a meson spectrum, and determine the
  exact action, stationary background, perturbation variables, kinetic inner
  product, self-adjoint domain, angular channels, continuum and resonance
  definitions, scale map, and quantization or particle dictionary needed to
  distinguish a classical soliton-mode spectrum from vacuum meson masses.
invariants:
  - >-
    C-MOD-001 fixes the exact mixed-term-complete self-adjoint radial Hessian,
    positive declared weight, Green form, Derrick ceiling, and zero continuum
    edge for one declared massless Option-C radial model. A positive finite-box
    level is not a bound state.
  - >-
    C-MOD-002 supplies qualified float64 evidence for one stationary massless
    hedgehog branch and its inverse-wall-squared continuum ladder. It supplies
    no resonance, particle, nucleon, Roper, or meson theorem.
  - >-
    C-SCL-001 keeps the inverse-time scale, action scale, background energy,
    and quantization rule explicit. A squared classical eigenvalue is not an
    energy and cannot select a physical mass ratio.
  - >-
    C-SYM-001 C-CHI-001 C-BRK-001 C-CHI-002 and C-GMR-001 are conditional
    classical symmetry, coordinate, local-curvature, and parameter ledgers.
    They derive no physical pion, sigma, meson, chiral action, Skyrmion, or
    absolute scale.
  - >-
    C-RPROF-001 and C-RPROF-002 are declared reduced-profile surfaces with
    explicit physical ceilings. They do not construct the full three-
    dimensional fluctuation operator or a particle spectrum.
  - >-
    Pending B1 grants no Berry connection, collective quantization, baryon,
    spin-statistics, or physical-state premise. Qualified PG1 PG2 and PG3 grant
    only their accepted claim mappings.
  - >-
    A fluctuation spectrum requires the second variation of a declared
    time-dependent action about an actually stationary background, a positive
    kinetic form, a self-adjoint domain, and a declared channel decomposition.
    Bound states, box levels, resonances, and continuum thresholds are distinct
    predicates.
  - >-
    Vacuum small-field masses and localized-soliton fluctuation frequencies
    inhabit different spectral problems. Identifying either with physical
    mesons additionally requires a state, quantization, normalization, scale,
    and observable dictionary.
  - >-
    The S2 scientific body, check literals, numeric outputs, and comparator
    values remain unopened at freeze. Queue metadata and a prior lexical audit
    exposed only that immutable S2 contains three direct legacy NumPy
    trapezoid calls.
