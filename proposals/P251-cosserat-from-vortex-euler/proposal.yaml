invariants:
  - no edits to accepted claims, campaigns, generated docs, or migration queues
  - constant-density incompressible Euler is the sole microscopic dynamics
  - every emergent Cosserat statement is conditional on explicitly declared ensemble premises; no hidden fitted constant; bending/twist moduli and microinertia are derived from the Biot-Savart self-energy, never postulated
  - material frame indifference and isotropy of the coarse-grained energy; SO(3) frame covariance of triad transport
  - the fluid limit (L_v -> 0) recovers Euler; the structure-free limit recovers the P242 Navier-Cauchy sector (C-ELS conditional machinery consistency)
  - exact claims use SymPy oracles; numeric claims use scipy with declared refinement and mutation probes; the incompressible branch and compressible branch are never mixed
  - EPS theorems are imported as declared existence input from in-hand verified sources; this campaign does not reprove or weaken them
allowed_imports:
  - sympy/numpy/scipy stack in .venv
  - MIT 2.25 Section 9 classical statements (Kelvin theorem, Biot-Savart field, frozen-line transport) as declared classical mechanics
  - EPS existence theorems (1210.6271, 1003.3122, 1505.01605) as declared existence input for the N7 premise layer only
  - src/substrate_framework/homogenization.py sphere moments and coefficient-matching pattern (conditional unpromoted infrastructure, P242 provenance)
  - src/substrate_framework/numerics.py and verification.py (CheckLedger, IVP evidence) shared machinery
