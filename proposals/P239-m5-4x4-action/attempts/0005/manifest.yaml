  - proposals/P239-m5-4x4-action/attempts/0005/result.json
next_if_success: >-
  Freeze an axisymmetric fixed-J field contract using the exact M5.17
  equivariant half-plane representation, then relax every eligible spatial
  and boost component with regular axis parity.
next_if_failure: >-
  Reject Candidate G if no projector-defined Lorentz scalar reproduces the
  full M5.17 potential off shell; compare an explicitly auxiliary covariant
  spatial metric rather than silently weakening the reduction gate.
verdict: >-
  Candidate G's projected Landau-de Gennes potential passed all 14 exact
  covariance, reduction, vacuum, coefficient, and mutation checks. It
  recovers the full M5.17 potential off shell, pins the selected g eigenvalue,
