verdict: >-
  Candidate I fails the branch gate. At zeta=1e-4 the minimum exterior gap is
  5.44e-4; at zeta=1e-2 it is 2.11e-3, both below 0.02 and both nonstationary.
  At each minimum all three eigenvalues coalesce near 0.44 while tangent
  splitting is below 1.7e-4, so the guard is correctly negligible: this is an
  isotropic M5.17 melt surface, not a clock-active permutation. A spectral
  guard cannot exclude it while remaining exactly inactive on the retained
  melt sector. Candidate I is rejected.
diagnosed_layer: representation and auxiliary field content
next_route: >-
  Make the continuous clock-axis label an explicit constrained spacelike
  auxiliary field which remains defined when M becomes isotropic.
