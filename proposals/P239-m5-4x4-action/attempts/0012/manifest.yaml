verdict: >-
  Candidate J fails the finite-frequency stationarity gate. After 8000
  L-BFGS-B iterations its relative gradient is 3.97e-3 and inertia has grown
  to 3286 while omega falls to 0.00304. The auxiliary label passes through an
  isotropic melt and emerges on a zero eigenline of a permuted uniaxial
  vacuum; rotating about it is an extensive ordinary rotation at zero M5.17
  potential cost. The local covariant lift survives, but it needs an
  on-shell-zero axis-lock term to distinguish the physical director.
diagnosed_layer: candidate clock energetics
next_route: >-
