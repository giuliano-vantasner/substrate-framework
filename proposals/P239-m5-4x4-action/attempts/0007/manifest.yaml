frozen_action: >-
  Let tau=Tr(P_t X), X=eta^-1 M, A(tau)=exp(2 alpha (tau-g)), and H_G be the
  nonnegative Candidate-G Hamiltonian. Add
  L_tau=-(kappa_tau/2) eta^munu partial_mu tau partial_nu tau and multiply the
  complete G matter Lagrangian by A. The inertial-frame Hamiltonian is
  A H_G+(kappa_tau/2) sum_mu (partial_mu tau)^2 for A>0,kappa_tau>0.
