  - two positive sources have U=-alpha^2*m1*m2/(pi*kappa_tau*r)
  - flipping one source sign flips the interaction and deleting alpha removes it
  - the accepted C-KRN-001 and conditional C-IGR-004/C-GRV-002 bridges are typed without importing a fitted number
