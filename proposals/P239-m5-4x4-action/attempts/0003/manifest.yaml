verdict: >-
  Candidate E alone is rejected as the completed action: its vacuum-orbit
  curvature density starts at fourth perturbative order, supplies no
  linearized massless operator, and has only 1/R Derrick scaling. Candidate F
  adds one positive projector stiffness. The term is a local Lorentz scalar,
  is positive in the Hamiltonian, vanishes identically throughout the
  uniform-time-row 3x3 sector, supplies the Laplace operator, and combines
  with curvature energy to give a unique strict finite scale at fixed J in
  the exact scale reduction. Existence of the full stationary profile and
  relaxed pair remains unproved.
