frozen_definitions:
  metric: eta_ab=diag(-1,1,1,1)
  field: M_ab is a real symmetric covariant rank-two field
  derivative: D_mu_ab=partial_mu M_ab is symmetric in a,b
  eta_commutator: '[A,B]_eta = A eta^{-1} B - B eta^{-1} A'
  curvature: F_munuab='[D_mu,D_nu]_eta_ab'
  source_symmetries:
    - F_munuab=-F_numuab
    - F_munuab=-F_munuba
  absent_source_symmetries:
    - no pair-exchange identity F_munuab=F_abmunu
    - no algebraic Bianchi identity F_[munua]b=0
  baseline_action: >-
    L0=-sum_(mu<nu) eta^mumu eta^nunu
    F_munuab F_munu^ab - V_spec(M), equivalently the full four-index
    metric contraction up to the source's ordered-pair normalization.
  spectral_potential: >-
    V_spec=sum_(p=1)^4 (Tr((eta M)^p)-sum_i Lambda_i^p)^2 with preferred
    mixed-tensor spectrum Lambda=(g,1,delta,0); independent term weights are
    not fixed by the source.
  spatial_reduction: >-
    A uniform time row reduces the eta commutator and internal contraction
    exactly to the M5.17 plain 3x3 commutator/Frobenius curvature action.
    The later M5.18 trace-power potential does not equal M5.17's quartic
    Landau-de Gennes potential off shell.
  m5_17_spatial_potential: >-
    V_LdG(S)=a Tr(S^2)-b Tr(S^3)+c Tr(S^2)^2-(a-b+c), with
    b=beta*c, a=(3b-4c)/2, c>0, and 0<beta<2. Its established exterior is
    the uniaxial pure-director field S=n n^T with spectrum (1,0,0).
  source_tension: >-
    M5.18 later replaces V_LdG by a trace-power potential that pins the
    biaxial mixed spectrum (g,1,delta,0). That replacement is proposal input,
    not an accepted framework claim, and it does not satisfy P239's stricter
    exact-M5.17 off-shell reduction gate. A moving biaxial tangent frame is
    also singular at a hedgehog pole when delta is nonzero. Candidate G
    therefore retains the M5.17 uniaxial exterior and covariantly lifts its
    full potential with the timelike spectral projector.
scope_decision:
  parity_even: all independent eta-only quadratic contractions remain eligible
  parity_odd: >-
    Enumerate and record every one-epsilon pseudoscalar contraction, but do not
    select one without a separate parity/chirality rationale because the
    established 3x3 action and issue-147 objective are parity even.
