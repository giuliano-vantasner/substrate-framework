campaign: P221
provisional_claim: C-VAR-003
statement: >-
  For a nonempty common domain X and real functionals A P Q whose infima for
  A, A+P, A+Q, and A+P+Q are finite, define the mixed variational interaction
  I=inf(A+P+Q)+inf(A)-inf(A+P)-inf(A+Q). The corresponding pointwise mixed
  expression vanishes identically, so I is entirely an optimization effect.
  It has no universal sign, even for continuous nonnegative coercive quadratic
  functionals on the real line, and every real value occurs by positive
  scaling of exact positive negative or zero examples. A common minimizer of A
  P Q implies I=0, but I=0 does not imply a common minimizer.
verification: symbolic_verified
review: audited
compatibility: compatible_extension
epistemic: proposed
