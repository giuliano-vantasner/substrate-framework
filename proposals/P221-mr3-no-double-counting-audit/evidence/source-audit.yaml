  MR3.3:
    source_verdict: one_stationary_branch_has_positive_mixed_increment
    framework_verdict: qualified_numeric_example_only
    reason: >-
      Four separate finite-domain solve_bvp stationary branches give a positive
      mixed infimum surrogate at one supplied coefficient set. There is no
      mesh domain tolerance or method refinement and no minimizer proof. The
      sign is not universal; C-VAR-003 supplies exact positive negative and zero
