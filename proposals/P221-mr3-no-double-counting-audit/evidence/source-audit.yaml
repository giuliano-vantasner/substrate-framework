    framework_verdict: qualified_bound_versus_value_example_only
    reason: >-
      The result correctly distinguishes a lower bound from a term value on one
      stationary full-profile branch, but calls that branch an actual minimizer
      without proof. Agreement with MR2 uses the same c6 c0 normalization and
      is dependent regression, not an independent physical route.
  MR3.5:
