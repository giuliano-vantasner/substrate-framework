    framework_verdict: duplicate_conditional_algebra_with_physical_assignment_rejected
    owners: [C-SK-001, MR1]
    reason: >-
      Substituting the declared unit into the declared mass formula gives
      48*pi^3*b identically. This does not derive either physical premise,
      identify the B=1 branch with a nucleon, or make b a prediction.
  MR3.6:
