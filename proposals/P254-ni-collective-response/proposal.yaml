- source: Del Giudice, Preparata and Vitiello, Water as a Free Electric Dipole Laser, PRL61 1085 (1988), DOI10.1103/PhysRevLett.61.1085
  access: Local original PDF/text in /home/administrator/sources/coherence; text snapshot in sources/delgiudice-preparata-vitiello-1988-prl.txt
  extracted: Matter plus quantized EM, water dipoles, long-wavelength approximation and rotational-state truncation; these are not Ni material parameters.
- source: Bressani, Del Giudice and Preparata, First Steps Toward an Understanding of Cold Nuclear Fusion (1989), DOI10.1007/BF02844877
  access: Local original PDF/text; snapshot sources/bressani-delgiudice-preparata-1989-nuovo-cimento.txt
  extracted: Proposed charged-species collective oscillations, screened entrance potential and nuclear-to-electronic transfer; hypotheses requiring material and nuclear bridge verification.
- source: Kim, Generalized Theory of Bose-Einstein Condensation Nuclear Fusion for Hydrogen-Metal System (2011)
  access: Local original PDF/text; sources/kim-generalized-bec.txt; https://lenr-canr.org/acrobat/KimYEgeneralize.pdf
  extracted: Nuclear condensation is assumed and the paper notes incomplete experimental information; distinct from classical vibration or electronic polarization.
- source: GPAW official dielectric and electron-phonon documentation
  access: Complete accessed method snapshots in sources/gpaw-*.txt, official URLs retained in headers
  extracted: RPA density response, optical-limit versus finite-q longitudinal distinction, artificial broadening, PAW electron-phonon vertices and convergence requirements.
- source: Installed GPAW26.7 and configured QE7.5 source
  access: /home/administrator/projects/catalyst-dft/.venv/lib/python3.12/site-packages/gpaw and /opt/qebuild/q-e-qe-7.5
  extracted: Collinear spin/RPA supported; ALDA density kernels one-spin only; response nblocks1 avoids missing BLACS; QE PHonon LSDA/USPP native build and irrep-recovery pilot completed; EPW LSDA e-ph rejected; physical e-ph linewidth machinery distinct from eta.
- source: Catalyst campaign3 actual QE inputs and geometry/recovery code
  access: /home/administrator/projects/catalyst-dft/runs/campaign3; source-backed scout handoffs preserved before execution
  extracted: Historical GBRV40/480Ry protocol and conventional-coordinate geometry; old vacancy structures have frozen Ni and are not full stationary backgrounds; single serial controller is essential.
