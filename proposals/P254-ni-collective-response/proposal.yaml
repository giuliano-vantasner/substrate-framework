  access: attempts/0001/derive_blocks.py, receipt.json and first-run-failure.txt; reusable src/substrate_framework/material_matter_field.py
  extracted: Verified complete-square energy, static bath subtraction and direct/reduced retarded resolvent with exposing mutations; finite conditional identities only, not material calibration or a coherence phase.
- source: NIST Atomic Weights and Isotopic Compositions for Hydrogen
  access: sources/nist-hydrogen-isotopes.txt, complete accessed primary NIST page with URL
  extracted: Neutral H-1 and H-2 atomic masses are explicit model inputs; a mass substitution alone does not model nuclear exchange.
- source: Actual W0 native recovery proofs and W1 preregistration, catalyst-dft@3138edc
  access: https://github.com/giuliano-vantasner/catalyst-dft/tree/3138edc/runs/2026-10-19_collective-response
  extracted: SCF completed-boundary survival, PH native irrep skip and GPAW all-wavefunction recovery are exercised; W1-stationary-inputs.md freezes fully mobile candidate seeds and force/mode sensitivity gates before W1 engine outputs. Pilot Ni1 response remains engineering evidence only.
invariants:
- Preserve Dan's Ni-lattice discovery objective and electron-versus-nuclear mechanism alternatives; no universal negative conclusion from one numerical model.
- Use actual host/loaded structures, mobile local Ni and H, and material-derived coupling/loss; no arbitrary gain, all-to-all coupling or pre-aligned phase as evidence.
- Ordinary extended vibrations, linear response and synchronized driving do not establish spontaneous quantum coherence or enhanced nuclear rates.
- Derive the full operator, static-screening bookkeeping, observables and their units before production dynamics; validate reduction against an independent small-system response.
- Every simulation launches through a labeled herdr tab, with durable systemd ownership, atomic checkpoints, exact input binding and demonstrated crash recovery.
- Existing VM only; benchmark runtime, keep BLAS threads pinned, preserve archives and unrelated edits, and record protocol deviations before consuming their outputs.
allowed_imports:
- Standard spin-polarized PBE Born-Oppenheimer DFT and source-verified PAW/USPP response implementations, at their approximated physical scope.
- Primary coherence proposals as candidate mechanisms, not accepted Ni or LENR facts.
- Existing substrate_framework.numerics and exact linear retained-memory APIs after applicability review; no Euler-to-Ni physical identification.
- SymPy exact finite-matrix identities and SciPy convergence-bounded simulation evidence; no arbitrary phenomenological rate promoted to measured physics.
candidates:
- id: E
  description: Material-specific electronic/electromagnetic collective response coupled to H/Ni motion, screened and dissipative.
- id: N
  description: Quantum-nuclear collective response on the material potential, with explicit nuclear state, isotope/statistics and environmental coupling.
- id: V
  description: Ordinary coupled H/Ni vibrations and host-mediated transport as the explicit null/comparator.
selection_criteria:
- Preserve physical material, symmetries, conservation, passivity, units and consistent screening.
- Determine coupling and loss from calculated or explicitly sourced inputs rather than desired output.
- Validate reduction on a small system before extending object count; vary size independently of density and numerical resolution.
- Generate a discriminating configuration/isotope consequence with uncertainty; do not rank by loading alone.
- Keep the nuclear transition and energy-disposal bridge explicit, without attaching rates to coherence metrics.
