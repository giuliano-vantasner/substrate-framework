question: Which hydrogen-loaded Ni lattice arrangements support a material-calibrated collective response that survives physical losses, and what additional construction connects it to a nuclear process?
positive_objective: Deliver coupled material inputs, actual many-region dynamics and a lattice-design comparison; retain the full LENR parent and its nuclear transition/energy-disposal obligations without substituting phonons or imposed phase locking.
coordination_boundary: Parent owns physical approach, manifest, integration and commits; engineering workers own explicitly assigned disjoint files. Mathematical code and oracles live here; DFT and durable execution live in catalyst-dft issue12.
