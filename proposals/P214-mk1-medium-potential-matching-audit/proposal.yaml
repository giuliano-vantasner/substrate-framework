question: >-
  What exact coefficient relation follows when a declared BPS-Skyrme
  potential mu_BPS^2*(1-cos(F)) is matched to a declared normalized cosine
  mass term, and do accepted claims independently identify that coefficient
  with a substrate-medium parameter or derive a physical pion mass and decay
  scale?
invariants:
