  - C-CHI-002 owns the exact SU(2) trace and kinetic normalization ledger and explicitly derives no chiral action physical pion decay scale coefficient or substrate realization.
  - C-BPS-001 treats positive lambda_BPS mu_BPS and the potential as supplied data and derives no potential selection coefficient value or physical map.
  - C-MED-003 uses a dimensionless 1+1 field and an onsite energy-per-length coefficient mu_medium; it derives no microscopic material or cross-dimensional BPS coefficient map and retains a common coefficient scale.
  - The symbol mu does not identify C-MED-003's onsite coefficient with C-BPS-001's square-root potential coupling; object type dimensions action measure and field map must agree explicitly.
  - Local curvature matching does not establish global potential equality and a downstream tail obtained from the same kinetic and potential coefficients is not independent confirmation of their identification.
  - Pending MK2 and later source units grant no backward authority.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral and immutable compatibility events never count as scientific candidate failures.
