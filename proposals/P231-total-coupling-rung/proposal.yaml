id: P231
base_release: v0.161.0
source_baseline: substrate-framework@7dfe89b
question: >-
  Composing the accepted one-loop inverse-coupling families C-IGR-001..003
  with C-GRV-001's dimensional and additive-baseline ledger into the
  framework's first derived usable total gravitational coupling
  1/G_total = 1/G_baseline + Delta(1/G) as a governed renormalization
  condition: which exact substrate-internal conditions (operator-spectrum
  positivity, cutoff ontology, conformal symmetry structure) select the
  usable scheme set across the three accepted families so the usable scheme
  and its finite parts are outputs of substrate structure rather than
  choices; what is the additive baseline's exact derivation status and
  consequence structure, including the purely-induced reading
  1/G_baseline = 0 with its downstream ceiling; what are the exact
  necessary and sufficient conditions on (N, xi, scheme, m^2, cutoff or
  subtraction scale, baseline) for the attractive Newtonian sign
  1/G_total > 0, including the conformal point xi = 1/6 and the exact-mass
  corrections; and what control ledger derives, cancels, or bounds in a
  predeclared domain every term that can defeat the claimed regime (the
  tau^-1 higher-curvature/cosmological sector and the nonlocal remainder)?
