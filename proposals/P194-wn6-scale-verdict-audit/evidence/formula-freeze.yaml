definitions:
  exact_cosine_potential: V(x)=1-cos(x)
  quadratic_approximation: Q(x)=x^2/2
  quadratic_gap: E(x)=Q(x)-V(x)
  harmonic_phase: phi(t)=P*cos(omega*t+delta)
  full_period: T=2*pi/abs(omega)
exact_targets:
  global_gap_nonnegative: 0<=E(x)
  global_gap_upper_bound: E(x)<=x^4/24
  relative_to_quadratic_bound: x!=0_implies_E(x)/Q(x)<=x^2/12
  tolerance_domain: abs(x)<=sqrt(12*epsilon)_implies_E(x)/Q(x)<=epsilon
  barrier_top_relative_error: E(pi)/Q(pi)=1-4/pi^2
  harmonic_cycle_mean_square: average_over_one_period(phi(t)^2)=P^2/2
  harmonic_rms: rms(phi)=abs(P)/sqrt(2)
  RMS_convention: A_RMS>=0_implies_mean_square=A_RMS^2_and_peak=sqrt(2)*A_RMS
  peak_convention: A_peak>=0_implies_mean_square=A_peak^2/2
  harmonic_pointwise_barrier_consequence: abs(phi)<=pi_implies_A_RMS^2<=pi^2/2
conditional_limb_targets:
  positive_RMS_map: S=A_RMS^2_and_A_RMS>0_implies_S>n_iff_A_RMS>sqrt(n)
  positive_peak_map: S=A_peak^2/2_and_A_peak>0_implies_S>n_iff_A_peak>sqrt(2*n)
