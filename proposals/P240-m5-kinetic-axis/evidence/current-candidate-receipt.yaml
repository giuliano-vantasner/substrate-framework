      - attempts/0032/result.yaml
    consequence: >-
      The field-dependent contraction is a necessary conceptual move rather
      than an arbitrary numerical preference.
  - proposition: >-
      The spectral-Cartan action is a proper Lorentz scalar, has a positive
      curvature Hamiltonian on its declared timelike branch, reverses the
      explicit negative clock sign, and recovers the arbitrary static 3x3
      action coefficient-exactly.
    role: exact_proof
    evidence:
      - attempts/0033/result.yaml
    bridge_to_goal_146: >-
      Exact static recovery preserves the established spatial/Coulomb
      coefficient; the positive field-dependent contraction repairs the
      kinetic sign without a fitted interpolation parameter.
  - proposition: >-
      For equal defects with diagonal inertia I0 and positive cross inertia C,
      the like-clock fixed-J interaction is
      -j^2*C/[2*I0*(I0+C)]. If C(r)=A/r+O(r^-2), A>0, then
      Delta E_J=-j^2*A/(2*I0^2*r)+O(r^-2).
    role: exact_proof
    evidence:
      - attempts/0034/result.yaml
    exclusions: >-
      This implication does not assert that relaxed M5 fields have A>0 or a
      1/r cross-inertia tail. Fixed omega is a different ensemble and has the
      opposite leading sign.
  - proposition: >-
      Delta=d(r)*sin(theta)^2 with q=O(r^2) and d=O(r^4) removes the hedgehog
      pole string while retaining nonzero off-axis clock response.
    role: exact_proof
    evidence:
      - attempts/0035/result.json
  - proposition: >-
      The smooth restricted variational spaces contain a finite-positive-
      inertia stationary branch through 6x5 modes.
    role: applicability
    verification: simulation_evidence
    evidence:
      - attempts/0038/result.yaml
      - attempts/0039/result.yaml
      - attempts/0040/result.yaml
    scope: >-
      Resolution-bounded direct Euler-Lagrange roots only; no continuum
      existence, local minimum, or empirical electron claim.
