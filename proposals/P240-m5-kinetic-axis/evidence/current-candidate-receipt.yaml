positive_results:
  - proposition: >-
      The complete constant-coefficient curvature-quadratic family has six
      parity-even and four one-epsilon independent scalars, and every
      deformation preserving the complete source-generated static 3x3 action
      is blind to an explicit negative affine clock.
    role: exact_proof
