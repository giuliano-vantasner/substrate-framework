candidate: relaxed_fixed_J_pair_oracle
frozen_question: >-
  Do separately relaxed two-defect hedgehog fields of the certified spectral-Cartan
  action, at fixed individual typed momenta, produce a positive cross inertia with
  a 1/r asymptotic (C(r) = A/r + O(r^-2), A > 0)? Sign and exponent of C(d) are
  the deliverables; the conditional Newton formula Delta_E_J = -j^2 C/[2 I0 (I0+C)]
  becomes a prediction only in the positive-1/r case.
derivation_basis:
  exact_algebra: >-
    attempts/0034/verify_two_clock_legendre.py (18/18 exact checks): inertia matrix
    [[I1,C],[C,I2]], E_J = (I2 J1^2 - 2 C J1 J2 + I1 J2^2)/(4 (I1 I2 - C^2)),
    like-clock channel eigenvector (1,1) with eigenvalue I0+C. Fixed-J ensemble
    exclusively; fixed omega has the opposite leading sign (+2 C omega^2).
  observable_rule: >-
    Pair observables are differences of separately relaxed common-action energies
    on one common mask (P236 formula-freeze.yaml; P240 invariant). Cross inertia is
    the mixed second derivative of the kinetic form:
    I_ab = int 4 sum_i <[[N_a,M],d_i M],[[N_b,M],d_i M]]> d^3x.
  composition_rule: >-
    Additive shared-field superposition per P236 repair (attempts/0001 manifest:
    product ansatz rejected as non-decaying artifact; theta(x)=theta_1+theta_2).
    Translated to the certified cpu_energy chart where the vacuum decode is
    eigenvalues (1,0,0) at every wall, the forced form is deviation-additive in
    profile space: q = q1 + q2 - 1, tangent = t1 + t2, split = s1 + s2, evaluated
    per center at r_a = |x - x_a| on ONE shared global spherical frame centered at
    the pair midpoint. Exact one-defect recovery: switching a defect off returns
    the certified one-body field identically. Raw profile sums are prohibited:
    they violate the (1,0,0) outer decode (attempts/0007 gate).
  pole_rule: delta = split * sin^2(theta_global) (attempts/0035 pole-free rule,
    global-axis reading; per-center angle reading was considered and rejected as
    chart-inconsistent).
  ensemble_reading: >-
    'Separately relaxed' means each defect is individually relaxed (the certified
    roots); the pair field is assembled, not jointly re-relaxed. Joint relaxation
    corrections enter at higher order in the overlap and are recorded as a caveat;
    if the measured tail is power-law, a joint-relaxation follow-up is mandatory
    before any promotion; if exponential, the conditional route closes regardless.
configuration:
  chart: cpu_energy.py (attempts/0041) verbatim functional; certified lineage
    0036 -> 0040 -> 0041 -> 0042
  defect_root: 'R=8 order-20 radial root from attempts/0041/radial-results.json
    (reference values at load: E=50.445846, I0=0.676382, omega=0.739227)'
  geometry: centers (+/-d/2, 0, 0) on z; shared frame spherical about origin;
    union-domain ball radius L = d/2 + 8; profiles pinned to vacuum (q=1, t=0,
    s=0) beyond each defect ball (hard Dirichlet extension, kink diagnostic G5)
  separations: 'd in {18, 20, 24, 28, 32}'
  generators: N_a = cross-product matrix of n_a(x) = (x - x_a)/|x - x_a|
gates:
  G1_certification: >-
    One-body limit of the pair evaluator (co-located centers, single active
    profile, L = 8) reproduces cpu_energy/XOracle total, curvature, potential,
    and inertia to relative 1e-10 before any pair number is inspected.
  G2_self_recovery: >-
    I_11 at the largest separation matches the one-body inertia I0 within
    3x the quadrature-refinement spread.
  G3_rotational_covariance: >-
    One separation re-run with the pair along x (full 3D quadrature) reproduces
    C(d) to relative 1e-8.
  G4_quadrature_refinement: >-
    Two node levels; spread < 5% at d=18; absolute noise floor rule from 0042:
    |C| counts only above 3x the enclosure half-width.
  G5_kink_diagnostic: >-
    Integrated |contribution| from shells |r_a - 8| < 0.25 reported at every d;
    flagged if > 10% of |C|.
interpretation_frozen_before_data:
  newton_tail_confirmed: >-
    C(d) > 0 at every measured d AND A(d) = C(d)*d constant across the three
    largest separations within G4 spreads AND the exponential model rejected by
    direct fit comparison. Only then does Delta_E_J become a parameter-free
    prediction (evidence record; promotion is a separate governed step).
  mechanism_refuted_repulsive: C(d) < 0 with sign stable under G4 refinements.
  no_long_range_channel: >-
    Exponential decay wins the fit comparison (effective exponent p(d) =
    -dln|C|/dlnd growing approximately linear in d); the conditional Newton
    route closes for the separately-relaxed realization.
  otherwise: report measured sign and effective exponent without promotion.
scope_boundary: >-
  Evidence only; no claim promotion. Phase 2 item 5 (Coulomb sector at R >= 7.5)
  is scoped separately: no in-repo charge-density definition exists for the
  certified chart (P236 charge machinery lives in the OpenWave-pinned M5.17
  source); item 5 will be recorded as defined-blocked unless implementation
  precedes data inspection.
amendment_protocol: >-
  Any revision after data inspection must be appended below with reason and
  timestamp before corrected results are interpreted (0042 discipline).
environment: NumPy 1.26.4, SciPy 1.11.4, PyTorch 2.13.0+cpu float64; no CUDA

