  min-max extrapolation. The degree-16 truncation of the same mode has
  Q[eta] = +0.47, so the instability lives in fine radial structure (degrees
  17-32) concentrated near the outer boundary; the lambda_2 ~ +2.5e-7 companion
  is a positive boundary-layer soft mode, not a symmetry zero mode. The delta == 0
  subsector is not stationary (split-channel force ~1e12 at delta=0; the action is
  not even in delta), so the symmetric-state escape route is closed.
  (2) Stability is radius-dependent: the branch is marginally stable for R >= 7.5,
  with critical radius R* in (6, 7.5).

consequence: >-
  The fixed-J pair oracle remains closed at R=6 but is open for the marginally
