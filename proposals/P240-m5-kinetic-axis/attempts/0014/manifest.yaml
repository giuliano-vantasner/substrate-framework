    imported into M5.
m5_candidate:
  currents: K_mu=[Y,Z_mu]
  alternating_current: >-
    B^mu=epsilon^(mu nu rho sigma) Tr(K_nu K_rho K_sigma)/6
  density: >-
    kappa*Tr(P_N Y)^2*q_(mu nu)(P_t)*B^mu*B^nu, where q is the positive
    spatial metric orthogonal to the M-derived timelike line.
