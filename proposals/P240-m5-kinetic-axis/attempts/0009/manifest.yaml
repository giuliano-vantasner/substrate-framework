verdict: >-
  The minus branch is a high-accuracy Euler-Lagrange root and the independent
  first-variation oracle passes, but five converged negative Hessian modes
  prove it is a saddle. The plus branch is near-stationary and has six
  negative modes. Neither is the stable one-body solution required by #146.
  This exhausts the two frozen branches for this L2 quartic member and
  continues the remaining preregistered quartic invariant basis. No
  refinement or pair calculation opens.
