status: complete_primary_gate_failed
candidate: L2_axis_pontryagin_square
objective: >-
  Find a regular stationary fixed-J axisymmetric one-body branch of the exact
  L2 action before any relaxed pair calculation.
equations_and_discretization:
  field: >-
    Seven cell-centred half-plane controls: director, meridional tangent and
    azimuthal eigenvalues; director angle; rho/z boost rapidities; and the
    timelike scalar tau-g.
  static_action: >-
    P239-source spatial spectral-Cartan curvature, timelike-projector current,
    projected M5.17 Landau-de Gennes potential, and Candidate-H scalar current
    with exp(2 alpha (tau-g)) matter factor. No P239 guard or axis-lock term.
  clock_action: >-
    gamma*lambda_N^2*P_N(F)^2/2 from attempt 0004; the old time-curvature
    inertia and rejected L1 term are absent.
  fixed_j: E_total=E_static+J^2/(4 I_L2), omega=J/(2 I_L2)
  domain: >-
    Axisymmetric rho>=0 half-plane, cell-centred rho, centred z, second-order
    centred differences, exact azimuthal equivariance, parity ghost at rho=0,
    and fixed pure-director hedgehog/tau=0/boost=0 outer boundaries.
  precision: IEEE-754 float64
  solver: >-
    PyTorch analytic reverse-mode gradient followed by SciPy L-BFGS-B with
    explicit bounds; two opposite tangent-splitting starts.
frozen_dimensionless_parameters:
  g: 8.0
  curvature_c2: 1.0
  beta: 1.0
  potential_scale: 1.0
  projector_stiffness: 1.0
  scalar_stiffness: 1.0
  scalar_coupling_alpha: 0.1
  l2_strength_gamma: 1.0
  angular_momentum_J: 1.0
  core_seed_radius: 1.0
primary_run:
  spacing: 0.5
  rho_cells: 8
  z_cells: 16
  adam_steps: 1200
  adam_learning_rate: 0.01
  lbfgsb_max_iterations: 3000
  lbfgsb_gtol: 1.0e-8
refinement_ladder:
  mesh: {spacing: 0.4, rho_cells: 10, z_cells: 20}
  domain: {spacing: 0.5, rho_cells: 12, z_cells: 24}
  tolerance: {lbfgsb_max_iterations: 6000, lbfgsb_gtol: 2.5e-9}
frozen_gates:
  optimizer_success: true
  stationarity_projected_inf_over_energy_max: 1.0e-5
  finite_outputs: true
  positive_inertia_scale_floor: sqrt_machine_epsilon_times_coordinate_domain_volume
