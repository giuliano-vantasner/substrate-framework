verdict: >-
  Both starts are finite and individually stationary, but the primary gate
  fails: their total energies differ by 0.2419 and frequencies by 0.5311,
  above the frozen 1e-4 and 0.05 limits. The lower-energy branch also has a
  much larger axis-connection-over-spacing diagnostic. No refinement or pair
  calculation is opened from this result.
