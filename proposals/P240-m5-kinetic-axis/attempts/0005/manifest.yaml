    python proposals/P240-m5-kinetic-axis/attempts/0005/solve_l2_fixed_j.py
    --spacing 0.5 --rho-cells 8 --z-cells 16 --adam-steps 1200
    --lbfgsb-iterations 3000 --lbfgsb-gtol 1e-8
  - mesh, domain, and tolerance commands after the primary gate passes
next_if_success: >-
  Complete all three refinements and only then freeze a common-action relaxed
