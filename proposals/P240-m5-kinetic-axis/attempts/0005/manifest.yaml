  mesh_observable_relative_change_max: 0.15
  domain_observable_relative_change_max: 0.15
  tolerance_observable_relative_change_max: 0.02
  axis_regularity: connection_over_spacing_finite_and_nonincreasing_under_mesh_refinement
comparators_opened: false
compatibility_preflight: >-
  The mutable solver contains no direct, imported, or dynamic np.trapz access.
  It uses no numerical quadrature alias; cell weights are explicit.
commands:
