    insertion: Y
    priority_reason: lowest nonconstant M-derived polynomial insertion
  - id: L2_external_pontryagin_Y2
    insertion: Y_squared
    priority_reason: next Cayley-Hamilton polynomial member if Y fails
exact_gates:
  - external epsilon makes every arbitrary static 3x3 curvature exactly null
  - identity insertion cancels on source curvature
  - candidate is nonzero and clock-velocity-linear on a source-admissible witness
