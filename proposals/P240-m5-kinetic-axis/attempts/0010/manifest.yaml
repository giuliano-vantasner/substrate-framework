  - outer axis weight kills the selected zero-eigenline mutation
  - Y and Y2 responses are compared for independence before selection
  - fixed-J endpoint divergence and strict minimum scaling
selection_rule: >-
  Select Y if it passes all exact gates because it has lower polynomial field
  order. Open Y2 only after a structural or stable-one-body failure of Y.
