id: P240
base_release: v0.163.0
source_baseline: substrate-framework@a34b5f584165b86d1fc62af0ede5fbf37b0aa5b7
canonical_issue: "146"
candidate_source_issue: "147"
question: >-
  Which local Lorentz-covariant completion in the ordered candidate families
  of issue #147 yields one explicit M5 4x4 action that preserves
  the complete static uniform-time-row 3x3 action and Coulomb coefficient,
  has a bounded positive-inertia finite-frequency fixed-J hedgehog, and gives
  an attractive relaxed Newton tail from that same action?
positive_objective: >-
  Resolve issue #146 with one explicit selected local 4x4 action, its exact
  coefficient relations and field equations, a refined stationary one-body
  fixed-J branch, common-action relaxed Coulomb and Newton pair branches,
  reusable APIs, individually reviewed claims, registry acceptance, and a
  pinned release.
coordination_boundary: >-
  P240 uses issue #146 as its sole canonical goal and issue #147 only as the
  ordered source of candidate families, beginning with its preferred
  same-curvature-order contraction completion. It runs on branch
  research/p240-m5-kinetic-axis from merged main a34b5f5. P239 artifacts,
  checks, receipts, and issue-147 goal status are prior proposal provenance,
  not P240 validation or completion evidence. OpenWave MODELS.md, immutable
  campaigns, docs/generated, and the user's dirty primary worktree are out of
  scope.
source_inventory:
  - source: GitHub issue #146 and Jarek Duda comment 5352977929
    access: open GitHub issue and comment, read 2026-08-20
    extracted: >-
      Preserve Coulomb from spatial dynamics, reverse the boost/Newton sign,
      and make electron-hedgehog energy select finite nonzero omega with a
      preferably Lorentz-covariant local kinetic correction.
  - source: GitHub issue #147 body and comment 5355624676
    access: open GitHub issue and comment, reread 2026-08-20
    extracted: >-
      Start with the complete same-order Lorentz-covariant curvature
      contractions, then continue through field-dependent contraction and
      higher-order current/Skyrme families under the same staged gates.
  - source: substrate-framework P239 merged checkpoint at a34b5f5
    access: in-hand repository source
    extracted: >-
      Conditional unpromoted M5 action/projector/timelike-scalar APIs and
      append-only rejection history only. P239's tests and receipts are not
      inherited by P240.
  - source: accepted release v0.163.0
    access: governance/releases/current.yaml and governance/claims.yaml
    extracted: >-
      C-LOR-002 convention, C-KRN-001 inverse kernel, C-VAR-003 separately
      relaxed interaction ledger, and C-IGR-004/C-GRV-002 conditional
      gravitational coupling/sign map.
invariants:
  - spacetime uses eta=diag(-1,1,1,1) in the accepted C-LOR-002 convention
  - every candidate term is a typed local Lorentz scalar with explicit index contractions
  - every added term vanishes identically on every static uniform-time-row 3x3 field with arbitrary symbolic spatial entries
  - the complete static 3x3 action and Coulomb coefficient are recovered exactly without coefficient reinterpretation
  - the physical director is distinguished from a zero-eigenline or permuted-vacuum clock escape
  - the selected Hamiltonian is bounded below on its declared branch and the fixed-J clock inertia is finite and positive
  - no external phase charge, imposed clock profile, fitted Newton value, or observed frequency enters selection
  - charge and mass defects use one action, admissible space, boundary data, and stationary definition
  - pair interactions are differences of separately relaxed common-action energies
allowed_imports:
  - C-LOR-002 for the accepted mostly-plus Lorentz-generator convention only
  - C-KRN-001 after the selected action independently supplies a massless quadratic branch
  - C-VAR-003 for the typed separately relaxed interaction definition
  - C-IGR-004 and C-GRV-002 only for a later conditional coupling/sign bridge
  - issue-146 author direction and the ordered issue-147 candidate families as approved proposal inputs
  - P239 merged APIs at a34b5f5 as conditional unpromoted infrastructure after source audit
candidates:
  - id: A_same_order_curvature_contractions
    description: >-
      Exhaust every independent quadratic contraction of the canonical M5
      curvature using its actual algebraic symmetries. Derive, on the image of
      symmetric M-field derivatives rather than an unconstrained stand-in
      tensor, the complete coefficient subspace that preserves the working
      static 3x3 action. Test that subspace exactly on source-admissible
      time-mixing directions before opening a numerical coefficient map.
  - id: B_contraction_signature
    description: >-
      Compare the two parameter-free endpoints of issue 147's contraction
      family: a fixed positive internal Frobenius metric with exact SO(3) but
      broken boosts, and its local field-dependent spectral-Cartan lift built
      from M's simple timelike eigenprojector. Require exact static recovery,
      an explicit symmetry ledger, positive Hamiltonian, and a typed
      long-range mass channel before any interpolation coefficient is allowed.
  - id: D_fixed_j_two_clock
    description: >-
      Use the parameter-free spectral-Cartan base action with two independently
      typed collective clock coordinates. Derive the full two-by-two inertia
      matrix and perform the fixed-J Legendre transform exactly. The candidate
      advances only if separately relaxed common-action fields produce a
      positive off-diagonal inertia with the required 1/r asymptotic; the
      matrix formula alone is not interaction evidence.
  - id: L1_field_dependent_kinetic_axis
    description: >-
      Enumerate the lowest-order local Lorentz scalars built from the M-derived
      timelike projector P_t, constrained P_N only when essential, the
      projected spatial mixed tensor Y=(I-P_t)(eta^-1 M)(I-P_t), and covariant
      derivatives. Every eligible monomial contains a genuine covariant
      timelike-derivative channel and is therefore exactly null on every
      static uniform-time-row 3x3 field while changing clock inertia.
  - id: L2_timelike_current_skyrme
    description: >-
      Enumerate quartic timelike-current or curvature contractions and use a
      sextic contraction only if the quartic family cannot meet the frozen
      structural gates. Every eligible monomial contains at least one genuine
      time-mixing factor, is exactly null on the complete static 3x3 sector,
      preserves the Coulomb coefficient, and adds no external phase charge.
uniqueness_evidence: null
selection_criteria:
  - exact Lorentz and index validity
  - identity-level recovery of the complete arbitrary static 3x3 action
  - exact Coulomb-sector coefficient preservation
  - positive clock inertia and Hamiltonian boundedness
  - sensitivity to the wrong-axis and permuted-vacuum escape
  - parameter and derivative-order economy
  - fixed-J Derrick scaling and limiting behavior
claims_proposed:
  - C-M5-005
  - C-M5-006
  - C-M5-007
  - C-M5-008
comparators_blinded_until: >-
  The complete eligible invariant enumeration, exact contraction conventions,
  arbitrary-symbolic-field 3x3 null proof, Coulomb reduction, Hamiltonian and
  clock-inertia signs, wrong-axis mutation, coefficient domain, fixed-J scale
  analysis, one-body equations, domain, boundary data, solver, error norm,
  scale-relative stationarity threshold, and refinement ladder are frozen.
  Values disclosed by P239 or issues #146/#147 are prior exposure and may not
  select a P240 candidate or tolerance.
status: active
phase: candidate_selected_independent_validation_requested
