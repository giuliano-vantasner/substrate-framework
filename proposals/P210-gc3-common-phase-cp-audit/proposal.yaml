question: >-
  What exact CP-odd conclusions follow when one or more Yukawa-like matrices
  are assumed to have a single removable overall phase times a real matrix,
  and does one condensate itself enforce that matrix form for every allowed
  coupling and mode or merely supply one conditional realization of it?
invariants:
  - C-MIX-001 owns exact finite complex SVD Gram spectra basis freedoms and relative-basis composition but no physical Yukawa CKM or CP interpretation.
  - C-MIX-002 owns the abstract unitary rephasing quotient and invariant quartets but no physical CP phase observed family map or generation count.
  - C-OVL-001 owns normalized overlaps against supplied profiles and modes but no Yukawa identification condensate dynamics or generation identity.
  - A matrix of the form exp(i*theta)*R with R real has a real Gram matrix but that conditional algebra does not establish that a physical model supplies only one phase or only real coefficients and modes.
  - Degenerate Gram eigenspaces permit nonunique complex basis choices so a basis-dependent apparent phase is not physical evidence.
  - The dimension N is an input to finite-matrix algebra unless an accepted independent theorem selects a family count.
  - Pending GC4 and GC5 are nonauthoritative cycle edges and cannot support GC3.
  - Numerical random trials cannot strengthen an exact symbolic identity and comparator closeness cannot select a concept.
  - Mutable integration uses numpy.trapezoid or trapezoid_integral and immutable compatibility events are never scientific failures.
